- id: '1700846828462'
  alias: Philips Tap Dial Switch- Bedroom
  description: Hue Tap Dial 1 (ZHA, bedroom). Dial steps light.bedroom_bedside_lamps_group
    brightness up or down by the dial's step size. Button 1 toggles the bedside lamps.
    Buttons 2, 3 and 4 are unassigned (Button 2 doorbell sound removed 2026-11-25
    at Scott's request). Converted from the nnmalex Tap Dial blueprint on 2026-11-25;
    triggers use the dial's IEEE address so they survive a re-pair.
  triggers:
  - event_data:
      command: step_with_on_off
      device_ieee: 00:17:88:01:0d:7c:0d:e7
    event_type: zha_event
    id: dial
    trigger: event
  - event_data:
      command: recall
      device_ieee: 00:17:88:01:0d:7c:0d:e7
    event_type: zha_event
    id: button
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dial
      sequence:
      - action: light.turn_on
        data:
          brightness_step_pct: '{{ trigger.event.data.params.step_size if trigger.event.data.params.step_mode
            in [0, ''StepMode.Up''] else -trigger.event.data.params.step_size }}'
          transition: 1
        target:
          entity_id: light.bedroom_bedside_lamps_group
    - alias: Button 1
      conditions:
      - condition: trigger
        id: button
      - condition: template
        value_template: '{{ trigger.event.data.args[1] == 1 }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedroom_bedside_lamps_group
  max_exceeded: silent
  mode: restart
