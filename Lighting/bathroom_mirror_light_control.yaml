- id: '1722497194862'
  alias: 'Bathroom Mirror: Light Control'
  description: Bathroom mirror on/off from the Bathroom Shower Switch (Zooz ZEN72)
    paddle event entities. Double tap upper paddle turns the mirror on; double tap
    lower paddle turns it off. Converted from the IOT_Ninja ZEN72 blueprint on 2026-11-25
    after Z-Wave JS renamed the scene labels (Scene 001 to Upper Paddle) and the blueprint
    stopped matching.
  triggers:
  - id: upper_double
    options:
      event_type:
      - KeyPressed2x
    target:
      entity_id: event.bathroom_shower_switch_scene_001
    trigger: event.received
  - id: lower_double
    options:
      event_type:
      - KeyPressed2x
    target:
      entity_id: event.bathroom_shower_switch_scene_002
    trigger: event.received
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: upper_double
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_mirror
    - conditions:
      - condition: trigger
        id: lower_double
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.bathroom_mirror
  mode: single
