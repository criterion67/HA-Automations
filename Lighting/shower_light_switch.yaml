- id: '1761411307247'
  alias: Shower Light Switch
  description: 'Bathroom Shower Switch (Zooz ZEN72) paddle event entities control
    light.bathroom_shower_downlight. Single press upper paddle turns the downlight
    on; single press lower paddle turns it off. Double taps on the same paddles are
    handled by Bathroom Mirror: Light Control. Converted from Z-Wave device triggers
    (device_id) to event.received on 2026-11-25.'
  triggers:
  - id: Shower Light ON
    options:
      event_type:
      - KeyPressed
    target:
      entity_id: event.bathroom_shower_switch_scene_001
    trigger: event.received
  - id: Shower Light OFF
    options:
      event_type:
      - KeyPressed
    target:
      entity_id: event.bathroom_shower_switch_scene_002
    trigger: event.received
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Shower Light ON
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bathroom_shower_downlight
    - conditions:
      - condition: trigger
        id: Shower Light OFF
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bathroom_shower_downlight
  mode: single
