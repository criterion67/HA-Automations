- id: '1744477733264'
  alias: CGM Monitor & Alerts (with 1hr cooldown)
  description: 'Monitors blood glucose levels from sensor.librelink_glucose_measurement.
    Triggers critical alerts for readings below 40. Plays TTS alert, sends notification,
    and flashes TV lights red.


    NOTIFY WRAPPER 2026-09-22: every notify.mobile_app_pixel_9 call was replaced by
    script.notify_alert (or script.notify_clear for clear_notification) with the same
    message, title, tag, channel, importance, priority, ttl, actions, sticky, persistent
    and icon values. Delivery behavior is unchanged; channel and importance policy
    now lives in the shared script.'
  triggers:
  - entity_id:
    - sensor.librelink_glucose_measurement
    below: 40
    for:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
    id: BG Low
    trigger: numeric_state
  conditions: []
  actions:
  - action: media_player.play_media
    target:
      entity_id: media_player.all_speakers
    data:
      media_content_id: media-source://tts/tts.home_assistant_cloud?message=Alert%2C+blood+glucose+level+is+critically+low&language=en-US&voice=JennyNeural
      media_content_type: provider
  - action: script.notify_alert
    data:
      message: Glucose level is {{ states('sensor.librelink_glucose_measurement')
        }} mg/dL (below 40)
      title: Critical Blood Glucose Alert
      channel: alarm_stream
      importance: high
      priority: high
      ttl: 0
  - action: light.turn_on
    target:
      entity_id: light.tv_lights
    data:
      color_name: red
      brightness_pct: 100
  - delay: 00:00:10
  - action: light.turn_off
    target:
      entity_id: light.tv_lights
    data: {}
  mode: single
