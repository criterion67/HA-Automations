- id: '1771535020419'
  alias: 'David Mowie: Stuck or Error Alert'
  description: 'Notify phone and announce via Cloud TTS when mower goes from mowing
    to error, 15 minute cooldown.


    NOTIFY WRAPPER 2026-09-22: every notify.mobile_app_pixel_9 call was replaced by
    script.notify_alert (or script.notify_clear for clear_notification) with the same
    message, title, tag, channel, importance, priority, ttl, actions, sticky, persistent
    and icon values. Delivery behavior is unchanged; channel and importance policy
    now lives in the shared script.'
  triggers:
  - entity_id: lawn_mower.david_mowie
    from: mowing
    to: error
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set last = state_attr(''automation.david_mowie_stuck_or_error_alert'',
      ''last_triggered'') %} {% set last_ts = as_timestamp(last) if last else 0 %}
      {{ (as_timestamp(now()) - last_ts) > 900 }}

      '
    note: Template is intentional. A 15 minute self cooldown reads this automation
      own last_triggered, which has no native condition equivalent. Do not convert.
  actions:
  - action: script.notify_alert
    data:
      message: David Mowie has gotten stuck and needs assistance.
      title: 🚨 David Mowie is Stuck!
      tag: david_mowie_stuck
      channel: alarm_stream
      priority: high
      ttl: 0
      icon: mdi:robot-mower
  - action: media_player.play_media
    target:
      entity_id: media_player.bedroom_group
    data:
      metadata: {}
      media:
        media_content_id: media-source://tts/tts.home_assistant_cloud?message=David+Mowie+has+gotten+stuck+and+needs+assistance.&language=en-US&voice=JennyNeural
        media_content_type: provider
        metadata: {}
  mode: single
