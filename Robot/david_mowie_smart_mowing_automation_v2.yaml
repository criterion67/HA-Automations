- id: '1764799107505'
  alias: David Mowie Smart Mowing Automation v2
  description: Smart mowing cycle with dock, recharge, and conditional resume
  triggers:
  - entity_id: input_boolean.david_mowie_start_mowing
    to: 'on'
    id: start
    platform: state
  - event_type: mobile_app_notification_action
    event_data:
      action: RESUME_MOWIE
    id: resume_action
    platform: event
  - entity_id: binary_sensor.garage_door_contact
    to: open
    id: door_opened
    platform: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - condition: numeric_state
        entity_id: sensor.david_mowie_battery
        above: 15
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door_contact
          state: 'off'
        then:
        - action: cover.open_cover
          target:
            entity_id: cover.garage_door
      - delay:
          seconds: 5
      - action: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.david_mowie
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.david_mowie_mowing
      - action: notify.mobile_app_pixel_9
        data:
          title: Mowie Started
          message: Mowie has started mowing. Garage door opened.
      - wait_for_trigger:
        - entity_id: sensor.david_mowie_battery
          below: 15
          trigger: numeric_state
        timeout: 03:00:00
        continue_on_timeout: false
      - action: lawn_mower.dock
        target:
          entity_id: lawn_mower.david_mowie
      - wait_for_trigger:
        - entity_id: lawn_mower.david_mowie
          to: docked
          trigger: state
        timeout: 00:30:00
        continue_on_timeout: false
      - delay:
          seconds: 10
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door_contact
          state: 'on'
        then:
        - action: cover.close_cover
          target:
            entity_id: cover.garage_door
      - wait_for_trigger:
        - entity_id: sensor.david_mowie_battery
          above: 85
          trigger: numeric_state
        timeout: 08:00:00
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door_contact
          state: 'off'
        then:
        - action: lawn_mower.pause
          target:
            entity_id: lawn_mower.david_mowie
        - action: notify.mobile_app_pixel_9
          data:
            title: Mowie Fully Charged
            message: Garage door is closed. Resume mowing
            data:
              actions:
              - action: RESUME_MOWIE
                title: Resume Mowing
              - action: KEEP_PAUSED
                title: Keep Paused
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.david_mowie_mowing
      - action: notify.mobile_app_pixel_9
        data:
          title: Mowie Docked
          message: Mowie has returned to charge.
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.david_mowie_start_mowing
    - conditions:
      - condition: trigger
        id: resume_action
      sequence:
      - action: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.david_mowie
      - action: notify.mobile_app_pixel_9
        data:
          title: Resuming Mowing
          message: Resuming mowing per your request.
    - conditions:
      - condition: trigger
        id: door_opened
      - condition: numeric_state
        entity_id: sensor.david_mowie_battery
        above: 85
      - condition: state
        entity_id: input_boolean.david_mowie_mowing
        state: 'off'
      sequence:
      - action: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.david_mowie
      - action: notify.mobile_app_pixel_9
        data:
          title: Garage Door Opened
          message: Garage door opened, resuming mowing.
  mode: single
