- id: '1759124281059'
  alias: Elsa – Finish Cleanup (Notify + Reset)
  description: 'Clears room selections and sends notifications when Elsa finishes.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - id: docked
    trigger: state
    entity_id: vacuum.z60_ultra_roller_complete
    to: docked
    for:
      seconds: 5
  - id: idle
    trigger: state
    entity_id: vacuum.z60_ultra_roller_complete
    to: idle
    for:
      seconds: 5
  - id: completed
    trigger: state
    entity_id: sensor.z60_ultra_roller_complete_task_status
    to: completed
    for:
      seconds: 5
  - id: drying
    trigger: state
    entity_id: sensor.z60_ultra_roller_complete_state
    to: drying
    for:
      minutes: 1
  actions:
  - variables:
      from_state: '{{ trigger.from_state.state if trigger.from_state is not none else
        ''none'' }}'
      to_state: '{{ trigger.to_state.state if trigger.to_state is not none else ''none''
        }}'
      valid_transition: '{{ trigger.from_state is not none and trigger.from_state.state
        not in [''unknown'',''unavailable''] }}'
      v_state: '{{ states(''vacuum.z60_ultra_roller_complete'') }}'
      task_status: '{{ states(''sensor.z60_ultra_roller_complete_task_status'') }}'
      dryer: '{{ states(''sensor.z60_ultra_roller_complete_state'') }}'
      area: '{{ state_attr(''vacuum.z60_ultra_roller_complete'',''cleaned_area'')
        or '''' }}'
      time_min: '{{ state_attr(''vacuum.z60_ultra_roller_complete'',''cleaning_time'')
        or '''' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''drying'' and valid_transition }}'
      sequence:
      - variables:
          msg: Elsa has completed cleaning and is now drying.
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
          target: watch
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'docked'\n   and valid_transition\n   and\
          \ from_state in ['cleaning','returning','paused'] }}\n"
      sequence:
      - variables:
          msg: 'Elsa has returned to the dock.{{ '' Cleaned '' ~ area ~ '' m² in ''
            ~ time_min ~ '' min.'' if area and time_min else '''' }}

            '
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
          target: watch
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'idle'\n   and valid_transition\n   and\
          \ from_state in ['cleaning','returning','paused'] }}\n"
      sequence:
      - variables:
          msg: 'Elsa is idle, cleaning cycle ended.{{ '' Cleaned '' ~ area ~ '' m²
            in '' ~ time_min ~ '' min.'' if area and time_min else '''' }}

            '
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
          target: watch
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'completed'\n   and valid_transition\n \
          \  and from_state not in ['completed'] }}\n"
      sequence:
      - variables:
          msg: 'Elsa has completed the cleaning cycle.{{ '' Cleaned '' ~ area ~ ''
            m² in '' ~ time_min ~ '' min.'' if area and time_min else '''' }}

            '
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
      - action: script.notify_alert
        data:
          message: '{{ msg }}'
          title: Elsa update
          target: watch
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id in ['docked','idle','completed','drying']\n\
          \   and valid_transition\n   and from_state in ['cleaning','returning','paused']\
          \ }}\n"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.clean_bathroom
          - input_boolean.clean_bedroom
          - input_boolean.clean_living_room
          - input_boolean.clean_kitchen
          - input_boolean.clean_laundry_room
          - input_boolean.clean_office
          - input_boolean.clean_dining_room
          - input_boolean.clean_sunroom
          - input_boolean.clean_foyer
          - input_boolean.clean_bath_2
          - input_boolean.clean_custom_1
          - input_boolean.clean_custom_2
  mode: restart
