- id: '1778044988595'
  alias: Health - Auto-Dismiss BP Reminder on Reading
  description: Automatically turns off the BP dashboard reminder when either BP sensor
    is updated within 30 minutes of the morning reminder window (7–10 AM) or the evening
    reminder reset (7 PM).
  triggers:
  - platform: state
    entity_id:
    - sensor.pixel_9_systolic_bp
    - sensor.pixel_9_diastolic_bp
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: 06:30:00
      before: '10:30:00'
    - condition: time
      after: '18:30:00'
      before: '19:30:00'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.bp_reminder_dismissed
  mode: single
