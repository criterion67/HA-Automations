- id: '1787272767509'
  alias: Petkit - Feeder Notifications (Consolidated)
  description: 'Notifications and monitoring for Gracie''s Fresh Element Solo feeder.
    Feeding is done by the feeder''s own Petkit app plan (7:00 AM 30 g, 12:00 PM 20
    g, 6:00 PM 30 g); automation.petkit_feeding_schedule only plays the call tone.
    Missed feed watchdogs run 5 minutes after each meal and alert if sensor.fresh_element_solo_times_dispensed
    (today''s dispense count, resets at midnight) is below the expected count: 1 at
    7:05, 2 at 12:05, 3 at 18:05. They no longer use binary_sensor.fresh_element_solo_feeding,
    which only changes for manual feeds (changed 2026-11-01). Other branches: dispense
    confirmation, low food, and three battery branches. KNOWN ISSUE: the battery branches
    key on the battery sensor reading ''Not in use'', but it reports a percentage,
    so they likely never fire; to be rebuilt with the 20% low battery alert (home-tasks
    #46). Mode parallel, max 10.'
  triggers:
  - entity_id: binary_sensor.fresh_element_solo_feeding
    from: 'on'
    id: feeding_complete
    to: 'off'
    trigger: state
  - entity_id: binary_sensor.fresh_element_solo_food_level
    from: 'off'
    id: food_low
    to: 'on'
    trigger: state
  - at: 07:05:00
    id: morning_check
    trigger: time
  - at: '12:05:00'
    id: midday_check
    trigger: time
  - at: '18:05:00'
    id: evening_check
    trigger: time
  - entity_id: sensor.fresh_element_solo_battery_level
    from: Not in use
    id: running_on_battery
    trigger: state
  - entity_id: binary_sensor.fresh_element_solo_battery_installed
    id: battery_removed
    to: 'off'
    trigger: state
  - entity_id: sensor.fresh_element_solo_battery_level
    id: usb_restored
    to: Not in use
    trigger: state
  actions:
  - choose:
    - alias: Feeding completed
      conditions:
      - condition: trigger
        id: feeding_complete
      sequence:
      - action: notify.send_message
        data:
          message: 'Fresh Element Solo just dispensed food. Today: {{ states(''sensor.fresh_element_solo_total_dispensed'')
            }}g total, {{ states(''sensor.fresh_element_solo_times_dispensed'') }}
            feeding(s).'
          title: 🐾 Gracie's Feeder Dispensed
        target:
          entity_id: notify.scott_s_phone
    - alias: Food bin running low
      conditions:
      - condition: trigger
        id: food_low
      sequence:
      - action: notify.send_message
        data:
          message: The food bin on the Fresh Element Solo is running low. Time to
            refill!
          title: 🐾 Gracie's Feeder — Low Food
        target:
          entity_id: notify.scott_s_phone
    - alias: Morning feed watchdog at 07:05
      conditions:
      - condition: trigger
        id: morning_check
      - condition: numeric_state
        entity_id: sensor.fresh_element_solo_times_dispensed
        below: 1
      sequence:
      - action: notify.send_message
        data:
          message: The 7:00 AM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Morning Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: Midday feed watchdog at 12:05
      conditions:
      - condition: trigger
        id: midday_check
      - condition: numeric_state
        entity_id: sensor.fresh_element_solo_times_dispensed
        below: 2
      sequence:
      - action: notify.send_message
        data:
          message: The 12:00 PM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Midday Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: Evening feed watchdog at 18:05
      conditions:
      - condition: trigger
        id: evening_check
      - condition: numeric_state
        entity_id: sensor.fresh_element_solo_times_dispensed
        below: 3
      sequence:
      - action: notify.send_message
        data:
          message: The 6:00 PM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Evening Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: USB power lost, now on battery backup
      conditions:
      - condition: trigger
        id: running_on_battery
      sequence:
      - action: notify.send_message
        data:
          message: 'The Fresh Element Solo has lost USB power and is now running on
            battery backup. Current battery level: {{ states(''sensor.fresh_element_solo_battery_level'')
            }}'
          title: ⚠️ Gracie's Feeder — USB Power Lost
        target:
          entity_id: notify.scott_s_phone
    - alias: Backup batteries removed
      conditions:
      - condition: trigger
        id: battery_removed
      sequence:
      - action: notify.send_message
        data:
          message: The backup batteries have been removed from the Fresh Element Solo.
            The feeder has no backup power if USB is disconnected.
          title: ⚠️ Gracie's Feeder — Battery Removed
        target:
          entity_id: notify.scott_s_phone
    - alias: USB power restored
      conditions:
      - condition: trigger
        id: usb_restored
      sequence:
      - action: notify.send_message
        data:
          message: The Fresh Element Solo is back on USB power. Battery backup is
            standby.
          title: ✅ Gracie's Feeder — USB Power Restored
        target:
          entity_id: notify.scott_s_phone
  max: 10
  mode: parallel
