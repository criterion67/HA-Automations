- id: '1787272767509'
  alias: Petkit - Feeder Notifications (Consolidated)
  description: 'Notifications and monitoring for Gracie''s Fresh Element Solo feeder.
    Feeding is done by the feeder''s own Petkit app plan (7:00 AM 30 g, 12:00 PM 20
    g, 6:00 PM 30 g); automation.petkit_feeding_schedule only plays the call tone.
    Missed feed watchdogs run 5 minutes after each meal and alert if sensor.fresh_element_solo_times_dispensed
    (today''s dispense count, resets at midnight) is below the expected count: 1 at
    7:05, 2 at 12:05, 3 at 18:05. They no longer use binary_sensor.fresh_element_solo_feeding,
    which only changes for manual feeds (changed 2026-11-01). Other branches: dispense
    confirmation (manual feeds only, same sensor limitation), and low food. POWER
    BRANCHES rebuilt 2026-11-25 (home-tasks #46) on sensor.fresh_element_solo_device_status
    (enum: offline, online_ac, online_battery, unknown): USB lost fires on online_ac
    to online_battery, USB restored fires on online_battery to online_ac. Chosen because
    the 2026-10-30 plug power cut test recorded exactly those two changes (online_battery
    at 7:35:13 PM, back to online_ac at 7:35:34 PM); sensor.sunroom_fresh_element_solo_power_type
    was not verified in that test. The old branches keyed on the battery sensor reading
    ''Not in use'', which never happens since it reports a percentage. The battery
    removed branch was dropped 2026-11-25 after Petkit removed binary_sensor.fresh_element_solo_battery_installed.
    LOW BATTERY: fires when sensor.fresh_element_solo_battery_level drops below 20%
    or the power type becomes on_battery_low; sent via script.notify_alert on Quiet
    Notices (low importance) per the notification channel policy. Mode parallel, max
    10.'
  triggers:
  - entity_id: binary_sensor.fresh_element_solo_feeding
    from: 'on'
    id: feeding_complete
    to: 'off'
    trigger: state
  - entity_id: binary_sensor.fresh_element_solo_food_level
    from: 'off'
    id: food_low
    to: 'on'
    trigger: state
  - at: 07:05:00
    id: morning_check
    trigger: time
  - at: '12:05:00'
    id: midday_check
    trigger: time
  - at: '18:05:00'
    id: evening_check
    trigger: time
  - trigger: state
    entity_id: sensor.fresh_element_solo_device_status
    from: online_ac
    to: online_battery
    id: running_on_battery
  - trigger: state
    entity_id: sensor.fresh_element_solo_device_status
    from: online_battery
    to: online_ac
    id: usb_restored
  - trigger: numeric_state
    entity_id: sensor.fresh_element_solo_battery_level
    below: 20
    id: battery_low
  - trigger: state
    entity_id: sensor.sunroom_fresh_element_solo_power_type
    to: on_battery_low
    id: battery_low
  actions:
  - choose:
    - alias: Feeding completed
      conditions:
      - condition: trigger
        id: feeding_complete
      sequence:
      - action: notify.send_message
        data:
          message: 'Fresh Element Solo just dispensed food. Today: {{ states(''sensor.fresh_element_solo_total_dispensed'')
            }}g total, {{ states(''sensor.fresh_element_solo_times_dispensed'') }}
            feeding(s).'
          title: 🐾 Gracie's Feeder Dispensed
        target:
          entity_id: notify.scott_s_phone
    - alias: Food bin running low
      conditions:
      - condition: trigger
        id: food_low
      sequence:
      - action: notify.send_message
        data:
          message: The food bin on the Fresh Element Solo is running low. Time to
            refill!
          title: 🐾 Gracie's Feeder — Low Food
        target:
          entity_id: notify.scott_s_phone
    - alias: Morning feed watchdog at 07:05
      conditions:
      - condition: trigger
        id: morning_check
      - condition: numeric_state
        entity_id: sensor.fresh_element_solo_times_dispensed
        below: 1
      sequence:
      - action: notify.send_message
        data:
          message: The 7:00 AM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Morning Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: Midday feed watchdog at 12:05
      conditions:
      - condition: trigger
        id: midday_check
      - condition: numeric_state
        entity_id: sensor.fresh_element_solo_times_dispensed
        below: 2
      sequence:
      - action: notify.send_message
        data:
          message: The 12:00 PM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Midday Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: Evening feed watchdog at 18:05
      conditions:
      - condition: trigger
        id: evening_check
      - condition: numeric_state
        entity_id: sensor.fresh_element_solo_times_dispensed
        below: 3
      sequence:
      - action: notify.send_message
        data:
          message: The 6:00 PM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Evening Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: USB power lost, now on battery backup
      conditions:
      - condition: trigger
        id: running_on_battery
      sequence:
      - action: notify.send_message
        data:
          message: 'The Fresh Element Solo has lost USB power and is now running on
            battery backup. Current battery level: {{ states(''sensor.fresh_element_solo_battery_level'')
            }}%'
          title: ⚠️ Gracie's Feeder — USB Power Lost
        target:
          entity_id: notify.scott_s_phone
    - alias: USB power restored
      conditions:
      - condition: trigger
        id: usb_restored
      sequence:
      - action: notify.send_message
        data:
          message: The Fresh Element Solo is back on USB power. Battery backup is
            standby.
          title: ✅ Gracie's Feeder — USB Power Restored
        target:
          entity_id: notify.scott_s_phone
    - alias: Backup battery low, below 20% or feeder reports on_battery_low
      conditions:
      - condition: trigger
        id: battery_low
      sequence:
      - action: script.notify_alert
        data:
          title: '🔋 Gracie''s Feeder: Battery Low'
          message: The Fresh Element Solo backup batteries are low ({{ states('sensor.fresh_element_solo_battery_level')
            }}%). Replace the 5 AAA batteries.
          tag: gracie_feeder_battery_low
          channel: Quiet Notices
          importance: low
          icon: mdi:battery-low
  max: 10
  mode: parallel
