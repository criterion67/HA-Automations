- id: '1777519968143'
  alias: Aqara 4 button remote
  description: 'This automation configures actions for the Aqara 4-button remote (Opple
    wireless switch, now on Zigbee2MQTT). Camera streaming uses Google TV Streamer
    4K via Cast (media_player.bedroom_tv_chromecast). G6 Pro Doorbell uses medium
    resolution channel (1440x1920) as the high resolution portrait stream (3024x4096)
    is not rendered correctly by Chromecast. TTS TARGET FIXED 2026-08-29: the garage
    door announcements targeted media_player.whole_house, a Music Assistant entity
    that no longer exists. They now use media_player.all_speakers, the house-wide
    Cast speaker group. LOG FIX 2026-09-24: all 8 MQTT triggers now use value_json.action
    with a default, so battery and link quality messages from the remote no longer
    log template warnings. BUTTON 1 CLEARED 2026-10-28: button 1 single and double
    press actions were removed because this remote should not control anything in
    the office (office lights use the Zooz remote and Lutron Caseta switches). Button
    1 is unassigned for now.'
  triggers:
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 1_single
    id: 1st pressed 1x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 1_double
    id: 1st pressed 2x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 2_single
    id: 2nd pressed 1x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 2_double
    id: 2nd pressed 2x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 3_single
    id: 3rd pressed 1x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 3_double
    id: 3rd pressed 2x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 4_single
    id: 4th pressed 1x
    trigger: mqtt
  - topic: zigbee2mqtt/Aqara 4 button remote
    value_template: '{{ value_json.action | default('''') }}'
    payload: 4_double
    id: 4th pressed 2x
    trigger: mqtt
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 1st pressed 1x
      sequence: []
    - conditions:
      - condition: trigger
        id: 1st pressed 2x
      sequence: []
    - conditions:
      - condition: trigger
        id: 2nd pressed 1x
      sequence:
      - target:
          entity_id: lock.front_door_deadbolt
        action: lock.lock
    - conditions:
      - condition: trigger
        id: 2nd pressed 2x
      sequence:
      - target:
          entity_id: lock.front_door_deadbolt
        action: lock.unlock
    - conditions:
      - condition: trigger
        id: 3rd pressed 1x
      sequence: []
    - conditions:
      - condition: trigger
        id: 3rd pressed 2x
      sequence:
      - action: script.reset_chromecast_power
    - conditions:
      - condition: trigger
        id: 4th pressed 1x
      sequence:
      - target:
          entity_id: cover.garage_door
        action: cover.close_cover
      - parallel:
        - sequence:
          - type: issue_all_led_effect
            domain: zha
            device_id: cf2b54ede5b6725a721039bc1f9bb552
            effect_type: Medium_Falling
            color: 125
            level: 79
            duration: 15
          - target:
              entity_id: light.bedroom_alert_light
            action: light.turn_off
        - sequence:
          - target:
              entity_id: media_player.all_speakers
            data:
              cache: true
              message: The garage door has been closed
              language: en-US
              voice: JennyNeural
            action: tts.speak
    - conditions:
      - condition: trigger
        id: 4th pressed 2x
      sequence:
      - target:
          entity_id: cover.garage_door
        action: cover.open_cover
      - parallel:
        - sequence:
          - type: issue_all_led_effect
            domain: zha
            device_id: cf2b54ede5b6725a721039bc1f9bb552
            effect_type: Medium_Rising
            color: 221
            level: 79
            duration: 15
          - target:
              entity_id: light.bedroom_alert_light
            data:
              rgb_color:
              - 255
              - 0
              - 0
              flash: short
            action: light.turn_on
        - sequence:
          - target:
              entity_id: media_player.all_speakers
            data:
              cache: true
              message: The garage door has been opened
              language: en-US
              voice: JennyNeural
            action: tts.speak
  mode: single
