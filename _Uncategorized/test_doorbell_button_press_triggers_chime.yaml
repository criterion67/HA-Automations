- id: '1774553614077'
  alias: TEST - Doorbell Button Press Triggers Chime
  description: 'Test automation: triggered by an incoming webhook HTTP POST to /api/webhook/doorbell_chime_trigger.
    Intended to be called by the Reolink doorbell''s built-in HTTP alarm action when
    the button is pressed. Plays tone ring_doorbell.mp3 (6 sec) on the Zooz ZSE50
    chime via siren.chime_play_tone. Uses restart mode so rapid presses reset the
    sequence.'
  triggers:
  - platform: webhook
    webhook_id: doorbell_chime_trigger
    allowed_methods:
    - POST
    local_only: false
  conditions: []
  actions:
  - alias: Play doorbell ring tone on Zooz chime
    action: siren.turn_on
    target:
      entity_id: siren.chime_play_tone
    data:
      tone: ring_doorbell.mp3 (6 sec)
  mode: restart
