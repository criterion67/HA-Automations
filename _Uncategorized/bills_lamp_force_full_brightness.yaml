- id: '1785549568398'
  alias: 'Bills Lamp: Force Full Brightness'
  description: Bills Lamp is a Lutron Caseta plug-in dimmer that remembers its last
    level, so a single accidental brightness change keeps replaying on every turn-on
    and makes the lamp appear to dim by itself. Bill only ever wants it on or off.
    This forces 100% whenever the lamp turns on, and also snaps it back if the level
    drops while it is already on (for example an accidental drag on the more-info
    brightness slider or a voice command carrying a brightness). The 2 second delay
    on the dim trigger lets a slider drag settle before correcting, so the automation
    does not fight a live drag. Setting 100% also rewrites the level the Caseta remembers,
    so the underlying cause stops compounding. Both triggers converge on the same
    action, so no choose block is needed; mode is restart so overlapping fires cannot
    stack.
  triggers:
  - entity_id: light.living_room_bills_lamp
    id: lamp_turned_on
    to: 'on'
    trigger: state
  - attribute: brightness
    below: 255
    entity_id: light.living_room_bills_lamp
    for:
      seconds: 2
    id: lamp_dimmed_while_on
    trigger: numeric_state
  conditions: []
  actions:
  - action: light.turn_on
    data:
      brightness_pct: 100
    target:
      entity_id: light.living_room_bills_lamp
  mode: restart
