- id: '1776135598837'
  alias: Office- Presence Lighting Control V3
  description: 'Turns office lamps, ceiling light, and fan on with presence, turns
    them off after 5 min of no presence, restores prior fan and ceiling light state
    on re-entry, and resets manual override. The office tablet screen (Kiosk Satellite,
    light.office_tablet_kiosk_screen) turns on with presence and off after 5 min of
    no presence, regardless of the ceiling presence toggle. NOTE 2026-10-20: the three
    office fan steps (snapshot, turn off, restore) are disabled until the fan is back
    on its plug.'
  triggers:
  - entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
    trigger: state
  - entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
    trigger: state
  conditions: []
  actions:
  - alias: Office tablet screen follows presence
    choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_tablet_kiosk_screen
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.office_tablet_kiosk_screen
        continue_on_error: true
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
      - choose:
        - conditions:
          - condition: state
            entity_id: light.office_lamps
            state: 'off'
            for:
              hours: 1
              minutes: 0
              seconds: 0
          sequence: []
        default:
        - if:
          - condition: template
            value_template: '{{ has_value(''scene.office_fan_temp_scene'') }}'
          then:
          - action: scene.turn_on
            target:
              entity_id: scene.office_fan_temp_scene
            data: {}
          note: 'Disabled 2026-10-20: office fan plug is temporarily used for something
            else. Re-enable when the fan is back on the plug.'
          enabled: false
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: scene.create
        data:
          scene_id: office_fan_temp_scene
          snapshot_entities:
          - switch.office_fan
        enabled: false
        note: 'Disabled 2026-10-20: office fan plug is temporarily used for something
          else. Re-enable when the fan is back on the plug.'
      - action: switch.turn_off
        target:
          entity_id: switch.office_fan
        enabled: false
        note: 'Disabled 2026-10-20: office fan plug is temporarily used for something
          else. Re-enable when the fan is back on the plug.'
      - if:
        - condition: state
          entity_id: light.office_lamps
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.office_lamps
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
