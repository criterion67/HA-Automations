- id: '1776135598837'
  alias: Office- Presence Lighting Control V3
  description: Turns office lamps, ceiling light, and fan on with presence, turns
    them off after 5 min of no presence, restores prior fan and ceiling light state
    on re-entry, and resets manual override.
  triggers:
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
      - choose:
        - conditions:
          - condition: state
            entity_id: light.office_lamps
            state: 'off'
            for:
              hours: 1
              minutes: 0
              seconds: 0
          sequence: []
        default:
        - action: scene.turn_on
          target:
            entity_id: scene.office_fan_temp_scene
          data: {}
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: scene.create
        data:
          scene_id: office_fan_temp_scene
          snapshot_entities:
          - switch.office_fan
          - switch.office_ceiling_light
      - action: switch.turn_off
        target:
          entity_id: switch.office_fan
      - action: switch.turn_off
        target:
          entity_id: switch.office_ceiling_light
      - if:
        - condition: state
          entity_id: light.office_lamps
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.office_lamps
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
