- id: '1776135598837'
  alias: Office- Presence Lighting Control V3
  description: Turns office lamps on with presence, turns them off after 5 min of
    no presence, and resets manual override. Replaces V2 which controlled the ceiling
    light.
  triggers:
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - if:
        - condition: state
          entity_id: light.office_lamps
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.office_lamps
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
