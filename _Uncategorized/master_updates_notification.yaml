- id: '1787255046492'
  alias: Master Updates Notification
  description: 'Notifies when any update entity becomes available or is completed,
    using a green light flash for critical infrastructure (HA Core, OS, Supervisor,
    Apps, UniFi gear) and royalblue for everything else.


    Replaces the two prior automations, Master Critical System Updates Notification
    and Master Standard Updates Notification. Both of those triggered on the raw state_changed
    event with no entity filter, so every state change across all 5,600+ entities
    woke them and ran four template conditions, one of which looped the entire state
    machine. They were also broken: their variables blocks stringified new_state,
    producing thousands of ''str object has no attribute name'' template warnings
    per day and garbled notification names.


    This version triggers only on sensor.pending_updates, a template helper whose
    state is the count of update entities currently on. Home Assistant subscribes
    that template to the update domain alone, so the automation is woken only when
    an update actually appears or completes rather than on every state change in the
    system.


    The changed entity is identified as the update entity with the most recent last_changed,
    which is sound because last_changed only advances on an actual on/off transition,
    not on attribute updates. Limitation worth knowing: if two update entities flip
    in opposite directions within the same instant the count is unchanged and no notification
    fires, and if two flip the same direction at once only the most recent is named.
    Both are rare. The startup guard skips the unavailable-to-value transition after
    a restart so a reboot does not produce a spurious notification.'
  triggers:
  - entity_id: sensor.pending_updates
    trigger: state
  conditions:
  - alias: Skip startup and unavailable transitions
    condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unknown'',''unavailable''] and trigger.to_state is not none and trigger.to_state.state
      not in [''unknown'',''unavailable''] }}'
  actions:
  - choose:
    - alias: Critical infrastructure update
      conditions:
      - condition: template
        value_template: '{% set critical = [''update.home_assistant_operating_system_update'',''update.home_assistant_supervisor_update'',''update.home_assistant_core_update'',''update.esphome_update'',''update.matter_server_update'',''update.openthread_border_router_update'',''update.zigbee2mqtt_update'',''update.z_wave_js_ui_update'',''update.mosquitto_broker_update'',''update.studio_code_server_update'',''update.terminal_ssh_update'',''update.file_editor_update'',''update.samba_share_update'',''update.advanced_ssh_web_terminal_update'',''update.home_assistant_mcp_server_update'',''update.music_assistant_server_update'',''update.ring_mqtt_with_video_streaming_update'',''update.usw_flex_mini'',''update.usw_pro_max_24_poe'',''update.living_room_usw_flex_mini'',''update.bedroom_usw_flex_mini'',''update.office_usw_flex_mini'',''update.usw_aggregation'',''update.usp_pdu_pro'',''update.udm_pro'',''update.usw_flex_2_5g_5'',''update.garage_ap_u6_lite'',''update.living_room_ap_u6_lite'',''update.cloud_gateway_ultra_2'']
          %}{{ changed_entity in critical }}'
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          message: '{{ title_word }} for {{ clean_name }}'
          title: Update {{ title_word }}
      - action: light.turn_on
        data:
          rgb_color:
          - 0
          - 255
          - 0
        target:
          entity_id: light.bedroom_fado_lamp
    default:
    - action: notify.mobile_app_pixel_9
      data:
        message: '{{ title_word }} for {{ clean_name }}'
        title: Update {{ title_word }}
    - action: light.turn_on
      data:
        color_name: royalblue
      target:
        entity_id: light.bedroom_fado_lamp
  max: 20
  mode: queued
  variables:
    changed_entity: '{{ (states.update | sort(attribute=''last_changed'') | last).entity_id
      }}'
    changed_state: '{{ (states.update | sort(attribute=''last_changed'') | last).state
      }}'
    title_word: '{{ ''Available'' if changed_state == ''on'' else ''Completed'' }}'
    clean_name: '{% set n = state_attr(changed_entity, ''friendly_name'') | default('''',
      true) %}{% set n = n | regex_replace(find=''(?i)update'', replace='''') %}{%
      set n = n | regex_replace(find=''(?i)firmware'', replace='''') %}{% set n =
      n | regex_replace(find=''\s+'', replace='' '') %}{{ n.strip().title() }}'
