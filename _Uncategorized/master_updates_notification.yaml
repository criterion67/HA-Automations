- id: '1787255046492'
  alias: Master Updates Notification
  description: 'Notifies when any update entity becomes available or is completed,
    and uses the IKEA Fado lamp in the bedroom as a visual pending indicator: green
    while a critical infrastructure update is outstanding (HA Core, OS, Supervisor,
    Apps, UniFi gear), royalblue for everything else, and off once nothing is pending.


    Replaces the two prior automations, Master Critical System Updates Notification
    and Master Standard Updates Notification. Both of those triggered on the raw state_changed
    event with no entity filter, so every state change across all 5,600+ entities
    woke them and ran four template conditions, one of which looped the entire state
    machine. They were also broken: their variables blocks stringified new_state,
    producing thousands of ''str object has no attribute name'' template warnings
    per day and garbled notification names.


    This version triggers only on sensor.pending_updates, a template helper whose
    state is the count of update entities currently on. Home Assistant subscribes
    that template to the update domain alone, so the automation is woken only when
    an update actually appears or completes rather than on every state change in the
    system.


    LAMP OWNERSHIP. Neither of the old automations ever turned the lamp off, so a
    completed update simply relit it. This version tracks ownership with input_boolean.fado_update_indicator_active,
    which is set on whenever this automation lights the lamp. When the pending count
    reaches zero the lamp is turned off ONLY if that flag is on, so a lamp Scott turned
    on himself for normal bedroom use is never switched off by an update completing.
    A second trigger watches the lamp for any transition to off (manual, a scene such
    as the 11 PM Lights Off scene, or this automation itself) and clears the flag,
    so ownership is released as soon as anyone else takes the lamp.


    The changed entity is identified as the update entity with the most recent last_changed,
    which is sound because last_changed only advances on an actual on/off transition,
    not on attribute updates. Limitation worth knowing: if two update entities flip
    in opposite directions within the same instant the count is unchanged and no notification
    fires, and if two flip the same direction at once only the most recent is named.
    Both are rare. The startup guard skips the unavailable to value transition after
    a restart so a reboot does not produce a spurious notification.


    CRITICAL LIST PRUNED 2026-08-30: update.office_usw_flex_mini and update.cloud_gateway_ultra_2
    were removed from the critical list. Both were stale UniFi registry entries with
    no integration behind them, deleted during the Spook 5.1.0 dead-entity cleanup.
    The live equivalents already in the list are update.usw_flex_mini (Office 2) and
    update.usw_flex_2_5g_5 (Office 1); the Cloud Gateway Ultra has no live update
    entity, so nothing replaced it.


    QUIET HOURS ADDED 2026-09-17. Between 10 PM and 8 AM this automation sends no
    phone notifications and never turns the lamp on or changes its color, so an overnight
    update cannot wake Scott. Overnight notifications are skipped, not queued. The
    all clear branch can still turn the lamp off overnight. A time trigger at 8 AM
    (id quiet_hours_end) lights the lamp if any update is still pending: green if
    any entity in the critical list is pending, otherwise royalblue, and sets the
    ownership flag. The startup guard is bypassed only for that time trigger, because
    a time trigger has no from_state. The critical list now appears twice (critical
    branch and 8 AM branch); keep both copies in sync when editing it.


    DEFAULT BRANCH FIX 2026-09-21. The 8 AM quiet_hours_end trigger fell through to
    the default branch whenever nothing was pending, which sent a stale Update Completed
    notification and turned the lamp royalblue every morning. The default branch now
    also requires trigger id updates_changed, so an 8 AM run with zero pending does
    nothing.'
  triggers:
  - entity_id: sensor.pending_updates
    id: updates_changed
    trigger: state
  - entity_id: light.bedroom_fado_lamp
    id: lamp_turned_off
    to: 'off'
    trigger: state
  - trigger: time
    at: 08:00:00
    id: quiet_hours_end
  conditions:
  - alias: Allow the 8 AM catch up, otherwise skip startup and unavailable transitions
    condition: or
    conditions:
    - condition: trigger
      id: quiet_hours_end
    - alias: Skip startup and unavailable transitions
      condition: template
      value_template: '{{ trigger.from_state is not none and trigger.from_state.state
        not in [''unknown'',''unavailable''] and trigger.to_state is not none and
        trigger.to_state.state not in [''unknown'',''unavailable''] }}'
  actions:
  - choose:
    - alias: Lamp turned off by anyone, release ownership
      conditions:
      - condition: trigger
        id: lamp_turned_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fado_update_indicator_active
    - alias: 8 AM catch up, light the lamp for updates still pending after quiet hours
      conditions:
      - condition: trigger
        id: quiet_hours_end
      - condition: numeric_state
        entity_id: sensor.pending_updates
        above: 0
      sequence:
      - alias: Green if any critical update is pending, otherwise royalblue
        if:
        - condition: state
          entity_id:
          - update.home_assistant_operating_system_update
          - update.home_assistant_supervisor_update
          - update.home_assistant_core_update
          - update.esphome_update
          - update.matter_server_update
          - update.openthread_border_router_update
          - update.zigbee2mqtt_update
          - update.z_wave_js_ui_update
          - update.mosquitto_broker_update
          - update.studio_code_server_update
          - update.terminal_ssh_update
          - update.file_editor_update
          - update.samba_share_update
          - update.advanced_ssh_web_terminal_update
          - update.home_assistant_mcp_server_update
          - update.music_assistant_server_update
          - update.ring_mqtt_with_video_streaming_update
          - update.usw_flex_mini
          - update.usw_pro_max_24_poe
          - update.living_room_usw_flex_mini
          - update.bedroom_usw_flex_mini
          - update.usw_aggregation
          - update.usp_pdu_pro
          - update.udm_pro
          - update.usw_flex_2_5g_5
          - update.garage_ap_u6_lite
          - update.living_room_ap_u6_lite
          state: 'on'
          match: any
        then:
        - action: light.turn_on
          data:
            rgb_color:
            - 0
            - 255
            - 0
          target:
            entity_id: light.bedroom_fado_lamp
        else:
        - action: light.turn_on
          data:
            color_name: royalblue
          target:
            entity_id: light.bedroom_fado_lamp
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.fado_update_indicator_active
    - alias: No updates left pending, clear the indicator
      conditions:
      - condition: trigger
        id: updates_changed
      - condition: state
        entity_id: sensor.pending_updates
        state: '0'
      sequence:
      - alias: Send the completed notification only outside quiet hours (10 PM to
          8 AM)
        if:
        - condition: time
          after: 08:00:00
          before: '22:00:00'
        then:
        - action: notify.mobile_app_pixel_9
          data:
            message: '{{ title_word }} for {{ clean_name }}'
            title: Update {{ title_word }}
      - if:
        - condition: state
          entity_id: input_boolean.fado_update_indicator_active
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.bedroom_fado_lamp
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fado_update_indicator_active
    - alias: Critical infrastructure update
      conditions:
      - condition: trigger
        id: updates_changed
      - condition: template
        value_template: '{% set critical = [''update.home_assistant_operating_system_update'',''update.home_assistant_supervisor_update'',''update.home_assistant_core_update'',''update.esphome_update'',''update.matter_server_update'',''update.openthread_border_router_update'',''update.zigbee2mqtt_update'',''update.z_wave_js_ui_update'',''update.mosquitto_broker_update'',''update.studio_code_server_update'',''update.terminal_ssh_update'',''update.file_editor_update'',''update.samba_share_update'',''update.advanced_ssh_web_terminal_update'',''update.home_assistant_mcp_server_update'',''update.music_assistant_server_update'',''update.ring_mqtt_with_video_streaming_update'',''update.usw_flex_mini'',''update.usw_pro_max_24_poe'',''update.living_room_usw_flex_mini'',''update.bedroom_usw_flex_mini'',''update.usw_aggregation'',''update.usp_pdu_pro'',''update.udm_pro'',''update.usw_flex_2_5g_5'',''update.garage_ap_u6_lite'',''update.living_room_ap_u6_lite'']
          %}{{ changed_entity in critical }}'
      sequence:
      - alias: Notify and light the lamp only outside quiet hours (10 PM to 8 AM)
        if:
        - condition: time
          after: 08:00:00
          before: '22:00:00'
        then:
        - action: notify.mobile_app_pixel_9
          data:
            message: '{{ title_word }} for {{ clean_name }}'
            title: Update {{ title_word }}
        - action: light.turn_on
          data:
            rgb_color:
            - 0
            - 255
            - 0
          target:
            entity_id: light.bedroom_fado_lamp
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.fado_update_indicator_active
    default:
    - alias: 'Only on an update change: notify and light the lamp outside quiet hours
        (10 PM to 8 AM)'
      if:
      - condition: trigger
        id: updates_changed
      - condition: time
        after: 08:00:00
        before: '22:00:00'
      then:
      - action: notify.mobile_app_pixel_9
        data:
          message: '{{ title_word }} for {{ clean_name }}'
          title: Update {{ title_word }}
      - action: light.turn_on
        data:
          color_name: royalblue
        target:
          entity_id: light.bedroom_fado_lamp
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.fado_update_indicator_active
  max: 20
  mode: queued
  variables:
    changed_entity: '{{ (states.update | sort(attribute=''last_changed'') | last).entity_id
      }}'
    changed_state: '{{ (states.update | sort(attribute=''last_changed'') | last).state
      }}'
    clean_name: '{% set n = state_attr(changed_entity, ''friendly_name'') | default('''',
      true) %}{% set n = n | regex_replace(find=''(?i)update'', replace='''') %}{%
      set n = n | regex_replace(find=''(?i)firmware'', replace='''') %}{% set n =
      n | regex_replace(find=''\s+'', replace='' '') %}{{ n.strip().title() }}'
    title_word: '{{ ''Available'' if changed_state == ''on'' else ''Completed'' }}'
