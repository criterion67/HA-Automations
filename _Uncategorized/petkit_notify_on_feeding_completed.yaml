- id: '1782882217579'
  alias: Petkit - Notify on Feeding Completed
  description: Sends a mobile notification to Scott's phone when the Fresh Element
    Solo finishes dispensing food. Triggers on the off transition of the feeding binary
    sensor (dispensing complete) and includes total dispensed today and times fed.
  triggers:
  - trigger: state
    entity_id: binary_sensor.fresh_element_solo_feeding
    from: 'on'
    to: 'off'
    id: feeding_complete
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.scott_s_phone
    data:
      title: 🐾 Gracie's Feeder Dispensed
      message: 'Fresh Element Solo just dispensed food. Today: {{ states(''sensor.fresh_element_solo_total_dispensed'')
        }}g total, {{ states(''sensor.fresh_element_solo_times_dispensed'') }} feeding(s).'
  mode: single
