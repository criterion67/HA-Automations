- id: '1786996147942'
  alias: Mailbox delivery notification, 5 p.m. reminder & reset
  description: 'Notifies when mail is delivered on the first mailbox opening of the
    day, then records a genuine second opening (mail collected) only when the delivery
    notification has already been standing for 30 minutes, so the door sensor bouncing
    during a single delivery does not falsely count as collection. Resets the notification
    flag daily at 6:00 AM, reminds to check the mail at 5:00 PM if the mailbox has
    not been opened a second time, and allows a manual reset using a dashboard button.
    Adds actionable notification buttons to reset or dismiss on Scott phone. Uses
    input_number.set_value rather than input_number.increment because Spook v5.0.0
    overrides the increment service and reads a private attribute that HA core 2026.8
    renamed, which raises an error and aborts the run. YOLINK LOCAL MIGRATION, 2026-08-26:
    the mailbox door sensor moved from the YoLink cloud integration to the YoLink
    Local (yolocal) integration on the YS1606-UC Local Hub. Its trigger entity changed
    from binary_sensor.mailbox_sensor_door to binary_sensor.mailbox_sensor. The local
    integration names the primary entity after the device, so the _door suffix is
    gone. Device class is still door, so the off to on transition still means the
    mailbox was opened.'
  triggers:
  - id: mailbox_open
    entity_id: binary_sensor.mailbox_sensor
    from: 'off'
    to: 'on'
    trigger: state
  - id: daily_reset
    at: 06:00:00
    trigger: time
  - id: reminder_5pm
    at: '17:00:00'
    trigger: time
  - id: manual_reset
    entity_id: input_button.mailbox_manual_reset
    trigger: state
  - id: mobile_reset
    event_type: mobile_app_notification_action
    event_data:
      action: MAILBOX_RESET
    trigger: event
  - id: mobile_dismiss
    event_type: mobile_app_notification_action
    event_data:
      action: MAILBOX_DISMISS
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: mailbox_open
      - condition: numeric_state
        entity_id: input_number.mailbox_open_count
        below: 1
      sequence:
      - target:
          entity_id: input_number.mailbox_open_count
        data:
          value: 1
        action: input_number.set_value
      - target:
          entity_id:
          - media_player.bedroom_speaker
          - media_player.dining_room_speaker
          - media_player.office_speaker
          - media_player.sunroom_speaker
        data:
          volume_level: 0.7
        action: media_player.volume_set
      - target:
          entity_id:
          - media_player.bedroom_speaker
          - media_player.dining_room_speaker
          - media_player.office_speaker
          - media_player.sunroom_speaker
        data:
          media:
            media_content_id: media-source://media_source/local/073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
            media_content_type: audio/mpeg
            metadata:
              title: 073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
              thumbnail: null
              media_class: music
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
              browse_entity_id: media_player.all_speakers
        action: media_player.play_media
      - delay:
          seconds: 3
      - target:
          entity_id:
          - media_player.bedroom_speaker
          - media_player.dining_room_speaker
          - media_player.office_speaker
          - media_player.sunroom_speaker
        data:
          media:
            media_content_id: media-source://media_source/local/073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
            media_content_type: audio/mpeg
            metadata:
              title: 073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
              thumbnail: null
              media_class: music
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
              browse_entity_id: media_player.all_speakers
        action: media_player.play_media
      - delay:
          seconds: 3
      - target:
          entity_id:
          - media_player.bedroom_speaker
          - media_player.dining_room_speaker
          - media_player.office_speaker
          - media_player.sunroom_speaker
        data:
          media:
            media_content_id: media-source://tts/cloud?message=Mail+has+been+delivered+to+the+mailbox&language=en-US&voice=JennyNeural
            media_content_type: provider
        action: media_player.play_media
      - data:
          title: Mailbox Notification
          message: Mail was delivered at {{ now().strftime('%I:%M %p on %b %-d') }}
          data:
            tag: mailbox_delivery_scott
            actions:
            - action: MAILBOX_RESET
              title: Reset
            - action: MAILBOX_DISMISS
              title: Dismiss
        action: notify.mobile_app_pixel_9
      - data:
          title: Mailbox Notification
          message: Mail was delivered at {{ now().strftime('%I:%M %p on %b %-d') }}
        action: notify.mobile_app_bills_phone
      - target:
          entity_id:
          - input_boolean.mailbox_notified
          - input_boolean.mail_dashboard_indicator
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id: mailbox_open
      - condition: numeric_state
        entity_id: input_number.mailbox_open_count
        above: 0
        below: 2
      - condition: state
        entity_id: input_boolean.mailbox_notified
        state: 'on'
        for:
          hours: 0
          minutes: 30
          seconds: 0
      sequence:
      - target:
          entity_id: input_number.mailbox_open_count
        data:
          value: 2
        action: input_number.set_value
    - conditions:
      - condition: trigger
        id: reminder_5pm
      - condition: state
        entity_id: input_boolean.mailbox_notified
        state: 'on'
      - condition: numeric_state
        entity_id: input_number.mailbox_open_count
        below: 2
      sequence:
      - data:
          message: Don't forget to check the mail today!
          data:
            tag: mailbox_reminder_scott
            actions:
            - action: MAILBOX_RESET
              title: Reset
            - action: MAILBOX_DISMISS
              title: Dismiss
        action: notify.mobile_app_pixel_9
      - data:
          message: Don't forget to check the mail today!
        action: notify.mobile_app_bills_phone
    - conditions:
      - condition: trigger
        id: daily_reset
      sequence:
      - target:
          entity_id: input_boolean.mailbox_notified
        action: input_boolean.turn_off
      - target:
          entity_id: input_boolean.mail_dashboard_indicator
        action: input_boolean.turn_off
      - target:
          entity_id: input_number.mailbox_open_count
        data:
          value: 0
        action: input_number.set_value
      - data:
          message: clear_notification
          data:
            tag: mailbox_delivery_scott
        action: notify.mobile_app_pixel_9
      - data:
          message: clear_notification
          data:
            tag: mailbox_reminder_scott
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: manual_reset
      sequence:
      - target:
          entity_id: input_boolean.mailbox_notified
        action: input_boolean.turn_off
      - target:
          entity_id: input_boolean.mail_dashboard_indicator
        action: input_boolean.turn_off
      - target:
          entity_id: input_number.mailbox_open_count
        data:
          value: 0
        action: input_number.set_value
      - data:
          message: clear_notification
          data:
            tag: mailbox_delivery_scott
        action: notify.mobile_app_pixel_9
      - data:
          message: clear_notification
          data:
            tag: mailbox_reminder_scott
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: mobile_reset
      sequence:
      - target:
          entity_id: input_boolean.mailbox_notified
        action: input_boolean.turn_off
      - target:
          entity_id: input_boolean.mail_dashboard_indicator
        action: input_boolean.turn_off
      - target:
          entity_id: input_number.mailbox_open_count
        data:
          value: 0
        action: input_number.set_value
      - data:
          message: clear_notification
          data:
            tag: mailbox_delivery_scott
        action: notify.mobile_app_pixel_9
      - data:
          message: clear_notification
          data:
            tag: mailbox_reminder_scott
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: mobile_dismiss
      sequence:
      - data:
          message: clear_notification
          data:
            tag: mailbox_delivery_scott
        action: notify.mobile_app_pixel_9
      - data:
          message: clear_notification
          data:
            tag: mailbox_reminder_scott
        action: notify.mobile_app_pixel_9
  mode: queued
  max: 10
