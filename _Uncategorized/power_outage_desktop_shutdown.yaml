- id: '1776226412089'
  alias: Power Outage - Desktop Shutdown
  description: 'Shuts down SCOTT-DESKTOP when either: (1) EFR3P-1 AC has been offline
    for 10 minutes, or (2) Goldenmate battery drops below 25%. Both conditions ensure
    a graceful shutdown well before the Goldenmate runs dry. Network gear and HA host
    are handled separately by the EFR3P-2 automation.'
  triggers:
  - platform: state
    entity_id: binary_sensor.ef_r30118_ac_plugged_in
    to: 'off'
    for: 00:10:00
  - platform: numeric_state
    entity_id: sensor.scott_desktop_goldenmatebatterylevel
    below: 25
  conditions: []
  actions:
  - alias: 'Notify: dashboard alert'
    action: notify.persistent_notification
    data:
      title: ⚡ Power Outage — Shutting Down Desktop
      message: Grid power has been out for 10 minutes. Shutting down SCOTT-DESKTOP.
  - alias: 'Notify: mobile push to Pixel 9'
    action: notify.mobile_app_pixel_9
    data:
      title: ⚡ Power Outage
      message: Grid power out for 10 minutes. Shutting down desktop PC now.
  - alias: Shut down SCOTT-DESKTOP
    action: button.press
    target:
      entity_id: button.scott_desktop_shutdown
  - alias: Wait 60s for desktop to shut down
    delay: 00:01:00
  mode: single
