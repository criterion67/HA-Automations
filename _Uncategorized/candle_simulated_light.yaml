- id: '1766275111302'
  alias: Candle Simulated Light
  description: ''
  triggers:
  - trigger: time_pattern
    seconds: /1
  conditions:
  - condition: state
    entity_id: input_boolean.simulated_candle_effect
    state: 'on'
  - condition: state
    entity_id: light.philips_hue_go_lamp
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.philips_hue_go_lamp
    data:
      brightness: "{% set base = range(35, 70) | random %} {% if range(1, 6) | random\
        \ == 1 %}\n  {{ range(25, 40) | random }}\n{% else %}\n  {{ base }}\n{% endif\
        \ %}\n"
      color_temp_kelvin: '{{ range(1800, 2200) | random }}'
      transition: 0.5
  mode: single
