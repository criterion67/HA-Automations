- id: '1784726402182'
  alias: Dashboard - Reset NWS Alert Dismissed When Alerts Clear
  description: Re-show the NWS Alert dashboard card whenever the active alert count
    is non-zero, by clearing the manual dismiss flag
  triggers:
  - entity_id: sensor.nws_alerts_alerts
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.nws_alerts_alerts
      state: '0'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.nws_alert_dismissed
  mode: single
