- id: '1789438222294'
  alias: DrainFlo Dosing
  description: 'OFFLINE BRANCH DOES NOT CURRENTLY FIRE. Tested 2026-09-17 by unplugging
    the relay for an hour: switch.drainflo never changed from ''off'' and last_updated
    never moved, so Zigbee2MQTT availability tracking is not reporting for this device
    and the pump_unavailable trigger has nothing to fire on. The branch is left in
    place because it costs nothing and will start working if availability is ever
    enabled in Z2M. A better fix now exists: the same physical relay was added to
    the Shelly integration over WiFi on 2026-09-17 at 192.168.30.130, and that integration
    tracks availability properly, so this trigger could be repointed at the WiFi entity
    instead.


    Doses the HVAC condensate drain line with 1 cup of distilled white vinegar on
    the 15th of every month, replacing the manual monthly pour and the reminder system
    that prompted it. The air handler is in the attic and drains by gravity with no
    condensate pump, so a clogged primary line backs up into the drain pan and out
    the secondary line, which discharges from the porch ceiling in front of the front
    door.


    HARDWARE. A Kamoer NKP 12V peristaltic pump sits in a printed enclosure on the
    lid, drawing from a 1 gallon vinegar jug that stands inside a 2 gallon bucket
    for containment. The pump tubing passes through a drilled 3/4 inch PVC cleanout
    cap and hangs about 3 inches into the riser, so there are no fittings anywhere
    in the liquid path. Power is switched by a Shelly 1 Gen4 dry contact relay running
    on Zigbee via Z2M, exposed as switch.drainflo.


    DOSE TIMING. 110 seconds. Measured 2026-09-14 with water on the bench: one cup
    took 105 seconds, which is about 135 mL per minute. The extra 5 seconds is margin,
    because overdosing slightly is harmless and underdosing defeats the purpose. Peristaltic
    tube takes a set over time and flow drops, so if a cup ever starts taking noticeably
    longer that is the signal to replace the pump tube and re-measure.


    SCHEDULE. 05:00 on the 15th of every month. Scott chose the 15th because the 1st
    is already crowded with other monthly reminders and notifications, and 05:00 because
    the attic is near its daily minimum then, which matters since the pump is rated
    0 to 40C and a Foley attic exceeds that by afternoon. The blower may have cycled
    by 05:00 in summer, which slightly shortens how long the vinegar dwells in the
    trap, an accepted tradeoff for avoiding the first-of-month pileup.


    SCHEDULE SOURCE. A day-of-month template condition, not a helper. There is no
    native day-of-month condition in Home Assistant, so now().day == 15 is the only
    option. input_datetime.hvac_drain_line_due_date is still updated by script.hvac_drain_line_cleaned
    after each dose, but only as a dashboard readout of when the next dose falls.
    It no longer gates anything, so if it drifts nothing breaks.


    NO DEVICE SIDE WATCHDOG. The Shelly 1 Gen4 exposes no countdown or auto off over
    Zigbee. Tested 2026-09-14 by publishing on_time to zigbee2mqtt/DrainFlo/set, which
    the device silently ignored while a plain state ON worked, so the off command
    depends entirely on Home Assistant. That is why this automation carries three
    independent protections: the dose sequence turns the pump off itself, the safety_cutoff
    branch force-offs anything still running at 6 minutes, and the ha_start branch
    force-offs on every restart in case HA died mid dose. The 2 gallon bucket is the
    last line of defence.


    WHERE THE DOSE LOGIC LIVES. Not here. Both the scheduled branch and the manual
    default branch call script.drainflo_run_dose, so the dose sequence and the 110
    second calibration number exist in exactly one place. If the pump tube is replaced
    and the flow rate changes, that script is the only thing to edit.


    MANUAL RUNS. Every named branch is gated on a trigger id, and a manual run from
    the UI carries no trigger id, so before 2026-09-17 pressing Run did nothing at
    all. The default branch fixes that: it catches any run that matches no trigger
    id, which in practice means only a manual invocation, and doses immediately without
    checking the date. Use it to dose out of cycle or to test.


    VERIFICATION. A commanded dose is not assumed to have worked. The switch is checked
    before commanding, then checked again 5 seconds after turn on. Either check failing
    raises input_boolean.drainflo_pump_fault and pushes, and leaves the counter and
    due date untouched. The fault does not self clear when the Shelly returns, because
    a missed monthly dose stays missed until someone deals with it.


    NOTIFICATION CHANNELS. Success and fault go on Quiet Notices at low importance
    per Scott''s channel policy, since neither is an emergency. The safety cutoff
    goes on alarm_stream, because a pump stuck on above a ceiling is the same class
    of problem as the monthly valve test failing.'
  triggers:
  - at: 05:00:00
    id: scheduled_dose
    trigger: time
  - entity_id: switch.drainflo
    for:
      minutes: 6
    id: safety_cutoff
    to: 'on'
    trigger: state
  - event: start
    id: ha_start
    trigger: homeassistant
  - entity_id: switch.drainflo
    for:
      hours: 2
    id: pump_unavailable
    to: unavailable
    trigger: state
  - event_data:
      action: DRAINFLO_FAULT_DISMISS
    event_type: mobile_app_notification_action
    id: fault_dismiss
    trigger: event
  conditions: []
  actions:
  - choose:
    - alias: Monthly dose on the 15th, flush the drain line with a cup of vinegar
      conditions:
      - condition: trigger
        id: scheduled_dose
      - alias: Today is the 15th of the month
        condition: template
        value_template: '{{ now().day == 15 }}'
      sequence:
      - alias: Hand off to the shared dose routine
        action: script.drainflo_run_dose
    - alias: Safety cutoff, the pump has been running far longer than a dose
      conditions:
      - condition: trigger
        id: safety_cutoff
      sequence:
      - action: switch.turn_off
        alias: Force the pump off
        target:
          entity_id: switch.drainflo
      - action: input_boolean.turn_on
        alias: Raise the fault flag for the dashboard card
        target:
          entity_id: input_boolean.drainflo_pump_fault
      - action: notify.mobile_app_pixel_9
        alias: Wake Scott, this one is urgent
        data:
          data:
            actions:
            - action: DRAINFLO_FAULT_DISMISS
              title: Dismiss
            channel: alarm_stream
            notification_icon: mdi:alert
            tag: drainflo_pump_fault
          message: The pump ran past 6 minutes against a 110 second dose and has been
            force stopped. Check the bucket in the attic for vinegar.
          title: DrainFlo pump stuck on
      - action: logbook.log
        alias: Record the cutoff in the logbook
        data:
          entity_id: switch.drainflo
          message: Safety cutoff fired. Pump ran past 6 minutes and was force stopped.
          name: DrainFlo
    - alias: Home Assistant restarted, make sure the pump is not left running
      conditions:
      - condition: trigger
        id: ha_start
      sequence:
      - action: switch.turn_off
        alias: Force off in case HA died mid dose
        continue_on_error: true
        target:
          entity_id: switch.drainflo
    - alias: Shelly has been unreachable for hours, warn before the dose window
      conditions:
      - condition: trigger
        id: pump_unavailable
      sequence:
      - action: input_boolean.turn_on
        alias: Raise the fault flag for the dashboard card
        target:
          entity_id: input_boolean.drainflo_pump_fault
      - action: notify.mobile_app_pixel_9
        alias: Warn Scott the relay is offline
        data:
          data:
            actions:
            - action: DRAINFLO_FAULT_DISMISS
              title: Dismiss
            channel: Quiet Notices
            importance: low
            notification_icon: mdi:zigbee
            tag: drainflo_pump_fault
          message: switch.drainflo has been unavailable for 2 hours. If it is still
            offline at 05:00 on the 15th the monthly dose will be skipped.
          title: DrainFlo relay offline
    - alias: Dismiss button tapped on a fault notification
      conditions:
      - condition: trigger
        id: fault_dismiss
      sequence:
      - action: script.drainflo_clear_fault
    default:
    - alias: Manual run from the UI, dose regardless of the date
      action: script.drainflo_run_dose
  max: 10
  mode: parallel
