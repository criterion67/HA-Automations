- id: '1789438222294'
  alias: DrainFlo Dosing
  description: 'OFFLINE WARNING WATCHES BOTH RADIOS, DELIBERATELY. This automation
    drives the relay over Zigbee as switch.drainflo, and everything that commands
    the pump uses that entity. The offline warning branch is the one exception: it
    triggers on switch.drainflo AND on switch.shelly1g4_acebe6f5bfd8, the same physical
    relay seen by the Shelly WiFi integration at 192.168.30.130. The watched entity
    and the controlled entity are therefore deliberately not the same. That is safe
    because this branch only raises a flag and sends a push, it never commands the
    pump, so an unreachable signal from either radio is worth having.


    WHY THE ZIGBEE SIDE ALONE WAS NOT ENOUGH. Z2M reports broker side availability,
    not device reachability. switch.drainflo does reach unavailable when Z2M or MQTT
    reconnects, in brief transitions that run unavailable to unknown to off, but it
    does not go unavailable when the relay itself loses power or drops off the mesh.
    Tested 2026-09-17 by unplugging the relay for an hour: the entity never changed.
    The Shelly integration tracks reachability properly, so the WiFi trigger is the
    one expected to actually fire. The Zigbee trigger is kept because a Z2M or broker
    outage is also worth knowing about before a dose window.


    LIMIT OF THE 2 HOUR HOLD. A state trigger''s for: clock restarts on every Home
    Assistant restart and on every momentary unavailable. If HA restarts more often
    than every 2 hours, this branch will not fire even when the relay is genuinely
    offline. That is an accepted limit, because the branch is early warning and not
    a protection.


    Doses the HVAC condensate drain line with 1 cup of distilled white vinegar on
    the 15th of every month, replacing the manual monthly pour and the reminder system
    that prompted it. The air handler is in the attic and drains by gravity with no
    condensate pump, so a clogged primary line backs up into the drain pan and out
    the secondary line, which discharges from the porch ceiling in front of the front
    door.


    HARDWARE. A Kamoer NKP 12V peristaltic pump sits in a printed enclosure on the
    lid, drawing from a 1 gallon vinegar jug that stands inside a 2 gallon bucket
    for containment. The pump tubing passes through a drilled 3/4 inch PVC cleanout
    cap and hangs about 3 inches into the riser, so there are no fittings anywhere
    in the liquid path. Power is switched by a Shelly 1 Gen4 dry contact relay running
    on Zigbee via Z2M, exposed as switch.drainflo.


    DOSE TIMING. 110 seconds. Measured 2026-09-14 with water on the bench: one cup
    took 105 seconds, which is about 135 mL per minute. The extra 5 seconds is margin,
    because overdosing slightly is harmless and underdosing defeats the purpose. Peristaltic
    tube takes a set over time and flow drops, so if a cup ever starts taking noticeably
    longer that is the signal to replace the pump tube and re-measure.


    SCHEDULE. 05:00 on the 15th of every month. Scott chose the 15th because the 1st
    is already crowded with other monthly reminders and notifications, and 05:00 because
    the attic is near its daily minimum then, which matters since the pump is rated
    0 to 40C and a Foley attic exceeds that by afternoon. The blower may have cycled
    by 05:00 in summer, which slightly shortens how long the vinegar dwells in the
    trap, an accepted tradeoff for avoiding the first-of-month pileup.


    SCHEDULE SOURCE. A day-of-month template condition, not a helper. There is no
    native day-of-month condition in Home Assistant, so now().day == 15 is the only
    option. input_datetime.hvac_drain_line_due_date is still updated by script.hvac_drain_line_cleaned
    after each dose, but only as a dashboard readout of when the next dose falls.
    It no longer gates anything, so if it drifts nothing breaks.


    NO DEVICE SIDE WATCHDOG. The Shelly 1 Gen4 exposes no countdown or auto off over
    Zigbee. Tested 2026-09-14 by publishing on_time to zigbee2mqtt/DrainFlo/set, which
    the device silently ignored while a plain state ON worked, so the off command
    depends entirely on Home Assistant. That is why this automation carries three
    independent protections: the dose sequence turns the pump off itself, the safety_cutoff
    branch force-offs anything still running at 6 minutes, and the ha_start branch
    force-offs on every restart in case HA died mid dose. The 2 gallon bucket is the
    last line of defence.


    WHERE THE DOSE LOGIC LIVES. Not here. Both the scheduled branch and the manual
    default branch call script.drainflo_run_dose, so the dose sequence and the 110
    second calibration number exist in exactly one place. If the pump tube is replaced
    and the flow rate changes, that script is the only thing to edit.


    MANUAL RUNS, AND THE BUG THAT CAME WITH THEM. Every named branch is gated on a
    trigger id, and a manual run from the UI carries no trigger id, so before 2026-09-17
    pressing Run did nothing. A default branch was added to fix that, since default
    catches any run matching no branch.


    That introduced a far worse fault, found 2026-09-19. The scheduled branch required
    BOTH the scheduled_dose trigger id AND now().day == 15. On every other day the
    date condition failed, so the branch did not match, and choose fell through to
    default, which doses unconditionally. The result was a full dose EVERY DAY at
    05:00 instead of monthly. It ran on the 18th and 19th before being caught, spending
    two doses and putting about two extra cups of vinegar down the line. The runs
    on the 17th were manual tests, including the 6 minute safety cutoff test.


    THE FIX. The scheduled branch now matches on trigger id ALONE, so it always claims
    the 05:00 trigger, and the date test moved inside its sequence as an if. On any
    day but the 15th the branch matches and does nothing. default is now only reachable
    by a manual invocation, which is what it was for.


    THE RULE THIS TAUGHT. A default branch catches every trigger whose branch conditions
    fail, not just manual runs. Never gate a branch on both a trigger id and a data
    condition while a default exists. Put the trigger id in the branch condition and
    the data test inside the sequence.


    VERIFICATION. A commanded dose is not assumed to have worked. The switch is checked
    before commanding, then checked again 5 seconds after turn on. Either check failing
    raises input_boolean.drainflo_pump_fault and pushes, and leaves the counter and
    due date untouched. The fault does not self clear when the Shelly returns, because
    a missed monthly dose stays missed until someone deals with it.


    NOTIFICATION CHANNELS. Success and fault go on Quiet Notices at low importance
    per Scott''s channel policy, since neither is an emergency. The safety cutoff
    goes on alarm_stream, because a pump stuck on above a ceiling is the same class
    of problem as the monthly valve test failing.


    NOTIFY WRAPPER 2026-09-22: every notify.mobile_app_pixel_9 call was replaced by
    script.notify_alert (or script.notify_clear for clear_notification) with the same
    message, title, tag, channel, importance, priority, ttl, actions, sticky, persistent
    and icon values. Delivery behavior is unchanged; channel and importance policy
    now lives in the shared script.'
  triggers:
  - at: 05:00:00
    id: scheduled_dose
    trigger: time
  - entity_id: switch.drainflo
    for:
      minutes: 6
    id: safety_cutoff
    to: 'on'
    trigger: state
  - event: start
    id: ha_start
    trigger: homeassistant
  - entity_id: switch.drainflo
    for:
      hours: 2
    id: pump_unavailable
    to: unavailable
    trigger: state
  - trigger: state
    entity_id: switch.shelly1g4_acebe6f5bfd8
    to: unavailable
    for:
      hours: 2
    id: pump_unavailable_wifi
  - event_data:
      action: DRAINFLO_FAULT_DISMISS
    event_type: mobile_app_notification_action
    id: fault_dismiss
    trigger: event
  conditions: []
  actions:
  - choose:
    - alias: Nightly 05:00 check, dose only when it is the 15th
      conditions:
      - condition: trigger
        id: scheduled_dose
      sequence:
      - alias: Dose only on the 15th; any other day this branch does nothing
        if:
        - alias: Today is the 15th of the month
          condition: template
          value_template: '{{ now().day == 15 }}'
        then:
        - alias: Hand off to the shared dose routine
          action: script.drainflo_run_dose
    - alias: Safety cutoff, the pump has been running far longer than a dose
      conditions:
      - condition: trigger
        id: safety_cutoff
      sequence:
      - action: switch.turn_off
        alias: Force the pump off
        target:
          entity_id: switch.drainflo
      - action: input_boolean.turn_on
        alias: Raise the fault flag for the dashboard card
        target:
          entity_id: input_boolean.drainflo_pump_fault
      - action: script.notify_alert
        alias: Wake Scott, this one is urgent
        data:
          message: The pump ran past 6 minutes against a 110 second dose and has been
            force stopped. Check the bucket in the attic for vinegar.
          title: DrainFlo pump stuck on
          tag: drainflo_pump_fault
          channel: alarm_stream
          actions:
          - action: DRAINFLO_FAULT_DISMISS
            title: Dismiss
          icon: mdi:alert
      - action: logbook.log
        alias: Record the cutoff in the logbook
        data:
          entity_id: switch.drainflo
          message: Safety cutoff fired. Pump ran past 6 minutes and was force stopped.
          name: DrainFlo
    - alias: Home Assistant restarted, make sure the pump is not left running
      conditions:
      - condition: trigger
        id: ha_start
      sequence:
      - action: switch.turn_off
        alias: Force off in case HA died mid dose
        continue_on_error: true
        target:
          entity_id: switch.drainflo
    - alias: Relay unreachable for hours on either radio, warn before the dose window
      conditions:
      - condition: trigger
        id:
        - pump_unavailable
        - pump_unavailable_wifi
      sequence:
      - action: input_boolean.turn_on
        alias: Raise the fault flag for the dashboard card
        target:
          entity_id: input_boolean.drainflo_pump_fault
      - action: script.notify_alert
        alias: Warn Scott the relay is unreachable
        data:
          message: The DrainFlo relay has been unreachable for 2 hours ({{ 'WiFi'
            if trigger.id == 'pump_unavailable_wifi' else 'Zigbee' }}). If it is still
            offline at 05:00 on the 15th the monthly dose will be skipped.
          title: DrainFlo relay offline
          tag: drainflo_pump_fault
          channel: Quiet Notices
          importance: low
          actions:
          - action: DRAINFLO_FAULT_DISMISS
            title: Dismiss
          icon: mdi:lan-disconnect
    - alias: Dismiss button tapped on a fault notification
      conditions:
      - condition: trigger
        id: fault_dismiss
      sequence:
      - action: script.drainflo_clear_fault
    default:
    - alias: Manual run only. A trigger-started run never reaches here, because every
        trigger id has a branch that always matches
      action: script.drainflo_run_dose
  max: 10
  mode: parallel
