- id: '1784301134249'
  alias: 'Bedroom: Snapshot & Auto-Off/Restore on Presence'
  description: When the Aqara FP300 presence sensor reports no presence for 15 minutes,
    snapshots the current state of bedroom lights, ceiling fan, and TV, then turns
    them off. When presence returns, restores the snapshot. Presence must be stable
    for 30 seconds before restoring, to filter mmWave sensor flicker. Signe Lamp's
    active effect is captured separately and re-applied after restore, since the scene's
    captured color attributes otherwise override the effect. A pending-flag guards
    the restore so a brief presence flicker (sensor going off then quickly back on,
    never reaching the 15-minute threshold) does not re-apply a stale snapshot; restore
    only runs after the automation itself actually turned things off.
  triggers:
  - entity_id: binary_sensor.aqara_fp300_presence_sensor_1_presence
    for:
      minutes: 15
    id: presence_off
    to: 'off'
    trigger: state
  - entity_id: binary_sensor.aqara_fp300_presence_sensor_1_presence
    id: presence_on
    to: 'on'
    trigger: state
    for:
      seconds: 30
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - presence_off
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.bedroom_signe_lamp_last_effect
        data:
          value: '{{ state_attr(''light.signe_lamp'', ''effect'') | default('''',
            true) }}'
      - action: scene.create
        data:
          scene_id: bedroom_presence_snapshot
          snapshot_entities:
          - light.bed_lights
          - light.bedroom_dresser_under_light
          - light.light_bars_1
          - light.signe_lamp
          - light.bedroom_bedside_lamps_group
          - light.bedroom_ceiling_lights
          - fan.bedroom_ceiling_fan
          - remote.bedroom_tv_1
      - action: homeassistant.turn_off
        target:
          entity_id:
          - light.bed_lights
          - light.bedroom_dresser_under_light
          - light.light_bars_1
          - light.signe_lamp
          - light.bedroom_bedside_lamps_group
          - light.bedroom_ceiling_lights
          - fan.bedroom_ceiling_fan
          - remote.bedroom_tv_1
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_presence_snapshot_pending
    - conditions:
      - condition: trigger
        id:
        - presence_on
      - condition: state
        entity_id: input_boolean.bedroom_presence_snapshot_pending
        state: 'on'
      - '{{ states(''light.bed_lights'') == ''off'' and states(''light.bedroom_dresser_under_light'')
        == ''off'' and states(''light.light_bars_1'') == ''off'' and states(''light.signe_lamp'')
        == ''off'' and states(''light.bedroom_bedside_lamps_group'') == ''off'' and
        states(''light.bedroom_ceiling_lights'') == ''off'' and states(''fan.bedroom_ceiling_fan'')
        == ''off'' }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.bedroom_presence_snapshot
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: input_text.bedroom_signe_lamp_last_effect
            state:
            - ''
            - none
            - None
            - unknown
            - unavailable
        then:
        - action: light.turn_on
          target:
            entity_id: light.signe_lamp
          data:
            effect: '{{ states(''input_text.bedroom_signe_lamp_last_effect'') }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom_presence_snapshot_pending
  mode: restart
