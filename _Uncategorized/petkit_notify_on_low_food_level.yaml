- id: '1782882233762'
  alias: Petkit - Notify on Low Food Level
  description: Sends a mobile notification to Scott's phone when the Fresh Element
    Solo food level sensor reports low (problem state on). Does not re-notify until
    food is refilled and goes low again.
  triggers:
  - entity_id: binary_sensor.fresh_element_solo_food_level
    from: 'off'
    id: food_low
    to: 'on'
    trigger: state
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.scott_s_phone
    data:
      title: 🐾 Gracie's Feeder — Low Food
      message: The food bin on the Fresh Element Solo is running low. Time to refill!
  mode: single
