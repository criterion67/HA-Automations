- id: '1775276150432'
  alias: 'LCM: Calendar PIN Setter - Slot 4'
  description: Extracts a 4-digit PIN from calendar event description and sets it
    on Slot 4. Clears PIN when event ends.
  use_blueprint:
    path: raman325/calendar_pin_setter.yaml
    input:
      config_entry: 01KN5THPGYPXVH3VCBDWXSGT1P
      slot_number: '4'
      calendar_entity: calendar.wscottfunk_gmail_com
      pin_template: '{{ description | regex_findall(''\d{4}'') | first | default('''')
        }}'
      clear_on_end: false
