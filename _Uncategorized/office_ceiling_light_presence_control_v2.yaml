- id: '1758650148017'
  alias: Office- Ceiling Light Presence Control V2
  description: Turns ceiling light on with presence, turns it off after 5 min of no
    presence, and resets manual override.
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - trigger: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.office_ceiling_light
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - if:
        - condition: state
          entity_id: switch.office_ceiling_light
          state: 'on'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.office_ceiling_light
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
