- id: '1776296571883'
  alias: Power Restored — Recovery Notification
  description: 'On HA startup, checks if the power outage shutdown flag is set. If
    so, sends a mobile and dashboard notification that power is restored and systems
    are back online, then clears the flag. Prevents false notifications on routine
    HA restarts.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - event: start
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: input_boolean.power_outage_shutdown_triggered
    state: 'on'
  actions:
  - alias: 'Notify: mobile push — power restored'
    action: script.notify_alert
    data:
      message: Grid power is back. Home Assistant and all systems are back online.
      title: ✅ Power Restored
  - alias: 'Notify: dashboard — power restored'
    action: notify.persistent_notification
    data:
      title: ✅ Power Restored
      message: Grid power is back. Home Assistant and all systems are back online.
  - alias: Clear power outage flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.power_outage_shutdown_triggered
  mode: single
