- id: '1776296571883'
  alias: Power Restored — Recovery Notification
  description: On HA startup, checks if the power outage shutdown flag is set. If
    so, sends a mobile and dashboard notification that power is restored and systems
    are back online, then clears the flag. Prevents false notifications on routine
    HA restarts.
  triggers:
  - platform: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.power_outage_shutdown_triggered
    state: 'on'
  actions:
  - alias: 'Notify: mobile push — power restored'
    action: notify.mobile_app_pixel_9
    data:
      title: ✅ Power Restored
      message: Grid power is back. Home Assistant and all systems are back online.
  - alias: 'Notify: dashboard — power restored'
    action: notify.persistent_notification
    data:
      title: ✅ Power Restored
      message: Grid power is back. Home Assistant and all systems are back online.
  - alias: Clear power outage flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.power_outage_shutdown_triggered
  mode: single
