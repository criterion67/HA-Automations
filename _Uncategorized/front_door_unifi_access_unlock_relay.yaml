- id: '1774735989154'
  alias: 'Front Door: UniFi Access Unlock Relay'
  description: When the Shelly Wave 1 Mini relay fires from a UniFi Access unlock
    event (mobile app, face unlock, NFC, or PIN), unlock the front door Wyze lock
    via Z2M.
  triggers:
  - platform: state
    entity_id: switch.door_lock_relay
    to: 'on'
    id: unifi_access_unlock
  actions:
  - target:
      entity_id: lock.front_door_lock
    action: lock.unlock
  mode: single
