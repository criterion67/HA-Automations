- id: '1774223718313'
  alias: Medication Reminders - Handle Notification Actions
  description: 'Handles taps on medication reminder notifications. Taken: dismisses
    the notification silently by clearing the tag. Snooze: turns on the corresponding
    snooze input_boolean which triggers the main reminder automation to wait 30 minutes
    and re-send.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_TAKEN_7AM
    id: taken_7am
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_SNOOZE_7AM
    id: snooze_7am
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_TAKEN_8AM
    id: taken_8am
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_SNOOZE_8AM
    id: snooze_8am
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_TAKEN_10AM
    id: taken_10am
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_SNOOZE_10AM
    id: snooze_10am
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_TAKEN_5PM
    id: taken_5pm
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_SNOOZE_5PM
    id: snooze_5pm
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_TAKEN_7PM
    id: taken_7pm
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_SNOOZE_7PM
    id: snooze_7pm
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_TAKEN_BEDTIME
    id: taken_bedtime
    trigger: event
  - event_type: mobile_app_notification_action
    event_data:
      action: MED_SNOOZE_BEDTIME
    id: snooze_bedtime
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: taken_7am
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_7am
    - conditions:
      - condition: trigger
        id: snooze_7am
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_7am
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.med_reminder_7am_snoozed
    - conditions:
      - condition: trigger
        id: taken_8am
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_8am
    - conditions:
      - condition: trigger
        id: snooze_8am
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_8am
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.med_reminder_8am_snoozed
    - conditions:
      - condition: trigger
        id: taken_10am
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_10am
    - conditions:
      - condition: trigger
        id: snooze_10am
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_10am
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.med_reminder_10am_snoozed
    - conditions:
      - condition: trigger
        id: taken_5pm
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_5pm
    - conditions:
      - condition: trigger
        id: snooze_5pm
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_5pm
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.med_reminder_5pm_snoozed
    - conditions:
      - condition: trigger
        id: taken_7pm
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_7pm
    - conditions:
      - condition: trigger
        id: snooze_7pm
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_7pm
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.med_reminder_7pm_snoozed
    - conditions:
      - condition: trigger
        id: taken_bedtime
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_bedtime
    - conditions:
      - condition: trigger
        id: snooze_bedtime
      sequence:
      - action: script.notify_clear
        data:
          tag: med_reminder_bedtime
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.med_reminder_bedtime_snoozed
  mode: parallel
  max: 10
