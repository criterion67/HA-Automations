- id: '1776626196171'
  alias: Water Valve Battery Low Alert
  description: 'Fires when the main water valve battery sensor drops below 15%. Sends
    a critical mobile notification with battery type and quantity, creates a Google
    Calendar purchase reminder, and posts a persistent dashboard notification.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - entity_id: sensor.main_water_valve_battery
    below: 15
    id: main_valve_battery
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: main_valve_battery
      sequence:
      - data:
          message: "Main Water Valve battery is at {{ states('sensor.main_water_valve_battery')\
            \ | int }}% — below the 15% threshold.\n\nBattery needed:\n  1× ER26500\
            \ 3.6V 9000mAh C Size\n  Li-SOCl₂ Lithium (Non-Rechargeable)\n\nA purchase\
            \ reminder has been added to your calendar."
          title: 🔋 Main Water Valve Battery Low
          channel: Quiet Notices
          importance: low
          priority: high
          ttl: 0
        action: script.notify_alert
      - target:
          entity_id: calendar.wscottfunk_gmail_com
        data:
          summary: 🔋 Buy Battery — Main Water Valve
          description: 'The Main Water Valve battery dropped below 15% and needs replacement.


            Battery required: 1× ER26500 3.6V 9000mAh C Size Lithium Battery

            Type: Li-SOCl₂ (High Capacity, Non-Rechargeable)


            Level at time of alert: {{ states(''sensor.main_water_valve_battery'')
            | int }}%'
          start_date_time: '{{ now().strftime(''%Y-%m-%d'') }}T09:00:00'
          end_date_time: '{{ now().strftime(''%Y-%m-%d'') }}T10:00:00'
        action: calendar.create_event
      - data:
          title: 🔋 Main Water Valve Battery Critical
          message: 'Battery is at {{ states(''sensor.main_water_valve_battery'') |
            int }}%.


            Replace with: 1× ER26500 3.6V 9000mAh C Size Li-SOCl₂ Lithium Battery
            (Non-Rechargeable).


            A purchase reminder has been added to your Google Calendar.'
          notification_id: main_valve_battery_low
        action: persistent_notification.create
  mode: single
