- id: '1786500995692'
  alias: Mower Garage Return
  description: 'Return half of the MOVA LiDAX Ultra 2000 AWD garage sequence. Companion
    to script.mower_zone_cycle, which handles the outbound half.


    WHY THIS IS AN AUTOMATION AND NOT PART OF THE SCRIPT

    The mower can decide to come home on its own for a completed session, low battery,
    or rain, and a mow can run for hours. A script waiting that long would die on
    a Home Assistant restart and the door would never reopen, leaving the mower stranded
    outside a closed door. A state triggered automation survives restarts.


    WHAT IT DOES

    1. On binary_sensor.jason_momower_returning going on, opens the garage door and
    stops it after 2.5 seconds for a 21 inch opening. Verified 2026-08-11 from history:
    on a natural end of session the returning flag goes on 0.25 seconds after mowing
    goes off and stays on for about 1 minute 40 seconds before the mower docks, so
    there is ample time for the door to open.

    3. ERROR HANDLING: if binary_sensor.jason_momower_error_active goes on during
    a cycle, sends an ACTIONABLE notification to Scott''s Pixel 9 with two buttons,
    Close Garage and Leave Open, plus the current door state and the error text. The
    taps are handled by the companion automation Mower Notification Actions. A time
    based watchdog was built first and then removed on 2026-08-12 at Scott''s request:
    an automatic close risks shutting the door on him while he is working in the garage,
    and it cannot tell a stalled mower from a slow one. Letting Scott decide from
    the notification is the safer design. NOTE: this means there is still no automatic
    close if the mower stalls silently without raising an error. The door would stay
    open until Scott notices.


    2. On binary_sensor.jason_momower_docked going on, waits 30 seconds for the mower
    to settle, closes the door, waits for the door to travel, then clears input_boolean.mower_cycle_active
    and notifies Scott''s Pixel 9.


    The whole automation is gated on input_boolean.mower_cycle_active being on, so
    it only acts during a cycle that Home Assistant started. A mow started from the
    MOVA app will not move the garage door.


    CORRECTED 2026-08-13: the returning flag DOES now fire on the lawn_mower.dock
    path. It was observed going on at 17:54:31, about half a second after script.mower_send_home
    issued its dock command. The earlier claim that it never fires on that path is
    wrong, whether because v0.2.68 changed the state flow or because the original
    2026-08-11 observation did not generalise. Both this automation and script.mower_send_home
    were built on that false premise, which is why they collided on the door and shut
    it on the mower.


    ANNOUNCEMENT ADDED 2026-08-14: the returning branch now speaks on media_player.bedroom_group
    via tts.home_assistant_cloud, but only between 07:00 and 19:00, and always sends
    a Pixel 9 notification regardless of the hour. Both run BEFORE the door-closed
    condition so they still fire on the script.mower_send_home path, where the door
    is already open and the rest of the branch is skipped.


    ERROR ALERTING REBUILT 2026-08-14, now two stages. STAGE ONE fires on any error:
    speaks on the bedroom group between 07:00 and 19:00, and the Pixel 9 alert now
    uses channel alarm_stream, priority high, ttl 0 and sticky true, copied from automation.david_mowie_stuck_or_error_alert
    so it sounds through silent mode and survives a clear-all. STAGE TWO fires only
    when the error has been set for 5 minutes AND sensor.jason_momower_state_name
    is no longer "mowing", which separates a genuine stall from a transient bump,
    and it speaks at any hour. Background: on 2026-08-14 a Path blocked error latched
    for 25 minutes while the mower carried on mowing normally and completed the job,
    so a bare error flag is not by itself evidence of a problem.


    SAFETY: the opener photo eyes remain the physical backstop and will reverse the
    door if the mower is in the doorway while it closes.'
  triggers:
  - entity_id: binary_sensor.jason_momower_returning
    id: returning
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.jason_momower_docked
    id: docked
    to: 'on'
    trigger: state
  - trigger: state
    entity_id: binary_sensor.jason_momower_error_active
    to: 'on'
    id: mower_error
  - trigger: state
    entity_id: binary_sensor.jason_momower_error_active
    to: 'on'
    for:
      minutes: 5
    id: mower_error_persistent
    note: Added 2026-08-14. Second stage alert for an error still set after 5 minutes
      AND where the mower has actually stopped. Exists because of the 2026-08-14 Path
      blocked event, which latched the error flag for 25 minutes while the mower carried
      on mowing normally and finished the job.
  conditions:
  - alias: Only act during an active mower cycle started from Home Assistant
    condition: state
    entity_id: input_boolean.mower_cycle_active
    state: 'on'
  actions:
  - choose:
    - alias: Mower is heading home, reopen the door
      conditions:
      - condition: trigger
        id: returning
      sequence:
      - alias: Spoken announcement, daytime only
        note: Added 2026-08-14. Placed FIRST, before the door-closed condition, because
          on the script.mower_send_home path the door is already open and that condition
          halts the branch. If this sat after it, the announcement would never fire
          on that path. Uses if/then rather than a bare condition so a night-time
          return still reaches the door logic below.
        if:
        - condition: time
          after: 07:00:00
          before: '19:00:00'
        then:
        - action: tts.speak
          alias: Announce on the bedroom speaker group
          target:
            entity_id: tts.home_assistant_cloud
          data:
            media_player_entity_id: media_player.bedroom_group
            cache: false
            message: Jason MoMower has finished mowing and is returning to the garage
              to dock.
      - action: notify.mobile_app_pixel_9
        alias: Notify Scott that the mower is heading back
        note: Deliberately NOT time gated. The spoken announcement is limited to 07:00-19:00
          so it cannot wake Scott, but a phone notification is quiet enough to be
          useful around the clock.
        data:
          title: Mower Returning
          message: Jason MoMower has finished mowing and is heading back to the dock.
      - condition: state
        entity_id: cover.garage_door
        state: closed
        alias: Only open if the door is actually shut
        note: BUG FIX 2026-08-13. script.mower_send_home opens the door itself, then
          the returning flag fires moments later and this branch sent a SECOND open_cover
          to a door already stopped partway. On this pulse based opener with no position
          control that reverses the door and it closes. That stranded the mower outside
          a shut door at 17:54 and produced Return to station failed.
      - action: cover.open_cover
        alias: Start the door opening
        target:
          entity_id: cover.garage_door
      - alias: Wait the calibrated interval for a 21 inch opening
        delay:
          milliseconds: 2500
      - action: cover.stop_cover
        alias: Stop the door partway
        target:
          entity_id: cover.garage_door
    - alias: Mower has docked, close up and clear the flag
      conditions:
      - condition: trigger
        id: docked
      sequence:
      - alias: Let the mower settle fully into the dock before moving the door
        delay:
          seconds: 30
      - condition: state
        entity_id: binary_sensor.jason_momower_docked
        state: 'on'
        alias: Confirm the mower is STILL docked after the settle delay
        note: BUG FIX 2026-08-13. A 0.32 second docked flicker at 17:56:48 satisfied
          the trigger, and 30 seconds later this branch closed the door and cleared
          the flag while the mower was still out on the lawn. If this condition fails
          the sequence halts, deliberately leaving the door OPEN and the flag SET
          so the real docking is still handled.
      - action: cover.close_cover
        alias: Close the garage door
        target:
          entity_id: cover.garage_door
      - alias: Give the door time to finish travelling before unsuppressing
        delay:
          seconds: 20
      - action: input_boolean.turn_off
        alias: Clear the suppression flag, ending the cycle
        target:
          entity_id: input_boolean.mower_cycle_active
      - action: notify.mobile_app_pixel_9
        data:
          message: Jason MoMower has docked and the garage door is closed.
          title: Mower Cycle Complete
    - alias: Mower reported an error during a cycle, offer to close the garage
      conditions:
      - condition: trigger
        id: mower_error
      sequence:
      - alias: Speak the error aloud, daytime only
        note: Added 2026-08-14. Time gated because this first stage fires on ANY error,
          including transient ones like the 2026-08-14 Path blocked that cleared itself
          while the mower kept working. The second stage alert is deliberately NOT
          time gated.
        if:
        - condition: time
          after: 07:00:00
          before: '19:00:00'
        then:
        - action: tts.speak
          alias: Announce the error on the bedroom speaker group
          target:
            entity_id: tts.home_assistant_cloud
          data:
            media_player_entity_id: media_player.bedroom_group
            cache: false
            message: Jason MoMower has reported a problem. The error is {{ states("sensor.jason_momower_error")
              }}.
      - action: notify.mobile_app_pixel_9
        data:
          title: Jason MoMower Error
          message: 'The mower reported a problem during a mowing cycle and may not
            make it back to the dock. The garage door is currently {{ states("cover.garage_door")
            }}. Error: {{ states("sensor.jason_momower_error") }}'
          data:
            actions:
            - action: MOWER_CLOSE_GARAGE
              title: Close Garage
            - action: MOWER_LEAVE_OPEN
              title: Leave Open
            tag: mower_error
            persistent: true
            sticky: true
            importance: high
            priority: high
            channel: alarm_stream
            ttl: 0
            notification_icon: mdi:robot-mower
        note: Updated 2026-08-14. channel alarm_stream, priority high and ttl 0 copied
          verbatim from automation.david_mowie_stuck_or_error_alert so this sounds
          through silent mode like the Ecovacs alert does. sticky true means a clear-all
          no longer wipes it, which is how Scott missed the 17:23 Path blocked alert.
    - alias: Error still set after 5 minutes and the mower has stopped, treat as a
        real stall
      conditions:
      - condition: trigger
        id: mower_error_persistent
      - condition: not
        alias: Only if the mower is NOT still mowing
        note: On 2026-08-14 the error flag latched for 25 minutes while sensor.jason_momower_state_name
          stayed "mowing" and the battery kept draining at its normal rate. lawn_mower.jason_momower
          itself reads "error" in that situation, so state_name is the entity that
          actually distinguishes a working mower from a stalled one.
        conditions:
        - condition: state
          entity_id: sensor.jason_momower_state_name
          state: mowing
      sequence:
      - action: notify.mobile_app_pixel_9
        alias: Escalated stuck alert
        data:
          title: Jason MoMower Is Stuck
          message: 'Jason MoMower has been in an error state for over 5 minutes and
            has stopped. Error: {{ states("sensor.jason_momower_error") }}. The garage
            door is currently {{ states("cover.garage_door") }}.'
          data:
            actions:
            - action: MOWER_CLOSE_GARAGE
              title: Close Garage
            - action: MOWER_LEAVE_OPEN
              title: Leave Open
            tag: mower_stuck
            persistent: true
            sticky: true
            importance: high
            priority: high
            channel: alarm_stream
            ttl: 0
            notification_icon: mdi:robot-mower
      - action: tts.speak
        alias: Announce the stall, any hour
        note: Deliberately NOT time gated, unlike the first stage. By this point the
          mower has been stopped in an error state for 5 minutes and is sitting outside,
          so waking Scott is the lesser problem.
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: media_player.bedroom_group
          cache: false
          message: Jason MoMower is stuck and needs assistance. The error is {{ states("sensor.jason_momower_error")
            }}.
  mode: parallel
