- id: '1787083573676'
  alias: Mower Incomplete Job Alert
  description: "Tells Scott when a mowing job ends early and SILENTLY, so a partially\
    \ mowed yard is not mistaken for a finished one.\n\nWHY THIS EXISTS. On 2026-08-18\
    \ a Full Yard run mowed the rear yard, skipped the front yard entirely, mowed\
    \ the side yard, then docked with battery to spare and no error present. Nothing\
    \ in Home Assistant said a word, because every other alert keys off an error and\
    \ that return looked completely normal. Scott only found out by walking outside.\n\
    \nREBUILT 2026-08-19 on sensor.jason_momower_status_notice. The original version\
    \ compared sensor.jason_momower_mowing_progress against 95 percent, which was\
    \ WRONG and false-alarmed on the successful side yard run that same evening: progress\
    \ is measured against the WHOLE MAP, so a single-zone job reads around 13 percent\
    \ even when it finishes perfectly. Do not reintroduce a progress threshold here.\n\
    \nTHE SIGNAL. sensor.jason_momower_status_notice is a clean discriminator, verified\
    \ against both runs on 2026-08-18:\n  Successful side yard run: 'Mowing task started'\
    \ 16:12:17, then 'Mowing task completed' 16:39:44, exactly as the mower turned\
    \ for home.\n  Failed Full Yard run: the sensor never left 'none'.\nSo a finished\
    \ job announces itself and an abandoned one does not. This works for zone jobs\
    \ and whole-map jobs alike, because it is the mower's own verdict rather than\
    \ anything inferred from area covered.\n\nWHY IT TRIGGERS ON RETURNING RATHER\
    \ THAN ON DOCKED. The notice is set at the moment the mower turns for home, and\
    \ a later session would overwrite it with 'Mowing task started'. Capturing it\
    \ on the way home and carrying it through the wait means a self-resume cannot\
    \ erase the evidence before it is read. Triggering on returning also guarantees\
    \ a real session actually happened, so this cannot fire on an unrelated dock.\n\
    \nWHAT IT DELIBERATELY DOES NOT DO. It stays silent when an error is present,\
    \ because sensor.jason_momower_error already drives two alerts in automation.mower_garage_return\
    \ and a third here would be noise. It does not restart or resume anything. It\
    \ reports, and Scott decides.\n\nThe notification quotes the raw notice text so\
    \ an unexpected value is diagnosable rather than mysterious."
  triggers:
  - entity_id: sensor.jason_momower_state_name
    id: heading_home
    to: returning
    trigger: state
  actions:
  - alias: Let the status notice settle before reading it
    note: On 2026-08-18 the notice flipped to 'Mowing task completed' at 16:39:44.358
      and the returning transition landed at 16:39:44.804, so they are effectively
      simultaneous. A short settle covers ordering jitter between the two.
    delay:
      seconds: 10
  - alias: Capture the mower's own verdict before anything can overwrite it
    note: Captured here rather than read after docking, because a self-resume would
      reset this sensor to 'Mowing task started' and destroy the evidence. Scott's
      mower is known to resume unfinished jobs on its own after charging.
    variables:
      notice_at_return: '{{ states(''sensor.jason_momower_status_notice'') }}'
  - alias: Wait for the mower to actually reach the dock
    note: The 60 second hold filters the known docked-flag flicker, where docked reads
      on for under a second mid return. continue_on_timeout false means a return that
      never completes stays silent here and is left to the error automations.
    timeout:
      minutes: 20
    continue_on_timeout: false
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.jason_momower_docked
      to: 'on'
      for:
        seconds: 60
  - alias: Alert only if the mower never declared the task complete
    if:
    - alias: The completion notice was absent
      condition: template
      value_template: '{{ notice_at_return != ''Mowing task completed'' }}'
      note: Compared against the sensor's display string, which is what this entity
        reports as its state. The underlying attribute uses the snake_case form mowing_task_completed;
        do not mix them up.
    - alias: No error was raised, so nothing else told Scott
      condition: state
      entity_id: sensor.jason_momower_error
      state: none
    then:
    - alias: Tell Scott the job ended early, and quote what the mower did say
      action: notify.mobile_app_pixel_9
      data:
        title: Mowing Job Ended Early
        message: Jason MoMower docked without reporting the task complete, on {{ states('sensor.jason_momower_battery')
          }} percent battery and with no error. Status notice read "{{ notice_at_return
          }}". Check which zone got shorted before assuming the yard is done.
        data:
          tag: mower_incomplete
          sticky: true
          importance: high
          priority: high
          channel: alarm_stream
          ttl: 0
          notification_icon: mdi:robot-mower-outline
  mode: single
