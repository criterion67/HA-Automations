- id: '1781048073798'
  alias: Tablet Nightly Maintenance
  description: Every evening at 19:00, clears the browser cache on both Galaxy Tab
    A9+ tablets, then performs a full device restart. After the restart delay, loads
    the start URL on both tablets. The bedroom tablet (A9+ 1) and office tablet (A9+
    2) run in parallel.
  triggers:
  - platform: time
    at: '19:00:00'
  actions:
  - parallel:
    - sequence:
      - alias: Bedroom tablet - clear cache
        action: button.press
        target:
          entity_id: button.galaxy_tab_a9_1_clear_browser_cache
      - alias: Bedroom tablet - wait after cache clear
        delay:
          seconds: 5
      - alias: Bedroom tablet - restart device
        action: button.press
        target:
          entity_id: button.galaxy_tab_a9_restart_device
    - sequence:
      - alias: Office tablet - clear cache
        action: button.press
        target:
          entity_id: button.galaxy_tab_a9_2_clear_browser_cache
      - alias: Office tablet - wait after cache clear
        delay:
          seconds: 5
      - alias: Office tablet - restart device
        action: button.press
        target:
          entity_id: button.galaxy_tab_a9_2_restart_device
  - alias: Wait for tablets to reboot
    delay:
      seconds: 60
  - parallel:
    - alias: Bedroom tablet - load start URL
      action: button.press
      target:
        entity_id: button.galaxy_tab_a9_load_start_url
    - alias: Office tablet - load start URL
      action: button.press
      target:
        entity_id: button.galaxy_tab_a9_2_load_start_url
  mode: single
