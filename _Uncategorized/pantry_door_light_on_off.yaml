- id: '1724002623895'
  alias: 'Pantry Door: Light On/Off'
  description: This automation controls the pantry light based on the door's status.
    It turns the light on when the door is opened, turns it off when the door is closed,
    and automatically turns it off if the door is left open for more than 5 minutes.
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.pantry_light_door
    to: 'on'
    id: Open
  - platform: state
    entity_id:
    - binary_sensor.pantry_light_door
    to: 'off'
    id: Closed
  - platform: state
    entity_id:
    - binary_sensor.pantry_light_door
    to: 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Timer
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: Open
      sequence:
      - target:
          device_id: 7d82f6d59c608c4457979153428327b3
        data: {}
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: Closed
      sequence:
      - target:
          device_id:
          - 7d82f6d59c608c4457979153428327b3
        data: {}
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: Timer
      sequence:
      - target:
          device_id:
          - 7d82f6d59c608c4457979153428327b3
        data: {}
        action: switch.turn_off
  mode: single
