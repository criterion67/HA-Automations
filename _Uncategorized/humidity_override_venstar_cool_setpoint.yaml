- id: '1780025896978'
  alias: Humidity Override – Venstar Cool Setpoint
  description: 'Monitors foyer humidity (sensor.temp_sensor_foyer_humidity, fallback:
    sensor.indoor_thermostat_humidity). When above 50%, saves the current cool setpoint
    and drops it 3°F (floor 70°F). Restores the original setpoint when humidity reaches
    43% or below. Tracks manual setpoint changes during an active override so user
    adjustments are not overwritten on restore. Falls back to the thermostat built-in
    sensor if the Aqara sensor goes offline.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.temp_sensor_foyer_humidity
    above: 50
    id: humidity_high
  - trigger: numeric_state
    entity_id: sensor.indoor_thermostat_humidity
    above: 50
    id: humidity_high_fallback
  - trigger: numeric_state
    entity_id: sensor.temp_sensor_foyer_humidity
    below: 43
    id: humidity_low
  - trigger: numeric_state
    entity_id: sensor.indoor_thermostat_humidity
    below: 43
    id: humidity_low_fallback
  - trigger: state
    entity_id: climate.indoor_thermostat
    attribute: temperature
    id: manual_setpoint_change
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: humidity_high
        - condition: and
          conditions:
          - condition: trigger
            id: humidity_high_fallback
          - condition: state
            entity_id: sensor.temp_sensor_foyer_humidity
            state:
            - unavailable
            - unknown
      - condition: numeric_state
        entity_id: input_number.thermostat_original_cool_setpoint
        below: 1
      sequence:
      - variables:
          current_sp: '{{ state_attr(''climate.indoor_thermostat'', ''temperature'')
            | float(75) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.thermostat_original_cool_setpoint
        data:
          value: '{{ current_sp }}'
      - action: climate.set_temperature
        target:
          entity_id: climate.indoor_thermostat
        data:
          temperature: '{{ [current_sp - 3, 70] | max }}'
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: humidity_low
        - condition: and
          conditions:
          - condition: trigger
            id: humidity_low_fallback
          - condition: state
            entity_id: sensor.temp_sensor_foyer_humidity
            state:
            - unavailable
            - unknown
      - condition: numeric_state
        entity_id: input_number.thermostat_original_cool_setpoint
        above: 0
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.indoor_thermostat
        data:
          temperature: '{{ states(''input_number.thermostat_original_cool_setpoint'')
            | float }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.thermostat_original_cool_setpoint
        data:
          value: 0
    - conditions:
      - condition: trigger
        id: manual_setpoint_change
      - condition: numeric_state
        entity_id: input_number.thermostat_original_cool_setpoint
        above: 0
      - condition: template
        value_template: '{{ trigger.to_state.attributes.temperature is not none and
          (trigger.to_state.attributes.temperature | float(0)) != (states(''input_number.thermostat_original_cool_setpoint'')
          | float - 3) }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.thermostat_original_cool_setpoint
        data:
          value: '{{ trigger.to_state.attributes.temperature | float }}'
  mode: parallel
  max: 5
