- id: '1776626168259'
  alias: Monthly Valve Test
  description: 'On the 1st of each month, cycles the main water valve closed then
    open to verify it is operational. Sends a mobile notification with results. On
    failure, sends a critical alert and creates a persistent dashboard notification.


    NOTIFY WRAPPER 2026-09-22: every notify.mobile_app_pixel_9 call was replaced by
    script.notify_alert (or script.notify_clear for clear_notification) with the same
    message, title, tag, channel, importance, priority, ttl, actions and icon values.
    Delivery behavior is unchanged; channel and importance policy now lives in the
    shared script.'
  triggers:
  - at: '10:00:00'
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  actions:
  - alias: Close Main Water Valve
    action: valve.close_valve
    target:
      entity_id: valve.main_water_valve
    continue_on_error: true
  - alias: Wait for Main Valve to Close
    wait_template: '{{ is_state(''valve.main_water_valve'', ''closed'') or state_attr(''valve.main_water_valve'',
      ''is_closed'') == true }}'
    timeout:
      seconds: 20
    continue_on_timeout: true
  - variables:
      main_closed_ok: '{{ wait.completed }}'
  - alias: Reopen Main Water Valve
    action: valve.open_valve
    target:
      entity_id: valve.main_water_valve
    continue_on_error: true
  - alias: Wait for Main Valve to Reopen
    wait_template: '{{ is_state(''valve.main_water_valve'', ''open'') and state_attr(''valve.main_water_valve'',
      ''is_closed'') == false }}'
    timeout:
      seconds: 20
    continue_on_timeout: true
  - variables:
      main_valve_ok: '{{ main_closed_ok and wait.completed }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ main_valve_ok }}'
      sequence:
      - action: script.notify_alert
        data:
          message: 'Main Water Valve passed its monthly test on {{ now().strftime(''%B
            %d, %Y'') }}.

            • Main Water Valve: PASS'
          title: ✅ Monthly Valve Test — All Clear
    default:
    - action: script.notify_alert
      data:
        message: 'Main Water Valve failed the monthly test on {{ now().strftime(''%B
          %d, %Y'') }}.

          • Main Water Valve: {{ ''✅ PASS'' if main_valve_ok else ''❌ FAIL'' }}'
        title: 🚨 Valve Test FAILURE — Action Required
        channel: alarm_stream
        importance: high
        priority: high
        ttl: 0
    - action: persistent_notification.create
      data:
        title: 🚨 VALVE TEST FAILURE — Action Required
        message: 'Monthly valve test failed on {{ now().strftime(''%B %d, %Y'') }}.


          • Main Water Valve: {{ ''✅ PASS'' if main_valve_ok else ''❌ FAIL — valve
          did not respond correctly'' }}


          Please inspect the valve immediately.'
        notification_id: valve_test_failure
  mode: single
