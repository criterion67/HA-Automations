- id: '1775277731308'
  alias: 'LCM: Calendar Slot Enable/Disable - Slot 4'
  description: Enables Slot 4 when a Gmail calendar event starts, disables it when
    the event ends. Works alongside Calendar PIN Setter.
  triggers:
  - platform: state
    entity_id: calendar.wscottfunk_gmail_com
    from: 'off'
    to: 'on'
    id: event_started
  - platform: state
    entity_id: calendar.wscottfunk_gmail_com
    from: 'on'
    to: 'off'
    id: event_ended
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: event_started
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.house_locks_code_slot_4_enabled
    - conditions:
      - condition: trigger
        id: event_ended
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.house_locks_code_slot_4_enabled
  mode: single
