- id: '1774380726267'
  alias: Hue Button - Desk Lamp Control
  description: Blueprint-based automation for the Philips Hue Smart Button (RDM005)
    controlling light.desk_lamp_short. Short press toggles the lamp. Long press loops
    brightness up 15% per repeat while held, stops on release. Uses fixed EPMatt awesome-ha-blueprints
    controller blueprint - Z2M action mapping corrected from ROM001 strings (press/hold/release)
    to RDM005 strings (on/brightness_move_up/brightness_stop).
  use_blueprint:
    path: EPMatt/philips_8718699693985.yaml
    input:
      integration: Zigbee2MQTT
      controller_device: 87f8fe1f9021f55176d698c9b9537af6
      helper_last_controller_event: input_text.hue_button_last_controller_event
      action_button_short:
      - target:
          entity_id: light.desk_lamp_short
        action: light.toggle
      action_button_long:
      - target:
          entity_id: light.desk_lamp_short
        data:
          brightness_step_pct: 15
          transition: 0.2
        action: light.turn_on
      button_long_loop: true
      button_long_max_loop_repeats: 20
