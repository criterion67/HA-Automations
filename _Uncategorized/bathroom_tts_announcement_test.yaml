- id: '1780695928727'
  alias: Bathroom- TTS Announcement Test
  description: Plays a welcome TTS on entry and a lights-off TTS on departure. Single
    mode prevents repeat announcements while presence is active.
  triggers:
  - platform: state
    entity_id: binary_sensor.bathroom_presence_radar_target
    from: 'off'
    to: 'on'
    id: detected
  - platform: state
    entity_id: binary_sensor.bathroom_presence_radar_target
    from: 'on'
    to: 'off'
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - action: media_player.play_media
        target:
          entity_id: media_player.era_100_bathroom
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=Hey+Scott%2C+welcome+to+the+bathroom.&language=en-US&voice=AndrewNeural
          media_content_type: music
          announce: true
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: media_player.play_media
        target:
          entity_id: media_player.era_100_bathroom
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=Bathroom+lights+are+off.&language=en-US&voice=AndrewNeural
          media_content_type: music
          announce: true
  mode: single
