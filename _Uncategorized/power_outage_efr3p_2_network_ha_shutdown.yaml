- id: '1776378808727'
  alias: Power Outage - EFR3P-2 Network & HA Shutdown
  description: 'When EFR3P-2 battery drops below 20% while AC is offline, sets outage
    flag, sends mobile alert, then gracefully shuts down UNAS Pro, UDM Pro Max, and
    the HA host (Wyse 5070). HA will auto-restart when grid power is restored.


    Edited 2026-09-15: now reads EFR3P-2 over USB through the Network UPS Tools app
    on the HA PC instead of the ef_ble Bluetooth integration, which relayed through
    the office ESPHome proxy and was the less reliable path. Trigger is sensor.efr3p_2_battery_charge
    (NUT, matched to serial R635ZABAWH344398). The AC condition uses binary_sensor.efr3p_2_ac_power,
    a template helper that is on when NUT status contains OL, and goes unavailable
    if NUT stops reporting, so this condition fails closed and will not shut anything
    down on missing data.


    The NUT low battery setpoint on this unit reads 10 percent, below this 20 percent
    trigger, so the NUT app does not stop itself before this automation fires. Re-check
    that if the setpoint is ever changed on the EcoFlow.


    The ef_ble Bluetooth integration is intentionally kept for output power readings
    and device controls, which NUT does not provide.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - below: 20
    entity_id: sensor.efr3p_2_battery_charge
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: binary_sensor.efr3p_2_ac_power
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    alias: 'Flag: mark power outage shutdown triggered'
    target:
      entity_id: input_boolean.power_outage_shutdown_triggered
  - action: notify.persistent_notification
    alias: 'Notify: dashboard alert'
    data:
      message: EFR3P-2 battery at 20%. Shutting down UNAS Pro, UDM Pro Max, and Home
        Assistant host.
      title: ⚡ Power Outage — EFR3P-2 Low Battery
  - action: script.notify_alert
    alias: 'Notify: mobile push to Pixel 9'
    data:
      message: EFR3P-2 battery at 20%. Shutting down network gear and HA host.
      title: ⚡ Power Outage (EFR3P-2)
  - action: shell_command.shutdown_unas_pro
    alias: Step 1 — Shut down UNAS Pro via SSH
  - alias: Wait 60s for UNAS Pro to shut down
    delay: 00:01:00
  - action: shell_command.shutdown_udm_pro_max
    alias: Step 2 — Shut down UDM Pro Max via SSH
  - alias: Wait 10s then shut down HA host
    delay: 00:00:10
  - action: hassio.host_shutdown
    alias: Step 3 — Full OS poweroff via Supervisor
  mode: single
