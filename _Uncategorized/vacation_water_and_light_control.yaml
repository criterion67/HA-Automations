- id: '1764114845569'
  alias: Vacation Water and Light Control
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - lock.front_door_lock
    - alarm_control_panel.ring_alarm_base_station
  - trigger: state
    entity_id:
    - input_boolean.vacation
    - input_boolean.vacation_alarm_disable
  - trigger: time_pattern
    minutes: /10
    id: heartbeat
  - trigger: time
    at: 02:00:00
    id: nightly_reset
  conditions:
  - condition: state
    entity_id: input_boolean.vacation
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{% if is_state('input_boolean.vacation_alarm_disable', 'on')\
          \ %}\n  {{ is_state('lock.front_door_lock', 'unlocked') }}\n{% else %}\n\
          \  {{ is_state('alarm_control_panel.ring_alarm_base_station','disarmed')\n\
          \     and is_state('lock.front_door_lock','unlocked') }}\n{% endif %}\n"
      sequence:
      - action: valve.open_valve
        target:
          entity_id: valve.main_water_valve
      - action: light.turn_on
        target:
          entity_id:
          - switch.foyer_light
          - light.living_room_ceiling_lights
          - switch.sunroom_ceiling_light
          - switch.kitchen_light
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.id not in [''heartbeat'',''nightly_reset'']
              }}'
          sequence:
          - action: notify.mobile_app_pixel_9
            data:
              title: Vacation Mode
              message: Water on and lights on
          - delay: 00:01:00
          - action: notify.mobile_app_pixel_9
            data:
              title: Vacation Mode
              message: State confirmed. Water on and lights on
    - conditions:
      - condition: template
        value_template: "{% if is_state('input_boolean.vacation_alarm_disable', 'on')\
          \ %}\n  {{ is_state('lock.front_door_lock', 'locked') }}\n{% else %}\n \
          \ (\n    is_state('lock.front_door_lock','locked')\n    and is_state('alarm_control_panel.ring_alarm_base_station','armed_away')\n\
          \  )\n  or\n  (trigger.id == 'nightly_reset')\n{% endif %}\n"
      sequence:
      - action: valve.close_valve
        target:
          entity_id: valve.main_water_valve
      - action: light.turn_off
        target:
          entity_id:
          - switch.foyer_light
          - light.living_room_ceiling_lights
          - switch.sunroom_ceiling_light
          - switch.kitchen_light
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.id not in [''heartbeat''] }}'
          sequence:
          - action: notify.mobile_app_pixel_9
            data:
              title: Vacation Mode
              message: Water off and lights off
          - delay: 00:01:00
          - action: notify.mobile_app_pixel_9
            data:
              title: Vacation Mode
              message: State confirmed. Water off and lights off
  mode: single
