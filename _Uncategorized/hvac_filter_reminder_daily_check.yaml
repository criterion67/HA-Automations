- id: '1782396479145'
  alias: HVAC Filter Reminder - Daily Check
  description: 'Checks daily if HVAC filters are due and sends an actionable notification


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - trigger: time
    at: 09:00:00
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ as_timestamp(now()) >= state_attr(''input_datetime.filter_reminder_date'',
      ''timestamp'') }}'
  - condition: template
    value_template: '{{ as_timestamp(now()) >= as_timestamp(states(''input_datetime.hvac_filter_snooze_until''))
      }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hvac_filter_reminder_active
  - action: script.notify_alert
    data:
      message: Time to replace your HVAC filters (16"×20"×1", qty 2). Check your supply
        or pick up filters at the hardware store.
      title: 🔧 HVAC Filter Change Due
      tag: hvac_filter_reminder
      channel: Quiet Notices
      importance: low
      actions:
      - action: HVAC_FILTER_SNOOZE
        title: Snooze 24h
      - action: HVAC_FILTER_REPLACED
        title: Filter Replaced ✓
  mode: single
