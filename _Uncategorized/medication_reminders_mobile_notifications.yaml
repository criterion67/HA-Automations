- id: '1774223698553'
  alias: Medication Reminders - Mobile Notifications
  description: 'Sends mobile notifications to Pixel 9 at each scheduled medication
    time with Snooze (30 min) and Taken action buttons. Six time slots: 7am (Levothyroxine),
    8am (morning meds + antibiotics), 10am (supplements), 5pm (Levofloxacin), 7pm
    (evening meds), bedtime (Magnesium). Snooze fires a second notification after
    30 minutes by turning on the corresponding input_boolean snooze flag, which re-triggers
    via state change. Taken dismisses without re-alerting.'
  triggers:
  - platform: time
    at: 07:00:00
    id: time_7am
  - platform: time
    at: 08:00:00
    id: time_8am
  - platform: time
    at: '10:00:00'
    id: time_10am
  - platform: time
    at: '17:00:00'
    id: time_5pm
  - platform: time
    at: '19:00:00'
    id: time_7pm
  - platform: time
    at: '22:00:00'
    id: time_bedtime
  - platform: state
    entity_id: input_boolean.med_reminder_7am_snoozed
    to: 'on'
    id: snooze_7am
  - platform: state
    entity_id: input_boolean.med_reminder_8am_snoozed
    to: 'on'
    id: snooze_8am
  - platform: state
    entity_id: input_boolean.med_reminder_10am_snoozed
    to: 'on'
    id: snooze_10am
  - platform: state
    entity_id: input_boolean.med_reminder_5pm_snoozed
    to: 'on'
    id: snooze_5pm
  - platform: state
    entity_id: input_boolean.med_reminder_7pm_snoozed
    to: 'on'
    id: snooze_7pm
  - platform: state
    entity_id: input_boolean.med_reminder_bedtime_snoozed
    to: 'on'
    id: snooze_bedtime
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - time_7am
        - snooze_7am
      sequence:
      - if:
        - condition: trigger
          id: snooze_7am
        then:
        - delay:
            minutes: 30
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.med_reminder_7am_snoozed
      - action: notify.mobile_app_pixel_9
        data:
          title: 💊 7:00 AM Medications
          message: 'Levothyroxine 100 mcg


            ⚠️ Take alone — empty stomach. Wait 60 min before food or other meds.'
          data:
            tag: med_reminder_7am
            persistent: true
            actions:
            - action: MED_TAKEN_7AM
              title: ✅ Taken
            - action: MED_SNOOZE_7AM
              title: ⏰ Snooze 30 min
    - conditions:
      - condition: trigger
        id:
        - time_8am
        - snooze_8am
      sequence:
      - if:
        - condition: trigger
          id: snooze_8am
        then:
        - delay:
            minutes: 30
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.med_reminder_8am_snoozed
      - action: notify.mobile_app_pixel_9
        data:
          title: 💊 8:00 AM Medications
          message: 'Bupropion 300mg · Furosemide 20mg · Gabapentin 200mg · Losartan
            25mg · Synjardy XR 25/1000mg · Doxycycline 100mg (if active)


            ⚠️ Take with breakfast. Doxycycline: full glass of water, sit upright
            30 min after.'
          data:
            tag: med_reminder_8am
            persistent: true
            actions:
            - action: MED_TAKEN_8AM
              title: ✅ Taken
            - action: MED_SNOOZE_8AM
              title: ⏰ Snooze 30 min
    - conditions:
      - condition: trigger
        id:
        - time_10am
        - snooze_10am
      sequence:
      - if:
        - condition: trigger
          id: snooze_10am
        then:
        - delay:
            minutes: 30
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.med_reminder_10am_snoozed
      - action: notify.mobile_app_pixel_9
        data:
          title: 💊 10:00 AM Supplements
          message: 'Centrum Men MultiGummies · B12 1000mcg · Vitamin D3 2000 IU ·
            Lutein 10mg


            ⚠️ Must be 2 hrs after Doxycycline (while on antibiotic course).'
          data:
            tag: med_reminder_10am
            persistent: true
            actions:
            - action: MED_TAKEN_10AM
              title: ✅ Taken
            - action: MED_SNOOZE_10AM
              title: ⏰ Snooze 30 min
    - conditions:
      - condition: trigger
        id:
        - time_5pm
        - snooze_5pm
      sequence:
      - if:
        - condition: trigger
          id: snooze_5pm
        then:
        - delay:
            minutes: 30
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.med_reminder_5pm_snoozed
      - action: notify.mobile_app_pixel_9
        data:
          title: 💊 5:00 PM Medications
          message: 'Levofloxacin 750mg (if active)


            ⚠️ Take with food. Must be 2+ hrs before bedtime Magnesium.'
          data:
            tag: med_reminder_5pm
            persistent: true
            actions:
            - action: MED_TAKEN_5PM
              title: ✅ Taken
            - action: MED_SNOOZE_5PM
              title: ⏰ Snooze 30 min
    - conditions:
      - condition: trigger
        id:
        - time_7pm
        - snooze_7pm
      sequence:
      - if:
        - condition: trigger
          id: snooze_7pm
        then:
        - delay:
            minutes: 30
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.med_reminder_7pm_snoozed
      - action: notify.mobile_app_pixel_9
        data:
          title: 💊 7:00 PM Medications
          message: 'Atorvastatin 40mg · Gabapentin 200mg · Metoprolol 25mg · Aspirin
            81mg · Clopidogrel 75mg


            ⚠️ Take with food. Never skip Clopidogrel without calling Dr. Trice.'
          data:
            tag: med_reminder_7pm
            persistent: true
            actions:
            - action: MED_TAKEN_7PM
              title: ✅ Taken
            - action: MED_SNOOZE_7PM
              title: ⏰ Snooze 30 min
    - conditions:
      - condition: trigger
        id:
        - time_bedtime
        - snooze_bedtime
      sequence:
      - if:
        - condition: trigger
          id: snooze_bedtime
        then:
        - delay:
            minutes: 30
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.med_reminder_bedtime_snoozed
      - action: notify.mobile_app_pixel_9
        data:
          title: 💊 Bedtime Medications
          message: 'Magnesium Glycinate 200mg


            ⚠️ Must be 2+ hrs after Levofloxacin (while on antibiotic course).'
          data:
            tag: med_reminder_bedtime
            persistent: true
            actions:
            - action: MED_TAKEN_BEDTIME
              title: ✅ Taken
            - action: MED_SNOOZE_BEDTIME
              title: ⏰ Snooze 30 min
  mode: parallel
  max: 10
