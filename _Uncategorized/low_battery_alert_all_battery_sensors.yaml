- id: '1788062748656'
  alias: Low Battery Alert (All Battery Sensors)
  description: 'Daily whole house low battery check at 09:30. Scans every sensor and
    binary sensor carrying the battery device class and sends one push listing everything
    that is low.


    Rewritten 2026-08-30 as a native automation, replacing the gmlupatelli/low_battery_notification
    blueprint, and keeps percentage readings and low battery flags in separate labelled
    sections.


    Edited 2026-09-15 to remove two sources of false alerts:

    1. OFFLINE DEVICES. YoLink Local writes 0 to a battery sensor when the device
    drops offline instead of going unavailable (Rear Yard Gate read 0 from 05:20 to
    11:15 on 2026-09-15 while its other entities were unavailable). A battery reading
    of exactly 0 is now skipped when any other entity on the same device is unavailable.
    A real 0 on a device that is still online is still reported. Offline devices are
    the job of automation.sensor_went_silent_alert.

    2. LOCK FLAGS THAT CONTRADICT THE PERCENTAGE. The Sunroom and Rear Door Z-Wave
    deadbolts hold their Replace battery now and Replace battery soon flags on while
    reading 89 percent, and Scott confirmed 89 percent is accurate. A battery binary
    sensor is now skipped whenever the same device also has a battery percentage sensor,
    so the percentage wins. The flag section only reports devices that have no percentage
    sensor.


    Also on 2026-09-15 the Goldenmate UPS moved to the NUT integration (sensor.goldenmate_battery_charge),
    and the old HASS.Agent based sensor.goldenmate_battery_level template helper that
    read a fake 0 was deleted.


    Threshold is 20 rather than 15 because the Foyer temperature sensor stopped transmitting
    at 17 percent and would never have reached a 15 percent threshold.


    Sensors reading unknown or unavailable are deliberately excluded here. That failure
    mode is covered by automation.sensor_went_silent_alert.


    The single template lives in variables so the condition and the notification share
    one scan of the state machine. There is no native condition for counting entities
    that match a device class, which is why a template is used in the condition position.'
  triggers:
  - at: 09:30:00
    id: daily_check
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ low_body | trim | length > 0 }}'
  actions:
  - action: notify.mobile_app_pixel_9
    data:
      data:
        channel: Quiet Notices
        importance: low
        notification_icon: mdi:battery-alert
        tag: low_battery_daily
      message: '{{ low_body }}'
      title: Low Battery
  mode: single
  variables:
    low_body: '{%- set ns = namespace(pct=[], flag=[]) -%}

      {%- for s in states.sensor if s.attributes.device_class == ''battery'' and s.state
      | float(-1) >= 0 and s.state | float(-1) < 20 -%}

      {%- set dev = device_id(s.entity_id) -%}

      {%- set offline = s.state | float(-1) == 0 and dev is not none and device_entities(dev)
      | select(''is_state'', ''unavailable'') | list | count > 0 -%}

      {%- if not offline -%}

      {%- set ns.pct = ns.pct + [s.name ~ '' ('' ~ s.state ~ ''%)''] -%}

      {%- endif -%}

      {%- endfor -%}

      {%- for s in states.binary_sensor if s.attributes.device_class == ''battery''
      and s.state == ''on'' -%}

      {%- set dev = device_id(s.entity_id) -%}

      {%- set has_pct = dev is not none and device_entities(dev) | select(''match'',
      ''sensor\.'') | select(''is_state_attr'', ''device_class'', ''battery'') | list
      | count > 0 -%}

      {%- if not has_pct -%}

      {%- set ns.flag = ns.flag + [s.name] -%}

      {%- endif -%}

      {%- endfor -%}

      {%- if ns.pct %}Below 20 percent:

      {% for i in ns.pct %}- {{ i }}

      {% endfor %}{% endif -%}

      {%- if ns.flag %}

      Reporting low (no percentage given):

      {% for i in ns.flag %}- {{ i }}

      {% endfor %}{% endif -%}'
