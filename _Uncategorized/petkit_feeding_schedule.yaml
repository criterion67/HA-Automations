- id: '1782935490153'
  alias: Petkit - Feeding Schedule
  description: Plays the 9000 Hz tone on the Dogs cast speaker to call Gracie at her
    three meal times (7:00 AM, 12:00 PM, 6:00 PM). Feeding itself is done by the feeder's
    own Petkit app schedule (30 g, 20 g, 30 g = 80 g daily), which keeps running offline
    and on battery during outages. This automation no longer sends feed commands (changed
    2026-10-31).
  triggers:
  - trigger: time
    at: 07:00:00
    id: morning
  - trigger: time
    at: '12:00:00'
    id: midday
  - trigger: time
    at: '18:00:00'
    id: evening
  actions:
  - action: media_player.play_media
    target:
      entity_id: media_player.dogs_cast
    data:
      media:
        media_content_id: media-source://media_source/local/oscillator-9000-hz-tone.mp3
        media_content_type: audio/mpeg
        metadata: {}
  mode: parallel
  max: 3
