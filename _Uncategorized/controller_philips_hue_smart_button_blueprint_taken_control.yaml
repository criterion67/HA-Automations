- id: '1774381469215'
  alias: Controller - Philips Hue Smart Button Blueprint - Taken Control
  description: ''
  triggers:
  - trigger: device
    domain: mqtt
    device_id: 87f8fe1f9021f55176d698c9b9537af6
    type: action
    subtype: 'on'
  - trigger: device
    domain: mqtt
    device_id: 87f8fe1f9021f55176d698c9b9537af6
    type: action
    subtype: 'off'
  - trigger: device
    domain: mqtt
    device_id: 87f8fe1f9021f55176d698c9b9537af6
    type: action
    subtype: press
  - trigger: device
    domain: mqtt
    device_id: 87f8fe1f9021f55176d698c9b9537af6
    type: action
    subtype: hold
  - trigger: device
    domain: mqtt
    device_id: 87f8fe1f9021f55176d698c9b9537af6
    type: action
    subtype: release
  - trigger: event
    event_type:
    - deconz_event
    - zha_event
    event_data:
      device_id: 87f8fe1f9021f55176d698c9b9537af6
  conditions:
  - condition: template
    value_template: '{%- set trigger_action -%} {%- if integration_id == "zigbee2mqtt"
      -%} {{ trigger.payload }} {%- elif integration_id == "deconz" -%} {{ trigger.event.data.event
      }} {%- elif integration_id == "zha" -%} {{ trigger.event.data.command }} {%-
      endif -%} {%- endset -%} {{ trigger_action not in ["","None"] }}'
  actions:
  - delay:
      milliseconds: 0
  - variables:
      trigger_action: '{%- if integration_id == "zigbee2mqtt" -%} {{ trigger.payload
        }} {%- elif integration_id == "deconz" -%} {{ trigger.event.data.event }}
        {%- elif integration_id == "zha" -%} {{ trigger.event.data.command }} {%-
        endif -%}'
      deserialized_state: '{{ (states(helper_last_controller_event) | from_json) if
        helper_last_controller_event is not none and (states(helper_last_controller_event)
        | regex_match("^\{\s*?((\"a\":\s*?\".*\"|\"t\":\s*?\d+\.\d+)(,\s*?)?){2}\s*?\}$"))
        else {} }}'
      trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0)))
        * 1000 }}'
  - action: input_text.set_value
    data:
      entity_id: ''
      value: '{{ {"a":trigger_action,"t":as_timestamp(now())} | to_json }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger_action | string in button_short }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ button_double_press }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ trigger_action | string == last_controller_event
                  and trigger_delta | int <= helper_double_press_delay | int }}'
              sequence:
              - action: input_text.set_value
                data:
                  entity_id: ''
                  value: '{{ {"a":"double_press","t":as_timestamp(now())} | to_json
                    }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_double
              - choose:
                - conditions: []
                  sequence: []
            default:
            - delay:
                milliseconds: '{{ adjusted_double_press_delay }}'
            - event: ahb_controller_event
              event_data:
                controller: '{{ controller_id }}'
                action: button_short
            - choose:
              - conditions: []
                sequence: []
        default:
        - event: ahb_controller_event
          event_data:
            controller: '{{ controller_id }}'
            action: button_short
        - choose:
          - conditions: []
            sequence: []
    - conditions:
      - condition: template
        value_template: '{{ trigger_action | string in button_long }}'
      sequence:
      - event: ahb_controller_event
        event_data:
          controller: '{{ controller_id }}'
          action: button_long
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ button_long_loop }}'
          sequence:
          - repeat:
              while:
              - condition: template
                value_template: '{{ repeat.index < button_long_max_loop_repeats |
                  int }}'
              sequence: []
        default: []
    - conditions:
      - condition: template
        value_template: '{{ trigger_action | string in button_release }}'
      sequence:
      - event: ahb_controller_event
        event_data:
          controller: '{{ controller_id }}'
          action: button_release
      - choose:
        - conditions: []
          sequence: []
  variables:
    ahb_version: 2025.11.04
    ahb_maintainers:
    - EPMatt
    integration: Zigbee2MQTT
    button_long_loop: false
    button_long_max_loop_repeats: 500
    button_double_press: false
    helper_last_controller_event: ''
    helper_double_press_delay: 500
    helper_debounce_delay: 0
    integration_id: '{{ integration | lower }}'
    adjusted_double_press_delay: '{{ [helper_double_press_delay - helper_debounce_delay,
      100] | max }}'
    actions_mapping:
      deconz:
        button_short:
        - '1000'
        button_long:
        - '1001'
        button_release:
        - '1003'
      zha:
        button_short:
        - on_short_release
        button_long:
        - on_hold
        button_release:
        - on_long_release
      zigbee2mqtt:
        button_short:
        - press
        button_long:
        - hold
        button_release:
        - release
    button_short: '{{ actions_mapping[integration_id]["button_short"] }}'
    button_long: '{{ actions_mapping[integration_id]["button_long"] }}'
    button_release: '{{ actions_mapping[integration_id]["button_release"] }}'
    controller_id: 87f8fe1f9021f55176d698c9b9537af6
  mode: restart
  max_exceeded: silent
