- id: '1771619044590'
  alias: 'Front Door Lock: Aqara Button (B1)'
  description: Single press locks. Double press unlocks.
  triggers:
  - domain: mqtt
    device_id: 9f47190752b6ab62fbb551223b91b5dd
    type: action
    subtype: single
    trigger: device
    id: single_press
  - domain: mqtt
    device_id: 9f47190752b6ab62fbb551223b91b5dd
    type: action
    subtype: double
    trigger: device
    id: double_press
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: single_press
      sequence:
      - action: lock.lock
        target:
          entity_id: lock.front_door_lock
    - conditions:
      - condition: trigger
        id: double_press
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.front_door_lock
  mode: single
