- id: '1763771518580'
  alias: Garage Door position change notifications v2
  description: 'Announces and notifies on garage door open and close: flashes the
    bedroom alert light red on open and turns it off on close, plays TTS on the bedroom
    speaker, sends a phone notification, and runs an LED effect on the Bedroom Light
    Switch (Inovelli).


    MOWER CYCLE BEHAVIOR (changed 2026-10-17). While input_boolean.mower_cycle_active
    is on, the automation still runs so the bedroom alert light and the Inovelli LED
    effect show that the garage door is open. Only the TTS announcement, the phone
    notification and the Living Room Floor Lamp 1 turn off are skipped, each wrapped
    in an if block gated on the flag being off. This replaced the old top level condition
    that suppressed everything, so a mower cycle no longer fires four TTS announcements
    and four notifications into the bedroom but still gives a visual.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - entity_id:
    - binary_sensor.garage_door_position
    id: Opening
    from:
    - 'off'
    to:
    - 'on'
    trigger: state
  - entity_id:
    - binary_sensor.garage_door_position
    id: Closing
    from:
    - 'on'
    to:
    - 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Opening
      sequence:
      - data:
          rgb_color:
          - 255
          - 0
          - 0
          flash: short
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_alert_light
      - data:
          rgb_color:
          - 255
          - 0
          - 0
        action: light.turn_on
        target:
          entity_id:
          - light.living_room_floor_lamp_1
        enabled: false
      - alias: Skip TTS and phone notification during a mower cycle
        if:
        - condition: state
          entity_id: input_boolean.mower_cycle_active
          state: 'off'
        then:
        - target:
            entity_id:
            - media_player.bedroom_speaker
          data:
            media:
              media_content_id: media-source://tts/cloud?message=The+garage+door+has+been+opened&language=en-US&voice=JennyNeural
              media_content_type: provider
              metadata:
                title: The garage door has been opened
                thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
                media_class: app
                navigateIds:
                - {}
                - media_content_type: app
                  media_content_id: media-source://tts
                - media_content_type: provider
                  media_content_id: media-source://tts/cloud?message=The+garage+door+has+been+opened&language=en-US&voice=JennyNeural
          action: media_player.play_media
        - action: script.notify_alert
          data:
            message: Garage door has been opened.
            title: Garage Door Position Changed
      - type: issue_all_led_effect
        domain: zha
        device_id: cf2b54ede5b6725a721039bc1f9bb552
        effect_type: Medium_Rising
        color: 221
        level: 79
        duration: 15
    - conditions:
      - condition: trigger
        id:
        - Closing
      sequence:
      - data: {}
        target:
          entity_id:
          - light.bedroom_alert_light
        action: light.turn_off
      - alias: Skip TTS during a mower cycle
        if:
        - condition: state
          entity_id: input_boolean.mower_cycle_active
          state: 'off'
        then:
        - target:
            entity_id:
            - media_player.bedroom_speaker
          data:
            media:
              media_content_id: media-source://tts/cloud?message=The+garage+door+has+been+closed&language=en-US&voice=JennyNeural
              media_content_type: provider
              metadata:
                title: The garage door has been closed
                thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
                media_class: app
                navigateIds:
                - {}
                - media_content_type: app
                  media_content_id: media-source://tts
                - media_content_type: provider
                  media_content_id: media-source://tts/cloud?message=The+garage+door+has+been+closed&language=en-US&voice=JennyNeural
          action: media_player.play_media
      - type: issue_all_led_effect
        domain: zha
        device_id: cf2b54ede5b6725a721039bc1f9bb552
        effect_type: Medium_Falling
        color: 125
        level: 79
        duration: 15
      - alias: Skip phone notification and floor lamp off during a mower cycle
        if:
        - condition: state
          entity_id: input_boolean.mower_cycle_active
          state: 'off'
        then:
        - action: script.notify_alert
          data:
            message: Garage door has been closed.
            title: Garage Door Position Changed
        - action: light.turn_off
          target:
            entity_id:
            - light.living_room_floor_lamp_1
          data: {}
          enabled: false
        - delay:
            seconds: 1
        - action: light.turn_off
          target:
            entity_id: light.living_room_floor_lamp_1
          data: {}
  mode: single
