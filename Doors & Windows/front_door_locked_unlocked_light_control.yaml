- id: '1706499230547'
  alias: 'Front Door: Locked/Unlocked - Light Control'
  description: The foyer and hall lights will turn on or off based on the front door
    being unlocked or locked after sunset and before sunrise.
  triggers:
  - platform: state
    entity_id: lock.front_door_deadbolt
    to: unlocked
    id: Unlocked
  - platform: state
    entity_id: lock.front_door_deadbolt
    to: locked
    id: Locked
  conditions:
  - condition: sun
    before: sunrise
    after: sunset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Unlocked
      sequence:
      - target:
          entity_id:
          - switch.foyer_light
          - switch.hall_light
        data: {}
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id:
        - Locked
      sequence:
      - target:
          entity_id:
          - switch.foyer_light
          - switch.hall_light
        data: {}
        action: switch.turn_off
  mode: single
