- id: '1719185920035'
  alias: 'Attic Lights: Door Controlled'
  description: Attic light is switched on and off based on the open) closed state
    of either interior or garage attic doors.
  triggers:
  - trigger: state
    entity_id: binary_sensor.attic_attic_door_1_opening
    to: 'on'
    id: Attic Door 1 Open
  - trigger: state
    entity_id: binary_sensor.attic_attic_door_1_opening
    to: 'off'
    id: Attic Door 1 Closed
  - trigger: state
    entity_id: binary_sensor.attic_attic_door_2_opening
    to: 'on'
    id: Attic Door 2 Open
  - trigger: state
    entity_id: binary_sensor.attic_attic_door_2_opening
    to: 'off'
    id: Attic Door 2 Closed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Attic Door 1 Open
        - Attic Door 2 Open
      sequence:
      - target:
          entity_id:
          - switch.attic_hallway_light
          - switch.attic_garage_light
        data: {}
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id:
        - Attic Door 1 Closed
        - Attic Door 2 Closed
      sequence:
      - target:
          entity_id:
          - switch.attic_hallway_light
          - switch.attic_garage_light
        data: {}
        action: switch.turn_off
  mode: single
