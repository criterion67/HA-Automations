- id: '1757264925777'
  alias: NFC - Toggle Garage Door from Truck
  description: 'NFC tag on dashboard will toggle garage door and lock/unlock laundry
    room door with failsafe notification.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - tag_id: b38fed34-ef7f-4575-a5ba-f28347be2b49
    trigger: tag
  actions:
  - action: cover.toggle
    target:
      entity_id: cover.garage_door
  - wait_for_trigger:
    - entity_id: binary_sensor.garage_door_contact
      to: 'on'
      trigger: state
    - entity_id: binary_sensor.garage_door_contact
      to: 'off'
      trigger: state
    timeout: 00:00:30
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.garage_door_contact
        state: 'on'
      sequence:
      - condition: state
        entity_id: lock.laundry_room_door_deadbolt
        state: locked
      - action: lock.unlock
        target:
          entity_id: lock.laundry_room_door_deadbolt
      - action: script.notify_alert
        data:
          message: Garage door is open and laundry door unlocked.
          title: Garage Door + Laundry Lock
    - conditions:
      - condition: state
        entity_id: binary_sensor.garage_door_contact
        state: 'off'
      sequence:
      - condition: state
        entity_id: lock.laundry_room_door_deadbolt
        state: unlocked
      - action: lock.lock
        target:
          entity_id: lock.laundry_room_door_deadbolt
      - action: script.notify_alert
        data:
          message: Garage door is closed and laundry door locked.
          title: Garage Door + Laundry Lock
    - conditions:
      - condition: template
        value_template: '{{ wait.completed == false }}'
      sequence:
      - action: script.notify_alert
        data:
          message: Garage door state unknown — laundry lock unchanged.
          title: Garage Door + Laundry Lock
  mode: single
