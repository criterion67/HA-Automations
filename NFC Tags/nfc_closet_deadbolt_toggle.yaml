- id: '1722436970246'
  alias: NFC - Closet Deadbolt Toggle
  description: NFC tag toggles closet door deadbolt. Located underneath the closet
    light switch faceplate on the top.
  triggers:
  - platform: tag
    tag_id: b52cebc2-7126-4b57-ae72-183c5fda497a
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: lock.bedroom_closet_door_deadbolt
        state: locked
      sequence:
      - data: {}
        action: lock.unlock
        target:
          entity_id: lock.bedroom_closet_door_deadbolt
    - conditions:
      - condition: state
        entity_id: lock.bedroom_closet_door_deadbolt
        state: unlocked
      sequence:
      - data: {}
        action: lock.lock
        target:
          entity_id: lock.bedroom_closet_door_deadbolt
  mode: single
