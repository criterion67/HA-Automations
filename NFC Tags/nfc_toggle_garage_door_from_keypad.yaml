- id: '1692825686150'
  alias: NFC - Toggle Garage Door from Keypad
  description: When NFC tag is scanned, open/close garage door. Located in keypad
    on garage door frame.
  triggers:
  - tag_id: b5c0f90b-f58e-4952-95bb-9a3a281fb70e
    platform: tag
  conditions: []
  actions:
  - action: cover.open_cover
    target:
      entity_id: cover.garage_door
    data: {}
  - data: {}
    action: lock.unlock
    target:
      entity_id: lock.laundry_room_door_deadbolt
  - data:
      message: Garage notification
      title: Garage door open/Laundry room door unlocked
    action: notify.mobile_app_pixel_9
  mode: single
