- id: '1773096059524'
  alias: Doorbell - Delivery Vehicle AI Notification
  description: 'Fires on three triggers, each handled differently. The parcel box
    and mailbox contact sensors are treated as near certain deliveries, so those notify
    unless the AI recognizes a resident collecting items rather than a courier leaving
    them. A vehicle detection on the Driveway 2 camera is treated as unproven, so
    it only notifies when the AI positively identifies a delivery. All paths send
    three frames (driveway wide shot, front porch, and the downward package camera)
    to LLM Vision on Google Gemini for a structured JSON verdict. The prompt leads
    with a location rule: carriers never pull into the driveway, they stop on the
    street, so any vehicle in the driveway is a resident or visitor vehicle and is
    ignored. It also lists where packages turn up, namely the parcel box, in front
    of the door, beside the white porch column, and on the sidewalk. Nothing is written
    to the timeline automatically; only a passing verdict creates an LLM Vision event
    labeled Package and pushes a notification to the Pixel. The pushed notification
    image now follows the trigger: the mailbox and driveway triggers attach the Driveway
    2 snapshot, which is the only view that actually shows the mailbox and the street
    where carriers stop, while the parcel box trigger keeps the front porch snapshot.
    The title likewise varies by trigger so mail reads as mail rather than as a package.
    A fourth trigger listens to the UniFi Protect package detection event on the G6
    Pro doorbell package camera, which covers the case a courier leaves a box on the
    porch floor without opening the parcel box and without their vehicle tripping
    the driveway detector. That trigger ignores the unknown and unavailable states
    so a restart cannot fire it, is treated as near certain like the parcel box, and
    attaches a fresh snapshot of the downward package camera. The vision prompt was
    revised on 2026-08-17 to name image 3 as the authoritative doorstep view when
    it disagrees with the porch view, and to stop requiring signs of recent activity,
    since the package detection path often snapshots an empty frame after the courier
    has already left. A package now counts on presence alone, and resident_retrieving
    requires a person to actually be visible.'
  triggers:
  - entity_id: binary_sensor.driveway_2_vehicle_detected_2
    for:
      seconds: 5
    id: driveway
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.mailbox_sensor_door
    id: mailbox
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.parcel_box_contact
    id: parcel_box
    to: 'on'
    trigger: state
  - trigger: state
    entity_id: event.outside_g6_pro_doorbell_package
    id: package
    not_to:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/delivery_driveway.png
    target:
      entity_id: camera.driveway_2_high_resolution_channel
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/delivery_doorbell.png
    target:
      entity_id: camera.g6_pro_entry_high_resolution_channel
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/delivery_package.png
    target:
      entity_id: camera.g6_pro_entry_package_camera
  - delay:
      seconds: 2
  - action: llmvision.image_analyzer
    data:
      description_field: description
      expose_images: true
      generate_title: false
      image_entity:
      - camera.driveway_2_high_resolution_channel
      - camera.g6_pro_entry_high_resolution_channel
      - camera.g6_pro_entry_package_camera
      include_filename: false
      max_tokens: 300
      message: 'You are seeing three camera views of the same residential property,
        taken at the same moment.


        IMAGE 1 is a wide driveway and street view.

        IMAGE 2 is the front porch, seen from the doorbell at eye level.

        IMAGE 3 is a downward facing package camera in the same doorbell, aimed straight
        at the doorstep. It is the closest and clearest view of the ground directly
        in front of the door. When image 2 and image 3 disagree about whether something
        is sitting on the porch floor, trust image 3.


        LOCATION RULE, apply this strictly and above everything else: delivery vehicles
        NEVER pull into this driveway. They always stop on the street, either in front
        of the driveway, in front of the mailbox, or in front of the house. Therefore
        any vehicle sitting in the driveway itself is a resident or visitor vehicle
        and must be ignored completely, whatever its make, color, size or type.


        Also ignore lawn care equipment and people mowing, neighbors, pets, and vehicles
        simply driving past without stopping.


        WHERE PACKAGES APPEAR: a BROWN PARCEL BOX sits in the BOTTOM RIGHT corner
        of image 2, partly cut off by the edge. Around 95 percent of deliveries go
        into that box, so a courier reaching toward the bottom right of the porch
        is almost always making a delivery. The remainder are set down on the concrete
        porch floor: on or beside the doormat directly in front of the door, at the
        base of the white porch column, or a little further out on the walkway leading
        away from the porch. Image 3 covers the doormat and door area directly, so
        check it carefully for anything resting on the ground. Treat any box, envelope,
        padded mailer or bag on the porch floor as a package.


        A package counts whether or not anyone is visible. You may be seeing the scene
        after the courier has already left, so do not require a person, a vehicle,
        or any sign of recent activity in order to report a package that is plainly
        sitting there.


        Set delivery to true if ANY of the following hold: a delivery vehicle from
        USPS, FedEx, UPS, or Amazon is stopped on the street; a uniformed courier
        is on foot approaching the property; or a package is present in any of the
        places listed above. Otherwise set delivery to false.


        Set resident_retrieving to true only if a person is visible AND that person
        is clearly a resident of the house collecting mail or a package rather than
        delivering one, for example someone walking out from the front door toward
        the parcel box or the mailbox. If no person is visible, set resident_retrieving
        to false.'
      provider: 01KZ2A24SYVPMCX8DTYVJTZTVV
      response_format: json
      store_in_timeline: false
      structure: '{"type": "object", "properties": {"delivery": {"type": "boolean",
        "description": "true only if a carrier vehicle is stopped on the street, a
        courier is on foot, or a package appears newly left"}, "carrier": {"type":
        "string", "description": "USPS, FedEx, UPS, Amazon, or none"}, "package_left":
        {"type": "boolean", "description": "true if a package appears to have been
        left on the porch, at the door, by the column, or on the sidewalk"}, "package_location":
        {"type": "string", "description": "where the package is: parcel box, front
        door, white column, sidewalk, or none"}, "resident_retrieving": {"type": "boolean",
        "description": "true if the person visible is a resident collecting mail or
        a package rather than delivering one"}, "title": {"type": "string", "description":
        "Short event title, under 6 words"}, "description": {"type": "string", "description":
        "One or two sentence description of what was seen"}}, "required": ["delivery",
        "carrier", "package_left", "package_location", "resident_retrieving", "title",
        "description"], "additionalProperties": false}'
      target_width: 1280
      title_field: title
    response_variable: response
  - condition: template
    value_template: '{% set t = trigger.id | default('''') %}{% set r = response.structured_response
      %}{{ (t in [''parcel_box'', ''mailbox'', ''package''] and not (r.resident_retrieving
      | default(false))) or (t == ''driveway'' and (r.delivery | default(false)))
      }}'
  - action: llmvision.create_event
    data:
      camera_entity: camera.driveway_2_high_resolution_channel
      description: '{{ response.structured_response.description }}'
      image_path: '{{ response.key_frame }}'
      label: Package
      title: '{{ response.structured_response.title }}'
  - action: notify.mobile_app_pixel_9
    data:
      data:
        image: '{% set t = trigger.id | default('''') %}{{ ''/local/snapshots/delivery_package.png''
          if t == ''package'' else (''/local/snapshots/delivery_driveway.png'' if
          t in [''mailbox'', ''driveway''] else ''/local/snapshots/delivery_doorbell.png'')
          }}'
        tag: doorbell_delivery_ai
        url: homeassistant://navigate/lovelace
      message: '{{ response.structured_response.description }}'
      title: '{% set t = trigger.id | default('''') %}{{ ''Mail Delivered! 📬'' if
        t == ''mailbox'' else (''Package Delivered! 📦'' if t in [''parcel_box'', ''package'']
        else ''Delivery Detected! 📦'') }}'
  max_exceeded: silent
  mode: single
