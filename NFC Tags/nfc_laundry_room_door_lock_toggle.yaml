- id: '1726283701098'
  alias: 'NFC - Laundry Room Door Lock Toggle '
  description: 'NFC tag toggles Laundry Room Door Lock. Located ? '
  trigger:
  - platform: tag
    tag_id: 1c2ad52a-44d0-459a-afca-0792d14a2bff
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: lock.laundry_room_door_lock
        state: locked
      sequence:
      - data: {}
        action: lock.unlock
        target:
          entity_id: lock.laundry_room_door_lock
    - conditions:
      - condition: state
        entity_id: lock.laundry_room_door_lock
        state: unlocked
      sequence:
      - data: {}
        action: lock.lock
        target:
          entity_id: lock.laundry_room_door_lock
  mode: single
