- id: '1726283010076'
  alias: NFC - Front Door Lock Toggle
  description: 'NFC tag toggles front door lock. Located ? '
  triggers:
  - tag_id: eff1012d-ee57-4eec-838c-9edcd248eb05
    trigger: tag
  - tag_id: 2b8bddee-c0a6-4841-87bf-7a4957daeda4
    trigger: tag
    enabled: false
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: lock.front_door_lock
        state: locked
      sequence:
      - data: {}
        action: lock.unlock
        target:
          entity_id: lock.front_door_lock
    - conditions:
      - condition: state
        entity_id: lock.front_door_lock
        state: unlocked
      sequence:
      - data: {}
        action: lock.lock
        target:
          entity_id: lock.front_door_lock
  mode: single
