- id: '1762182206207'
  alias: Doorbell Person or Visitor - Tablet Camera View v2.0
  description: When a person is detected or someone presses the G6 Pro Doorbell, wake
    the bedroom, bathroom and office tablets, show the doorbell camera full screen
    for 30 seconds, then return each tablet to its own dashboard (bedroom and bathroom
    to the main tablet dashboard, office to the Pi-hole UPS dashboard) and turn the
    bathroom tablet screen back off. All three tablets run Kiosk Satellite and switch
    views through their dashboard view selects.
  triggers:
  - entity_id: binary_sensor.g6_pro_doorbell_person_detected
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.g6_pro_doorbell_doorbell
    to: 'on'
    trigger: state
  actions:
  - alias: Turn on all tablet screens
    action: light.turn_on
    target:
      entity_id:
      - light.bedroom_tablet_kiosk_screen
      - light.bathroom_tablet_kiosk_screen
      - light.office_tablet_kiosk_screen
    continue_on_error: true
  - alias: Wait 2 seconds for screens to wake
    delay: 00:00:02
  - alias: Show doorbell camera on all tablets
    action: select.select_option
    target:
      entity_id:
      - select.bedroom_tablet_kiosk_dashboard_view
      - select.bathroom_tablet_kiosk_dashboard_view
      - select.office_tablet_kiosk_dashboard_view
    data:
      option: doorbell-camera/0
    continue_on_error: true
  - alias: Wait 30 seconds while displaying camera
    delay: 00:00:30
  - alias: Return bedroom and bathroom tablets to main dashboard
    action: select.select_option
    target:
      entity_id:
      - select.bedroom_tablet_kiosk_dashboard_view
      - select.bathroom_tablet_kiosk_dashboard_view
    data:
      option: scotts-dashboard-tablet/home
    continue_on_error: true
  - alias: Return office tablet to Pi-hole UPS dashboard
    action: select.select_option
    target:
      entity_id: select.office_tablet_kiosk_dashboard_view
    data:
      option: pihole-ups/pihole-ups
    continue_on_error: true
  - alias: Turn off bathroom tablet screen after viewing
    action: light.turn_off
    target:
      entity_id: light.bathroom_tablet_kiosk_screen
  mode: single
