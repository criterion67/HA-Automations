- id: '1762182206207'
  alias: Doorbell Person or Visitor - Tablet Camera View v2.0
  description: When a person is detected or someone presses the G6 Pro Doorbell, wake
    all tablets, show the doorbell camera full screen for 30 seconds, then return
    to the main dashboard and turn the bathroom tablet screen back off. Bedroom and
    bathroom tablets run Kiosk Satellite and switch views through their dashboard
    view selects. The office tablet (Galaxy Tab A9+ 2) still runs Fully Kiosk until
    it is migrated.
  triggers:
  - entity_id: binary_sensor.g6_pro_doorbell_person_detected
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.g6_pro_doorbell_doorbell
    to: 'on'
    trigger: state
  actions:
  - alias: Turn on Kiosk Satellite tablet screens
    action: light.turn_on
    target:
      entity_id:
      - light.bedroom_tablet_kiosk_screen
      - light.bathroom_tablet_kiosk_screen
    continue_on_error: true
  - alias: Turn on office tablet screen (Fully)
    action: switch.turn_on
    target:
      entity_id: switch.galaxy_tab_a9_2_screen
    continue_on_error: true
  - alias: Wait 2 seconds for screens to wake
    delay: 00:00:02
  - alias: Show doorbell camera on Kiosk Satellite tablets
    action: select.select_option
    target:
      entity_id:
      - select.bedroom_tablet_kiosk_dashboard_view
      - select.bathroom_tablet_kiosk_dashboard_view
    data:
      option: doorbell-camera/0
    continue_on_error: true
  - alias: Show doorbell camera on office tablet (Fully)
    action: fully_kiosk.load_url
    data:
      device_id:
      - a9214fb40d85cc451175d4ccb7262585
      url: http://192.168.10.168:8123/doorbell-camera/0?hide_header&hide_sidebar
    continue_on_error: true
  - alias: Wait 30 seconds while displaying camera
    delay: 00:00:30
  - alias: Return Kiosk Satellite tablets to main dashboard
    action: select.select_option
    target:
      entity_id:
      - select.bedroom_tablet_kiosk_dashboard_view
      - select.bathroom_tablet_kiosk_dashboard_view
    data:
      option: scotts-dashboard-tablet/home
    continue_on_error: true
  - alias: Return office tablet to main dashboard (Fully)
    action: fully_kiosk.load_url
    data:
      device_id:
      - a9214fb40d85cc451175d4ccb7262585
      url: http://192.168.10.168:8123/scotts-dashboard-tablet/0
    continue_on_error: true
  - alias: Turn off bathroom tablet screen after viewing
    action: light.turn_off
    target:
      entity_id: light.bathroom_tablet_kiosk_screen
  mode: single
