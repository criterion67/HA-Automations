- id: '1751428822023'
  alias: Water Leak Alert 1 - Triggered Response
  description: 'Sounds the alarm for a detected water leak: TTS announcement on media_player.whole_house
    naming the sensor, a high priority actionable push with Snooze and Dismiss, then
    three siren pulses on switch.ring_alarm_siren, repeating every 5 minutes until
    the leak clears or the alert is snoozed.


    Mode is restart so a second leak sensor tripping restarts the loop and re-announces
    with the new sensor name rather than starting a competing siren.


    DEFECT FIXED 2026-08-20: the repeat while condition was or(any sensor on, leak_alert_snoozed
    on). Because the snooze flag was ORed in rather than negated and ANDed, pressing
    Snooze suppressed nothing and instead kept the siren looping after every sensor
    had cleared, until Dismiss was pressed. It is now and(any sensor on, not snoozed),
    so Snooze actually stops the loop and the loop ends on its own when the leak clears.


    The Snooze and Dismiss buttons are handled by automation.water_leak_alert_notification_action_handler,
    which sets and clears input_boolean.leak_alert_snoozed. Nothing automatically
    clears the snooze flag, so after snoozing a leak you must press Dismiss (or clear
    the boolean) before this alarm can sound again.


    TEMPORARY SIREN FALLBACK, APPLIED 2026-08-21 - REVERT THIS WHEN THE RING SIREN
    RETURNS.


    This automation used to pulse switch.ring_alarm_siren three times. That entity
    no longer exists. The Ring Alarm security panel device (Ring zid 6f3a0b61-64c5-4b2d-b835-68d429ad00a0),
    which carried BOTH the alarm_control_panel and the siren switch, stopped being
    published by the ring-mqtt add-on around 2026-08-15. Ruled out as causes: authentication,
    the add-on state file, the add-on version (5.9.3 is latest), and the HA entity
    registry. A complete uninstall, reinstall and re-authentication of ring-mqtt on
    2026-08-21 rediscovered from scratch and still returned only three devices - Base
    Station (ece94eb9-b82f-4452-a387-3c64368ff224), Keypad 1 (2a6309f1-76c2-431c-a3c7-d77b2dbff9f6)
    and Keypad 2 (f6129287-6437-4ced-a2d0-16925827a75b). The alarm itself is healthy
    and arms and disarms normally from the Ring phone app, so the panel exists on
    the Ring account and ring-mqtt is simply not being given it. Open with the ring-mqtt
    maintainer.


    UNTIL THEN the siren step uses siren.chime_play_tone, the Ring Chime, tone 3 (siren2.mp3,
    40 seconds) at full volume with an 8 second duration per pulse, keeping the original
    three-pulse 8-on 12-off rhythm. Scott''s stated preference is to go back to the
    Ring siren, so when a Ring siren entity reappears, replace this whole fallback
    block and delete these two paragraphs.'
  triggers:
  - entity_id:
    - binary_sensor.leak_sensor_1_moisture_2
    - binary_sensor.kitchen_leak_sensor_2_moisture
    - binary_sensor.leak_sensor_3_moisture
    - binary_sensor.leak_sensor_4_moisture
    - binary_sensor.bathroom_leak_sensor_5_moisture
    - binary_sensor.bathroom_leak_sensor_6_moisture
    - binary_sensor.bathroom_2_leak_sensor_7_moisture
    - binary_sensor.bathroom_2_leak_sensor_8_moisture
    - binary_sensor.hvac_condensate_pan_sensor_9
    to:
    - 'on'
    trigger: state
  actions:
  - variables:
      triggered_sensor: '{{ trigger.to_state.name }}'
  - repeat:
      while:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.leak_sensor_1_moisture_2
            state: 'on'
          - condition: state
            entity_id: binary_sensor.kitchen_leak_sensor_2_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.leak_sensor_3_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.leak_sensor_4_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bathroom_leak_sensor_5_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bathroom_leak_sensor_6_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bathroom_2_leak_sensor_7_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bathroom_2_leak_sensor_8_moisture
            state: 'on'
          - condition: state
            entity_id: binary_sensor.hvac_condensate_pan_sensor_9
            state: 'on'
        - condition: not
          conditions:
          - condition: state
            entity_id: input_boolean.leak_alert_snoozed
            state: 'on'
      sequence:
      - data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Attention%2C+a+water+leak+has+been+detected+at+the+{{
              triggered_sensor | replace(' ', '+') }}.+Please+check+the+area+and+turn+off+the+water.&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        target:
          entity_id: media_player.whole_house
        action: media_player.play_media
      - data:
          title: 🚨 URGENT - Water Leak Detected!
          message: Leak detected at {{ triggered_sensor }}. Tap to respond.
          data:
            actions:
            - action: SNOOZE_LEAK
              title: Snooze
            - action: DISMISS_LEAK
              title: Dismiss
            channel: alarm_stream
            importance: high
            ttl: 0
            priority: high
        action: notify.mobile_app_pixel_9
      - delay: 00:00:10
      - alias: TEMPORARY FALLBACK SIREN - revert to the Ring siren when it returns
        repeat:
          count: 3
          sequence:
          - action: siren.turn_on
            target:
              entity_id: siren.chime_play_tone
            data:
              tone: '3'
              volume_level: 1.0
              duration: 8
          - delay: 00:00:08
          - action: siren.turn_off
            target:
              entity_id: siren.chime_play_tone
          - delay: 00:00:12
      - delay: 00:05:00
  mode: restart
