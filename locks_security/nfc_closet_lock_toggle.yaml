- id: '1722436970246'
  alias: NFC - Closet Lock Toggle
  description: NFC tag toggles closet door lock. Located underneath the closet light
    switch faceplate on the top.
  trigger:
  - platform: tag
    tag_id: b52cebc2-7126-4b57-ae72-183c5fda497a
  condition: []
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: lock.bedroom_closet_door_lock
        state: locked
      sequence:
      - data: {}
        action: lock.unlock
        target:
          entity_id: lock.bedroom_closet_door_lock
    - conditions:
      - condition: state
        entity_id: lock.bedroom_closet_door_lock
        state: unlocked
      sequence:
      - data: {}
        action: lock.lock
        target:
          entity_id: lock.bedroom_closet_door_lock
  mode: single
