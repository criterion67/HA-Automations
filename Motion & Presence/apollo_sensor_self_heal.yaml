- id: '1763347794930'
  alias: Apollo Sensor Self Heal
  description: Monitors all Apollo devices and reloads their config entry if offline
    for 5 minutes.
  triggers:
  - entity_id: binary_sensor.apollo_msr_2_f58a4c_online
    to:
    - unavailable
    - 'off'
    for: 00:05:00
    id: Bathroom
    trigger: state
  - entity_id: binary_sensor.laundry_room_presence_online
    to:
    - unavailable
    - 'off'
    for: 00:05:00
    id: Laundry
    trigger: state
  - entity_id: binary_sensor.apollo_mtr_1_cc063c_online
    to:
    - unavailable
    - 'off'
    for: 00:05:00
    id: Garage
    trigger: state
  - entity_id: binary_sensor.apollo_msr_2_f58628_online
    to:
    - unavailable
    - 'off'
    for: 00:05:00
    id: HallBath
    trigger: state
  - entity_id: binary_sensor.apollo_msr_2_f736b0_online
    to:
    - unavailable
    - 'off'
    for: 00:05:00
    id: Office
    trigger: state
  - entity_id: binary_sensor.apollo_air_1_3e9fe4_online
    to:
    - unavailable
    - 'off'
    for: 00:05:00
    id: AIR1
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Bathroom
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: binary_sensor.apollo_msr_2_f58a4c_online
    - conditions:
      - condition: trigger
        id: Laundry
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: binary_sensor.laundry_room_presence_online
    - conditions:
      - condition: trigger
        id: Garage
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: binary_sensor.apollo_mtr_1_cc063c_online
    - conditions:
      - condition: trigger
        id: HallBath
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: binary_sensor.apollo_msr_2_f58628_online
    - conditions:
      - condition: trigger
        id: Office
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: binary_sensor.apollo_msr_2_f736b0_online
    - conditions:
      - condition: trigger
        id: AIR1
      sequence:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: binary_sensor.apollo_air_1_3e9fe4_online
  mode: parallel
