- id: '1773100118815'
  alias: Dashboard - Reset Mower Stuck Dismissed When Mower Clears Error
  description: When David Mowie leaves error state, reset the dismissed flag so the
    alert can show again next time
  triggers:
  - trigger: state
    entity_id: lawn_mower.david_mowie
    from: error
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.mower_stuck_dismissed
  mode: single
