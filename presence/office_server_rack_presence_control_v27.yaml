- id: '1758650148017'
  alias: Office- Server Rack Presence Control V2.7
  description: 'Presence turns on UniFi Blue (if internet up) or Red (if internet
    down), and tablet. Clears after 5 min.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - trigger: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - action: logbook.log
        data:
          name: Presence Control Debug
          message: Presence detected — evaluating internet status for Blue/Red fallback,
            forcing tablet ON.
          entity_id: binary_sensor.office_presence_radar_target
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.8_8_8_8
            state: 'on'
          sequence:
          - action: logbook.log
            data:
              name: Presence Control Debug
              message: Internet up — setting UniFi Blue.
              entity_id: binary_sensor.8_8_8_8
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ''UniFi Blue'' in (state_attr(''select.network_cabinet_ws2811_preset'',''options'')
                  or []) }}

                  '
              sequence:
              - target:
                  entity_id: select.network_cabinet_ws2811_preset
                data:
                  option: UniFi Blue
                action: select.select_option
            default:
            - target:
                entity_id: light.network_cabinet_ws2811
              data:
                rgb_color:
                - 0
                - 102
                - 255
                brightness_pct: 100
              action: light.turn_on
        - conditions:
          - condition: state
            entity_id: binary_sensor.8_8_8_8
            state: 'off'
          sequence:
          - action: logbook.log
            data:
              name: Presence Control Debug
              message: Internet down — setting Red fallback.
              entity_id: binary_sensor.8_8_8_8
          - target:
              entity_id: light.network_cabinet_ws2811
            data:
              rgb_color:
              - 255
              - 0
              - 0
              brightness_pct: 100
            action: light.turn_on
      - action: switch.turn_on
        target:
          entity_id: switch.galaxy_tab_a9_2_screen
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: logbook.log
        data:
          name: Presence Control Debug
          message: No presence 5 min — powering devices off.
          entity_id: binary_sensor.office_presence_radar_target
      - target:
          entity_id: light.network_cabinet_ws2811
        action: light.turn_off
      - action: logbook.log
        data:
          name: Presence Control Debug
          message: Network cabinet light forced OFF.
          entity_id: light.network_cabinet_ws2811
      - action: switch.turn_off
        target:
          entity_id: switch.galaxy_tab_a9_2_screen
      - action: logbook.log
        data:
          name: Presence Control Debug
          message: Tablet screen forced OFF.
          entity_id: switch.galaxy_tab_a9_2_screen
  mode: single
