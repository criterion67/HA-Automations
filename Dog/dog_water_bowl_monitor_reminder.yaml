- id: '1726420403753'
  alias: Dog Water Bowl Monitor & Reminder
  description: Monitors dog water bowl level, sends alerts when empty, and notifies
    when refilled. Active daily between 7 AM and 10 PM.
  triggers:
  - trigger: state
    entity_id: binary_sensor.dog_bowl_water_level
    to: 'off'
    id: Empty
  - trigger: state
    entity_id: binary_sensor.dog_bowl_water_level
    to: 'on'
    id: Full
  conditions:
  - condition: time
    after: 07:00:00
    before: '22:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Empty
      - condition: state
        entity_id: input_boolean.dog_bowl_notification
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.dog_bowl_notification
        action: input_boolean.turn_on
      - data:
          title: Dog's Water Bowl Alert!
          message: Dog's water bowl is empty. Please refill as soon as possible.
        action: notify.mobile_app_pixel_9
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+dogs+water+bowl+is+empty.+Please+refill+as+soon+as+possible.&language=en-US&voice=JennyNeural
          media_content_type: provider
        metadata:
          title: The dog's water bowl is empty. Please refill as soon as possible.
          thumbnail: https://brands.home-assistant.io/_/tts/logo.png
        action: media_player.play_media
      - delay:
          minutes: 15
    - conditions:
      - condition: trigger
        id: Full
      sequence:
      - target:
          entity_id: input_boolean.dog_bowl_notification
        action: input_boolean.turn_off
      - data:
          title: Dog's Water Bowl Alert!
          message: Dog's water bowl has been refilled.
        action: notify.mobile_app_pixel_9
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+dogs+water+bowl+has+been+refilled.&language=en-US&voice=JennyNeural
          media_content_type: provider
        metadata:
          title: The dog's water bowl has been refilled.
          thumbnail: https://brands.home-assistant.io/_/tts/logo.png
        action: media_player.play_media
  mode: single
