- id: '1751772259530'
  alias: Washer/Dryer Status Management
  description: 'This automation monitors the washer and dryer''s status, providing
    voice notifications for each cycle change. It also uses light color changes and
    mobile notifications to alert when cycles start or finish. The bedroom ceiling
    light state is snapshotted at the start of each run and restored at the end, so
    the notification flash never leaves the light in the wrong state.


    ESPHOME MIGRATION 2026-10-21: triggers moved from the dead geappliances MQTT entities
    (sensor.machine_state_machine_status, sensor.sub_cycle_state_machine_sub_cycle)
    to the ESPHome GE Ultrafast Combo entities (sensor.ge_ultrafast_combo_state, sensor.ge_ultrafast_combo_sub_cycle).
    State names changed: Run to Running, Finished to Cycle Complete, Fill to Filling,
    Cool Down to Cooldown. Trigger IDs are unchanged so the choose branches still
    match. Every trigger ignores changes coming from unavailable or unknown, so an
    ESPHome reconnect mid cycle does not repeat an announcement. The Off trigger stays
    disabled; ESPHome has not been seen reporting Off.'
  triggers:
  - entity_id: sensor.ge_ultrafast_combo_state
    to: Running
    id: 'On'
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Load Size Detection
    id: Load Size Detection
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Filling
    id: Fill
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Wash
    id: Wash
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Rinse
    id: Rinse
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Drain
    id: Drain
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Spin
    id: Spin
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Drying
    id: Drying
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_sub_cycle
    to: Cooldown
    id: Cool Down
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_state
    to: Cycle Complete
    id: Finished
    trigger: state
    not_from:
    - unavailable
    - unknown
  - entity_id: sensor.ge_ultrafast_combo_state
    to: 'Off'
    id: 'Off'
    enabled: false
    trigger: state
    not_from:
    - unavailable
    - unknown
  conditions: []
  actions:
  - action: scene.create
    data:
      scene_id: downlightsbefore
      snapshot_entities:
      - light.bedroom_ceiling_lights
    note: Capture the bedroom ceiling light state at the start of every run so the
      final step can put it back exactly as it was before the notification flash.
  - choose:
    - conditions:
      - condition: trigger
        id: 'On'
      sequence:
      - target:
          entity_id: light.bedroom_ceiling_lights
        data:
          brightness_step_pct: 100
          color_name: magenta
        action: light.turn_on
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+on&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
      - delay: 00:00:15
      - target:
          entity_id: light.bedroom_ceiling_lights
        data:
          brightness_step_pct: 100
          color_name: white
        action: light.turn_on
      - delay: 00:00:02
      - target:
          entity_id: light.bedroom_ceiling_lights
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: Load Size Detection
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+detecting+load+size&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Fill
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+filling&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Wash
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+in+wash+mode&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Rinse
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+in+rinse+mode&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Drain
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+draining&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Spin
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Washing+machine+is+in+spin+mode&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Drying
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Laundry+load+is+now+drying&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
    - conditions:
      - condition: trigger
        id: Cool Down
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Dryer+is+in+cool+down+mode&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
      - target:
          entity_id: light.bedroom_ceiling_lights
        data:
          brightness_step_pct: 100
          color_name: blue
        action: light.turn_on
      - delay: 00:00:30
      - target:
          entity_id: light.bedroom_ceiling_lights
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: Finished
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Dryer+has+finished.&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
      - target:
          entity_id: light.bedroom_ceiling_lights
        data:
          brightness_step_pct: 100
          color_name: green
        action: light.turn_on
      - delay: 00:00:15
      - target:
          entity_id: light.bedroom_ceiling_lights
        data:
          brightness_step_pct: 100
          color_name: white
        action: light.turn_on
      - delay: 00:00:02
      - target:
          entity_id: light.bedroom_ceiling_lights
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: 'Off'
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Dryer+is+now+off&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata: {}
        action: media_player.play_media
  - target:
      entity_id: scene.downlightsbefore
    action: scene.turn_on
    note: Restore the bedroom ceiling light to the state captured by the snapshot
      step at the start of this run.
  mode: single
