- id: '1772667760179'
  alias: Scent Diffuser - Scheduled 10 Minute Cycle
  description: Turn on the scent diffuser for 60 seconds every 10 minutes when Scott
    is home, the thermostat is in cool or heat mode, the fan is actively running,
    and the time is between 8:00 a.m. and 8:00 p.m.
  triggers:
  - minutes: /10
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: person.scott_funk
    state: home
  - condition: time
    after: 08:00:00
    before: '20:00:00'
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.indoor_thermostat
      state: cool
    - condition: state
      entity_id: climate.indoor_thermostat
      state: heat
  actions:
  - target:
      entity_id: switch.scent_diffuser
    action: switch.turn_on
    data: {}
  - delay:
      hours: 0
      minutes: 1
      seconds: 15
      milliseconds: 0
  - target:
      entity_id: switch.scent_diffuser
    action: switch.turn_off
    data: {}
  mode: single
