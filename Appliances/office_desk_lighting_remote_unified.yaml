- id: '1745982816417'
  alias: Office- Desk Lighting Remote (Unified)
  description: 'Office lighting control. Wall switch (switch.office_lamps) on/off
    drives the Office Lamps group. Office Scene Controller (Zooz ZEN37) buttons via
    its event entities: B1 single toggles desk lamps, B1 double toggles Office Lamps,
    B1 hold reserved; B2 single toggles ceiling presence mode, B2 double toggles ceiling
    light; B3 single toggles office fan; B4 single toggles Office Lamps (Zigbee group).
    Moved from zwave_js_value_notification bus events to event.received on 2026-11-25
    after those bus events stopped firing.'
  triggers:
  - entity_id: switch.office_lamps
    to: 'on'
    id: switch-on
    trigger: state
  - entity_id: switch.office_lamps
    to: 'off'
    id: switch-off
    trigger: state
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_001
    options:
      event_type:
      - KeyPressed
    id: zen37_scene001_single
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_001
    options:
      event_type:
      - KeyPressed2x
    id: zen37_scene001_double
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_001
    options:
      event_type:
      - KeyHeldDown
    id: zen37_scene001_hold
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_002
    options:
      event_type:
      - KeyPressed
    id: zen37_scene002_single
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_002
    options:
      event_type:
      - KeyPressed2x
    id: zen37_scene002_double
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_003
    options:
      event_type:
      - KeyPressed
    id: zen37_scene003_single
  - trigger: event.received
    target:
      entity_id: event.zen37_switch_scene_controller_scene_004
    options:
      event_type:
      - KeyPressed
    id: zen37_scene004_single
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: switch-on
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: switch-off
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: zen37_scene001_single
      sequence:
      - action: light.toggle
        target:
          entity_id:
          - light.desk_lamp_short
          - light.desk_lamp_tall
    - conditions:
      - condition: trigger
        id: zen37_scene001_double
      sequence:
      - action: light.toggle
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: zen37_scene001_hold
      sequence: []
    - conditions:
      - condition: trigger
        id: zen37_scene002_single
      sequence:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
    - conditions:
      - condition: trigger
        id: zen37_scene002_double
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.office_ceiling_light
    - conditions:
      - condition: trigger
        id: zen37_scene003_single
      sequence:
      - action: fan.toggle
        target:
          entity_id: fan.office_fan
        data: {}
    - conditions:
      - condition: trigger
        id: zen37_scene004_single
      sequence:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id: light.nabu_casa_skyconnect_v1_0_office_lamps
  mode: single
