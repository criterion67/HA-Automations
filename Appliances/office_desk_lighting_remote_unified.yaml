- id: '1745982816417'
  alias: Office- Desk Lighting Remote (Unified)
  description: Unified automation to handle both remote control and wall switch control.
  triggers:
  - entity_id: switch.office_lamps
    to: 'on'
    id: switch-on
    trigger: state
  - entity_id: switch.office_lamps
    to: 'off'
    id: switch-off
    trigger: state
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 001
      value: KeyPressed
    id: zen37_scene001_single
    trigger: event
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 001
      value: KeyPressed2x
    id: zen37_scene001_double
    trigger: event
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 001
      value: KeyHeldDown
    id: zen37_scene001_hold
    trigger: event
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 002
      value: KeyPressed
    id: zen37_scene002_single
    trigger: event
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 002
      value: KeyPressed2x
    id: zen37_scene002_double
    trigger: event
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 003
      value: KeyPressed
    id: zen37_scene003_single
    trigger: event
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 6
      label: Scene 004
      value: KeyPressed
    id: zen37_scene004_single
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: switch-on
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: switch-off
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: zen37_scene001_single
      sequence:
      - action: light.toggle
        target:
          entity_id:
          - light.desk_lamp_short
          - light.desk_lamp_tall
    - conditions:
      - condition: trigger
        id: zen37_scene001_double
      sequence:
      - action: light.toggle
        target:
          entity_id: light.office_lamps
    - conditions:
      - condition: trigger
        id: zen37_scene001_hold
      sequence: []
    - conditions:
      - condition: trigger
        id: zen37_scene002_single
      sequence:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
    - conditions:
      - condition: trigger
        id: zen37_scene002_double
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.office_ceiling_light
    - conditions:
      - condition: trigger
        id: zen37_scene003_single
      sequence:
      - action: fan.toggle
        target:
          entity_id: fan.office_fan
        data: {}
    - conditions:
      - condition: trigger
        id: zen37_scene004_single
      sequence:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id: light.nabu_casa_skyconnect_v1_0_office_lamps
  mode: single
