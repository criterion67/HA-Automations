- id: '1755733082034'
  alias: 'Ecovacs Mower: Battery Charge Alert'
  description: 'Notify when mower recharges to 80%+ after being used (battery < 50%)
    and when battery drops to 17%. This automation triggers notifications and audio
    alerts  to inform you of both low battery (17%) and successful charging (80%)
    events.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - entity_id: sensor.david_mowie_battery
    below: 50
    id: battery_low
    trigger: numeric_state
  - entity_id:
    - sensor.david_mowie_battery
    above: 83
    id: battery_high
    trigger: numeric_state
  - entity_id:
    - sensor.david_mowie_battery
    below: 17
    id: battery_recharge
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: battery_low
      sequence:
      - target:
          entity_id: input_boolean.mower_80_notified
        action: input_boolean.turn_off
        data: {}
      - target:
          entity_id:
          - input_boolean.mower_battery_recharge_notified
        action: input_boolean.turn_off
        data: {}
    - conditions:
      - condition: trigger
        id: battery_high
      - condition: state
        entity_id: lawn_mower.david_mowie
        state: docked
      - condition: state
        entity_id: input_boolean.mower_80_notified
        state: 'off'
      - condition: time
        after: 07:00:00
        before: '19:00:00'
      sequence:
      - data:
          message: David Mowie has recharged to 83% and will now finish mowing. {{
            now().strftime('%I:%M %p on %b %-d') }}
          title: Ecovacs Battery Level
        action: script.notify_alert
      - target:
          entity_id:
          - media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=David+Mowie+has+recharged+to+80%25+and+will+now+finish+mowing.&language=en-US&voice=JennyNeural
            media_content_type: audio/mp3
            metadata: {}
        action: media_player.play_media
      - target:
          entity_id: input_boolean.mower_80_notified
        action: input_boolean.turn_on
        data: {}
    - conditions:
      - condition: trigger
        id:
        - battery_recharge
      - condition: state
        entity_id: input_boolean.mower_battery_recharge_notified
        state: 'off'
      - condition: time
        after: 07:00:00
        before: '19:00:00'
      sequence:
      - data:
          message: David Mowie's battery has discharged to 17% and will now return
            to the dock to charge. {{ now().strftime('%I:%M %p on %b %-d') }}
          title: Ecovacs Low Battery Alert
        action: script.notify_alert
      - action: script.notify_alert
        data:
          message: David Mowie's battery has discharged to 17% and will now return
            to the dock to charge. {{ now().strftime('%I:%M %p on %b %-d') }}
          title: Mower Battery Recharge Alert
          target: watch
      - target:
          entity_id:
          - media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://media_source/local/Best Chime Tone.mp3
            media_content_type: audio/mpeg
            metadata:
              title: Best Chime Tone.mp3
        action: media_player.play_media
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - target:
          entity_id:
          - media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=David+Mowie%27s+battery+has+discharged+to+17%25+and+will+now+return+to+the+dock+to+charge.&language=en-US&voice=JennyNeural
            media_content_type: audio/mp3
            metadata: {}
        action: media_player.play_media
      - target:
          entity_id:
          - input_boolean.mower_battery_recharge_notified
        action: input_boolean.turn_on
        data: {}
  mode: single
