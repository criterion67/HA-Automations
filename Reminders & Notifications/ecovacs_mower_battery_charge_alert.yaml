- id: '1755733082034'
  alias: 'Ecovacs Mower: Battery Charge Alert'
  description: Notify when mower recharges to 80%+ after being used (battery < 50%)
    and when battery drops to 17%. This automation triggers notifications and audio
    alerts  to inform you of both low battery (17%) and successful charging (80%)
    events.
  triggers:
  - entity_id: sensor.david_mowie_battery
    below: 50
    id: battery_low
    platform: numeric_state
  - entity_id: sensor.david_mowie_battery
    above: 79
    id: battery_high
    platform: numeric_state
  - entity_id:
    - sensor.david_mowie_battery
    below: 20
    id: battery_recharge
    platform: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: battery_low
      sequence:
      - target:
          entity_id: input_boolean.mower_80_notified
        action: input_boolean.turn_off
        data: {}
      - target:
          entity_id:
          - input_boolean.mower_battery_recharge_notified
        action: input_boolean.turn_off
        data: {}
    - conditions:
      - condition: trigger
        id: battery_high
      - condition: state
        entity_id: lawn_mower.david_mowie
        state: docked
      - condition: state
        entity_id: input_boolean.mower_80_notified
        state: 'off'
      - condition: time
        after: 07:00:00
        before: '19:00:00'
      sequence:
      - data:
          title: Ecovacs Battery Level
          message: David Mowie has recharged to 80% and will now finish mowing. {{
            now().strftime('%I:%M %p on %b %-d') }}
        action: notify.mobile_app_pixel_9
      - target:
          entity_id:
          - media_player.bedroom_group
          - media_player.dining_room_speaker_cast
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=David+Mowie+has+recharged+to+80%25+and+will+now+finish+mowing.&language=en-US&voice=AndrewNeural
          media_content_type: audio/mp3
        action: media_player.play_media
      - target:
          entity_id: input_boolean.mower_80_notified
        action: input_boolean.turn_on
        data: {}
    - conditions:
      - condition: trigger
        id:
        - battery_recharge
      - condition: state
        entity_id: input_boolean.mower_battery_recharge_notified
        state: 'off'
      - condition: time
        after: 07:00:00
        before: '19:00:00'
      sequence:
      - data:
          title: Ecovacs Low Battery Alert
          message: David Mowie's battery has discharged to 17% and will now return
            to the dock to charge. {{ now().strftime('%I:%M %p on %b %-d') }}
        action: notify.mobile_app_pixel_9
      - action: notify.mobile_app_galaxy_watch7_904t
        data:
          title: Mower Battery Recharge Alert
          message: David Mowie's battery has discharged to 20% and will now return
            to the dock to charge. {{ now().strftime('%I:%M %p on %b %-d') }}
      - target:
          entity_id:
          - media_player.bedroom_group
          - media_player.dining_room_speaker_cast
        data:
          media_content_id: media-source://media_source/local/Best Chime Tone.mp3
          media_content_type: audio/mpeg
        metadata:
          title: Best Chime Tone.mp3
        action: media_player.play_media
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - target:
          entity_id:
          - media_player.bedroom_group
          - media_player.dining_room_speaker_cast
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=David+Mowie%27s+battery+has+discharged+to+17%25+and+will+now+return+to+the+dock+to+charge.&language=en-US&voice=AndrewNeural
          media_content_type: audio/mp3
        action: media_player.play_media
      - target:
          entity_id:
          - input_boolean.mower_battery_recharge_notified
        action: input_boolean.turn_on
        data: {}
  mode: single
