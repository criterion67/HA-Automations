- id: '1765321515092'
  alias: Dawn Dusk Routine (Elevation Based v4)
  description: Using sun elevation for natural dawn and dusk transitions.
  triggers:
  - entity_id: sun.sun
    attribute: elevation
    above: -2
    id: Dawn
    trigger: numeric_state
  - entity_id: sun.sun
    attribute: elevation
    below: -5
    id: Dusk
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Dawn
      sequence:
      - parallel:
        - target:
            entity_id: scene.dawn_group
          action: scene.turn_on
        - target:
            entity_id: cover.bedroom_curtains
          action: cover.open_cover
    - conditions:
      - condition: trigger
        id: Dusk
      sequence:
      - parallel:
        - target:
            entity_id: scene.dusk_group
          action: scene.turn_on
        - target:
            entity_id: cover.bedroom_curtains
          action: cover.close_cover
  mode: single
