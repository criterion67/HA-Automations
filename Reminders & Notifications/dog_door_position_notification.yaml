- id: '1727834948348'
  alias: 'Dog Door Position Notification '
  description: 'When the position of the dog door changes, provide a push notification
    for specific change.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - type: opened
    device_id: a317c78833ecada28d98b49893fcaca1
    entity_id: 863c62caf1dd02c6a7a8b2192d0e5c1b
    domain: binary_sensor
    id: Dog Door Opened
    trigger: device
  - type: not_opened
    device_id: a317c78833ecada28d98b49893fcaca1
    entity_id: 863c62caf1dd02c6a7a8b2192d0e5c1b
    domain: binary_sensor
    id: Dog Door Closed
    trigger: device
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Dog Door Opened
      sequence:
      - data:
          message: Dog Door has been opened. {{now().strftime('%I:%M %p on %b %-d')}}
          title: Dog Door Position
        action: script.notify_alert
    - conditions:
      - condition: trigger
        id:
        - Dog Door Closed
      sequence:
      - data:
          message: Dog Door has been closed. {{now().strftime('%I:%M %p on %b %-d')}}
          title: Dog Door Position
        action: script.notify_alert
  mode: single
