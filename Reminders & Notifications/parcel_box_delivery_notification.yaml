- id: '1752868210354'
  alias: Parcel box delivery notification
  description: Plays chime and TTS when a package is delivered to the parcel box.
    Prevents repeat alerts using a dashboard indicator boolean. Allows manual reset
    and auto-reset at 6:00 AM. Adds actionable notification buttons to reset or dismiss
    on Scott's phone only.
  triggers:
  - id: parcel_box_open
    entity_id: binary_sensor.parcel_box_contact
    to: 'on'
    platform: state
  - id: manual_reset
    entity_id: input_boolean.parcel_box_manual_reset
    to: 'on'
    platform: state
  - id: daily_reset
    at: 06:00:00
    platform: time
  - id: mobile_reset
    event_type: mobile_app_notification_action
    event_data:
      action: PARCEL_RESET
    platform: event
  - id: mobile_dismiss
    event_type: mobile_app_notification_action
    event_data:
      action: PARCEL_DISMISS
    platform: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: parcel_box_open
      - condition: state
        entity_id: input_boolean.parcel_dashboard_indicator
        state: 'off'
      sequence:
      - target:
          entity_id: media_player.all_speakers
        data:
          volume_level: 0.7
        action: media_player.volume_set
      - delay:
          seconds: 4
      - target:
          entity_id: media_player.all_speakers
        data:
          media:
            media_content_id: media-source://media_source/local/073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
            media_content_type: audio/mpeg
            metadata:
              title: 073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
              thumbnail: null
              media_class: music
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
              browse_entity_id: media_player.all_speakers
        action: media_player.play_media
      - delay:
          seconds: 3
      - target:
          entity_id: media_player.all_speakers
        data:
          media:
            media_content_id: media-source://media_source/local/073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
            media_content_type: audio/mpeg
            metadata:
              title: 073981_131659__bertrof__game-sound-intro-to-game_amp_80921__justinbw__buttonchime02up_7mp3-90501.mp3
              thumbnail: null
              media_class: music
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
              browse_entity_id: media_player.all_speakers
        action: media_player.play_media
      - delay:
          seconds: 3
      - target:
          entity_id: media_player.all_speakers
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=A+delivery+has+been+made+to+the+parcel+box+on+the+front+porch+&language=en-US&voice=AndrewNeural
            media_content_type: audio/mp3
            metadata: {}
        action: media_player.play_media
      - target:
          entity_id: input_boolean.parcel_dashboard_indicator
        action: input_boolean.turn_on
        data: {}
      - data:
          title: Parcel Delivery
          message: A package was delivered to the front porch parcel box at {{ now().strftime('%I:%M
            %p on %b %-d') }}
          data:
            tag: parcel_delivery_scott
            actions:
            - action: PARCEL_RESET
              title: Reset
            - action: PARCEL_DISMISS
              title: Dismiss
        action: notify.mobile_app_pixel_9
      - data:
          title: Parcel Delivery
          message: A package was delivered to the front porch parcel box at {{ now().strftime('%I:%M
            %p on %b %-d') }}
        action: notify.mobile_app_bill_s_phone
    - conditions:
      - condition: trigger
        id: manual_reset
      sequence:
      - target:
          entity_id: input_boolean.parcel_dashboard_indicator
        action: input_boolean.turn_off
        data: {}
      - target:
          entity_id: input_boolean.parcel_box_manual_reset
        action: input_boolean.turn_off
        data: {}
      - data:
          message: clear_notification
          data:
            tag: parcel_delivery_scott
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: daily_reset
      sequence:
      - target:
          entity_id: input_boolean.parcel_dashboard_indicator
        action: input_boolean.turn_off
        data: {}
      - data:
          message: clear_notification
          data:
            tag: parcel_delivery_scott
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: mobile_reset
      sequence:
      - target:
          entity_id: input_boolean.parcel_dashboard_indicator
        action: input_boolean.turn_off
        data: {}
      - data:
          message: clear_notification
          data:
            tag: parcel_delivery_scott
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: mobile_dismiss
      sequence:
      - data:
          message: clear_notification
          data:
            tag: parcel_delivery_scott
        action: notify.mobile_app_pixel_9
  mode: single
