- id: '1730303083036'
  alias: Laundry Finish Time Notification
  description: 'Sends a push when the GE combo washer/dryer finishes a load.


    ESPHOME MIGRATION 2026-10-21: the old template trigger compared the clock to sensor.laundry_finish_time,
    which read the dead geappliances MQTT sensor and never matched, so this had not
    fired since July 15. It now triggers directly when sensor.ge_ultrafast_combo_state
    changes to Cycle Complete, ignoring changes coming from unavailable or unknown
    so an ESPHome reconnect cannot fire it.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - trigger: state
    entity_id: sensor.ge_ultrafast_combo_state
    to: Cycle Complete
    not_from:
    - unavailable
    - unknown
    note: ESPHome GE Ultrafast Combo reports Cycle Complete when the load finishes
      (seen Oct 18 2026 at 9:45 PM).
  conditions: []
  actions:
  - data:
      message: Laundry is done! Please check your clothes.
    action: script.notify_alert
