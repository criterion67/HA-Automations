- id: '1773536601423'
  alias: Update Forecast High/Low Temp Today
  description: Calls weather.get_forecasts daily and on startup to store today's forecast
    high/low in input_number.forecast_high_temp_today and input_number.forecast_low_temp_today
    for use on dashboards.
  triggers:
  - trigger: time
    at: 00:01:00
  - trigger: homeassistant
    event: start
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.pirateweather
    data:
      type: daily
    response_variable: forecast_data
  - action: input_number.set_value
    target:
      entity_id: input_number.forecast_low_temp_today
    data:
      value: '{{ forecast_data[''weather.pirateweather''][''forecast''][0][''templow'']
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.forecast_high_temp_today
    data:
      value: '{{ forecast_data[''weather.pirateweather''][''forecast''][0][''temperature'']
        }}'
  mode: single
