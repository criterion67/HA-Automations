- id: '1764972742421'
  alias: Master Garage Climate Control
  description: 'Central controller for garage heat and cool. input_boolean.garage_heat_cool_mode
    ON means cool (AC) mode, OFF means heat mode.


    Triggers:

    - Laundry Room Button (Aqara, ZHA ieee 00:15:8d:00:09:26:fc:58) single press toggles
    the mode with a TTS confirmation on the dining room speaker. Heat: AC off and
    Rudy''s Heater (climate.garage_heater, generic thermostat on switch.garage_heater)
    to heat at its own setpoint. Cool: heater off and AC to cool at its current setpoint.

    - High temp (above 89 F for 5 min) starts the AC in dry 78 when in heat mode with
    Bill home.

    - AC internal reading below 72.1 while in dry switches it to cool 78 (cool mode
    only).

    - Freeze protection: Temp Sensor Garage below 42 F for 5 min ALWAYS switches to
    heat mode and starts the heater, regardless of mode, vacation or who is home,
    because Rudy is out there.


    REBUILT 2026-11-17 for heating: the heat press previously never started the heater,
    the cool press forced dry 80, and freeze protection was gated on AC mode (backwards),
    required Bill home and only set 44 F without turning the heater on. Mode changed
    from single to queued so a freeze trigger is never dropped. Heater setpoint (69
    F) lives on the thermostat itself, not in this automation.


    NOTIFY WRAPPER 2026-09-22: notifications go through script.notify_alert / script.notify_clear.'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 00:15:8d:00:09:26:fc:58
      command: single
    id: button
  - entity_id:
    - sensor.temp_sensor_garage
    - sensor.temp_sensor_rudys_crate
    above: 89
    for:
      minutes: 5
    id: high_temp_cool
    trigger: numeric_state
  - entity_id: climate.garage_ac
    attribute: current_temperature
    below: 72.1
    id: dry_to_cool
    trigger: numeric_state
  - entity_id: sensor.temp_sensor_garage
    below: 42
    for:
      minutes: 5
    id: freeze_protect
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: button
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.garage_heat_cool_mode
            state: 'on'
          sequence:
          - target:
              entity_id: input_boolean.garage_heat_cool_mode
            action: input_boolean.turn_off
          - target:
              entity_id: climate.garage_ac
            action: climate.turn_off
          - action: climate.set_hvac_mode
            alias: Start Rudys Heater, keeping its own setpoint (69 F)
            data:
              hvac_mode: heat
            target:
              entity_id: climate.garage_heater
          - delay:
              seconds: 5
          - target:
              entity_id: media_player.dining_room_speaker
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Garage+heat+mode+activated&language=en-US&voice=JennyNeural
                media_content_type: provider
                metadata: {}
            action: media_player.play_media
        - conditions:
          - condition: state
            entity_id: input_boolean.garage_heat_cool_mode
            state: 'off'
          sequence:
          - target:
              entity_id: input_boolean.garage_heat_cool_mode
            action: input_boolean.turn_on
          - action: climate.set_hvac_mode
            alias: Stop Rudys Heater
            data:
              hvac_mode: 'off'
            target:
              entity_id: climate.garage_heater
          - action: climate.set_hvac_mode
            alias: Start the AC in cool, keeping its current setpoint
            data:
              hvac_mode: cool
            target:
              entity_id: climate.garage_ac
          - delay:
              seconds: 5
          - target:
              entity_id: media_player.dining_room_speaker
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Garage+A+C+mode+activated&language=en-US&voice=JennyNeural
                media_content_type: provider
                metadata: {}
            action: media_player.play_media
    - conditions:
      - condition: trigger
        id: high_temp_cool
      sequence:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.garage_heat_cool_mode
          state: 'off'
        - condition: state
          entity_id: input_boolean.vacation
          state: 'off'
        - condition: state
          entity_id: person.bill_funk
          state: home
        - condition: state
          entity_id: climate.garage_ac
          state: 'off'
        - condition: state
          entity_id: cover.garage_door
          state: closed
        - condition: state
          entity_id: binary_sensor.rear_door
          state: 'off'
      - target:
          entity_id: climate.garage_ac
        data:
          hvac_mode: dry
          temperature: 78
        action: climate.set_temperature
      - data:
          message: Garage AC has been activated due to high temperature.
          title: Garage AC
        action: script.notify_alert
    - conditions:
      - condition: trigger
        id: dry_to_cool
      sequence:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.garage_heat_cool_mode
          state: 'off'
        - condition: state
          entity_id: input_boolean.vacation
          state: 'off'
        - condition: state
          entity_id: climate.garage_ac
          state: dry
      - target:
          entity_id: climate.garage_ac
        data:
          hvac_mode: cool
          temperature: 78
        action: climate.set_temperature
      - data:
          message: Garage AC has switched from dry to cool.
          title: Garage AC
        action: script.notify_alert
    - conditions:
      - condition: trigger
        id: freeze_protect
      sequence:
      - action: input_boolean.turn_off
        alias: Switch the garage to heat mode
        target:
          entity_id: input_boolean.garage_heat_cool_mode
      - action: climate.turn_off
        alias: AC off
        target:
          entity_id: climate.garage_ac
      - action: climate.set_hvac_mode
        alias: Start Rudys Heater, keeping its own setpoint
        data:
          hvac_mode: heat
        target:
          entity_id: climate.garage_heater
      - action: script.notify_alert
        alias: Tell Scott freeze protection ran
        data:
          message: Garage is {{ states('sensor.temp_sensor_garage') | float(0) | round(1)
            }} F. Freeze protection switched the garage to heat mode and started Rudys
            Heater.
          title: Garage Freeze Protection
          tag: garage_freeze_protect
          channel: Garage Safety
          importance: high
          icon: mdi:snowflake-alert
  mode: queued
  max: 10
