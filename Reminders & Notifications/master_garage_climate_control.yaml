- id: '1764972742421'
  alias: Master Garage Climate Control
  description: 'Central controller for garage heat and cool based on button, temperature,
    and freeze protection.

    '
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 00:15:8d:00:09:26:fc:58
      command: single
    id: button
  - entity_id:
    - sensor.temp_sensor_garage
    - sensor.temp_sensor_rudys_crate
    above: 89
    for:
      minutes: 5
    id: high_temp_cool
    trigger: numeric_state
  - entity_id: climate.garage_ac
    attribute: current_temperature
    below: 72.1
    id: dry_to_cool
    trigger: numeric_state
  - entity_id: sensor.temp_sensor_garage
    below: 42
    for:
      minutes: 5
    id: freeze_protect
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: button
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.garage_heat_cool_mode
            state: 'on'
          sequence:
          - target:
              entity_id: input_boolean.garage_heat_cool_mode
            action: input_boolean.turn_off
          - target:
              entity_id: climate.garage_ac
            action: climate.turn_off
          - delay:
              seconds: 5
          - target:
              entity_id: media_player.dining_room_speaker
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Garage+heat+mode+activated&language=en-US&voice=AndrewNeural
                media_content_type: provider
                metadata: {}
            action: media_player.play_media
        - conditions:
          - condition: state
            entity_id: input_boolean.garage_heat_cool_mode
            state: 'off'
          sequence:
          - target:
              entity_id: input_boolean.garage_heat_cool_mode
            action: input_boolean.turn_on
          - target:
              entity_id: climate.garage_ac
            data:
              temperature: 80
              hvac_mode: dry
            action: climate.set_temperature
          - delay:
              seconds: 5
          - target:
              entity_id: media_player.dining_room_speaker
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Garage+A+C+mode+activated&language=en-US&voice=AndrewNeural
                media_content_type: provider
                metadata: {}
            action: media_player.play_media
    - conditions:
      - condition: trigger
        id: high_temp_cool
      sequence:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.garage_heat_cool_mode
          state: 'off'
        - condition: state
          entity_id: input_boolean.vacation
          state: 'off'
        - condition: state
          entity_id: person.bill_funk
          state: home
        - condition: state
          entity_id: climate.garage_ac
          state: 'off'
        - condition: state
          entity_id: cover.garage_door
          state: closed
        - condition: state
          entity_id: binary_sensor.rear_door
          state: 'off'
      - target:
          entity_id: climate.garage_ac
        data:
          hvac_mode: dry
          temperature: 78
        action: climate.set_temperature
      - data:
          title: Garage AC
          message: Garage AC has been activated due to high temperature.
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: dry_to_cool
      sequence:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.garage_heat_cool_mode
          state: 'off'
        - condition: state
          entity_id: input_boolean.vacation
          state: 'off'
        - condition: state
          entity_id: climate.garage_ac
          state: dry
      - target:
          entity_id: climate.garage_ac
        data:
          hvac_mode: cool
          temperature: 78
        action: climate.set_temperature
      - data:
          title: Garage AC
          message: Garage AC has switched from dry to cool.
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: freeze_protect
      sequence:
      - condition: and
        conditions:
        - condition: state
          entity_id: input_boolean.garage_heat_cool_mode
          state: 'on'
        - condition: state
          entity_id: input_boolean.vacation
          state: 'off'
        - condition: state
          entity_id: person.bill_funk
          state: home
      - target:
          entity_id: climate.garage_heater
        data:
          temperature: 44
        action: climate.set_temperature
      - target:
          entity_id: climate.garage_ac
        action: climate.turn_off
      - data:
          title: Garage Heater
          message: Temperature below 42. Heat target set for freeze protection.
        action: notify.mobile_app_pixel_9
  mode: single
