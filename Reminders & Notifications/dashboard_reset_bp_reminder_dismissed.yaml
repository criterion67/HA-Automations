- id: '1773100113548'
  alias: Dashboard - Reset BP Reminder Dismissed
  description: Re-show the BP reminder card at midnight (new day) and again at 7 PM
    as an evening check-in
  triggers:
  - at: 00:00:00
    platform: time
  - at: '19:00:00'
    platform: time
  conditions:
  - condition: template
    value_template: '{% set last = states(''input_datetime.last_bp_reading'') | as_datetime
      | as_local %}

      {{ last.date() < now().date() }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bp_reminder_dismissed
  mode: single
