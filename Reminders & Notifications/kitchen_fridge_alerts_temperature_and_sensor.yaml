- id: '1773883949400'
  alias: 'Kitchen Fridge Alerts: Temperature and Sensor'
  description: 'Monitors kitchen refrigerator (sensor.temp_sensor_main_fridge) and
    freezer (sensor.inkbird_kitchen_freezer_temperature) for unsafe temperature conditions
    and sensor loss. Uses parallel mode so multiple simultaneous conditions each fire
    independently.


    Thresholds based on 7-day historical data and FDA food safety guidelines:

    - Fridge normal range: 35-39F. Early warning above 43F for 10 min (door left open
    / compressor struggling). Ceiling alert above 45F for 20 min (food safety risk).
    Runaway cold below 33F for 20 min (thermostat failure, food freezing risk).

    - Freezer normal range: 0F target. Early warning above 10F for 10 min. Ceiling
    alert above 15F for 20 min (food safety failure zone). Runaway cold below -10F
    for 20 min (thermostat failure).

    - Sensor offline: unavailable or unknown for 30 min indicates battery failure
    or Zigbee drop. Without sensor data, temperature monitoring is blind.


    All alerts send high-priority push to notify.mobile_app_pixel_9 with current temperature
    included in the message.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.temp_sensor_main_fridge
    above: 45
    for:
      minutes: 20
    id: fridge_high
  - platform: numeric_state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    above: 15
    for:
      minutes: 20
    id: freezer_high
  - platform: numeric_state
    entity_id: sensor.temp_sensor_main_fridge
    above: 43
    for:
      minutes: 10
    id: fridge_rising
  - platform: numeric_state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    above: 10
    for:
      minutes: 10
    id: freezer_rising
  - platform: numeric_state
    entity_id: sensor.temp_sensor_main_fridge
    below: 33
    for:
      minutes: 20
    id: fridge_low
  - platform: numeric_state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    below: -10
    for:
      minutes: 20
    id: freezer_low
  - platform: state
    entity_id: sensor.temp_sensor_main_fridge
    to: unavailable
    for:
      minutes: 30
    id: fridge_unavail
  - platform: state
    entity_id: sensor.temp_sensor_main_fridge
    to: unknown
    for:
      minutes: 30
    id: fridge_unknown
  - platform: state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    to: unavailable
    for:
      minutes: 30
    id: freezer_unavail
  - platform: state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    to: unknown
    for:
      minutes: 30
    id: freezer_unknown
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fridge_high
      sequence:
      - data:
          title: 🌡️ Fridge Too Warm
          message: 'Refrigerator has been above 45°F for 20 minutes. Current: {{ states(''sensor.temp_sensor_main_fridge'')
            | round(1) }}°F. Check the door or compressor.'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: freezer_high
      sequence:
      - data:
          title: 🌡️ Freezer Too Warm
          message: 'Freezer has been above 15°F for 20 minutes. Current: {{ states(''sensor.inkbird_kitchen_freezer_temperature'')
            | round(1) }}°F. Check the door or compressor.'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: fridge_rising
      sequence:
      - data:
          title: ⚠️ Fridge Temp Climbing
          message: 'Refrigerator has been above 43°F for 10 minutes and still rising.
            Current: {{ states(''sensor.temp_sensor_main_fridge'') | round(1) }}°F.'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: freezer_rising
      sequence:
      - data:
          title: ⚠️ Freezer Temp Climbing
          message: 'Freezer has been above 10°F for 10 minutes and still rising. Current:
            {{ states(''sensor.inkbird_kitchen_freezer_temperature'') | round(1) }}°F.'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: fridge_low
      sequence:
      - data:
          title: 🧊 Fridge Too Cold
          message: 'Refrigerator has been below 33°F for 20 minutes. Current: {{ states(''sensor.temp_sensor_main_fridge'')
            | round(1) }}°F. Risk of food freezing.'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: freezer_low
      sequence:
      - data:
          title: 🧊 Freezer Runaway Cold
          message: 'Freezer has been below -10°F for 20 minutes. Current: {{ states(''sensor.inkbird_kitchen_freezer_temperature'')
            | round(1) }}°F. Check thermostat.'
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id:
        - fridge_unavail
        - fridge_unknown
      sequence:
      - data:
          title: 📵 Fridge Sensor Offline
          message: Fridge temperature sensor has been unavailable for 30 minutes.
            Check battery or Zigbee connection.
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id:
        - freezer_unavail
        - freezer_unknown
      sequence:
      - data:
          title: 📵 Freezer Sensor Offline
          message: Freezer temperature sensor has been unavailable for 30 minutes.
            Check battery or Zigbee connection.
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
  mode: parallel
  max: 10
