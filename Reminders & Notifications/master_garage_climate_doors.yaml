- id: '1764972777413'
  alias: 'Master: Garage Climate Doors'
  description: 'Turns the garage AC off when the GARAGE DOOR has been open for 3 minutes,
    and resumes cooling when it closes again.


    REAR DOOR REMOVED 2026-09-11 19:06. binary_sensor.rear_door no longer has any
    authority over the garage AC, in either direction. It stuck in the open state
    twice in eleven hours on 2026-09-11: on at 08:15:25 with no close report until
    13:43:22, then on again at 18:55:25 with no close report at all. Each time this
    automation shut the AC off three minutes later on a reading that was not true,
    with Rudy in the garage. The first incident reached 86.9 F. A sensor that has
    failed twice in a day does not get to turn off the cooling. It keeps its monitoring
    role in automation.garage_safety_net_rudy, which alerts when it goes silent, and
    that is all it does now.


    Do not add the rear door back as a trigger until the Ring node (Z-Wave node 262,
    4SD2SZ-0EN0) has been reseated and proven stable over time.


    EARLIER REBUILD, same day, after the first incident:


    1. The resume branch required the shutoff to be less than 300 seconds old. When
    the door finally read closed after 5h27m the condition failed and the sequence
    stopped silently, so the AC was never restored. That 300 second window is gone.


    2. The 5-minute door-still-open alert required switch.garage_heater to be in state
    off. That switch has been unavailable since 2026-09-07 16:55, and unavailable
    does not match off, so the alert was silenced on every one-minute check and Scott
    got no warning at all. All monitoring and alerting now lives in automation.garage_safety_net_rudy.


    3. The heater is physically unplugged for the season. Every reference to switch.garage_heater
    and input_boolean.garage_heat_cool_mode was removed. Note the two garage automations
    disagreed on what garage_heat_cool_mode meant: Master Garage Climate Control treats
    on as AC mode, this one treated on as heat mode. Reintroduce a heater path deliberately
    in the fall, do not restore the old one.


    4. Resume calls climate.set_hvac_mode rather than climate.set_temperature, so
    Scott''s setpoint is preserved instead of being forced to 80.


    KNOWN LIMITATION: resume always returns to cool. If the AC was in dry when the
    garage door opened, it comes back in cool.'
  triggers:
  - entity_id: cover.garage_door
    for: 00:03:00
    id: door_open
    to: open
    trigger: state
  - entity_id: cover.garage_door
    id: doors_closed
    to: closed
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: Garage door has been open 3 minutes, shut the AC down
      conditions:
      - condition: trigger
        id: door_open
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: climate.garage_ac
        state:
        - cool
        - dry
      sequence:
      - action: input_datetime.set_datetime
        alias: Record when the AC was shut off
        data:
          datetime: '{{ now().isoformat() }}'
        target:
          entity_id: input_datetime.garage_ac_last_off_time
      - action: climate.turn_off
        alias: Turn the AC off
        target:
          entity_id: climate.garage_ac
      - action: input_boolean.turn_off
        alias: Clear the off-notified flag so the safety net can alert fresh
        target:
          entity_id: input_boolean.garage_ac_off_notified
    - alias: Garage door is closed, resume cooling
      conditions:
      - condition: trigger
        id: doors_closed
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: input_boolean.vacation
        state: 'off'
      - condition: state
        entity_id: climate.garage_ac
        state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        alias: Resume cooling, preserving the existing setpoint
        data:
          hvac_mode: cool
        target:
          entity_id: climate.garage_ac
      - action: input_boolean.turn_off
        alias: Clear the off-notified flag
        target:
          entity_id: input_boolean.garage_ac_off_notified
      - action: notify.mobile_app_pixel_9
        alias: Clear any standing safety-net alert
        data:
          data:
            tag: garage_climate_alert
          message: clear_notification
      - action: notify.mobile_app_pixel_9
        alias: Tell Scott the AC is back on
        data:
          data:
            channel: Garage Safety
            importance: high
            tag: garage_climate_resume
          message: Garage door closed. Garage AC has resumed cooling.
          title: Garage Climate
  mode: single
