- id: '1764972777413'
  alias: 'Master: Garage Climate Doors'
  description: 'Pauses garage climate when the GARAGE DOOR has been open for 3 minutes
    and resumes it when the door closes, following the season mode in input_boolean.garage_heat_cool_mode
    (ON = cool, OFF = heat).


    Cool mode: door open 3 min turns the AC off; door closed resumes cool at the existing
    setpoint.

    Heat mode (added 2026-11-17): door open 3 min turns Rudy''s Heater (climate.garage_heater)
    off; door closed resumes heat at the heater''s own setpoint. No vacation check
    on the heat resume, because Rudy may be home during a vacation.

    The resume cool branch now requires cool mode, so closing the garage door in winter
    no longer forces the AC into cool (it did that on 2026-11-17 12:58). All door-open
    shutoffs are skipped during a mower cycle (input_boolean.mower_cycle_active).


    REAR DOOR REMOVED 2026-09-11: binary_sensor.rear_door stuck open twice and has
    no authority here; monitoring lives in automation.garage_safety_net_rudy. Do not
    re-add it until the Ring node (Z-Wave 262) is proven stable.


    RACE FIX 2026-09-27: mode queued (max 10) and the AC shutoff waits up to 15 s
    for the AC to report off, so a close landing mid shutoff still resumes.


    KNOWN LIMITATION: cool resume always returns to cool, even if the AC was in dry.


    NOTIFY WRAPPER 2026-09-22: notifications go through script.notify_alert / script.notify_clear.'
  triggers:
  - entity_id: cover.garage_door
    for: 00:03:00
    id: door_open
    to: open
    trigger: state
  - entity_id: cover.garage_door
    id: doors_closed
    to: closed
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: Garage door has been open 3 minutes, shut the AC down
      conditions:
      - condition: trigger
        id: door_open
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: climate.garage_ac
        state:
        - cool
        - dry
      sequence:
      - action: input_datetime.set_datetime
        alias: Record when the AC was shut off
        data:
          datetime: '{{ now().isoformat() }}'
        target:
          entity_id: input_datetime.garage_ac_last_off_time
      - action: climate.turn_off
        alias: Turn the AC off
        target:
          entity_id: climate.garage_ac
      - alias: Wait for the AC to actually report off, so a door close that lands
          mid shutoff queues behind this run and can resume cooling
        wait_template: '{{ is_state(''climate.garage_ac'', ''off'') }}'
        timeout: 00:00:15
        continue_on_timeout: true
      - action: input_boolean.turn_off
        alias: Clear the off-notified flag so the safety net can alert fresh
        target:
          entity_id: input_boolean.garage_ac_off_notified
    - alias: Garage door is closed, resume cooling
      conditions:
      - condition: trigger
        id: doors_closed
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: input_boolean.garage_heat_cool_mode
        state: 'on'
      - condition: state
        entity_id: input_boolean.vacation
        state: 'off'
      - condition: state
        entity_id: climate.garage_ac
        state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        alias: Resume cooling, preserving the existing setpoint
        data:
          hvac_mode: cool
        target:
          entity_id: climate.garage_ac
      - action: input_boolean.turn_off
        alias: Clear the off-notified flag
        target:
          entity_id: input_boolean.garage_ac_off_notified
      - action: script.notify_clear
        alias: Clear any standing safety-net alert
        data:
          tag: garage_climate_alert
      - action: script.notify_alert
        alias: Tell Scott the AC is back on
        data:
          message: Garage door closed. Garage AC has resumed cooling.
          title: Garage Climate
          tag: garage_climate_resume
          channel: Garage Safety
          importance: high
    - alias: Garage door has been open 3 minutes, shut Rudys Heater down
      conditions:
      - condition: trigger
        id: door_open
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: climate.garage_heater
        state: heat
      sequence:
      - action: climate.set_hvac_mode
        alias: Turn the heater off
        data:
          hvac_mode: 'off'
        target:
          entity_id: climate.garage_heater
    - alias: Garage door is closed, resume heating
      conditions:
      - condition: trigger
        id: doors_closed
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: input_boolean.garage_heat_cool_mode
        state: 'off'
      - condition: state
        entity_id: climate.garage_heater
        state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        alias: Resume heating, preserving the heater setpoint
        data:
          hvac_mode: heat
        target:
          entity_id: climate.garage_heater
      - action: script.notify_alert
        alias: Tell Scott the heater is back on
        data:
          message: Garage door closed. Rudys Heater has resumed heating.
          title: Garage Climate
          tag: garage_climate_resume
          channel: Garage Safety
          importance: high
  mode: queued
  max: 10
