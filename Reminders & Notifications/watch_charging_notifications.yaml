- id: '1747090407891'
  alias: Watch charging notifications
  description: 'Chimes and announces on the bedroom speaker when the watch starts
    charging, and again when it reaches full, with a push on the full event.


    ENTITY RENAME 2026-08-30: sensor.galaxy_watch7_904t_battery_state became sensor.scott_s_watch_battery_state.
    The watch entities were renamed off the model number so a future watch upgrade
    drops straight in without editing automations.'
  triggers:
  - entity_id:
    - sensor.scott_s_watch_battery_state
    to:
    - charging
    id: Charging
    trigger: state
  - entity_id: sensor.scott_s_watch_battery_state
    to: full
    id: Full
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Charging
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - target:
          entity_id: media_player.bedroom_speaker
        data:
          media:
            media_content_id: media-source://media_source/local/Best Chime Tone.mp3
            media_content_type: audio/mpeg
            metadata:
              title: Best Chime Tone.mp3
        action: media_player.play_media
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - action: media_player.play_media
        target:
          entity_id: media_player.bedroom_speaker
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Watch+is+charging&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata:
              title: Watch is charging
              thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
              media_class: app
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://tts
              - media_content_type: provider
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Watch+is+charging&language=en-US&voice=JennyNeural
    - conditions:
      - condition: trigger
        id:
        - Full
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - target:
          entity_id: media_player.bedroom_speaker
        data:
          media:
            media_content_id: media-source://media_source/local/Best Chime Tone.mp3
            media_content_type: audio/mpeg
            metadata:
              title: Best Chime Tone.mp3
        action: media_player.play_media
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
      - target:
          entity_id: media_player.bedroom_speaker
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=Watch+is+now+fully+charged&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata:
              title: Watch is now fully charged
              thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
              media_class: app
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://tts
              - media_content_type: provider
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Watch+is+now+fully+charged&language=en-US&voice=JennyNeural
        action: media_player.play_media
      - data:
          title: Watch Fully Charged
          message: Your Galaxy Watch is now fully charged and ready to use.
        action: notify.mobile_app_pixel_9
  mode: single
