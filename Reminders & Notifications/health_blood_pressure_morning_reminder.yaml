- id: '1773099695914'
  alias: Health - Blood Pressure Morning Reminder
  description: Send reminder notification between 7 AM and 10 AM if blood pressure
    hasn't been logged today
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions:
  - condition: time
    after: 07:00:00
    before: '10:00:00'
  - condition: template
    value_template: '{% set last = states.sensor.pixel_9_systolic_bp.last_changed
      %}

      {{ last.date() < now().date() }}'
  actions:
  - action: notify.mobile_app_pixel_9
    data:
      title: Blood Pressure Reminder
      message: Don't forget to take your morning blood pressure reading.
      data:
        tag: bp_reminder
        actions:
        - action: DISMISS_BP_REMINDER
          title: Dismiss for Today
  mode: single
