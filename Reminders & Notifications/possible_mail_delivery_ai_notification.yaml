- id: '1746465837978'
  alias: Possible Mail Delivery AI Notification
  description: Detects possible USPS mail delivery from driveway camera. DISABLED
    - replaced by Doorbell - Delivery Vehicle AI Notification.
  triggers:
  - trigger: state
    entity_id: binary_sensor.mailbox_sensor_door
    to: 'on'
  conditions: []
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.driveway_2_high_resolution_channel
    data:
      filename: /config/www/snapshots/doorbell.png
  - delay:
      seconds: 2
  - action: llmvision.image_analyzer
    metadata: {}
    data:
      include_filename: false
      target_width: 1280
      detail: high
      max_tokens: 100
      temperature: 0.2
      provider: 01KZ2A24SYVPMCX8DTYVJTZTVV
      image_entity:
      - camera.driveway_2_high_resolution_channel
      message: Is there a USPS mail truck in the snapshot? The mailbox is on a white
        post at the end of the driveway (right side). If seen, describe the vehicle's
        type, color, and time of day. Respond concisely.
      response_variable: response
    response_variable: response
  - action: notify.mobile_app_pixel_9
    data:
      title: Possible Mail Delivery! 🚗🏃‍♂️
      message: '{{ response.response_text }}'
      data:
        tag: mail_delivery_ai
        image: /local/snapshots/doorbell.png
        url: homeassistant://navigate/lovelace
  mode: single
  initial_state: false
