- id: '1719247743911'
  alias: Away Mode Button
  description: The laundry room button will activate away mode and turn off everything
    and said house in a way mode when Laundry room button is double pressed.
  trigger:
  - device_id: 0692e92c3a10fc27e64992758dbd5f9f
    domain: zha
    platform: device
    type: remote_button_double_press
    subtype: remote_button_double_press
  - platform: state
    entity_id:
    - input_boolean.shut_down_house
    to: 'on'
  condition: []
  action:
  - service: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.away_mode_everything_off
  mode: single
