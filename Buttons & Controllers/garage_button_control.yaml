- id: '1761971748381'
  alias: Garage Button Control
  description: 'Controls garage lighting and door using the Aqara Mini Button (Garage
    Lights Remote) via Zigbee2MQTT. Single press: sets input_boolean.garage_presence_override
    on (forces V2.3 presence automation to keep lights on). Double press: toggles
    garage night light. Hold 4+ seconds: toggles garage door.'
  triggers:
  - topic: zigbee2mqtt/Garage Lights Remote/action
    payload: single
    id: single_press
    platform: mqtt
  - topic: zigbee2mqtt/Garage Lights Remote/action
    payload: double
    id: double_press
    platform: mqtt
  - topic: zigbee2mqtt/Garage Lights Remote/action
    payload: hold
    id: hold_start
    platform: mqtt
  - topic: zigbee2mqtt/Garage Lights Remote/action
    payload: release
    id: hold_release
    platform: mqtt
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: single_press
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garage_presence_override
    - conditions:
      - condition: trigger
        id: double_press
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.garage_night_light
    - conditions:
      - condition: trigger
        id: hold_start
      sequence:
      - wait_for_trigger:
        - trigger: mqtt
          topic: zigbee2mqtt/Garage Lights Remote/action
          payload: release
        timeout: 00:00:04
        continue_on_timeout: true
      - condition: template
        value_template: '{{ wait.trigger is none }}'
      - action: cover.toggle
        target:
          entity_id: cover.garage_door
  mode: single
