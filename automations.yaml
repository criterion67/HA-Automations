      time_min: '{{ state_attr(''vacuum.z60_ultra_roller_complete'',''cleaning_time'')
        or '''' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''drying'' and valid_transition }}'
