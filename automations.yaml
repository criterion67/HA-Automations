- id: '1773884008537'
  alias: 'Kitchen Fridge Alerts: Low Battery'
  description: 'Monitors battery level on both the refrigerator temp sensor (sensor.battery_sensor_main_fridge)
    and the freezer Inkbird sensor (sensor.inkbird_temperature_sensor_battery). Fires
    when either drops below 10%.


    The 10% threshold is intentional: these sensors run on small batteries and can
    drop quickly once they pass 20%. A dead sensor means temperature monitoring is
    completely blind. Alerting at 10% gives enough lead time to replace batteries
    before the sensor drops offline.


    Sends a high-priority push to notify.mobile_app_pixel_9 with the current battery
    percentage included so you know how urgent replacement is.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.battery_sensor_main_fridge
    below: 10
    id: fridge_batt
  - platform: numeric_state
    entity_id: sensor.inkbird_temperature_sensor_battery
    below: 10
    id: freezer_batt
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fridge_batt
      sequence:
      - data:
          title: "\U0001F50B Fridge Sensor Battery Low"
          message: Main fridge temperature sensor battery is at {{ states('sensor.battery_sensor_main_fridge')
            }}%. Replace soon to avoid sensor loss.
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: freezer_batt
      sequence:
      - data:
          title: "\U0001F50B Freezer Sensor Battery Low"
          message: Freezer temperature sensor battery is at {{ states('sensor.inkbird_temperature_sensor_battery')
            }}%. Replace soon to avoid sensor loss.
          data:
            priority: high
            ttl: 0
        action: notify.mobile_app_pixel_9
    default: []
  mode: single
- id: '1773884021307'
  alias: 'Kitchen Fridge Alerts: No Power Draw'
  description: 'Monitors sensor.kitchen_fridge (energy monitoring smart plug the refrigerator
    is connected to) for a sustained zero-watt reading.


    Normal refrigerator behavior: idles at 2.5-8W between compressor cycles, then
    spikes to 75-330W during compressor runs. Even at idle, the plug never reads 0W
    under normal operation. A reading below 1W sustained for 10 minutes indicates
    the fridge has lost power entirely, which could mean: the plug was accidentally
    unplugged, a GFCI or breaker tripped, the smart plug itself has failed, or the
    fridge has a power fault.


    This alert is intentionally separate from the temperature automations because
    a power loss may not immediately trigger a temperature alert, especially if the
    fridge was recently cooled. Catching the power loss early allows intervention
    before food is at risk.


    Sends a high-priority push to notify.mobile_app_pixel_9.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.kitchen_fridge
    below: 1
    for:
      minutes: 10
  actions:
  - data:
      title: ⚡ Fridge No Power Detected
      message: 'Kitchen fridge energy monitor has shown 0W for over 10 minutes. The
        fridge may be unplugged, a GFCI or breaker may have tripped, or the smart
        plug may have failed. Current: {{ states(''sensor.kitchen_fridge'') }}W'
      data:
        priority: high
        ttl: 0
    action: notify.mobile_app_pixel_9
  mode: single
