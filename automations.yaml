    event_data:
      device_id: 3f75b498f61be17ef9a463a3775b8628
      button_type: raise
      action: press
    id: raise
    platform: event
  - event_type: lutron_caseta_button_event
    event_data:
      device_id: 3f75b498f61be17ef9a463a3775b8628
      button_type: lower
      action: press
    id: lower
    platform: event
  actions:
