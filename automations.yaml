        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
      - choose:
        - conditions:
          - condition: state
            entity_id: light.office_lamps
            state: 'off'
            for:
              hours: 1
              minutes: 0
              seconds: 0
          sequence: []
        default:
        - action: scene.turn_on
          target:
            entity_id: scene.office_fan_temp_scene
          data: {}
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: scene.create
        data:
          scene_id: office_fan_temp_scene
          snapshot_entities:
          - switch.office_fan
      - action: switch.turn_off
        target:
          entity_id: switch.office_fan
      - if:
        - condition: state
          entity_id: light.office_lamps
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.office_lamps
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
- id: '1776226412089'
