- id: '1757385105935'
  alias: Bedroom Fridge - Temp & Connectivity Alerts
  description: ''
  triggers:
  - entity_id:
    - sensor.bedroom_fridge_temperature
    above: 50
    for:
      hours: 0
      minutes: 30
      seconds: 0
    id: Hot
    platform: numeric_state
  - entity_id:
    - sensor.bedroom_fridge_temperature
    to: unavailable
    for:
      hours: 0
      minutes: 30
      seconds: 0
    id: Offline
    platform: state
  - entity_id:
    - sensor.bedroom_fridge_temperature
    to: unknown
    for:
      hours: 0
      minutes: 30
      seconds: 0
    id: Offline
    platform: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Hot
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ states(''sensor.bedroom_fridge_temperature'')|float(0)
              > 50 }}'
          sequence:
          - variables:
              temp_f: '{{ (states(''sensor.bedroom_fridge_temperature'')|float(0)
                | round(1)) | string | regex_replace(''\.0$'', '''') }}

                '
          - delay:
              seconds: 1
          - action: media_player.play_media
            target:
              entity_id: media_player.bedroom_group
            data:
              media:
                media_content_id: media-source://media_source/local/Best Chime Tone.mp3
                media_content_type: audio/mpeg
                metadata:
                  title: Best Chime Tone.mp3
          - delay:
              seconds: 2
          - action: media_player.play_media
            target:
              entity_id: media_player.bedroom_group
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message={{
                  ('Heads up. The bedroom fridge temperature is ' ~ temp_f ~ ' degrees
                  Fahrenheit. Please check it.') | urlencode }}&language=en-US&voice=AndrewNeural
                media_content_type: provider
                metadata:
                  title: Bedroom fridge temperature alert
                  thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
                  media_class: app
          - action: notify.mobile_app_pixel_9
            data:
              title: Bedroom Fridge Alert
              message: Temperature is {{ temp_f }}°F. Please check the fridge.
              data:
                ttl: 0
                priority: high
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0
                  interruption-level: critical
                channel: alarm_stream
                importance: high
          - delay:
              hours: 1
    - conditions:
      - condition: trigger
        id:
        - Offline
      sequence:
      - delay:
          seconds: 1
      - action: media_player.play_media
        target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://media_source/local/Best Chime Tone.mp3
            media_content_type: audio/mpeg
            metadata:
              title: Best Chime Tone.mp3
      - delay:
          seconds: 2
      - action: media_player.play_media
        target:
          entity_id: media_player.bedroom_group
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message={{
              ('Attention. The bedroom fridge temperature sensor is not reporting.
              Please check the sensor or connection.') | urlencode }}&language=en-US&voice=AndrewNeural
            media_content_type: provider
            metadata:
              title: Bedroom fridge sensor unavailable alert
              thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
              media_class: app
      - action: notify.mobile_app_pixel_9
        data:
          title: Bedroom Fridge Sensor Alert
          message: The bedroom fridge temperature sensor is unavailable. Please check
            the sensor or connection.
          data:
            ttl: 0
            priority: high
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
              interruption-level: critical
            channel: alarm_stream
            importance: high
  mode: single
