        ''none'' }}'
      to_state: '{{ trigger.to_state.state if trigger.to_state is not none else ''none''
        }}'
      valid_transition: '{{ trigger.from_state is not none and trigger.from_state.state
        not in [''unknown'',''unavailable''] }}'
      v_state: '{{ states(''vacuum.z60_ultra_roller_complete'') }}'
      task_status: '{{ states(''sensor.z60_ultra_roller_complete_task_status'') }}'
      dryer: '{{ states(''sensor.z60_ultra_roller_complete_state'') }}'
      area: '{{ state_attr(''vacuum.z60_ultra_roller_complete'',''cleaned_area'')
