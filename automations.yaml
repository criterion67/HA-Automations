- id: '1777613776997'
  alias: V2.2 Garage Presence Lighting Control
  description: Controls garage ceiling lights and workbench light based on presence
    and PIR motion detection. Replaces V2.1 (disabled, preserved for rollback). Ceiling
    lights turn on when garage_presence_target_count > 0, and turn off after 60 seconds
    of no presence UNLESS input_boolean.workbench_occupied is on (meaning the workbench
    PIR sensor still detects activity). Workbench light (switch.workbench_light) turns
    on when binary_sensor.pir_ms_1_occupancy detects motion and turns off 5 minutes
    after motion clears; it also sets/clears input_boolean.workbench_occupied to prevent
    the ceiling lights from shutting off while someone is at the workbench. Night-time
    block (11:00pm-6:00am) applies to ceiling lights only, bypassed by input_boolean.garage_light_time_override.
    Time override resets at 6:00am daily. Manual override (input_boolean.garage_presence_override)
    bypasses the entire automation.
  triggers:
  - entity_id: sensor.garage_presence_target_count
    above: 0
    id: presence_detected
    platform: numeric_state
  - entity_id: sensor.garage_presence_target_count
    below: 1
    for:
      seconds: 60
    id: no_presence
    platform: numeric_state
  - entity_id: binary_sensor.pir_ms_1_occupancy
    to: 'on'
    id: workbench_motion_on
    platform: state
  - entity_id: binary_sensor.pir_ms_1_occupancy
    to: 'off'
    for:
      minutes: 5
    id: workbench_motion_off
    platform: state
  - at: 06:00:00
    id: reset_override
    platform: time
  conditions:
  - condition: state
    entity_id: input_boolean.garage_presence_override
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_detected
      - condition: state
        entity_id: switch.garage_lights
        state: 'off'
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: time
            after: '23:00:00'
          - condition: time
            before: 06:00:00
        - condition: state
          entity_id: input_boolean.garage_light_time_override
          state: 'on'
      sequence:
      - target:
          entity_id: switch.garage_lights
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: no_presence
      - condition: state
        entity_id: input_boolean.workbench_occupied
        state: 'off'
      sequence:
      - target:
          entity_id: switch.garage_lights
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: workbench_motion_on
      sequence:
      - target:
          entity_id: input_boolean.workbench_occupied
        action: input_boolean.turn_on
      - target:
          entity_id: switch.workbench_light
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: workbench_motion_off
      sequence:
      - target:
          entity_id: input_boolean.workbench_occupied
        action: input_boolean.turn_off
      - target:
          entity_id: switch.workbench_light
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: reset_override
      sequence:
      - target:
          entity_id: input_boolean.garage_light_time_override
        action: input_boolean.turn_off
  mode: parallel
  max: 10
- id: '1777644946284'
  alias: Living Room TV - Turn Off When Bill Leaves
  description: When Bill has been away from home for 10 minutes, turn off the Living
    Room Chromecast. If Scott is home, send an actionable notification first asking
    whether to keep it on. If no response within 2 minutes, turn it off automatically.
  triggers:
  - platform: state
    entity_id: person.bill_funk
    to: not_home
    for:
      minutes: 10
    id: bill_left
  conditions:
  - condition: state
    entity_id: media_player.onn_streaming_device_4k_pro
    state:
    - playing
    - paused
    - idle
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: person.scott_funk
        state: home
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          title: Living Room TV On
          message: Bill has left home. Should the Living Room TV stay on?
          data:
            actions:
            - action: LIVING_ROOM_TV_KEEP_ON
              title: Keep On
            - action: LIVING_ROOM_TV_TURN_OFF
              title: Turn Off
            tag: living_room_tv_bill_away
            persistent: true
            sticky: true
      - wait_for_trigger:
        - platform: event
          event_type: mobile_app_notification_action
          event_data:
            action: LIVING_ROOM_TV_KEEP_ON
        - platform: event
          event_type: mobile_app_notification_action
          event_data:
            action: LIVING_ROOM_TV_TURN_OFF
        timeout:
          minutes: 2
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
              == ''LIVING_ROOM_TV_KEEP_ON'' }}'
          sequence:
          - action: notify.mobile_app_pixel_9
            data:
              message: clear_notification
              data:
                tag: living_room_tv_bill_away
        default:
        - action: media_player.turn_off
          target:
            entity_id: media_player.onn_streaming_device_4k_pro
        - action: notify.mobile_app_pixel_9
          data:
            message: clear_notification
            data:
              tag: living_room_tv_bill_away
    default:
    - action: media_player.turn_off
      target:
        entity_id: media_player.onn_streaming_device_4k_pro
  mode: single
- id: '1777675226974'
  alias: V2.3 Garage Presence Lighting Control
  description: 'Controls garage ceiling lights (switch.garage_lights) and workbench
    light (switch.workbench_light) using layered presence and human-confirmation logic
    to filter out pet false triggers (Rudy). Human presence is confirmed via any of:
    PIR motion (binary_sensor.pir_ms_1_occupancy), garage door opening (binary_sensor.garage_door_position),
    laundry room door opening (binary_sensor.laundry_room_door), rear door opening
    (binary_sensor.rear_door). Confirmed human presence sets input_boolean.human_in_garage
    which guards ceiling and workbench light activation. mmWave (sensor.garage_presence_target_count)
    holds lights on while present. Lights turn off 60 seconds after mmWave clears.
    Workbench light turns on with ceiling lights when human confirmed and PIR active,
    turns off 5 minutes after PIR clears. David Mowie guard (input_boolean.david_mowie_mowing)
    prevents garage door open events from confirming human presence during mowing
    cycles. input_boolean.human_in_garage resets 30 minutes after last confirming
    event if mmWave also clear. Manual override (input_boolean.garage_presence_override)
    bypasses all automatic logic and resets at 6:00am daily. Helpers used: input_boolean.human_in_garage,
    input_boolean.workbench_occupied, input_boolean.garage_presence_override. Replaces
    V2.2 (disabled, preserved for rollback).'
  triggers:
  - above: 0
    entity_id: sensor.garage_presence_target_count
    id: presence_detected
    platform: numeric_state
  - below: 1
    entity_id: sensor.garage_presence_target_count
    for:
      seconds: 60
    id: no_presence
    platform: numeric_state
  - entity_id: binary_sensor.pir_ms_1_occupancy
    id: workbench_motion_on
    platform: state
    to: 'on'
  - entity_id: binary_sensor.pir_ms_1_occupancy
    for:
      minutes: 5
    id: workbench_motion_off
    platform: state
    to: 'off'
  - entity_id: binary_sensor.garage_door_position
    from: 'off'
    id: garage_door_opened
    platform: state
    to: 'on'
  - entity_id: binary_sensor.laundry_room_door
    from: 'off'
    id: laundry_door_opened
    platform: state
    to: 'on'
  - entity_id: binary_sensor.rear_door
    from: 'off'
    id: rear_door_opened
    platform: state
    to: 'on'
  - at: 06:00:00
    id: reset_override
    platform: time
  conditions:
  - condition: state
    entity_id: input_boolean.garage_presence_override
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - garage_door_opened
        - laundry_door_opened
        - rear_door_opened
        - workbench_motion_on
      sequence:
      - if:
        - condition: trigger
          id: garage_door_opened
        - condition: state
          entity_id: input_boolean.david_mowie_mowing
          state: 'on'
        then:
        - stop: David Mowie is mowing, garage door open is not a human entry event
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.human_in_garage
      - delay:
          minutes: 30
      - condition: state
        entity_id: sensor.garage_presence_target_count
        state: '0'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.human_in_garage
    - conditions:
      - condition: trigger
        id: presence_detected
      sequence:
      - condition: state
        entity_id: input_boolean.human_in_garage
        state: 'on'
      - action: switch.turn_on
        target:
          entity_id: switch.garage_lights
      - if:
        - condition: state
          entity_id: binary_sensor.pir_ms_1_occupancy
          state: 'on'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.workbench_light
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.workbench_occupied
    - conditions:
      - condition: trigger
        id: no_presence
      sequence:
      - condition: state
        entity_id: input_boolean.workbench_occupied
        state: 'off'
      - action: switch.turn_off
        target:
          entity_id:
          - switch.garage_lights
          - switch.workbench_light
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.human_in_garage
    - conditions:
      - condition: trigger
        id: workbench_motion_on
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.workbench_occupied
      - action: switch.turn_on
        target:
          entity_id: switch.workbench_light
      - if:
        - condition: state
          entity_id: switch.garage_lights
          state: 'off'
        - condition: state
          entity_id: input_boolean.human_in_garage
          state: 'on'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.garage_lights
    - conditions:
      - condition: trigger
        id: workbench_motion_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.workbench_occupied
      - action: switch.turn_off
        target:
          entity_id: switch.workbench_light
    - conditions:
      - condition: trigger
        id: reset_override
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garage_presence_override
  max: 10
  mode: parallel
- id: '1778044988595'
  alias: Health - Auto-Dismiss BP Reminder on Reading
  description: Automatically turns off the BP dashboard reminder when either BP sensor
    is updated within 30 minutes of the morning reminder window (7–10 AM) or the evening
    reminder reset (7 PM).
  triggers:
  - platform: state
    entity_id:
    - sensor.pixel_9_systolic_bp
    - sensor.pixel_9_diastolic_bp
  conditions:
  - condition: or
