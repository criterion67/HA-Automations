- id: '1773775580443'
  alias: Zigbee Keypad - Lock/Unlock Front Door
  description: Home button + PIN unlocks front door. Away button + PIN locks front
    door. Wrong PIN sends rejection beep.
  triggers:
  - platform: mqtt
    topic: zigbee2mqtt/Zigbee Keypad
    value_template: '{{ value_json.action is defined and value_json.action_code is
      defined }}'
  conditions: []
  actions:
  - variables:
      action: '{{ trigger.payload_json.action | default('''') }}'
      code: '{{ trigger.payload_json.action_code | default('''') | string }}'
      transaction: '{{ trigger.payload_json.action_transaction | default(0) | int(0)
        }}'
      valid_pin: '{{ states(''input_text.keypad_pin_code'') | string }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ code != valid_pin }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Zigbee Keypad/set
          payload: '{{ {''arm_mode'': {''transaction'': transaction, ''mode'': ''invalid_code''}}
            | tojson }}'
    - conditions:
      - condition: template
        value_template: '{{ code == valid_pin and action == ''arm_day_zones'' }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Zigbee Keypad/set
          payload: '{{ {''arm_mode'': {''transaction'': transaction, ''mode'': ''arm_day_zones''}}
            | tojson }}'
      - action: lock.unlock
        target:
          entity_id: lock.front_door_deadbolt
    - conditions:
      - condition: template
        value_template: '{{ code == valid_pin and action == ''arm_all_zones'' }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Zigbee Keypad/set
          payload: '{{ {''arm_mode'': {''transaction'': transaction, ''mode'': ''arm_all_zones''}}
            | tojson }}'
      - action: lock.lock
        target:
          entity_id: lock.front_door_deadbolt
  mode: queued
  max: 5
- id: '1773883949400'
  alias: 'Kitchen Fridge Alerts: Temperature and Sensor'
  description: 'Monitors kitchen refrigerator (sensor.temp_sensor_main_fridge) and
    freezer (sensor.inkbird_kitchen_freezer_temperature) for unsafe temperature conditions
    and sensor loss. Uses parallel mode so multiple simultaneous conditions each fire
    independently.


    Thresholds based on 7-day historical data and FDA food safety guidelines:

    - Fridge normal range: 35-39F. Early warning above 43F for 10 min (door left open
    / compressor struggling). Ceiling alert above 45F for 20 min (food safety risk).
    Runaway cold below 33F for 20 min (thermostat failure, food freezing risk).

    - Freezer normal range: 0F target. Early warning above 10F for 10 min. Ceiling
    alert above 15F for 20 min (food safety failure zone). Runaway cold below -10F
    for 20 min (thermostat failure).

    - Sensor offline: unavailable or unknown for 30 min indicates battery failure
    or Zigbee drop. Without sensor data, temperature monitoring is blind.


    All alerts send high-priority push to notify.mobile_app_pixel_9 with current temperature
    included in the message.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.temp_sensor_main_fridge
    above: 45
    for:
      minutes: 20
    id: fridge_high
  - platform: numeric_state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    above: 15
    for:
      minutes: 20
    id: freezer_high
  - platform: numeric_state
    entity_id: sensor.temp_sensor_main_fridge
    above: 43
    for:
      minutes: 10
    id: fridge_rising
  - platform: numeric_state
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    above: 10
    for:
      minutes: 10
    id: freezer_rising
  - platform: numeric_state
    entity_id: sensor.temp_sensor_main_fridge
    below: 33
    for:
