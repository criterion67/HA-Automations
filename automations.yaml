- id: '1768404848896'
  alias: 'Lock Batteries: Alert below 15% with Snooze and Dismiss'
  description: ''
  triggers:
  - entity_id:
    - sensor.bedroom_closet_door_deadbolt_battery
    - sensor.front_door_deadbolt_battery_level
    - sensor.laundry_room_door_deadbolt_battery_level
    - sensor.rear_door_deadbolt_battery_level
    - sensor.sunroom_door_deadbolt_battery_level
    below: 15
    for:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    trigger: numeric_state
  conditions:
  - condition: template
    value_template: '{% set key = trigger.entity_id %} {% set store = states(''input_text.lock_battery_alert_snoozed_until'')
      %} {% if store in [''unknown'',''unavailable'',''''] %} true {% else %} {% set
      data = store | from_json %} {% set until = data.get(key, '''') %} {% if until
      == '''' %} true {% else %} now() >= as_datetime(until) {% endif %} {% endif
      %}'
  actions:
  - variables:
      battery_entity: '{{ trigger.entity_id }}'
      battery_level: '{{ trigger.to_state.state | int(0) }}'
      lock_name: '{{ state_attr(trigger.entity_id, ''friendly_name'') or trigger.entity_id
        }}'
      store_raw: '{{ states(''input_text.lock_battery_alert_snoozed_until'') }}'
      store: '{% if store_raw in [''unknown'',''unavailable'',''''] %} {} {% else
        %} {{ store_raw | from_json }} {% endif %}'
  - action: notify.mobile_app_pixel_9
    data:
      title: Lock battery low
      message: '{{ lock_name }} is at {{ battery_level }}%.'
      data:
        tag: lock_batt_{{ battery_entity }}
        persistent: true
        actions:
        - action: LOCK_BATT_SNOOZE|{{ battery_entity }}
          title: Snooze 12h
        - action: LOCK_BATT_DISMISS|{{ battery_entity }}
          title: Dismiss 48h
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: LOCK_BATT_SNOOZE|{{ battery_entity }}
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: LOCK_BATT_DISMISS|{{ battery_entity }}
    timeout: '12:00:00'
    continue_on_timeout: false
  - variables:
      picked: '{{ wait.trigger.event.data.action }}'
      picked_entity: '{{ picked.split(''|'')[1] }}'
      new_until: '{% if picked.startswith(''LOCK_BATT_SNOOZE|'') %} {{ (now() + timedelta(hours=12)).isoformat()
        }} {% else %} {{ (now() + timedelta(hours=48)).isoformat() }} {% endif %}'
      new_store: '{% set merged = dict(store) %} {% set _ = merged.update({picked_entity:
        new_until}) %} {{ merged | to_json }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.lock_battery_alert_snoozed_until
    data:
      value: '{{ new_store }}'
  - action: notify.mobile_app_pixel_9
    data:
      message: clear_notification
      data:
        tag: lock_batt_{{ battery_entity }}
  mode: parallel
  max: 10
- id: '1769493494913'
  alias: 'Bathroom Shower: Light Timer v4.4'
  description: 'Door open sets 5000 K at 100%. If still open after 1:30, red plus
    chime plus TTS, then back to 5000 K. After announcement, the next door close starts
    a 10 minute in shower timer and announces "Shower timer has started". Timer finish
    shows a brief red reminder, then returns to 5000 K. Light turns off when the door
    closes for quick in and out, or when you exit and close the door after a timed
    shower.

    '
  triggers:
  - id: door_opened
    entity_id: binary_sensor.bathroom_shower_door_sensor_contact
    to: 'on'
    trigger: state
  - id: door_closed
    entity_id: binary_sensor.bathroom_shower_door_sensor_contact
    to: 'off'
    trigger: state
  - id: timer_finished
    event_type: timer.finished
    event_data:
      entity_id: timer.shower_in_shower_timer
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: door_opened
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bathroom_shower_downlight
        data:
          color_temp_kelvin: 5000
          brightness_pct: 100
      - choose:
        - conditions:
          - condition: state
            entity_id: timer.shower_in_shower_timer
            state: active
          sequence:
          - stop: In shower, ignore warmup flow on door open
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shower_ready_announced
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.bathroom_shower_door_sensor_contact
          to: 'off'
        timeout: 00:01:30
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
            note: Template is intentional. Checking a wait result is the documented
              pattern and has no native condition equivalent. Do not convert.
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.bathroom_shower_downlight
          - stop: Door closed before warmup complete
        default:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.shower_ready_announced
        - action: light.turn_on
          target:
            entity_id: light.bathroom_shower_downlight
          data:
            color_name: red
            brightness_pct: 100
        - action: media_player.play_media
          target:
            entity_id: media_player.era_100_bathroom
          data:
            media_content_id: media-source://media_source/local/Best Chime Tone.mp3
            media_content_type: audio/mpeg
            announce: true
            extra:
              volume: 45
        - delay: 00:00:02
        - action: media_player.play_media
          target:
            entity_id: media_player.era_100_bathroom
          data:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+shower+is+ready&language=en-US&voice=JennyNeural
            media_content_type: provider
            announce: true
            extra:
              volume: 45
        - delay: 00:00:02
        - action: light.turn_on
          target:
            entity_id: light.bathroom_shower_downlight
          data:
            color_temp_kelvin: 5000
            brightness_pct: 100
    - conditions:
      - condition: trigger
        id: door_closed
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: timer.shower_in_shower_timer
            state: active
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.bathroom_shower_downlight
          - action: timer.cancel
            target:
              entity_id: timer.shower_in_shower_timer
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.shower_ready_announced
        - conditions:
          - condition: state
            entity_id: input_boolean.shower_ready_announced
            state: 'on'
          sequence:
          - action: timer.start
            target:
              entity_id: timer.shower_in_shower_timer
          - action: media_player.play_media
            target:
              entity_id: media_player.era_100_bathroom
            data:
              media_content_id: media-source://tts/tts.home_assistant_cloud?message=Shower+timer+has+started&language=en-US&voice=JennyNeural
              media_content_type: provider
              announce: true
              extra:
                volume: 45
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.shower_ready_announced
        default:
        - action: light.turn_off
          target:
            entity_id: light.bathroom_shower_downlight
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.shower_ready_announced
        - action: timer.cancel
          target:
            entity_id: timer.shower_in_shower_timer
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - condition: state
        entity_id: binary_sensor.bathroom_shower_door_sensor_contact
        state: 'off'
      - action: light.turn_on
        target:
          entity_id: light.bathroom_shower_downlight
        data:
          color_name: red
          brightness_pct: 100
      - delay: 00:00:10
      - action: light.turn_on
        target:
          entity_id: light.bathroom_shower_downlight
        data:
          color_temp_kelvin: 5000
          brightness_pct: 100
  mode: restart
- id: '1769749220185'
  alias: Garbage/Recycling Pickup AI Notification
  description: On Thursday mornings between 6:00 and 7:30, a vehicle detection on
    the Driveway 2 camera sends a frame to LLM Vision (Google Gemini) asking for a
    structured JSON verdict on whether the green garbage bin and blue recycling bin
    have been collected. The prompt tells the model to ignore the homeowner's parked
    pickup, visitor vehicles, lawn equipment, neighbors, pets, and passing traffic.
    Nothing is written to the timeline automatically. Only when pickup_detected comes
    back true does the automation create an LLM Vision timeline event labeled Truck
    and push a notification. This replaces the old version, which stored every Thursday-morning
    vehicle detection on the timeline and notified unconditionally, so any passing
    car during that window would alert.
  triggers:
  - entity_id: binary_sensor.driveway_2_vehicle_detected_2
    to: 'on'
    trigger: state
  conditions:
  - after: 06:00:00
    before: 07:30:00
    condition: time
  - condition: time
    weekday:
    - thu
  actions:
  - action: camera.snapshot
    data:
      filename: /config/www/snapshots/garbage_pickup.png
    target:
      entity_id: camera.driveway_2_high_resolution_channel
  - action: llmvision.image_analyzer
    data:
      description_field: description
      expose_images: true
      generate_title: false
      image_entity:
      - camera.driveway_2_high_resolution_channel
      include_filename: false
      max_tokens: 300
      message: 'This is a driveway and street view of a residential property. On collection
        day the GREEN garbage bin and BLUE recycling bin are staged near the upper
        left of the frame, at the end of the driveway.


        LOCATION RULE, apply this strictly and above everything else: collection trucks
        operate from the street and NEVER pull into this driveway. Therefore any vehicle
        sitting in the driveway itself is a resident or visitor vehicle and must be
        ignored completely, whatever its make, color, size or type.


        Also ignore lawn equipment, neighbors, pets, and ordinary passing traffic
        that does not stop.


        Set pickup_detected to true ONLY if a city garbage or recycling collection
        truck is stopped on the street, or the bins that were staged for collection
        are clearly no longer in place or have been tipped or moved as if just emptied.
        Otherwise set pickup_detected to false.'
      provider: 01KZ2A24SYVPMCX8DTYVJTZTVV
      response_format: json
      store_in_timeline: false
      structure: '{"type": "object", "properties": {"pickup_detected": {"type": "boolean",
        "description": "true only if a collection truck is visible or the staged bins
        have clearly been emptied or moved"}, "truck_present": {"type": "boolean",
        "description": "true if a city garbage or recycling truck is visible"}, "bins_present":
        {"type": "boolean", "description": "true if the green or blue bins are still
        staged at the end of the driveway"}, "title": {"type": "string", "description":
        "Short event title, under 6 words"}, "description": {"type": "string", "description":
        "One or two sentence description of what was seen"}}, "required": ["pickup_detected",
        "truck_present", "bins_present", "title", "description"], "additionalProperties":
        false}'
      target_width: 1280
      title_field: title
    response_variable: response
  - condition: template
    value_template: '{{ response.structured_response.pickup_detected | default(false)
      }}'
  - action: llmvision.create_event
    data:
      camera_entity: camera.driveway_2_high_resolution_channel
      description: '{{ response.structured_response.description }}'
      image_path: '{{ response.key_frame }}'
      label: Truck
      title: '{{ response.structured_response.title }}'
  - action: notify.mobile_app_pixel_9
    data:
      data:
        image: /local/snapshots/garbage_pickup.png
        tag: garbage_pickup_ai
      message: '{{ response.structured_response.description }}'
      title: "Garbage/Recycling Pickup Detected! \U0001F5D1️♻️"
  max_exceeded: silent
  mode: single
