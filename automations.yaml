- id: '1757834616096'
  alias: V2.1 Garage Presence Lighting Control
  description: 'Controls garage lights based on presence detection unless the manual
    override is enabled. Lights will not turn on between 11:00 p.m. and 6:00 a.m.
    unless the time override toggle is enabled. Also resets the time override toggle
    each morning at 6:00 a.m.

    '
  triggers:
  - entity_id: sensor.garage_presence_target_count
    above: 0
    id: presence_detected
    trigger: numeric_state
  - entity_id: sensor.garage_presence_target_count
    below: 1
    for:
      seconds: 60
    id: no_presence
    trigger: numeric_state
  - at: 06:00:00
    id: reset_override
    trigger: time
  conditions:
  - condition: state
    entity_id: input_boolean.garage_presence_override
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_detected
      - condition: state
        entity_id: switch.garage_lights
        state: 'off'
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: time
            after: '23:00:00'
          - condition: time
            before: 06:00:00
        - condition: state
          entity_id: input_boolean.garage_light_time_override
          state: 'on'
      sequence:
      - target:
          entity_id: switch.garage_lights
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: no_presence
      sequence:
      - target:
          entity_id: switch.garage_lights
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: reset_override
      sequence:
      - target:
          entity_id: input_boolean.garage_light_time_override
        action: input_boolean.turn_off
  mode: single
- id: '1758650148017'
  alias: Office- Ceiling Light Presence Control V2
  description: Turns ceiling light on with presence, turns it off after 5 min of no
    presence, and resets manual override.
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - trigger: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.office_ceiling_light
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - if:
        - condition: state
          entity_id: switch.office_ceiling_light
          state: 'on'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.office_ceiling_light
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
- id: '1758738295864'
  alias: Ego Battery Notification Actions (Combined)
  description: Handles app notification actions for both plugs with a 3-snooze limit.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  actions:
  - variables:
      a: '{{ trigger.event.data.action | default('''') }}'
      map:
        SNOOZE_CHARGER_1:
          snooze: counter.ego_battery_snooze_1
          switch: switch.ego_battery_charge_monitor_1
          charging: input_boolean.ego_battery_charging_active_1
          charged: input_boolean.ego_battery_charged_indicator_1
        RESET_CHARGER_1:
          snooze: counter.ego_battery_snooze_1
          switch: switch.ego_battery_charge_monitor_1
          charging: input_boolean.ego_battery_charging_active_1
          charged: input_boolean.ego_battery_charged_indicator_1
        SNOOZE_CHARGER_2:
          snooze: counter.ego_battery_snooze_2
          switch: switch.ego_battery_charge_monitor_2
          charging: input_boolean.ego_battery_charging_active_2
          charged: input_boolean.ego_battery_charged_indicator_2
        RESET_CHARGER_2:
          snooze: counter.ego_battery_snooze_2
          switch: switch.ego_battery_charge_monitor_2
          charging: input_boolean.ego_battery_charging_active_2
          charged: input_boolean.ego_battery_charged_indicator_2
      cfg: '{{ map.get(a) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ a.startswith(''RESET_'') and cfg is not none }}'
      sequence:
      - data:
          entity_id: '{{ cfg.switch }}'
        action: switch.turn_on
      - data:
          entity_id: '{{ cfg.charging }}'
        action: input_boolean.turn_off
      - data:
          entity_id: '{{ cfg.charged }}'
        action: input_boolean.turn_off
      - data:
          entity_id: '{{ cfg.snooze }}'
        action: counter.reset
    - conditions:
      - condition: template
        value_template: '{{ a.startswith(''SNOOZE_'') and cfg is not none }}'
      sequence:
      - data:
          entity_id: '{{ cfg.snooze }}'
        action: counter.increment
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(cfg.snooze)|int(0) < 3 }}'
          sequence:
          - delay: 01:00:00
          - condition: template
            value_template: '{{ is_state(cfg.switch, ''off'') }}'
          - data:
              title: Ego Battery Charger Reminder
              message: 'Charger is still off. You have {{ 3 - (states(cfg.snooze)|int(0))
                }} snoozes left. Do you want to reset it for the next battery?

                '
              data:
                sticky: true
                actions:
                - action: '{{ a }}'
                  title: Snooze Again
                - action: '{{ ''RESET_CHARGER_1'' if a.endswith(''_1'') else ''RESET_CHARGER_2''
                    }}

                    '
                  title: Dismiss / Reset
            action: notify.mobile_app_pixel_9
        - conditions:
          - condition: template
            value_template: '{{ states(cfg.snooze)|int(0) >= 3 }}'
          sequence:
          - data:
              title: Ego Battery Charger
              message: 'Snooze limit reached (3). Reminders stopped. Charger remains
                off until you turn it on.

                '
            action: notify.mobile_app_pixel_9
  mode: restart
- id: '1758941793372'
  alias: Car Battery Voltage Alerts (Temp Compensated)
  description: Warn at temp-adjusted 12.2 V (20 min), critical at temp-adjusted 12.0
    V (10 min)
  triggers:
  - id: warning
    for: 00:20:00
    value_template: '{% set t = states(''sensor.temp_sensor_outside'') | float(25)
      %} {% set unit = state_attr(''sensor.temp_sensor_outside'',''unit_of_measurement'')
      %} {% set temp_c = (t - 32) * 5/9 if unit in [''°F'',''F'',''Fahrenheit''] else
      t %} {% set warn = 12.2 + ((25 - temp_c) * 0.02) %} {{ (states(''sensor.shelly_uni_voltmeter'')
      | float(99)) < warn }}

      '
    trigger: template
  - id: critical
    for: 00:10:00
    value_template: '{% set t = states(''sensor.temp_sensor_outside'') | float(25)
      %} {% set unit = state_attr(''sensor.temp_sensor_outside'',''unit_of_measurement'')
      %} {% set temp_c = (t - 32) * 5/9 if unit in [''°F'',''F'',''Fahrenheit''] else
      t %} {% set crit = 12.0 + ((25 - temp_c) * 0.02) %} {{ (states(''sensor.shelly_uni_voltmeter'')
      | float(99)) < crit }}

      '
    trigger: template
  actions:
  - variables:
      t: '{{ states(''sensor.temp_sensor_outside'') | float(25) }}'
      unit: '{{ state_attr(''sensor.temp_sensor_outside'',''unit_of_measurement'')
        }}'
      temp_c: '{{ (t - 32) * 5/9 if unit in [''°F'',''F'',''Fahrenheit''] else t }}'
      batt: '{{ states(''sensor.shelly_uni_voltmeter'') | float(99) }}'
      warn: '{{ 12.2 + ((25 - temp_c) * 0.02) }}'
      crit: '{{ 12.0 + ((25 - temp_c) * 0.02) }}'
  - choose:
    - conditions:
      - condition: trigger
        id: critical
      sequence:
      - data:
          title: Car Battery CRITICAL
          message: 'Battery critically low: {{ batt | round(2) }} V (below {{ crit
            | round(2) }} V @ {{ temp_c | round(1) }} °C). Charge immediately to avoid
            damage.

            '
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: warning
      sequence:
      - data:
          title: Car Battery Warning
          message: 'Battery low: {{ batt | round(2) }} V (below {{ warn | round(2)
            }} V @ {{ temp_c | round(1) }} °C). Consider running the car or connecting
            a maintainer.

            '
        action: notify.mobile_app_pixel_9
  mode: single
- id: '1759025426226'
  alias: Ego Battery Charge Monitor v3.7 (Combined)
  description: 'Monitors both Ego battery chargers (Plug 1 & Plug 2). Notifies when
    charging starts and when the battery is ✅ Fully Charged, powers off plug with
    failsafe, and provides actionable notification (Snooze/Reset) with a 3-snooze
    limit. Includes startup recovery and failsafe cutoff.

    '
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ego_battery_monitor_power_1
    above: 100
    for: 00:01:00
    id: reset
  - trigger: numeric_state
    entity_id: sensor.ego_battery_monitor_power_1
    below: 5
    for: 00:02:00
    id: notify
  - trigger: numeric_state
    entity_id: sensor.ego_battery_monitor_power_2
    above: 100
    for: 00:01:00
    id: reset
  - trigger: numeric_state
    entity_id: sensor.ego_battery_monitor_power_2
    below: 5
    for: 00:02:00
    id: notify
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - variables:
      plug_map:
        sensor.ego_battery_monitor_power_1:
          switch: switch.ego_battery_charge_monitor_1
          charging: input_boolean.ego_battery_charging_active_1
          charged: input_boolean.ego_battery_charged_indicator_1
          snooze: counter.ego_battery_snooze_1
          tag: Plug 1
          snooze_action: SNOOZE_CHARGER_1
          reset_action: RESET_CHARGER_1
        sensor.ego_battery_monitor_power_2:
          switch: switch.ego_battery_charge_monitor_2
          charging: input_boolean.ego_battery_charging_active_2
          charged: input_boolean.ego_battery_charged_indicator_2
          snooze: counter.ego_battery_snooze_2
          tag: Plug 2
          snooze_action: SNOOZE_CHARGER_2
          reset_action: RESET_CHARGER_2
      cfg: '{{ plug_map.get(trigger.entity_id) if trigger.entity_id is defined else
        None }}'
  - choose:
    - conditions:
      - condition: trigger
        id: notify
      - condition: template
        value_template: '{{ cfg is not none and is_state(cfg.charging, ''on'') }}'
      sequence:
      - data:
          title: Ego Battery Charge Update ({{ cfg.tag }})
          message: '✅ Fully Charged. Your Ego battery on {{ cfg.tag }} is now fully
            charged. The charger has been turned off automatically to preserve battery
            life.

            '
          data:
            sticky: true
            actions:
            - action: '{{ cfg.snooze_action }}'
              title: Snooze
            - action: '{{ cfg.reset_action }}'
              title: Dismiss / Reset
        action: notify.mobile_app_pixel_9
      - data:
          entity_id: '{{ cfg.switch }}'
        action: switch.turn_off
      - data:
          entity_id: '{{ cfg.charging }}'
        action: input_boolean.turn_off
      - data:
          entity_id: '{{ cfg.charged }}'
        action: input_boolean.turn_on
      - delay: 03:00:00
      - condition: template
        value_template: '{{ is_state(cfg.switch, ''on'') }}'
      - data:
          entity_id: '{{ cfg.switch }}'
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: reset
      sequence:
      - data:
          entity_id: '{{ cfg.snooze }}'
        action: counter.reset
      - data:
          entity_id: '{{ cfg.charging }}'
        action: input_boolean.turn_on
      - data:
          title: Ego Battery Charge Update ({{ cfg.tag }})
          message: 'Your Ego battery on {{ cfg.tag }} has begun charging. You''ll
            be notified once it is ✅ Fully Charged.

            '
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: startup
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''sensor.ego_battery_monitor_power_1'')|float
              > 20 }}'
          sequence:
          - data:
              entity_id: input_boolean.ego_battery_charging_active_1
            action: input_boolean.turn_on
        - conditions:
          - condition: template
            value_template: "{{ is_state('switch.ego_battery_charge_monitor_1', 'on')\n
              \  and states('sensor.ego_battery_monitor_power_1')|float < 5 }}\n"
          sequence:
          - data:
              entity_id: switch.ego_battery_charge_monitor_1
            action: switch.turn_off
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''sensor.ego_battery_monitor_power_2'')|float
              > 20 }}'
          sequence:
          - data:
              entity_id: input_boolean.ego_battery_charging_active_2
            action: input_boolean.turn_on
        - conditions:
          - condition: template
            value_template: "{{ is_state('switch.ego_battery_charge_monitor_2', 'on')\n
              \  and states('sensor.ego_battery_monitor_power_2')|float < 5 }}\n"
          sequence:
          - data:
              entity_id: switch.ego_battery_charge_monitor_2
            action: switch.turn_off
  mode: single
- id: '1759124281059'
  alias: Jarvis – Finish Cleanup (Notify + Reset)
  description: Clears room selections and sends notifications when Jarvis finishes.
  triggers:
  - id: docked
    trigger: state
    entity_id: vacuum.jarvis
    to: docked
    for:
      seconds: 5
  - id: idle
    trigger: state
    entity_id: vacuum.jarvis
    to: idle
    for:
      seconds: 5
  - id: completed
    trigger: state
    entity_id: sensor.jarvis_task_status
    to: completed
    for:
      seconds: 5
  - id: drying
    trigger: state
    entity_id: sensor.jarvis_state
    to: drying
    for:
      minutes: 1
  actions:
  - variables:
      from_state: '{{ trigger.from_state.state if trigger.from_state is not none else
        ''none'' }}'
      to_state: '{{ trigger.to_state.state if trigger.to_state is not none else ''none''
        }}'
      valid_transition: '{{ trigger.from_state is not none and trigger.from_state.state
        not in [''unknown'',''unavailable''] }}'
      v_state: '{{ states(''vacuum.jarvis'') }}'
      task_status: '{{ states(''sensor.jarvis_task_status'') }}'
      dryer: '{{ states(''sensor.jarvis_state'') }}'
      area: '{{ state_attr(''vacuum.jarvis'',''cleaned_area'') or '''' }}'
      time_min: '{{ state_attr(''vacuum.jarvis'',''cleaning_time'') or '''' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''drying'' and valid_transition }}'
      sequence:
      - variables:
          msg: Jarvis has completed cleaning and is now drying.
      - action: notify.mobile_app_pixel_9
        data:
          title: Jarvis update
          message: '{{ msg }}'
      - action: notify.mobile_app_galaxy_watch7_904t
        data:
          title: Jarvis update
          message: '{{ msg }}'
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'docked'\n   and valid_transition\n   and
          from_state in ['cleaning','returning','paused'] }}\n"
      sequence:
      - variables:
          msg: 'Jarvis has returned to the dock.{{ '' Cleaned '' ~ area ~ '' m² in
            '' ~ time_min ~ '' min.'' if area and time_min else '''' }}

            '
      - action: notify.mobile_app_pixel_9
        data:
          title: Jarvis update
          message: '{{ msg }}'
      - action: notify.mobile_app_galaxy_watch7_904t
        data:
          title: Jarvis update
          message: '{{ msg }}'
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'idle'\n   and valid_transition\n   and
          from_state in ['cleaning','returning','paused'] }}\n"
      sequence:
      - variables:
          msg: 'Jarvis is idle, cleaning cycle ended.{{ '' Cleaned '' ~ area ~ ''
            m² in '' ~ time_min ~ '' min.'' if area and time_min else '''' }}

            '
      - action: notify.mobile_app_pixel_9
        data:
          title: Jarvis update
          message: '{{ msg }}'
      - action: notify.mobile_app_galaxy_watch7_904t
        data:
          title: Jarvis update
          message: '{{ msg }}'
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'completed'\n   and valid_transition\n   and
          from_state not in ['completed'] }}\n"
      sequence:
      - variables:
          msg: 'Jarvis has completed the cleaning cycle.{{ '' Cleaned '' ~ area ~
            '' m² in '' ~ time_min ~ '' min.'' if area and time_min else '''' }}

            '
      - action: notify.mobile_app_pixel_9
        data:
          title: Jarvis update
          message: '{{ msg }}'
      - action: notify.mobile_app_galaxy_watch7_904t
        data:
          title: Jarvis update
          message: '{{ msg }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id in ['docked','idle','completed','drying']\n
          \  and valid_transition\n   and from_state in ['cleaning','returning','paused']
          }}\n"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.clean_bathroom
          - input_boolean.clean_bedroom
          - input_boolean.clean_living_room
          - input_boolean.clean_kitchen
          - input_boolean.clean_laundry_room
          - input_boolean.clean_office
          - input_boolean.clean_dining_room
          - input_boolean.clean_sunroom
          - input_boolean.clean_foyer
          - input_boolean.clean_bath_2
          - input_boolean.clean_custom_1
          - input_boolean.clean_custom_2
  mode: restart
- id: '1759297625936'
  alias: System - Deprecation Warning Alert
