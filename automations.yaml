  description: ''
  triggers:
  - trigger: event
    event_type: state_changed
  conditions:
  - condition: time
    after: 08:00:00
    before: '22:00:00'
  - condition: template
    value_template: "{{ trigger.event.data.new_state is not none\n   and trigger.event.data.new_state.state
      == 'unavailable' }}\n"
