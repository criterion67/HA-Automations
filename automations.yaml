- id: '1757355570578'
  alias: HVAC UV Bulb Monitor
  description: Alerts when the HVAC UV purifier has drawn under 5W for a full 24 hours,
    which indicates a failed bulb or ballast. Uses a level-based daily check against
    a 24h max Statistics helper instead of an edge-based numeric_state trigger, because
    the original edge trigger fired once on 2026-06-20 and could never re-arm after
    the power stayed at 0W. Snooze defers 24h via an input_datetime stamp; Dismiss
    suppresses alerts until the purifier draws power again. Both are restart-safe.
  triggers:
  - at: 09:00:00
    id: daily_check
    note: 'Level-based daily poll. Deliberately not a numeric_state trigger: an edge
      trigger cannot re-fire once the sensor is already below threshold.'
    trigger: time
  - above: 5
    entity_id: sensor.hvac_uv_purifier_power
    id: power_restored
    note: Bulb replaced or power restored. Clears both the dismiss flag and any active
      snooze.
    trigger: numeric_state
  - event_data:
      action: UV_SNOOZE_24H
    event_type: mobile_app_notification_action
    id: snooze
    trigger: event
  - event_data:
      action: UV_DISMISS
    event_type: mobile_app_notification_action
    id: dismiss
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: daily_check
      - below: 5
        condition: numeric_state
        entity_id: sensor.hvac_uv_purifier_power_24h_max
      - condition: state
        entity_id: input_boolean.hvac_uv_alert_dismissed
        state: 'off'
      - '{{ state_attr(''input_datetime.hvac_uv_alert_snooze_until'', ''timestamp'')
        is none or now().timestamp() > state_attr(''input_datetime.hvac_uv_alert_snooze_until'',
        ''timestamp'') }}'
      note: 'Fires only if all four gates pass: right trigger, sustained low draw,
        not dismissed, not snoozed.'
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            actions:
            - action: UV_SNOOZE_24H
              title: Snooze 24h
            - action: UV_DISMISS
              title: Dismiss
            channel: HVAC Alerts
            sticky: true
            tag: hvac_uv_bulb_low_power
          message: UV purifier peak draw over the last 24h was {{ states('sensor.hvac_uv_purifier_power_24h_max')
            }} W, below the 5 W threshold. The bulb may have failed.
          title: ⚠️ HVAC UV Bulb Alert
    - conditions:
      - condition: trigger
        id: power_restored
      note: Resets suppression state so the next genuine failure alerts normally.
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_uv_alert_dismissed
      - action: input_datetime.set_datetime
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        target:
          entity_id: input_datetime.hvac_uv_alert_snooze_until
    - conditions:
      - condition: trigger
        id: snooze
      note: input_datetime survives restarts, unlike an inline delay.
      sequence:
      - action: input_datetime.set_datetime
        data:
          datetime: '{{ (now() + timedelta(hours=24)).strftime(''%Y-%m-%d %H:%M:%S'')
            }}'
        target:
          entity_id: input_datetime.hvac_uv_alert_snooze_until
    - conditions:
      - condition: trigger
        id: dismiss
      note: Stays suppressed until the power_restored trigger clears it.
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_uv_alert_dismissed
    default: []
  max: 10
  mode: parallel
- id: '1757385105935'
  alias: Bedroom Fridge - Temp & Connectivity Alerts
  description: ''
  triggers:
