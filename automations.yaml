- id: '1751596353822'
  alias: Network Cabinet Fan Smart Control
  description: 'Controls the network cabinet fan based on temperature and office presence.
    Turns on at 85°F or higher, off 5 min after temp drops below 85°F. Disables fan
    while office is occupied. Honors override via input_boolean.network_cabinet_fan_automation_enabled.

    '
  triggers:
  - entity_id:
    - sensor.network_cabinet_temp_monitor_temperature
    above: 85
    id: temp_high
    trigger: numeric_state
  - entity_id:
    - sensor.network_cabinet_temp_monitor_temperature
    below: 85
    id: temp_low
    trigger: numeric_state
  - entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: presence_on
    trigger: state
  - entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    id: presence_off
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.network_cabinet_fan_automation_enabled
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: temp_high
      - condition: state
        entity_id: binary_sensor.office_presence_radar_target
        state: 'off'
      sequence:
      - target:
          entity_id: fan.network_cabinet_fan
        action: fan.turn_on
    - conditions:
      - condition: trigger
        id: temp_low
      - condition: state
        entity_id: binary_sensor.office_presence_radar_target
        state: 'off'
      sequence:
      - delay: 00:05:00
      - condition: numeric_state
        entity_id: sensor.network_cabinet_temp_monitor_temperature
        below: 85
      - target:
          entity_id: fan.network_cabinet_fan
        action: fan.turn_off
    - conditions:
      - condition: trigger
        id: presence_on
      sequence:
      - target:
          entity_id: fan.network_cabinet_fan
        action: fan.turn_off
    - conditions:
      - condition: trigger
        id: presence_off
      - condition: numeric_state
        entity_id: sensor.network_cabinet_temp_monitor_temperature
        above: 85
      sequence:
      - target:
          entity_id: fan.network_cabinet_fan
        action: fan.turn_on
  mode: restart
