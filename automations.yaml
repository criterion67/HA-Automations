            data:
              option: UniFi Blue
        default:
        - action: light.turn_on
          target:
            entity_id: light.network_cabinet_ws2811
          data:
            rgb_color:
            - 0
            - 102
            - 255
            brightness_pct: 100
    - conditions:
      - condition: trigger
        id: cleared
      - condition: state
        entity_id: binary_sensor.8_8_8_8
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.network_cabinet_ws2811
  mode: single
