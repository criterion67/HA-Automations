        id: garbage_can
      sequence:
      - action: media_player.play_media
        data:
          media:
            media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+garbage+can+has+been+set+on+the+street+for+pickup&language=en-US&voice=JennyNeural
            media_content_type: provider
            metadata:
              children_media_class:
              media_class: app
              navigateIds:
              - {}
              - media_content_id: media-source://tts
                media_content_type: app
              - media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+garbage+can+has+been+set+on+the+street+for+pickup&language=en-US&voice=JennyNeural
                media_content_type: provider
              thumbnail: https://brands.home-assistant.io/_/tts/logo.png
              title: The garbage can has been set on the street for pickup
        target:
          entity_id: media_player.bedroom_speaker
  max: 10
  mode: parallel
- id: '1787269725649'
  alias: Kitchen Fridge Alerts (Consolidated)
  description: 'Single handler for all kitchen refrigerator and freezer alerting,
    replacing three automations: Temperature and Sensor, Low Battery, and No Power
    Draw. Every trigger has a unique id and its own choose branch, so no branch can
    be shadowed by the first-match behavior of choose.


    Mode is parallel with max 10, inherited from the Temperature and Sensor automation,
    which was already parallel. The Low Battery and No Power Draw automations were
    mode single. Parallel is the correct choice for the merged version because these
    are independent notification paths that must not block one another: a battery
    alert should never be dropped because a temperature alert is mid-flight. Since
    every branch only sends a push notification and holds no state, there is no re-entrancy
    risk in running several at once.


    Thresholds are carried over unchanged and are based on 7 day historical data plus
    FDA food safety guidance.

    Fridge (sensor.temp_sensor_main_fridge): normal 35 to 39F. Early warning above
    43F for 10 min. Ceiling alert above 45F for 20 min. Runaway cold below 33F for
    20 min.

    Freezer (sensor.inkbird_kitchen_freezer_temperature): 0F target. Early warning
    above 10F for 10 min. Ceiling alert above 15F for 20 min. Runaway cold below -10F
    for 20 min.

    Sensor offline: unavailable or unknown for 30 min on either sensor indicates battery
    failure or a Zigbee drop, which leaves temperature monitoring blind.

    Batteries (sensor.battery_sensor_main_fridge, sensor.inkbird_temperature_sensor_battery):
    below 10 percent. The low threshold is intentional because these small batteries
    fall off quickly once past 20 percent.

    Power (sensor.kitchen_fridge): below 1W for 10 min. A fridge idles at 2.5 to 8W
    between compressor cycles and spikes to 75 to 330W during a run, so it never reads
    0W in normal operation. Sustained zero means an unplugged cord, a tripped GFCI
    or breaker, a failed smart plug, or a fridge power fault. This stays a distinct
    branch because a power loss may not trigger a temperature alert for some time
    if the box was recently cooled.


    All branches send a high priority push to notify.mobile_app_pixel_9 with the current
    reading included.'
  triggers:
  - above: 45
    entity_id: sensor.temp_sensor_main_fridge
    for:
      minutes: 20
    id: fridge_high
    trigger: numeric_state
  - above: 15
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    for:
      minutes: 20
    id: freezer_high
    trigger: numeric_state
  - above: 43
    entity_id: sensor.temp_sensor_main_fridge
    for:
      minutes: 10
    id: fridge_rising
    trigger: numeric_state
  - above: 10
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    for:
      minutes: 10
    id: freezer_rising
    trigger: numeric_state
  - below: 33
    entity_id: sensor.temp_sensor_main_fridge
    for:
      minutes: 20
    id: fridge_low
    trigger: numeric_state
  - below: -10
    entity_id: sensor.inkbird_kitchen_freezer_temperature
    for:
      minutes: 20
    id: freezer_low
    trigger: numeric_state
  - entity_id: sensor.temp_sensor_main_fridge
    for:
      minutes: 30
    id: fridge_unavail
    to: unavailable
    trigger: state
  - entity_id: sensor.temp_sensor_main_fridge
    for:
      minutes: 30
    id: fridge_unknown
    to: unknown
    trigger: state
  - entity_id: sensor.inkbird_kitchen_freezer_temperature
    for:
      minutes: 30
    id: freezer_unavail
    to: unavailable
    trigger: state
  - entity_id: sensor.inkbird_kitchen_freezer_temperature
    for:
      minutes: 30
    id: freezer_unknown
    to: unknown
    trigger: state
  - below: 10
    entity_id: sensor.battery_sensor_main_fridge
    id: fridge_batt
    trigger: numeric_state
  - below: 10
    entity_id: sensor.inkbird_temperature_sensor_battery
    id: freezer_batt
    trigger: numeric_state
  - below: 1
    entity_id: sensor.kitchen_fridge
    for:
      minutes: 10
    id: no_power
    trigger: numeric_state
  actions:
  - choose:
    - alias: Fridge above 45F for 20 min
      conditions:
      - condition: trigger
        id: fridge_high
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Refrigerator has been above 45°F for 20 minutes. Current: {{ states(''sensor.temp_sensor_main_fridge'')
            | round(1) }}°F. Check the door or compressor.'
          title: "\U0001F321️ Fridge Too Warm"
    - alias: Freezer above 15F for 20 min
      conditions:
      - condition: trigger
        id: freezer_high
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Freezer has been above 15°F for 20 minutes. Current: {{ states(''sensor.inkbird_kitchen_freezer_temperature'')
            | round(1) }}°F. Check the door or compressor.'
          title: "\U0001F321️ Freezer Too Warm"
    - alias: Fridge above 43F for 10 min
      conditions:
      - condition: trigger
        id: fridge_rising
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Refrigerator has been above 43°F for 10 minutes and still rising.
            Current: {{ states(''sensor.temp_sensor_main_fridge'') | round(1) }}°F.'
          title: ⚠️ Fridge Temp Climbing
    - alias: Freezer above 10F for 10 min
      conditions:
      - condition: trigger
        id: freezer_rising
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Freezer has been above 10°F for 10 minutes and still rising. Current:
            {{ states(''sensor.inkbird_kitchen_freezer_temperature'') | round(1) }}°F.'
          title: ⚠️ Freezer Temp Climbing
    - alias: Fridge below 33F for 20 min
      conditions:
      - condition: trigger
        id: fridge_low
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Refrigerator has been below 33°F for 20 minutes. Current: {{ states(''sensor.temp_sensor_main_fridge'')
            | round(1) }}°F. Risk of food freezing.'
          title: "\U0001F9CA Fridge Too Cold"
    - alias: Freezer below -10F for 20 min
      conditions:
      - condition: trigger
        id: freezer_low
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Freezer has been below -10°F for 20 minutes. Current: {{ states(''sensor.inkbird_kitchen_freezer_temperature'')
            | round(1) }}°F. Check thermostat.'
          title: "\U0001F9CA Freezer Runaway Cold"
    - alias: Fridge temp sensor offline 30 min
      conditions:
      - condition: trigger
        id:
        - fridge_unavail
        - fridge_unknown
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: Fridge temperature sensor has been unavailable for 30 minutes.
            Check battery or Zigbee connection.
          title: "\U0001F4F5 Fridge Sensor Offline"
    - alias: Freezer temp sensor offline 30 min
      conditions:
      - condition: trigger
        id:
        - freezer_unavail
        - freezer_unknown
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: Freezer temperature sensor has been unavailable for 30 minutes.
            Check battery or Zigbee connection.
          title: "\U0001F4F5 Freezer Sensor Offline"
    - alias: Fridge sensor battery below 10 percent
      conditions:
      - condition: trigger
        id: fridge_batt
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: Main fridge temperature sensor battery is at {{ states('sensor.battery_sensor_main_fridge')
            }}%. Replace soon to avoid sensor loss.
          title: "\U0001F50B Fridge Sensor Battery Low"
    - alias: Freezer sensor battery below 10 percent
      conditions:
      - condition: trigger
        id: freezer_batt
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: Freezer temperature sensor battery is at {{ states('sensor.inkbird_temperature_sensor_battery')
            }}%. Replace soon to avoid sensor loss.
          title: "\U0001F50B Freezer Sensor Battery Low"
    - alias: Fridge drawing no power for 10 min
      conditions:
      - condition: trigger
        id: no_power
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            priority: high
            ttl: 0
          message: 'Kitchen fridge energy monitor has shown 0W for over 10 minutes.
            The fridge may be unplugged, a GFCI or breaker may have tripped, or the
            smart plug may have failed. Current: {{ states(''sensor.kitchen_fridge'')
            }}W'
          title: ⚡ Fridge No Power Detected
  max: 10
  mode: parallel
- id: '1787269760086'
  alias: Water Leak Alert - Notification Action Handler
  description: 'Handles the Snooze and Dismiss buttons on the water leak notification
    sent by automation.water_leak_alert_1_triggered_response. Replaces the two separate
    handler automations, Water Leak Alert 2 - Snooze Handler and Water Leak Alert
    3 - Dismiss Handler.


    SNOOZE_LEAK turns input_boolean.leak_alert_snoozed on. DISMISS_LEAK turns it off.
    Behavior is carried over exactly unchanged from the two originals.


    Mode is parallel with max 10 so a button press is always handled immediately even
    while another press is in flight. Both originals were mode single; since each
    branch is a single instant boolean write with no waiting, parallel cannot cause
    a race.


    WHY THE ALERTING AUTOMATION IS NOT MERGED IN HERE: automation.water_leak_alert_1_triggered_response
    is mode restart and runs a long repeat loop that sounds the siren and re-notifies
    every 5 minutes. Merging these event triggers into it would mean that pressing
    Snooze or Dismiss restarts the automation and kills the running alert loop outright,
    silently changing what those buttons do. Merging the other direction, under mode
    parallel, would let a second leak sensor start a second concurrent siren loop
    instead of restarting the first. Neither is acceptable for a leak alarm, so the
    alerting automation stays standalone with its own mode restart.


    KNOWN DEFECT IN THE ALERTING AUTOMATION, NOT CHANGED HERE: its repeat while condition
    is or(any sensor on, leak_alert_snoozed on). Because leak_alert_snoozed is ORed
    in rather than negated and ANDed, pressing Snooze does not suppress anything;
    it makes the loop continue even after every leak sensor has cleared, until Dismiss
    is pressed. The intended logic is almost certainly and(any sensor on, not snoozed).
    Flagged to Scott 2026-08-20, left untouched pending his decision.'
  triggers:
  - event_data:
      action: SNOOZE_LEAK
    event_type: mobile_app_notification_action
    id: snooze
    trigger: event
  - event_data:
      action: DISMISS_LEAK
    event_type: mobile_app_notification_action
    id: dismiss
    trigger: event
  actions:
  - choose:
    - alias: Snooze pressed sets the snooze flag on
      conditions:
      - condition: trigger
        id: snooze
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.leak_alert_snoozed
    - alias: Dismiss pressed clears the snooze flag
      conditions:
      - condition: trigger
        id: dismiss
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.leak_alert_snoozed
  max: 10
  mode: parallel
- id: '1787271796385'
  alias: Dashboard - Reset Dismissed Flags (Consolidated)
  description: 'Clears the manual dismiss flags behind the conditional dashboard cards,
    so each alert card can appear again the next time its condition returns. Replaces
    six separate automations, one per flag.


    Each trigger has a unique id and its own choose branch, so no branch can be shadowed
    by the first-match behavior of choose.


    Mode is parallel with max 10. All six originals were mode single, but they were
    independent automations, so one firing never blocked another. Parallel preserves
    that independence. Every branch is a single instant input_boolean.turn_off with
    no delay or wait, so concurrent runs cannot race.


    Mappings, all carried over unchanged:

    - lawn_mower.david_mowie leaving state error clears input_boolean.mower_stuck_dismissed

    - binary_sensor.rear_yard_gate to off clears input_boolean.gate_open_dismissed

    - cover.garage_door to closed clears input_boolean.garage_door_open_dismissed

    - sensor.dog_bowl_water_level to Full clears input_boolean.dog_bowl_empty_dismissed

    - binary_sensor.dog_door to on clears input_boolean.dog_door_closed_dismissed

    - sensor.nws_alerts_alerts any state change, gated on the count not being 0, clears
    input_boolean.nws_alert_dismissed


    The NWS branch keeps its extra condition because unlike the other five it triggers
    on any state change of the sensor rather than on one specific target state, so
    it needs the not-zero guard to avoid clearing the flag when alerts drop to none.


    Note on the mower trigger: it fires on leaving error with no to state specified,
    which is how the original behaved, so it also fires on a transition from error
    to unavailable.'
  triggers:
  - entity_id: lawn_mower.david_mowie
    from: error
    id: mower
    trigger: state
  - entity_id: binary_sensor.rear_yard_gate
    id: gate
    to: 'off'
    trigger: state
  - entity_id: cover.garage_door
    id: garage
    to: closed
    trigger: state
  - entity_id: sensor.dog_bowl_water_level
    id: dog_bowl
    to: Full
    trigger: state
  - entity_id: binary_sensor.dog_door
    id: dog_door
    to: 'on'
    trigger: state
  - entity_id: sensor.nws_alerts_alerts
    id: nws
    trigger: state
  actions:
  - choose:
    - alias: Mower left error state
      conditions:
      - condition: trigger
        id: mower
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mower_stuck_dismissed
    - alias: Rear yard gate closed
      conditions:
      - condition: trigger
        id: gate
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gate_open_dismissed
    - alias: Garage door closed
      conditions:
      - condition: trigger
        id: garage
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garage_door_open_dismissed
    - alias: Dog bowl refilled to Full
      conditions:
      - condition: trigger
        id: dog_bowl
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dog_bowl_empty_dismissed
    - alias: Dog door opened
      conditions:
      - condition: trigger
        id: dog_door
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dog_door_closed_dismissed
    - alias: NWS alert count is non-zero
      conditions:
      - condition: trigger
        id: nws
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.nws_alerts_alerts
          state: '0'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.nws_alert_dismissed
  max: 10
  mode: parallel
- id: '1787272767509'
  alias: Petkit - Feeder Notifications (Consolidated)
  description: 'All notification and monitoring for Gracie''s Fresh Element Solo feeder,
    replacing three automations: Feeder Notifications, Notify if Feed Not Dispensed,
    and Notify on Battery Issue. Every trigger has a unique id and its own choose
    branch, so no branch can be shadowed by the first-match behavior of choose.


    DELIBERATELY NOT MERGED: automation.petkit_feeding_schedule, which is the automation
    that ACTUALLY DISPENSES FOOD (text.set_value on text.fresh_element_solo_manual_feed
    at 07:00, 12:00 and 18:00, 30g / 20g / 30g, plus the 9000 Hz call tone). It stays
    separate on purpose. Folding the feeder''s own watchdog into the same automation
    as the actuator it watches would mean a fault in the notification path could take
    out feeding, and the two sets of time triggers sit only 5 minutes apart, which
    is harder to reason about when debugging a missed meal.


    Mode is parallel with max 10. The originals were parallel max 3, parallel max
    2 and single respectively, but they were independent automations so none could
    block another; parallel preserves that. Every branch is a single notification
    with no delay or wait, so concurrent runs cannot race.


    The three feed watchdogs keep their original condition, that binary_sensor.fresh_element_solo_feeding
    has stayed off for 5 minutes. In the original that was one shared top-level condition;
    here it is repeated per branch so that the battery and feeder-event branches are
    not gated by it, which matches how the three separate automations actually behaved.


    Battery semantics carried over unchanged: sensor.fresh_element_solo_battery_level
    reading ''Not in use'' means the feeder is on USB power, and any other value means
    it is running on batteries.'
  triggers:
  - entity_id: binary_sensor.fresh_element_solo_feeding
    from: 'on'
    id: feeding_complete
    to: 'off'
    trigger: state
  - entity_id: binary_sensor.fresh_element_solo_food_level
    from: 'off'
    id: food_low
    to: 'on'
    trigger: state
  - at: 07:05:00
    id: morning_check
    trigger: time
  - at: '12:05:00'
    id: midday_check
    trigger: time
  - at: '18:05:00'
    id: evening_check
    trigger: time
  - entity_id: sensor.fresh_element_solo_battery_level
    from: Not in use
    id: running_on_battery
    trigger: state
  - entity_id: binary_sensor.fresh_element_solo_battery_installed
    id: battery_removed
    to: 'off'
    trigger: state
  - entity_id: sensor.fresh_element_solo_battery_level
    id: usb_restored
    to: Not in use
    trigger: state
  actions:
  - choose:
    - alias: Feeding completed
      conditions:
      - condition: trigger
        id: feeding_complete
      sequence:
      - action: notify.send_message
        data:
          message: 'Fresh Element Solo just dispensed food. Today: {{ states(''sensor.fresh_element_solo_total_dispensed'')
            }}g total, {{ states(''sensor.fresh_element_solo_times_dispensed'') }}
            feeding(s).'
          title: "\U0001F43E Gracie's Feeder Dispensed"
        target:
          entity_id: notify.scott_s_phone
    - alias: Food bin running low
      conditions:
      - condition: trigger
        id: food_low
      sequence:
      - action: notify.send_message
        data:
          message: The food bin on the Fresh Element Solo is running low. Time to
            refill!
          title: "\U0001F43E Gracie's Feeder — Low Food"
        target:
          entity_id: notify.scott_s_phone
    - alias: Morning feed watchdog at 07:05
      conditions:
      - condition: trigger
        id: morning_check
      - condition: state
        entity_id: binary_sensor.fresh_element_solo_feeding
        for:
          minutes: 5
        state: 'off'
      sequence:
      - action: notify.send_message
        data:
          message: The 7:00 AM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Morning Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: Midday feed watchdog at 12:05
      conditions:
      - condition: trigger
        id: midday_check
      - condition: state
        entity_id: binary_sensor.fresh_element_solo_feeding
        for:
          minutes: 5
        state: 'off'
      sequence:
      - action: notify.send_message
        data:
          message: The 12:00 PM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Midday Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: Evening feed watchdog at 18:05
      conditions:
      - condition: trigger
        id: evening_check
      - condition: state
        entity_id: binary_sensor.fresh_element_solo_feeding
        for:
          minutes: 5
        state: 'off'
      sequence:
      - action: notify.send_message
        data:
          message: The 6:00 PM feeding does not appear to have dispensed. Check the
            feeder.
          title: ⚠️ Gracie's Feeder — Evening Feed Missed
        target:
          entity_id: notify.scott_s_phone
    - alias: USB power lost, now on battery backup
      conditions:
      - condition: trigger
        id: running_on_battery
      sequence:
      - action: notify.send_message
        data:
          message: 'The Fresh Element Solo has lost USB power and is now running on
            battery backup. Current battery level: {{ states(''sensor.fresh_element_solo_battery_level'')
            }}'
          title: ⚠️ Gracie's Feeder — USB Power Lost
        target:
          entity_id: notify.scott_s_phone
    - alias: Backup batteries removed
      conditions:
      - condition: trigger
        id: battery_removed
      sequence:
      - action: notify.send_message
        data:
          message: The backup batteries have been removed from the Fresh Element Solo.
            The feeder has no backup power if USB is disconnected.
          title: ⚠️ Gracie's Feeder — Battery Removed
        target:
          entity_id: notify.scott_s_phone
    - alias: USB power restored
      conditions:
      - condition: trigger
        id: usb_restored
      sequence:
      - action: notify.send_message
        data:
          message: The Fresh Element Solo is back on USB power. Battery backup is
            standby.
          title: ✅ Gracie's Feeder — USB Power Restored
        target:
          entity_id: notify.scott_s_phone
  max: 10
  mode: parallel
