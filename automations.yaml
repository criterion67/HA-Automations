    - condition: time
      after: 06:30:00
      before: '10:30:00'
    - condition: time
      after: '18:30:00'
      before: '19:30:00'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.bp_reminder_dismissed
  mode: single
