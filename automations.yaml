- id: '1776378808727'
  alias: Power Outage - EFR3P-2 Network & HA Shutdown
  description: When EFR3P-2 battery drops to 20% while AC is offline, sets outage
    flag, sends mobile alert, then gracefully shuts down UNAS Pro, UDM Pro Max, and
    the HA host (Wyse 5070). HA will auto-restart when grid power is restored.
  triggers:
  - platform: numeric_state
    entity_id: sensor.ef_r34398_battery_level
