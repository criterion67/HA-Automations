      - alias: Pause living room TV if currently playing
        if:
        - condition: state
          entity_id: media_player.living_room_tv
          state: playing
        then:
        - action: media_player.media_pause
          target:
            entity_id: media_player.living_room_tv
          data: {}
      - alias: Display camera for 1 minute
        delay: 00:01:00
      - alias: Stop doorbell camera stream on Living Room TV
        action: media_player.media_stop
        target:
          entity_id: media_player.onn_streaming_device_4k_pro
        data: {}
      - alias: Resume previous Living Room TV playback
        action: media_player.media_play
        target:
          entity_id: media_player.living_room_tv
        data: {}
  mode: single
- id: '1755733082034'
  alias: 'Ecovacs Mower: Battery Charge Alert'
  description: Notify when mower recharges to 80%+ after being used (battery < 50%)
    and when battery drops to 17%. This automation triggers notifications and audio
    alerts  to inform you of both low battery (17%) and successful charging (80%)
    events.
  triggers:
  - entity_id: sensor.david_mowie_battery
    below: 50
    id: battery_low
    platform: numeric_state
  - entity_id: sensor.david_mowie_battery
    above: 79
    id: battery_high
    platform: numeric_state
  - entity_id:
    - sensor.david_mowie_battery
    below: 20
    id: battery_recharge
    platform: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: battery_low
      sequence:
      - target:
          entity_id: input_boolean.mower_80_notified
        action: input_boolean.turn_off
        data: {}
      - target:
          entity_id:
          - input_boolean.mower_battery_recharge_notified
        action: input_boolean.turn_off
        data: {}
    - conditions:
