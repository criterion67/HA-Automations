- id: plant_watering_pct_crossing_specific
  alias: Plant Watering Reminder by Moisture Percentage
  description: Notify when a plant drops below its moisture threshold, with Watered
    action and specific plant name. 24-hour cooldown to prevent duplicate notifications.
  triggers:
  - entity_id: sensor.soil_sensor_1_soil_moisture
    below: 25
    platform: numeric_state
    for:
      minutes: 5
  - entity_id: sensor.soil_sensor_2_soil_moisture
    below: 28
    platform: numeric_state
    for:
      minutes: 5
  - entity_id: sensor.soil_sensor_3_soil_moisture
    below: 10
    platform: numeric_state
    for:
      minutes: 5
  - event_type: mobile_app_notification_action
    platform: event
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''event'' and trigger.event.data.action
          == ''PLANT_WATERED'' }}'
      sequence:
      - data:
          message: clear_notification
          data:
            tag: plant_watering
        action: notify.mobile_app_pixel_9
      - data:
          name: Plants
          message: Watered acknowledged
          entity_id: sensor.soil_sensor_1_soil_moisture
        action: logbook.log
      - delay:
          hours: 24
    - conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''numeric_state'' }}'
      sequence:
      - variables:
          trigger_name: "{% set trig = trigger.entity_id %}\n{% set match = plants
            | selectattr('entity_id','eq', trig) | list | first %}\n{% if match is
            defined and match is not none %}\n  {{ match.name }}\n{% else %}\n  {{
            state_attr(trig, 'friendly_name') or trig }}\n{% endif %}"
          trigger_value: '{{ states(trigger.entity_id) | float(0) | round(0) }}'
          trigger_threshold: "{% set trig = trigger.entity_id %}\n{% set match = plants
            | selectattr('entity_id','eq', trig) | list | first %}\n{% if match is
            defined and match is not none %}\n  {{ match.threshold }}\n{% else %}\n
            \ 0\n{% endif %}"
          low_list: "{% set ns = namespace(text='') %}\n{% for p in plants %}\n  {%
            set val = states(p.entity_id) | float(999) %}\n  {% if val < p.threshold
            and p.entity_id != trigger.entity_id %}\n    {% set ns.text = ns.text
            + p.name ~ ' (' ~ (val | round(0)) ~ '% < ' ~ p.threshold ~ '%), ' %}\n
            \ {% endif %}\n{% endfor %}\n{{ ns.text[:-2] if ns.text != '' else ''
            }}"
      - data:
          title: '{{ trigger_name }} needs water'
          message: '{% if low_list != '''' %}

            {{ trigger_name }} is at {{ trigger_value }}% which is below its {{ trigger_threshold
            }}% threshold. Other plants also low: {{ low_list }}.

            {% else %}

            {{ trigger_name }} is at {{ trigger_value }}% which is below its {{ trigger_threshold
            }}% threshold.

            {% endif %}'
          data:
            tag: plant_watering
            ttl: 0
            priority: high
            action:
            - action: PLANT_WATERED
              title: Watered
        action: notify.mobile_app_pixel_9
      - delay:
          hours: 24
  mode: single
  max_exceeded: silent
  variables:
    plants:
    - name: Spider Plant
      entity_id: sensor.soil_sensor_1_soil_moisture
      threshold: 25
    - name: Red Aglaonema
      entity_id: sensor.soil_sensor_2_soil_moisture
      threshold: 28
    - name: Snake Plant
      entity_id: sensor.soil_sensor_3_soil_moisture
      threshold: 10
- id: '1764799107505'
  alias: David Mowie Smart Mowing Automation v2
  description: Smart mowing cycle with dock, recharge, and conditional resume
  triggers:
  - entity_id: input_boolean.david_mowie_start_mowing
    to: 'on'
    id: start
    platform: state
  - event_type: mobile_app_notification_action
    event_data:
      action: RESUME_MOWIE
    id: resume_action
    platform: event
  - entity_id: binary_sensor.garage_door_contact
    to: open
    id: door_opened
    platform: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - condition: numeric_state
        entity_id: sensor.david_mowie_battery
        above: 15
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door_contact
          state: 'off'
        then:
        - action: cover.open_cover
          target:
            entity_id: cover.garage_door
      - delay:
          seconds: 5
      - action: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.david_mowie
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.david_mowie_mowing
      - action: notify.mobile_app_pixel_9
        data:
          title: Mowie Started
          message: Mowie has started mowing. Garage door opened.
      - wait_for_trigger:
        - entity_id: sensor.david_mowie_battery
          below: 15
          trigger: numeric_state
        timeout: 03:00:00
        continue_on_timeout: false
      - action: lawn_mower.dock
        target:
          entity_id: lawn_mower.david_mowie
      - wait_for_trigger:
        - entity_id: lawn_mower.david_mowie
          to: docked
          trigger: state
        timeout: 00:30:00
        continue_on_timeout: false
      - delay:
          seconds: 10
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door_contact
          state: 'on'
        then:
        - action: cover.close_cover
          target:
            entity_id: cover.garage_door
      - wait_for_trigger:
        - entity_id: sensor.david_mowie_battery
          above: 85
          trigger: numeric_state
        timeout: 08:00:00
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.garage_door_contact
          state: 'off'
        then:
        - action: lawn_mower.pause
          target:
            entity_id: lawn_mower.david_mowie
        - action: notify.mobile_app_pixel_9
          data:
            title: Mowie Fully Charged
            message: Garage door is closed. Resume mowing
            data:
              actions:
              - action: RESUME_MOWIE
                title: Resume Mowing
              - action: KEEP_PAUSED
                title: Keep Paused
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.david_mowie_mowing
      - action: notify.mobile_app_pixel_9
        data:
          title: Mowie Docked
          message: Mowie has returned to charge.
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.david_mowie_start_mowing
    - conditions:
      - condition: trigger
        id: resume_action
      sequence:
      - action: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.david_mowie
      - action: notify.mobile_app_pixel_9
        data:
          title: Resuming Mowing
          message: Resuming mowing per your request.
    - conditions:
      - condition: trigger
        id: door_opened
      - condition: numeric_state
        entity_id: sensor.david_mowie_battery
        above: 85
      - condition: state
        entity_id: input_boolean.david_mowie_mowing
        state: 'off'
      sequence:
      - action: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.david_mowie
      - action: notify.mobile_app_pixel_9
        data:
          title: Garage Door Opened
          message: Garage door opened, resuming mowing.
  mode: single
- id: '1764972742421'
  alias: Master Garage Climate Control
  description: 'Central controller for garage heat and cool based on button, temperature,
    and freeze protection.

    '
  triggers:
  - device_id: 0692e92c3a10fc27e64992758dbd5f9f
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
    id: button
    platform: device
  - entity_id:
    - sensor.temp_sensor_garage
    - sensor.temp_sensor_rudys_crate
    above: 89
    for:
      minutes: 5
    id: high_temp_cool
    platform: numeric_state
  - entity_id: climate.garage_ac
    attribute: current_temperature
    below: 72.1
    id: dry_to_cool
    platform: numeric_state
  - entity_id: sensor.temp_sensor_garage
    below: 42
    for:
      minutes: 5
    id: freeze_protect
    platform: numeric_state
  conditions: []
  actions:
  - variables:
      mode_boolean: '{{ states(''input_boolean.garage_heat_cool_mode'') }}'
      vacation: '{{ states(''input_boolean.vacation'') }}'
      bill_home: '{{ is_state(''person.bill_funk'', ''home'') }}'
  - choose:
    - conditions:
      - condition: trigger
        id: button
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ mode_boolean == ''on'' }}'
          sequence:
          - target:
              entity_id: input_boolean.garage_heat_cool_mode
            action: input_boolean.turn_off
          - target:
              entity_id: climate.garage_ac
            action: climate.turn_off
          - delay:
              seconds: 5
          - target:
              entity_id: media_player.dining_room_speaker
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Garage+heat+mode+activated&language=en-US&voice=AndrewNeural
                media_content_type: provider
                metadata: {}
            action: media_player.play_media
        - conditions:
          - condition: template
            value_template: '{{ mode_boolean == ''off'' }}'
          sequence:
          - target:
              entity_id: input_boolean.garage_heat_cool_mode
            action: input_boolean.turn_on
          - target:
              entity_id: climate.garage_ac
            data:
              temperature: 80
              hvac_mode: dry
            action: climate.set_temperature
          - delay:
              seconds: 5
          - target:
              entity_id: media_player.dining_room_speaker
            data:
              media:
                media_content_id: media-source://tts/tts.home_assistant_cloud?message=Garage+A+C+mode+activated&language=en-US&voice=AndrewNeural
                media_content_type: provider
                metadata: {}
            action: media_player.play_media
    - conditions:
      - condition: trigger
        id: high_temp_cool
      sequence:
      - condition: template
        value_template: "{{ mode_boolean == 'off' and vacation == 'off' and bill_home
          and\n   is_state('climate.garage_ac', 'off') and\n   is_state('cover.garage_door',
          'closed') and\n   is_state('binary_sensor.rear_door', 'off') }}\n"
      - target:
          entity_id: climate.garage_ac
        data:
          temperature: 80
          hvac_mode: dry
        action: climate.set_temperature
      - data:
          title: Garage AC
          message: Garage AC has been activated due to high temperature.
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: dry_to_cool
      sequence:
      - condition: template
        value_template: "{{ mode_boolean == 'off' and vacation == 'off' and\n   is_state_attr('climate.garage_ac',
          'hvac_mode', 'dry') }}\n"
      - target:
          entity_id: climate.garage_ac
        data:
          temperature: 80
          hvac_mode: cool
        action: climate.set_temperature
      - data:
          title: Garage AC
          message: Garage AC has switched from dry to cool.
        action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: freeze_protect
      sequence:
      - condition: template
        value_template: '{{ mode_boolean == ''on'' and vacation == ''off'' and bill_home
          }}'
      - target:
          entity_id: climate.garage_heater
        data:
          temperature: 44
        action: climate.set_temperature
      - target:
          entity_id: climate.garage_ac
        action: climate.turn_off
      - data:
          title: Garage Heater
          message: Temperature below 42. Heat target set for freeze protection.
        action: notify.mobile_app_pixel_9
  mode: single
- id: '1764972777413'
  alias: 'Master: Garage Climate Doors'
  description: 'Turns off heater or AC when doors open, resumes automatically when
    closed, and sends actionable notifications to stop climate.

    '
  triggers:
  - entity_id: cover.garage_door
    to: open
    for: 00:02:00
    id: door_open
    platform: state
  - entity_id: binary_sensor.rear_door
    to: 'on'
    for: 00:02:00
    id: door_open
    platform: state
  - entity_id:
    - cover.garage_door
    - binary_sensor.rear_door
    to:
    - closed
    - 'off'
    id: doors_closed
    platform: state
  - event_type: mobile_app_notification_action
    event_data:
      action: GARAGE_DOOR_STOP_CLIMATE
    id: stop_climate
    platform: event
  conditions: []
  actions:
  - variables:
      mode_boolean: '{{ states(''input_boolean.garage_heat_cool_mode'') }}'
      vacation: '{{ states(''input_boolean.vacation'') }}'
  - choose:
    - conditions:
      - condition: trigger
        id: door_open
      sequence:
      - choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: climate.garage_ac
              state: cool
            - condition: state
              entity_id: climate.garage_ac
              state: dry
            - condition: state
              entity_id: switch.garage_heater
              state: 'on'
          sequence:
          - target:
              entity_id: input_datetime.garage_ac_last_off_time
            data:
              datetime: '{{ now().isoformat() }}'
            action: input_datetime.set_datetime
          - target:
              entity_id: climate.garage_ac
            action: climate.turn_off
          - target:
              entity_id: switch.garage_heater
            action: switch.turn_off
    - conditions:
      - condition: trigger
        id: doors_closed
      sequence:
      - condition: template
        value_template: "{{ states('input_datetime.garage_ac_last_off_time') not in
          ['unknown','unavailable','']\n   and (now().timestamp() - as_timestamp(states('input_datetime.garage_ac_last_off_time')))
          < 300 }}\n"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ vacation == ''off'' and mode_boolean == ''on'' }}'
          sequence:
          - target:
              entity_id: switch.garage_heater
            action: switch.turn_on
          - data:
              title: Garage Climate
              message: Heater has resumed. Tap to stop climate.
              data:
                actions:
                - action: GARAGE_DOOR_STOP_CLIMATE
                  title: Stop climate
            action: notify.mobile_app_pixel_9
        - conditions:
          - condition: template
            value_template: '{{ vacation == ''off'' and mode_boolean == ''off'' }}'
          sequence:
          - target:
              entity_id: climate.garage_ac
            data:
              hvac_mode: cool
              temperature: 80
            action: climate.set_temperature
          - data:
              title: Garage Climate
              message: AC has resumed. Tap to stop climate.
              data:
                actions:
                - action: GARAGE_DOOR_STOP_CLIMATE
                  title: Stop climate
            action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: stop_climate
      sequence:
      - target:
          entity_id: climate.garage_ac
        action: climate.turn_off
      - target:
          entity_id: switch.garage_heater
        action: switch.turn_off
      - data:
          title: Garage Climate
          message: Climate stopped by user request.
        action: notify.mobile_app_pixel_9
  mode: single
- id: '1764976415124'
  alias: Master Critical System Updates Notification
  triggers:
  - event_type: state_changed
    platform: event
  conditions:
  - condition: template
    value_template: '{% set ha_start = namespace(ts=0) %}{% for s in states if s.domain
      == ''homeassistant'' %}{% set ha_start.ts = as_timestamp(s.last_changed) %}{%
      endfor %}{{ ha_start.ts == 0 or (as_timestamp(now()) - ha_start.ts) > 30 }}'
  - condition: template
    value_template: '{{ trigger.event.data.entity_id.startswith(''update.'') }}

      '
  - condition: template
    value_template: '{% set new = trigger.event.data.new_state %} {{ new is not none
      and new.state in [''on'',''off''] }}

      '
  - condition: template
    value_template: "{% set critical = [\n  'update.home_assistant_operating_system_update',\n
      \ 'update.home_assistant_supervisor_update',\n  'update.home_assistant_core_update',\n
      \ 'update.esphome_update',\n  'update.matter_server_update',\n  'update.openthread_border_router_update',\n
      \ 'update.zigbee2mqtt_update',\n  'update.z_wave_js_ui_update',\n  'update.mosquitto_broker_update',\n
      \ 'update.studio_code_server_update',\n  'update.terminal_ssh_update',\n  'update.file_editor_update',\n
      \ 'update.samba_share_update',\n  'update.advanced_ssh_web_terminal_update',\n
      \ 'update.home_assistant_mcp_server_update',\n  'update.music_assistant_server_update',\n
      \ 'update.ring_mqtt_with_video_streaming_update',\n  'update.usw_flex_mini',\n
      \ 'update.usw_pro_max_24_poe',\n  'update.living_room_usw_flex_mini',\n  'update.bedroom_usw_flex_mini',\n
      \ 'update.office_usw_flex_mini',\n  'update.usw_aggregation',\n  'update.usp_pdu_pro',\n
      \ 'update.udm_pro',\n  'update.usw_flex_2_5g_5',\n  'update.garage_ap_u6_lite',\n
      \ 'update.living_room_ap_u6_lite',\n  'update.cloud_gateway_ultra_2'\n] %} {{
      trigger.event.data.entity_id in critical }}\n"
  actions:
  - variables:
      new: '{{ trigger.event.data.new_state }}'
      last_change: '{{ as_timestamp(new.last_changed) }}'
      now_ts: '{{ as_timestamp(now()) }}'
      cooldown_secs: 300
      raw: '{{ new.name }}'
      clean: '{% set name = raw %} {% set name = name | regex_replace(find=''(?i)update'',
        replace='''') %} {% set name = name | regex_replace(find=''(?i)firmware'',
        replace='''') %} {% set name = name | regex_replace(find=''\\s+'', replace=''
        '') %} {{ name.strip().title() }}

        '
  - condition: template
    value_template: '{{ now_ts - last_change > cooldown_secs }}

      '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ new.state == ''on'' }}'
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          title: Update Available
          message: Update available for {{ clean }}
      - action: light.turn_on
        target:
          entity_id: light.bedroom_fado_lamp
        data:
          rgb_color:
          - 0
          - 255
          - 0
    - conditions:
      - condition: template
        value_template: '{{ new.state == ''off'' }}'
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          title: Update Completed
          message: Update completed for {{ clean }}
      - action: light.turn_on
        target:
          entity_id: light.bedroom_fado_lamp
        data:
          rgb_color:
          - 0
          - 255
          - 0
