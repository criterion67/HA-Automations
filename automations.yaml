- id: '1785709222103'
  alias: Weather - AI Weather Report (Hourly)
  description: Generates a short two sentence weather narrative every hour and stores
    it in input_text.ai_weather_report for display on the Weather dashboard. Blends
    live WS90 backyard weather station readings with the next 8 hours of the Google
    Weather forecast, then sends both to ai_task.google_ai_task (Google Gemini, free
    tier). Modeled on the AI Weather Report card in the Google Weather app, which
    the Google Weather HA integration does not expose. If the AI call fails, for example
    a rate limit, the automation stops and the previous report stays on the card rather
    than blanking it. Also runs 2 minutes after a Home Assistant restart so the card
    is never stale after a reboot.
  triggers:
  - id: hourly
    minutes: 0
    trigger: time_pattern
  - event: start
    id: startup
    trigger: homeassistant
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: startup
      sequence:
      - delay:
          minutes: 2
  - action: weather.get_forecasts
    data:
      type: hourly
    response_variable: fc
    target:
      entity_id: weather.scott_s_home
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.google_ai_task
      instructions: 'You write the short weather blurb shown on a home dashboard in
        Foley, Alabama, on the Gulf Coast.


        BACKYARD WEATHER STATION, measured right now:

        Temperature {{ states(''sensor.weather_station_temperature'') | float(0) |
        round(0) | int }} F, feels like {{ states(''sensor.weather_station_apparent_temperature'')
        | float(0) | round(0) | int }} F, humidity {{ states(''sensor.weather_station_humidity'')
        | float(0) | round(0) | int }} percent, dew point {{ states(''sensor.weather_station_dew_point'')
        | float(0) | round(0) | int }} F, pressure {{ states(''sensor.weather_station_pressure'')
        | float(0) | round(2) }} inHg, wind {{ states(''sensor.weather_station_wind_speed'')
        | float(0) | round(0) | int }} mph gusting {{ states(''sensor.weather_station_gust_speed'')
        | float(0) | round(0) | int }} mph, rain rate {{ states(''sensor.weather_station_rain_rate'')
        }} in/h, UV index {{ states(''sensor.weather_station_uv_index'') }}, sky {{
        states(''sensor.weather_station_weather_condition'') }}.


        GOOGLE FORECAST, next 8 hours:

        {% for h in fc[''weather.scott_s_home''].forecast[:8] %}{{ as_local(as_datetime(h.datetime)).strftime(''%-I
        %p'') }}: {{ h.condition }}, {{ h.temperature }} F, {{ h.precipitation_probability
        }} percent chance of rain.

        {% endfor %}

        Write at most two sentences, under 200 characters total. The first sentence
        says what it is like outside right now, leaning on the weather station numbers.
        The second says what is coming over the next several hours, leaning on the
        forecast. Conversational plain English, the way a local would say it. Where
        the station and the forecast disagree about current conditions, trust the
        station. No preamble, no markdown, no emoji, no bullet points, no headings,
        no quotation marks. Output only the sentences.'
      task_name: AI Weather Report
    response_variable: report
  - action: input_text.set_value
    data:
      value: '{{ report.data | trim | truncate(250, True, '''') }}'
    target:
      entity_id: input_text.ai_weather_report
  max_exceeded: silent
  mode: single
- id: '1786320805878'
  alias: 'Bathroom Vanity: Double Tap Full Bright with AL Override'
  description: Double tapping up on the Bathroom Light Switch marks the vanity group
    as manually controlled in Adaptive Lighting, then applies the daylight scene (full
    brightness, 6535K). Without the manual control mark, AL re-adapts brightness back
    down on its next 90 second cycle because detect_non_ha_changes is off and commands
    sent over the Zigbee group bind are invisible to it. When the vanity group turns
    off from any source (paddle, presence automation, dashboard), manual control is
    released so AL resumes adapting on the next turn on. Replaces the former 'Bathroom
    light switch daylight scene' automation, which used the same double tap trigger
    without the AL handling.
  triggers:
  - device_id: 05fadbb6a5379e43e8614cd1e00b8013
    domain: zha
    id: double_tap_up
    subtype: Up
    trigger: device
    type: remote_button_double_press
  - entity_id: light.bathroom_vanity_light_group
    id: lights_off
    to: 'off'
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: double_tap_up
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_bathroom
          lights:
          - light.bathroom_vanity_light_group
          manual_control: true
      - action: scene.turn_on
        target:
          entity_id: scene.bathroom_lights_daylight_temperature_on
    - conditions:
      - condition: trigger
        id: lights_off
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_bathroom
          lights:
          - light.bathroom_vanity_light_group
          manual_control: false
  max: 10
  mode: parallel
- id: '1786500995692'
  alias: Mower Garage Return
  description: 'Return half of the MOVA LiDAX Ultra 2000 AWD garage sequence. Companion
    to script.mower_zone_cycle, which handles the outbound half.


    WHY THIS IS AN AUTOMATION AND NOT PART OF THE SCRIPT

    The mower can decide to come home on its own for a completed session, low battery,
    or rain, and a mow can run for hours. A script waiting that long would die on
    a Home Assistant restart and the door would never reopen, leaving the mower stranded
    outside a closed door. A state triggered automation survives restarts.


    WHAT IT DOES

    1. On binary_sensor.jason_momower_returning going on, opens the garage door and
    stops it after 2.5 seconds for a 21 inch opening. Verified 2026-08-11 from history:
    on a natural end of session the returning flag goes on 0.25 seconds after mowing
    goes off and stays on for about 1 minute 40 seconds before the mower docks, so
    there is ample time for the door to open.

    3. ERROR HANDLING: if binary_sensor.jason_momower_error_active goes on during
    a cycle, sends an ACTIONABLE notification to Scott''s Pixel 9 with two buttons,
    Close Garage and Leave Open, plus the current door state and the error text. The
    taps are handled by the companion automation Mower Notification Actions. A time
    based watchdog was built first and then removed on 2026-08-12 at Scott''s request:
    an automatic close risks shutting the door on him while he is working in the garage,
    and it cannot tell a stalled mower from a slow one. Letting Scott decide from
    the notification is the safer design. NOTE: this means there is still no automatic
    close if the mower stalls silently without raising an error. The door would stay
    open until Scott notices.


    2. On binary_sensor.jason_momower_docked going on, waits 30 seconds for the mower
    to settle, closes the door, waits for the door to travel, then clears input_boolean.mower_cycle_active
    and notifies Scott''s Pixel 9.


    The whole automation is gated on input_boolean.mower_cycle_active being on, so
    it only acts during a cycle that Home Assistant started. A mow started from the
    MOVA app will not move the garage door.


    CORRECTED 2026-08-13: the returning flag DOES now fire on the lawn_mower.dock
    path. It was observed going on at 17:54:31, about half a second after script.mower_send_home
    issued its dock command. The earlier claim that it never fires on that path is
    wrong, whether because v0.2.68 changed the state flow or because the original
    2026-08-11 observation did not generalise. Both this automation and script.mower_send_home
    were built on that false premise, which is why they collided on the door and shut
    it on the mower.


    ANNOUNCEMENT ADDED 2026-08-14: the returning branch now speaks on media_player.bedroom_group
    via tts.home_assistant_cloud, but only between 07:00 and 19:00, and always sends
    a Pixel 9 notification regardless of the hour. Both run BEFORE the door-closed
    condition so they still fire on the script.mower_send_home path, where the door
    is already open and the rest of the branch is skipped.


    ERROR ALERTING REBUILT 2026-08-14, now two stages. STAGE ONE fires on any error:
    speaks on the bedroom group between 07:00 and 19:00, and the Pixel 9 alert now
    uses channel alarm_stream, priority high, ttl 0 and sticky true, copied from automation.david_mowie_stuck_or_error_alert
    so it sounds through silent mode and survives a clear-all. STAGE TWO fires only
    when the error has been set for 5 minutes AND sensor.jason_momower_state_name
    is no longer "mowing", which separates a genuine stall from a transient bump,
    and it speaks at any hour. Background: on 2026-08-14 a Path blocked error latched
    for 25 minutes while the mower carried on mowing normally and completed the job,
    so a bare error flag is not by itself evidence of a problem.


    SAFETY: the opener photo eyes remain the physical backstop and will reverse the
    door if the mower is in the doorway while it closes.'
  triggers:
  - entity_id: binary_sensor.jason_momower_returning
    id: returning
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.jason_momower_docked
    id: docked
    to: 'on'
    trigger: state
  - trigger: state
    entity_id: binary_sensor.jason_momower_error_active
    to: 'on'
    id: mower_error
  - trigger: state
    entity_id: binary_sensor.jason_momower_error_active
    to: 'on'
    for:
      minutes: 5
    id: mower_error_persistent
    note: Added 2026-08-14. Second stage alert for an error still set after 5 minutes
      AND where the mower has actually stopped. Exists because of the 2026-08-14 Path
      blocked event, which latched the error flag for 25 minutes while the mower carried
      on mowing normally and finished the job.
  conditions:
  - alias: Only act during an active mower cycle started from Home Assistant
    condition: state
    entity_id: input_boolean.mower_cycle_active
    state: 'on'
  actions:
  - choose:
    - alias: Mower is heading home, reopen the door
      conditions:
      - condition: trigger
        id: returning
      sequence:
      - alias: Spoken announcement, daytime only
        note: Added 2026-08-14. Placed FIRST, before the door-closed condition, because
          on the script.mower_send_home path the door is already open and that condition
          halts the branch. If this sat after it, the announcement would never fire
          on that path. Uses if/then rather than a bare condition so a night-time
          return still reaches the door logic below.
        if:
        - condition: time
          after: 07:00:00
          before: '19:00:00'
        then:
        - action: tts.speak
          alias: Announce on the bedroom speaker group
          target:
            entity_id: tts.home_assistant_cloud
          data:
            media_player_entity_id: media_player.bedroom_group
            cache: false
            message: Jason MoMower has finished mowing and is returning to the garage
              to dock.
      - action: notify.mobile_app_pixel_9
        alias: Notify Scott that the mower is heading back
        note: Deliberately NOT time gated. The spoken announcement is limited to 07:00-19:00
          so it cannot wake Scott, but a phone notification is quiet enough to be
          useful around the clock.
        data:
          title: Mower Returning
          message: Jason MoMower has finished mowing and is heading back to the dock.
      - condition: state
        entity_id: cover.garage_door
        state: closed
        alias: Only open if the door is actually shut
        note: BUG FIX 2026-08-13. script.mower_send_home opens the door itself, then
          the returning flag fires moments later and this branch sent a SECOND open_cover
          to a door already stopped partway. On this pulse based opener with no position
          control that reverses the door and it closes. That stranded the mower outside
          a shut door at 17:54 and produced Return to station failed.
      - action: cover.open_cover
        alias: Start the door opening
        target:
          entity_id: cover.garage_door
      - alias: Wait the calibrated interval for a 21 inch opening
        delay:
          milliseconds: 2500
      - action: cover.stop_cover
        alias: Stop the door partway
        target:
          entity_id: cover.garage_door
    - alias: Mower has docked, close up and clear the flag
      conditions:
      - condition: trigger
        id: docked
      sequence:
      - alias: Let the mower settle fully into the dock before moving the door
        delay:
          seconds: 30
      - condition: state
        entity_id: binary_sensor.jason_momower_docked
        state: 'on'
        alias: Confirm the mower is STILL docked after the settle delay
        note: BUG FIX 2026-08-13. A 0.32 second docked flicker at 17:56:48 satisfied
          the trigger, and 30 seconds later this branch closed the door and cleared
          the flag while the mower was still out on the lawn. If this condition fails
          the sequence halts, deliberately leaving the door OPEN and the flag SET
          so the real docking is still handled.
      - action: cover.close_cover
        alias: Close the garage door
        target:
          entity_id: cover.garage_door
      - alias: Give the door time to finish travelling before unsuppressing
        delay:
          seconds: 20
      - action: input_boolean.turn_off
        alias: Clear the suppression flag, ending the cycle
        target:
          entity_id: input_boolean.mower_cycle_active
      - action: notify.mobile_app_pixel_9
        data:
          message: Jason MoMower has docked and the garage door is closed.
          title: Mower Cycle Complete
    - alias: Mower reported an error during a cycle, offer to close the garage
      conditions:
      - condition: trigger
        id: mower_error
      sequence:
      - alias: Speak the error aloud, daytime only
        note: Added 2026-08-14. Time gated because this first stage fires on ANY error,
          including transient ones like the 2026-08-14 Path blocked that cleared itself
          while the mower kept working. The second stage alert is deliberately NOT
          time gated.
        if:
        - condition: time
          after: 07:00:00
          before: '19:00:00'
        then:
        - action: tts.speak
          alias: Announce the error on the bedroom speaker group
          target:
            entity_id: tts.home_assistant_cloud
          data:
            media_player_entity_id: media_player.bedroom_group
            cache: false
            message: Jason MoMower has reported a problem. The error is {{ states("sensor.jason_momower_error")
              }}.
      - action: notify.mobile_app_pixel_9
        data:
          title: Jason MoMower Error
          message: 'The mower reported a problem during a mowing cycle and may not
            make it back to the dock. The garage door is currently {{ states("cover.garage_door")
            }}. Error: {{ states("sensor.jason_momower_error") }}'
          data:
            actions:
            - action: MOWER_CLOSE_GARAGE
              title: Close Garage
            - action: MOWER_LEAVE_OPEN
              title: Leave Open
            tag: mower_error
            persistent: true
            sticky: true
            importance: high
            priority: high
            channel: alarm_stream
            ttl: 0
            notification_icon: mdi:robot-mower
        note: Updated 2026-08-14. channel alarm_stream, priority high and ttl 0 copied
          verbatim from automation.david_mowie_stuck_or_error_alert so this sounds
          through silent mode like the Ecovacs alert does. sticky true means a clear-all
          no longer wipes it, which is how Scott missed the 17:23 Path blocked alert.
    - alias: Error still set after 5 minutes and the mower has stopped, treat as a
        real stall
      conditions:
      - condition: trigger
        id: mower_error_persistent
      - condition: not
        alias: Only if the mower is NOT still mowing
        note: On 2026-08-14 the error flag latched for 25 minutes while sensor.jason_momower_state_name
          stayed "mowing" and the battery kept draining at its normal rate. lawn_mower.jason_momower
          itself reads "error" in that situation, so state_name is the entity that
          actually distinguishes a working mower from a stalled one.
        conditions:
        - condition: state
          entity_id: sensor.jason_momower_state_name
          state: mowing
      sequence:
      - action: notify.mobile_app_pixel_9
        alias: Escalated stuck alert
        data:
          title: Jason MoMower Is Stuck
          message: 'Jason MoMower has been in an error state for over 5 minutes and
            has stopped. Error: {{ states("sensor.jason_momower_error") }}. The garage
            door is currently {{ states("cover.garage_door") }}.'
          data:
            actions:
            - action: MOWER_CLOSE_GARAGE
              title: Close Garage
            - action: MOWER_LEAVE_OPEN
              title: Leave Open
            tag: mower_stuck
            persistent: true
            sticky: true
            importance: high
            priority: high
            channel: alarm_stream
            ttl: 0
            notification_icon: mdi:robot-mower
      - action: tts.speak
        alias: Announce the stall, any hour
        note: Deliberately NOT time gated, unlike the first stage. By this point the
          mower has been stopped in an error state for 5 minutes and is sitting outside,
          so waking Scott is the lesser problem.
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: media_player.bedroom_group
          cache: false
          message: Jason MoMower is stuck and needs assistance. The error is {{ states("sensor.jason_momower_error")
            }}.
  mode: parallel
- id: '1786567462613'
  alias: Mower Notification Actions
  description: 'Handles the action buttons on the Jason MoMower error notification
    sent by automation.mower_garage_return.


    WHY THIS IS A SEPARATE AUTOMATION

    Mower Garage Return is gated on input_boolean.mower_cycle_active being on. If
    that flag were ever cleared while an error notification was still sitting on Scott''s
    phone, a tap would silently do nothing. Handling the taps here, ungated, means
    the buttons always work.


    WHAT IT DOES

    - MOWER_CLOSE_GARAGE: closes the garage door and confirms. The cycle flag is deliberately
    NOT cleared, so the door will still reopen automatically if the mower later recovers
    and reports returning.

    - MOWER_LEAVE_OPEN: acknowledges and does nothing to the door.


    Both replies reuse the notification tag mower_error so they replace the original
    alert on the phone rather than stacking up.


    CONTEXT: this replaced a time based watchdog that automatically closed the door
    after 15 minutes open during a cycle. Scott removed that on 2026-08-12 because
    it could shut the door on him while he was working in the garage, and it could
    not distinguish a stalled mower from a slow return. The tradeoff is that a silent
    stall with no error raised will leave the door open until Scott notices.'
  triggers:
  - event_data:
      action: MOWER_CLOSE_GARAGE
    event_type: mobile_app_notification_action
    id: close_garage
    trigger: event
  - event_data:
      action: MOWER_LEAVE_OPEN
    event_type: mobile_app_notification_action
    id: leave_open
    trigger: event
  actions:
  - choose:
    - alias: Scott tapped Close Garage
      conditions:
      - condition: trigger
        id: close_garage
      sequence:
      - action: cover.close_cover
        alias: Close the garage door
        target:
          entity_id: cover.garage_door
      - action: notify.mobile_app_pixel_9
        data:
          data:
            tag: mower_error
          message: Closing the garage door now. The mower cycle flag is still set,
            so the door will reopen on its own if Jason MoMower recovers and reports
            returning.
          title: Garage Closing
    - alias: Scott tapped Leave Open
      conditions:
      - condition: trigger
        id: leave_open
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            tag: mower_error
          message: Leaving the garage door as it is. Nothing further will move it
            automatically except the normal return sequence when Jason MoMower docks.
          title: Garage Left As Is
  mode: queued
- id: '1786731986924'
  alias: Health - Blood Pressure Reminder (Consolidated)
  description: 'Single source of truth for the blood pressure reminder, covering both
    the dashboard card and the phone notification. At 7:00 AM and again at 7:00 PM
    it clears input_boolean.bp_reminder_dismissed (which reveals the conditional card
    on the Mobile and Scott''s Dashboard tablet views) and sends one push to the Pixel
    9 tagged bp_reminder. The reminder goes away three ways, all of which end in the
    same state: tapping Dismiss on the phone notification, tapping the dashboard card,
    or a genuinely new systolic reading arriving from Health Connect. Any of those
    sets the boolean on and clears the phone notification by tag, so the two surfaces
    stay in sync. A new systolic reading also stamps input_datetime.last_bp_reading
    and input_number.last_known_systolic; the value-change guard on that branch prevents
    Health Connect resyncs and restarts from being mistaken for fresh readings. Replaces
    four earlier automations: the 30 minute time_pattern morning reminder, the midnight
    and 7 PM flag reset, the windowed auto dismiss, and the standalone stamp automation.'
  triggers:
  - at: 07:00:00
    id: morning
    trigger: time
  - at: '19:00:00'
    id: evening
    trigger: time
  - entity_id: sensor.pixel_9_systolic_bp
    id: reading
    not_to:
    - unknown
    - unavailable
    trigger: state
  - event_data:
      action: DISMISS_BP_REMINDER
    event_type: mobile_app_notification_action
    id: dismiss_action
    trigger: event
  - entity_id: input_boolean.bp_reminder_dismissed
    id: flag_dismissed
    to: 'on'
    trigger: state
  actions:
  - choose:
    - alias: Morning reminder
      conditions:
      - condition: trigger
        id: morning
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bp_reminder_dismissed
      - action: notify.mobile_app_pixel_9
        data:
          data:
            actions:
            - action: DISMISS_BP_REMINDER
              title: Dismiss
            tag: bp_reminder
          message: Time for your morning blood pressure reading.
          title: Blood Pressure Reminder
    - alias: Evening reminder
      conditions:
      - condition: trigger
        id: evening
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bp_reminder_dismissed
      - action: notify.mobile_app_pixel_9
        data:
          data:
            actions:
            - action: DISMISS_BP_REMINDER
              title: Dismiss
            tag: bp_reminder
          message: Time for your evening blood pressure reading.
          title: Blood Pressure Reminder
    - alias: New reading arrived
      conditions:
      - condition: trigger
        id: reading
      - condition: template
        value_template: '{{ trigger.to_state.state | float(0) != states(''input_number.last_known_systolic'')
          | float(0) }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bp_reminder_dismissed
      - action: notify.mobile_app_pixel_9
        data:
          data:
            tag: bp_reminder
          message: clear_notification
      - action: input_datetime.set_datetime
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        target:
          entity_id: input_datetime.last_bp_reading
      - action: input_number.set_value
        data:
          value: '{{ trigger.to_state.state | float }}'
        target:
          entity_id: input_number.last_known_systolic
    - alias: Dismissed from phone notification
      conditions:
      - condition: trigger
        id: dismiss_action
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bp_reminder_dismissed
      - action: notify.mobile_app_pixel_9
        data:
          data:
            tag: bp_reminder
          message: clear_notification
    - alias: Dismissed from dashboard card
      conditions:
      - condition: trigger
        id: flag_dismissed
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          data:
            tag: bp_reminder
          message: clear_notification
  max: 10
  mode: parallel
- id: mower_gate_reminders
  alias: Mower Gate Reminders
  description: 'Handles the side gate for mowing. MOST branches are scoped to a FULL
    YARD cycle (rear 3, front 1, side 2). Every branch is gated on input_boolean.mower_full_yard_cycle,
    which script.mower_full_yard_cycle sets. That marker is what stops a manual rear-then-front
    run from producing false gate prompts, which was Scott''s specific concern on
    2026-08-17.


    WHY THIS EXISTS: the rear yard is only reachable with the gate open, but the gate
    obstructs the side yard. So the mower does the rear yard first, and Scott closes
    the gate while it is busy on the front yard.


    BRANCH 0, reached_rear: the mower is entering the rear yard and the gate does
    NOT read open. Pauses immediately and alerts hard. THIS BRANCH IS UNGATED on the
    full yard marker, unlike every other branch, because a shut or unreadable gate
    on entry to the rear yard is a real problem on any session including a plain Rear
    Yard button press. It fails CLOSED, so unavailable and unknown from a dead sensor
    battery or weak signal also pause the mower.


    BRANCH 1, reached_front: the rear yard is done, so tell Scott to go close the
    gate. Speaks at any hour, because missing this prompt is what breaks the whole
    cycle.


    BRANCH 2, gate_closed: acknowledge so Scott knows it registered and stops wondering.


    BRANCH 3, reached_side: the mower is entering the side yard with the gate STILL
    OPEN. Pauses the mower immediately, then alerts hard. NOTE this is a mitigation,
    not a guarantee: the zone transition is only reported once the mower is already
    moving, so it stops it quickly rather than preventing it from ever approaching
    the gate.


    RESUME IS DELIBERATELY MANUAL. There is no resume service on this integration;
    the only candidate is lawn_mower.start_mowing and it is NOT yet verified whether
    that resumes a paused ZONE session or kicks off a whole-map mow. Until that is
    tested with Scott watching, branch 2 only tells him it is safe to resume and he
    does it himself.


    BRANCH 4, cycle_ended: clears the full yard marker whenever input_boolean.mower_cycle_active
    clears, so a normal finish, a cancel, or an early dock all clean up.


    LABEL FORM HANDLING, added 2026-08-20. All three current_zone triggers match both
    the friendly form and the raw form, because an integration reload or HA restart
    makes the sensor drop friendly names. Each also carries not_from with the same
    pair, so a label flip mid-run is not read as a fresh zone entry. If a fourth zone
    is ever added, both forms must be listed here or the branch silently never fires.'
  triggers:
  - entity_id: sensor.jason_momower_current_zone
    id: reached_front
    to:
    - Front Yard (#1)
    - Zone 1
    trigger: state
    not_from:
    - Front Yard (#1)
    - Zone 1
    note: 'Matches BOTH label forms. After an integration reload or HA restart, sensor.jason_momower_current_zone
      stops resolving friendly zone names and reports the raw form instead. Verified
      in the recorder on 2026-08-19: it read "Rear Yard (#3)" at 11:32:14, then "Zone
      3" at 12:31:58 after a reload, then "Zone 1" at 12:48:08. Because the trigger
      matched only the labelled string, the close-the-gate prompt never fired that
      day. not_from carries the SAME pair so a mid-run label flip on the zone the
      mower is already in (labelled to raw, or raw to labelled) does not re-fire this
      branch; only a genuine entry from another zone or from unavailable does.'
  - entity_id: binary_sensor.rear_yard_gate
    id: gate_closed
    to: 'off'
    trigger: state
  - entity_id: sensor.jason_momower_current_zone
    id: reached_side
    to:
    - Side Yard (#2)
    - Zone 2
    trigger: state
    not_from:
    - Side Yard (#2)
    - Zone 2
    note: 'Matches BOTH label forms. After an integration reload or HA restart, sensor.jason_momower_current_zone
      stops resolving friendly zone names and reports the raw form instead. Verified
      in the recorder on 2026-08-19: it read "Rear Yard (#3)" at 11:32:14, then "Zone
      3" at 12:31:58 after a reload, then "Zone 1" at 12:48:08. Because the trigger
      matched only the labelled string, the close-the-gate prompt never fired that
      day. not_from carries the SAME pair so a mid-run label flip on the zone the
      mower is already in (labelled to raw, or raw to labelled) does not re-fire this
      branch; only a genuine entry from another zone or from unavailable does.'
  - entity_id: input_boolean.mower_cycle_active
    id: cycle_ended
    to: 'off'
    trigger: state
  - trigger: state
    entity_id: sensor.jason_momower_current_zone
    to:
    - Rear Yard (#3)
    - Zone 3
    id: reached_rear
    note: 'Matches BOTH label forms. After an integration reload or HA restart, sensor.jason_momower_current_zone
      stops resolving friendly zone names and reports the raw form instead. Verified
      in the recorder on 2026-08-19: it read "Rear Yard (#3)" at 11:32:14, then "Zone
      3" at 12:31:58 after a reload, then "Zone 1" at 12:48:08. Because the trigger
      matched only the labelled string, the close-the-gate prompt never fired that
      day. not_from carries the SAME pair so a mid-run label flip on the zone the
      mower is already in (labelled to raw, or raw to labelled) does not re-fire this
      branch; only a genuine entry from another zone or from unavailable does.'
    not_from:
    - Rear Yard (#3)
    - Zone 3
  conditions: []
  actions:
  - choose:
    - alias: Entering the rear yard without an open gate, pause and alert. NOT gated
        on the full yard marker.
      note: 'Deliberately UNGATED on input_boolean.mower_full_yard_cycle, at Scott
        request 2026-08-17. Every other branch is marker-gated to avoid false prompts
        on manual runs, but a gate that is not open when the mower is entering the
        REAR yard is a real problem on ANY session, including a plain Rear Yard button
        press. Fails CLOSED: the NOT condition means off, unavailable and unknown
        all trigger this, so a dead gate sensor battery or weak signal pauses the
        mower rather than letting it drive at a gate nobody can confirm is open.'
      conditions:
      - condition: trigger
        id: reached_rear
      - condition: not
        alias: Gate does NOT read open
        conditions:
        - condition: state
          entity_id: binary_sensor.rear_yard_gate
          state: 'on'
      - condition: state
        entity_id: sensor.jason_momower_state_name
        state: mowing
        alias: Only while actually mowing, not while returning
        note: Added 2026-08-17, immediately after the branch was written, to close
          a hole found before its first run. sensor.jason_momower_current_zone briefly
          reported "Rear Yard (#3)" at 12:52:44 on 2026-08-17 while the mower was
          actually traversing on its way HOME, not mowing that zone. Without this
          condition, that flicker plus a closed gate (the normal resting state) would
          pause the mower mid-return and strand it outside. Note that lawn_mower.jason_momower
          reads "returning" in that situation but state_name is the entity that reliably
          distinguishes mowing from traversing.
      sequence:
      - action: lawn_mower.pause
        alias: Stop the mower before it reaches the shut gate
        target:
          entity_id: lawn_mower.jason_momower
      - action: tts.speak
        alias: Hard spoken alert, any hour
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: media_player.bedroom_group
          cache: false
          message: Jason MoMower has been paused. It is entering the rear yard but
            the side gate is not reading open.
      - action: notify.mobile_app_pixel_9
        alias: Hard phone alert
        data:
          title: Mower Paused, Rear Gate Not Open
          message: Jason MoMower is entering the rear yard but the side gate reads
            {{ states("binary_sensor.rear_yard_gate") }}. It has been paused. Open
            the gate and resume manually. If the gate reads unavailable or unknown,
            check the contact sensor battery and signal.
          data:
            tag: mower_gate_blocked
            sticky: true
            persistent: true
            importance: high
            priority: high
            channel: alarm_stream
            ttl: 0
            notification_icon: mdi:gate-alert
    - alias: Rear yard done, time to close the gate
      conditions:
      - condition: trigger
        id: reached_front
      - condition: state
        entity_id: input_boolean.mower_full_yard_cycle
        state: 'on'
      - condition: state
        entity_id: binary_sensor.rear_yard_gate
        state: 'on'
      sequence:
      - action: tts.speak
        alias: Announce that the gate needs closing
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: Jason MoMower has finished the rear yard and is now mowing the
            front yard. Please go close the side gate.
        note: Not time gated. If Scott misses this the mower reaches the side yard
          with the gate in the way, which is the failure this whole automation exists
          to prevent.
        target:
          entity_id: tts.home_assistant_cloud
      - action: notify.mobile_app_pixel_9
        alias: Phone prompt with the same message
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:gate
            priority: high
            sticky: true
            tag: mower_gate
            ttl: 0
          message: Rear yard is done and Jason MoMower is on the front yard now. Close
            the side gate before it reaches the side yard, roughly 55 minutes.
          title: Close The Side Gate
    - alias: Gate closed, acknowledge it
      conditions:
      - condition: trigger
        id: gate_closed
      - condition: state
        entity_id: input_boolean.mower_full_yard_cycle
        state: 'on'
      sequence:
      - action: tts.speak
        alias: Confirm the gate registered as closed
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: The side gate is closed. Jason MoMower is clear to continue.
        target:
          entity_id: tts.home_assistant_cloud
      - alias: If the mower was paused waiting on this, tell Scott he can resume
        if:
        - condition: state
          entity_id: lawn_mower.jason_momower
          state: paused
        note: Resume is manual on purpose. lawn_mower.start_mowing is the only candidate
          and its behaviour on a paused ZONE session is unverified. Once tested, this
          branch is where an automatic resume would go.
        then:
        - action: notify.mobile_app_pixel_9
          data:
            data:
              channel: alarm_stream
              importance: high
              notification_icon: mdi:gate
              priority: high
              sticky: true
              tag: mower_gate
              ttl: 0
            message: The side gate is now closed and Jason MoMower is paused. Resume
              it manually when you are ready.
            title: Gate Closed, Mower Is Paused
    - alias: Entering the side yard to MOW it with the gate still open, pause and
        alert. NOT gated on the full yard marker.
      conditions:
      - condition: trigger
        id: reached_side
      - condition: state
        entity_id: binary_sensor.rear_yard_gate
        state: 'on'
      - condition: state
        entity_id: sensor.jason_momower_state_name
        state: mowing
        alias: Only while actually mowing, not while traversing or returning
        note: Added 2026-08-18 together with ungating this branch, and it is load
          bearing. Scott confirmed the mower must pass THROUGH the side yard to reach
          either the dock or the front yard from the rear yard, so every return trip
          crosses this zone. Without this condition an ungated branch would pause
          the mower on its way home whenever the gate was open, and strand it outside.
          Mirrors the same guard already on the reached_rear branch.
      sequence:
      - action: lawn_mower.pause
        alias: Stop the mower before it reaches the open gate
        note: Pause first, alert second. Verified 2026-08-17 that lawn_mower.pause
          is available on this mower.
        target:
          entity_id: lawn_mower.jason_momower
      - action: tts.speak
        alias: Hard spoken alert, any hour
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: Jason MoMower has been paused. It reached the side yard but the
            side gate is still open. Please close the gate.
        target:
          entity_id: tts.home_assistant_cloud
      - action: notify.mobile_app_pixel_9
        alias: Hard phone alert
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:gate-alert
            priority: high
            sticky: true
            tag: mower_gate_blocked
            ttl: 0
          message: Jason MoMower reached the side yard with the side gate still open
            and has been paused. Close the gate, then resume it manually.
          title: Mower Paused, Gate Still Open
      note: UNGATED on input_boolean.mower_full_yard_cycle as of 2026-08-18, at Scott's
        request. Previously this branch only protected a Full Yard preset run, which
        meant it never fired during Scott's actual workflow of pressing individual
        zone buttons. A gate left open while the mower is mowing the side yard is
        a real obstruction on ANY session, so this now behaves like the reached_rear
        branch.
    - alias: Cycle ended, clear the full yard marker
      conditions:
      - condition: trigger
        id: cycle_ended
      - condition: state
        entity_id: input_boolean.mower_full_yard_cycle
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        alias: Clear the marker
        note: Tied to mower_cycle_active clearing rather than to the side yard finishing,
          so a cancel or an early dock cleans up too.
        target:
          entity_id: input_boolean.mower_full_yard_cycle
  max: 10
  mode: parallel
