- id: '1775696159907'
  alias: Office- Network Cabinet WLED Presence Control
  description: Turns the network cabinet WLED strip on when office presence is detected,
    off after 5 min of no presence. If internet is down, skips the turn-off so the
    red warning from the Internet Connectivity Monitor stays active.
  triggers:
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ''UniFi Blue'' in (state_attr(''select.network_cabinet_ws2811_preset'',''options'')
              or []) }}'
          sequence:
          - action: select.select_option
            target:
              entity_id: select.network_cabinet_ws2811_preset
            data:
              option: UniFi Blue
        default:
        - action: light.turn_on
          target:
            entity_id: light.network_cabinet_ws2811
          data:
            rgb_color:
            - 0
            - 102
            - 255
            brightness_pct: 100
    - conditions:
      - condition: trigger
        id: cleared
      - condition: state
        entity_id: binary_sensor.8_8_8_8
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.network_cabinet_ws2811
  mode: single
- id: '1776135598837'
  alias: Office- Presence Lighting Control V3
  description: Turns office lamps on with presence, turns them off after 5 min of
    no presence, and resets manual override. Replaces V2 which controlled the ceiling
    light.
  triggers:
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
  - platform: state
    entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: input_boolean.office_ceiling_presence_enabled
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.office_lamps
      - choose:
        - conditions:
          - condition: state
            entity_id: light.office_lamps
            state: 'off'
            for:
              hours: 1
              minutes: 0
              seconds: 0
          sequence: []
        default:
        - action: scene.turn_on
          target:
            entity_id: scene.office_fan_temp_scene
          data: {}
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: scene.create
        data:
          scene_id: office_fan_temp_scene
          snapshot_entities:
          - switch.office_fan
      - if:
        - condition: state
          entity_id: light.office_lamps
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.office_lamps
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_ceiling_presence_enabled
  mode: single
- id: '1776226412089'
  alias: Power Outage - Desktop Shutdown
  description: 'Shuts down SCOTT-DESKTOP when either: (1) EFR3P-1 AC has been offline
    for 10 minutes, or (2) Goldenmate battery drops below 25%. Both conditions ensure
    a graceful shutdown well before the Goldenmate runs dry. Network gear and HA host
    are handled separately by the EFR3P-2 automation.'
  triggers:
  - platform: state
    entity_id: binary_sensor.ef_r30118_ac_plugged_in
