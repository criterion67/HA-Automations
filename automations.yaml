        - action: UV_DISMISS
          title: Dismiss
  - wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: UV_SNOOZE_24H
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: UV_DISMISS
      trigger: event
    timeout: 02:00:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ wait.trigger is not none and\n   wait.trigger.event is
          defined and\n   wait.trigger.event.data.action == 'UV_SNOOZE_24H' }}\n"
      sequence:
      - delay: '24:00:00'
    - conditions:
      - condition: template
        value_template: "{{ wait.trigger is not none and\n   wait.trigger.event is
