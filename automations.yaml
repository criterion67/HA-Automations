- id: '1726420403753'
  alias: Dog Water Bowl Monitor & Reminder
  description: Monitors dog water bowl level, sends alerts when empty, and notifies
    when refilled. Active daily between 7 AM and 10 PM.
  triggers:
  - trigger: state
    entity_id: binary_sensor.dog_bowl_water_level
    to: 'off'
    id: Empty
  - trigger: state
    entity_id: binary_sensor.dog_bowl_water_level
    to: 'on'
    id: Full
  conditions:
  - condition: time
    after: 07:00:00
    before: '22:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Empty
      - condition: state
        entity_id: input_boolean.dog_bowl_notification
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.dog_bowl_notification
        action: input_boolean.turn_on
      - data:
          title: Dog's Water Bowl Alert!
          message: Dog's water bowl is empty. Please refill as soon as possible.
        action: notify.mobile_app_pixel_9
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+dogs+water+bowl+is+empty.+Please+refill+as+soon+as+possible.&language=en-US&voice=JennyNeural
          media_content_type: provider
        metadata:
          title: The dog's water bowl is empty. Please refill as soon as possible.
          thumbnail: https://brands.home-assistant.io/_/tts/logo.png
        action: media_player.play_media
      - delay:
          minutes: 15
    - conditions:
      - condition: trigger
        id: Full
      sequence:
      - target:
          entity_id: input_boolean.dog_bowl_notification
        action: input_boolean.turn_off
      - data:
          title: Dog's Water Bowl Alert!
          message: Dog's water bowl has been refilled.
        action: notify.mobile_app_pixel_9
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+dogs+water+bowl+has+been+refilled.&language=en-US&voice=JennyNeural
          media_content_type: provider
        metadata:
          title: The dog's water bowl has been refilled.
          thumbnail: https://brands.home-assistant.io/_/tts/logo.png
        action: media_player.play_media
  mode: single
- id: '1726433710777'
  alias: 'Rear Gate: Open Notification'
  description: 'Contact sensor to monitor whether rear yard gate is open or closed.
    SUPPRESSED during a full yard mowing cycle: when input_boolean.mower_full_yard_cycle
    is on, the gate is intentionally open so the mower can reach the rear yard, and
    automation.mower_gate_reminders owns the messaging.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.rear_yard_gate
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.mower_full_yard_cycle
    state: 'off'
    alias: Not during a full yard mowing cycle
    note: Added 2026-08-17. During script.mower_full_yard_cycle the side gate is deliberately
      held open for the whole rear yard run, roughly 78 minutes, so this would announce
      "The gate has been opened" as a false alarm every time. automation.mower_gate_reminders
      handles all gate messaging during that cycle instead. Same suppression pattern
      already used on the garage door notifications.
  actions:
  - action: media_player.play_media
    target:
      entity_id: media_player.bedroom_group
    data:
      media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+gate+has+been+opened&language=en-US&voice=JennyNeural
      media_content_type: provider
    metadata:
      title: The gate has been opened
      thumbnail: https://brands.home-assistant.io/_/tts/logo.png
      media_class: app
      children_media_class:
      navigateIds:
      - {}
      - media_content_type: app
        media_content_id: media-source://tts
      - media_content_type: provider
        media_content_id: media-source://tts/tts.home_assistant_cloud?message=The+gate+has+been+opened&language=en-US&voice=JennyNeural
  - data:
      message: Side gate was opened at {{ now().strftime('%I:%M %p on %b %-d') }}
      title: Gate Notification
    action: notify.mobile_app_pixel_9
  mode: single
