- id: '1787009969985'
  alias: Mower Unattended Start
  description: 'Catches any Jason MoMower session that Home Assistant did not start,
    and opens the garage door for it.


    WHY THIS EXISTS. Built 2026-08-17 after a confirmed failure. During the front
    yard run that day the mower raised "Lidar temperature high with map" at 13:58:50
    and ended the session at roughly 96 percent. automation.mower_garage_return handled
    that return correctly and cleared input_boolean.mower_cycle_active at 14:02:40.
    The mower then charged to 100 percent and RESTARTED ITSELF at 14:55:30 to finish
    the remaining few percent, with no command from Home Assistant or the MOVAhome
    app. Because the flag had been cleared, nothing opened the door on the way out
    and nothing opened it on the return, and Scott had to work the door by hand both
    times.


    WHAT IT COVERS. Any undock Home Assistant did not initiate: the mower resuming
    an unfinished job after charging, and any session started from the MOVAhome app.


    WHY IT IS A SEPARATE AUTOMATION. automation.mower_garage_return is gated on input_boolean.mower_cycle_active
    being ON. This one has to fire on exactly the opposite condition, so it cannot
    live inside that automation without breaking its gate.


    HOW IT WORKS

    1. Fires when binary_sensor.jason_momower_docked has been off for 10 seconds.
    The 10 second hold filters the known docked-flag flicker on this firmware, and
    costs nothing: the mower backs out, then spends roughly 60 seconds turning and
    positioning before it is ready to move, so it is not near the doorway for at least
    a minute after undocking.

    2. Runs only when input_boolean.mower_cycle_active is OFF. Every Home Assistant
    initiated cycle raises that flag before it touches the door, so a scripted run
    can never reach this automation.

    3. Raises the flag itself. That hands the return leg to automation.mower_garage_return
    exactly as if script.mower_zone_cycle had started the job, and suppresses the
    garage door notification and garage climate automations for the rest of the session.

    4. Opens the door to the calibrated 21 inch gap, but ONLY if the door reads closed.
    This opener is a pulse type with no position control, and a second open pulse
    on a door that is open or stopped partway REVERSES it, which has stranded the
    mower outside before.

    5. If it opened the door, it waits out the rest of the 120 second exit window
    and closes it. If the door was already open when the mower undocked, it leaves
    the door alone entirely, on the assumption Scott opened it on purpose.

    6. Notifies Scott''s Pixel either way, since an unattended start is something
    he should know about.


    The flag is deliberately left ON at the end. automation.mower_garage_return clears
    it after the mower docks.'
  triggers:
  - entity_id: binary_sensor.jason_momower_docked
    for:
      seconds: 10
    id: unattended_undock
    to: 'off'
    trigger: state
  conditions:
  - alias: Only when Home Assistant did not start this session
    condition: state
    entity_id: input_boolean.mower_cycle_active
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    alias: Raise the suppression flag so the return leg is handled normally
    target:
      entity_id: input_boolean.mower_cycle_active
  - alias: Open the door to 21 inches, but ONLY if it is actually shut
    if:
    - alias: Door read closed at the moment the mower undocked
      condition: template
      value_template: '{{ door_was_closed }}'
    then:
    - action: cover.open_cover
      alias: Start the door opening
      target:
        entity_id: cover.garage_door
    - alias: Wait the calibrated interval for a 21 inch opening
      delay:
        milliseconds: 2500
    - action: cover.stop_cover
      alias: Stop the door partway
      target:
        entity_id: cover.garage_door
  - action: notify.mobile_app_pixel_9
    alias: Tell Scott the mower let itself out
    data:
      data:
        channel: alarm_stream
        importance: high
        notification_icon: mdi:robot-mower
        priority: high
        tag: mower_unattended
        ttl: 0
      message: Jason MoMower undocked without a Home Assistant command. {{ 'The garage
        door was opened for it and will close automatically.' if door_was_closed else
        'The garage door was already open, so it was left alone.' }}
      title: Mower Started On Its Own
  - alias: Close the door behind the mower, only if we opened it
    if:
    - alias: We are the ones who opened it
      condition: template
      value_template: '{{ door_was_closed }}'
    then:
    - alias: Finish out the 120 second exit window measured from the undock
      delay:
        seconds: 108
    - action: cover.close_cover
      alias: Close the garage door behind the mower
      target:
        entity_id: cover.garage_door
  mode: single
  variables:
    door_was_closed: '{{ is_state(''cover.garage_door'', ''closed'') }}'
- id: '1787083573676'
  alias: Mower Incomplete Job Alert
  description: "Tells Scott when a mowing job ends early and SILENTLY, so a partially
    mowed yard is not mistaken for a finished one.\n\nWHY THIS EXISTS. On 2026-08-18
    a Full Yard run mowed the rear yard, skipped the front yard entirely, mowed the
    side yard, then docked with battery to spare and no error present. Nothing in
    Home Assistant said a word, because every other alert keys off an error and that
    return looked completely normal. Scott only found out by walking outside.\n\nREBUILT
    2026-08-19 on sensor.jason_momower_status_notice. The original version compared
    sensor.jason_momower_mowing_progress against 95 percent, which was WRONG and false-alarmed
    on the successful side yard run that same evening: progress is measured against
    the WHOLE MAP, so a single-zone job reads around 13 percent even when it finishes
    perfectly. Do not reintroduce a progress threshold here.\n\nTHE SIGNAL. sensor.jason_momower_status_notice
    is a clean discriminator, verified against both runs on 2026-08-18:\n  Successful
    side yard run: 'Mowing task started' 16:12:17, then 'Mowing task completed' 16:39:44,
    exactly as the mower turned for home.\n  Failed Full Yard run: the sensor never
    left 'none'.\nSo a finished job announces itself and an abandoned one does not.
    This works for zone jobs and whole-map jobs alike, because it is the mower's own
    verdict rather than anything inferred from area covered.\n\nWHY IT TRIGGERS ON
    RETURNING RATHER THAN ON DOCKED. The notice is set at the moment the mower turns
    for home, and a later session would overwrite it with 'Mowing task started'. Capturing
    it on the way home and carrying it through the wait means a self-resume cannot
    erase the evidence before it is read. Triggering on returning also guarantees
    a real session actually happened, so this cannot fire on an unrelated dock.\n\nWHAT
    IT DELIBERATELY DOES NOT DO. It stays silent when an error is present, because
    sensor.jason_momower_error already drives two alerts in automation.mower_garage_return
    and a third here would be noise. It does not restart or resume anything. It reports,
    and Scott decides.\n\nThe notification quotes the raw notice text so an unexpected
    value is diagnosable rather than mysterious."
  triggers:
  - entity_id: sensor.jason_momower_state_name
    id: heading_home
    to: returning
    trigger: state
  actions:
  - alias: Let the status notice settle before reading it
    note: On 2026-08-18 the notice flipped to 'Mowing task completed' at 16:39:44.358
      and the returning transition landed at 16:39:44.804, so they are effectively
      simultaneous. A short settle covers ordering jitter between the two.
    delay:
      seconds: 10
  - alias: Capture the mower's own verdict before anything can overwrite it
    note: Captured here rather than read after docking, because a self-resume would
      reset this sensor to 'Mowing task started' and destroy the evidence. Scott's
      mower is known to resume unfinished jobs on its own after charging.
    variables:
      notice_at_return: '{{ states(''sensor.jason_momower_status_notice'') }}'
  - alias: Wait for the mower to actually reach the dock
    note: The 60 second hold filters the known docked-flag flicker, where docked reads
      on for under a second mid return. continue_on_timeout false means a return that
      never completes stays silent here and is left to the error automations.
    timeout:
      minutes: 20
    continue_on_timeout: false
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.jason_momower_docked
      to: 'on'
      for:
        seconds: 60
  - alias: Alert only if the mower never declared the task complete
    if:
    - alias: The completion notice was absent
      condition: template
      value_template: '{{ notice_at_return != ''Mowing task completed'' }}'
      note: Compared against the sensor's display string, which is what this entity
        reports as its state. The underlying attribute uses the snake_case form mowing_task_completed;
        do not mix them up.
    - alias: No error was raised, so nothing else told Scott
      condition: state
      entity_id: sensor.jason_momower_error
      state: none
    then:
    - alias: Tell Scott the job ended early, and quote what the mower did say
      action: notify.mobile_app_pixel_9
      data:
        title: Mowing Job Ended Early
        message: Jason MoMower docked without reporting the task complete, on {{ states('sensor.jason_momower_battery')
          }} percent battery and with no error. Status notice read "{{ notice_at_return
          }}". Check which zone got shorted before assuming the yard is done.
        data:
          tag: mower_incomplete
          sticky: true
          importance: high
          priority: high
          channel: alarm_stream
          ttl: 0
          notification_icon: mdi:robot-mower-outline
  mode: single
- id: '1787232090375'
  alias: Mower Restart Recovery
  description: 'Fires when Home Assistant finishes starting while input_boolean.mower_cycle_active
    is still ON, which means a restart or an integration reload landed in the middle
    of a mowing cycle.


    WHAT IT FIXES: an integration reload resets select.jason_momower_mowing_action
    back to All area. Confirmed twice, at 08:25:30 on 2026-08-19 and again mid job
    at 12:36:31. A mower left in All area silently ignores any zone list, so the remainder
    of the job runs the mower''s own whole map plan. This automation sets Zone again,
    reads it back, and tells Scott either way.


    WHAT IT CANNOT FIX, AND SCOTT SHOULD NOT EXPECT IT TO: a restart KILLS the running
    script.mower_zone_cycle. Every remaining step in that script, including the wait
    for undock, the 120 second clearance delay and the garage door close, is gone
    and will never execute. No helper and no automation can resume a killed script.
    The garage door may therefore be sitting open with nothing scheduled to close
    it, which is why both notification branches report the live door state and tell
    Scott to check it himself.


    WHY IT WAITS: after a restart the mower entities come back as unavailable for
    a while. Writing to the select before it is available would fail. The wait_template
    holds until the select reports a real value, then a 5 second settle, then the
    write.


    WHY IT READS BACK: this integration can return success on a write that never reached
    the mower. Verified 2026-08-18, where an unverified select.select_option showed
    Zone optimistically in HA and a later device poll corrected it to All area. The
    read back after 6 seconds is the only trustworthy confirmation, and it is the
    same pattern already proven inside script.mower_zone_cycle.


    This automation does NOT touch the garage door, does NOT restart the mow, and
    does NOT clear any flag. It only restores the mode and reports. Anything beyond
    that is Scott''s call with eyes on the mower.'
  triggers:
  - event: start
    id: ha_started
    note: Fires once when HA finishes starting. Also covers the reload case indirectly,
      since Scott's reloads have accompanied full restarts.
    trigger: homeassistant
  conditions:
  - alias: Only if a mowing cycle was in progress when HA went down
    condition: state
    entity_id: input_boolean.mower_cycle_active
    note: This helper is restore-on-restart and was confirmed to survive both restarts
      on 2026-08-19, so it is a reliable marker that a cycle was live. If it is off,
      there is nothing to recover and the automation stays silent.
    state: 'on'
  actions:
  - alias: Hold until the mower entities come back from the restart
    continue_on_timeout: false
    note: wait_template rather than wait_for_trigger on purpose. wait_for_trigger
      only fires on a CHANGE, so if the select were already available when this runs
      it would hang until the timeout. wait_template passes immediately when the condition
      is already true, which is exactly the behaviour needed here. continue_on_timeout
      false means a mower that never comes back produces no misleading success message.
    timeout: 00:05:00
    wait_template: '{{ states(''select.jason_momower_mowing_action'') not in [''unavailable'',
      ''unknown''] }}'
  - alias: Let the first poll settle before writing
    delay: 00:00:05
  - action: select.select_option
    alias: Set mowing action back to Zone
    data:
      option: Zone
    target:
      entity_id: select.jason_momower_mowing_action
  - alias: Settle before reading back
    delay: 00:00:06
    note: '6 seconds, matching the proven pre-flight inside script.mower_zone_cycle.
      Load bearing, not padding: the write can report success without reaching the
      mower, so the read back needs time for a real device poll to land.'
  - alias: Report whether the mode was actually restored
    else:
    - action: notify.mobile_app_pixel_9
      alias: Mode restore FAILED, hard alert
      data:
        data:
          channel: alarm_stream
          importance: high
          notification_icon: mdi:alert-octagon
          persistent: true
          priority: high
          sticky: true
          tag: mower_restart_recovery
          ttl: 0
        message: Home Assistant restarted while a mowing cycle was active and the
          attempt to set mowing action back to Zone did not take. It reads {{ states('select.jason_momower_mowing_action')
          }}. Any remaining zone list will be ignored and the mower will run its own
          whole map plan. The garage door reads {{ states('cover.garage_door') }}
          and the mower reads {{ states('sensor.jason_momower_state_name') }}. The
          cycle script was also killed, so nothing will close the door.
        title: Restart Landed Mid Mow, Zone Mode NOT Restored
    - action: tts.speak
      alias: Spoken alert, any hour
      data:
        cache: false
        media_player_entity_id: media_player.bedroom_group
        message: Home Assistant restarted during a mowing cycle and zone mode could
          not be restored. The mower may run the whole map. Please check the mower
          and the garage door.
      target:
        entity_id: tts.home_assistant_cloud
    if:
    - alias: Reads exactly Zone
      condition: state
      entity_id: select.jason_momower_mowing_action
      state: Zone
    then:
    - action: notify.mobile_app_pixel_9
      alias: Recovered, but warn about the killed script
      data:
        data:
          channel: alarm_stream
          importance: high
          notification_icon: mdi:restart-alert
          persistent: true
          priority: high
          sticky: true
          tag: mower_restart_recovery
          ttl: 0
        message: 'Home Assistant restarted while a mowing cycle was active. Mowing
          action has been set back to Zone and verified. WARNING: the running cycle
          script was killed by the restart, so the garage door close and the clearance
          delay will never run. The garage door currently reads {{ states(''cover.garage_door'')
          }} and the mower reads {{ states(''sensor.jason_momower_state_name'') }}.
          Check the door yourself.'
        title: Restart Landed Mid Mow, Zone Mode Restored
    - action: tts.speak
      alias: Spoken alert, any hour
      data:
        cache: false
        media_player_entity_id: media_player.bedroom_group
        message: Home Assistant restarted during a mowing cycle. Zone mode has been
          restored, but the cycle script was killed and the garage door will not close
          on its own. Please check the garage door.
      target:
        entity_id: tts.home_assistant_cloud
  mode: single
- id: mower_chain_advance
  alias: Mower Chain Advance
  description: 'Drives the chained whole-yard run. script.mower_full_yard_chain starts
    leg one, the rear yard; this automation owns everything after that. It reads input_select.mower_chain_leg
    to know where the chain is and advances rear to front to side, each leg being
    its own single-zone session ending in a normal return and dock.


    WHY THIS EXISTS: a single multi-zone job with zone_ids [3, 1, 2] failed on 2026-08-18,
    2026-08-19 and 2026-08-20. The 2026-08-20 run was fully clean, with Zone mode
    held all the way through and no restarts, and the mower still finished the rear
    yard, drove to the shut garage door as if to dock, then went to the side yard
    and reported Some zones unreachable. Multi-zone chaining inside the mower does
    not work, so the chain lives in Home Assistant instead.


    WHY THE THREE MINUTE HOLD ON THE DOCKED TRIGGER: two reasons, both load bearing.
    First, binary_sensor.jason_momower_docked flickers ON mid return, once for 33.5
    seconds, so a bare trigger would fire while the mower is still outside. Second,
    automation.mower_garage_return waits 30 seconds after docking, rechecks, closes
    the door and only then clears input_boolean.mower_cycle_active, which on 2026-08-20
    took until 50 seconds after the dock. Starting the next leg before that finishes
    would send open_cover into a closing door, and on this pulse opener that REVERSES
    it. Three minutes clears both with margin. Do not shorten it.


    WHY THE HEALTH CONDITIONS: every advancing branch requires status notice Mowing
    task completed, error none, cycle flag off, garage door closed, and the mower
    actually charging. On 2026-08-20 the failed run docked reporting Some zones unreachable,
    so it would have failed this test and stopped the chain instead of advancing over
    a skipped zone. That is the whole point of the design.


    GATE HANDLING: only the rear yard needs the gate open and only the side yard is
    obstructed by it, which is Scott''s call. So the close-the-gate prompt fires when
    leg one DOCKS, a real event with no time pressure, rather than mid-mow off sensor.jason_momower_current_zone.
    That sensor has falsely reported Front Yard (#1) twice while the mower was physically
    heading elsewhere, for 98 seconds on 2026-08-18 and 84 seconds on 2026-08-20.
    The front leg runs regardless of gate state. The side leg requires the gate to
    read exactly off, so unavailable and unknown both hold the chain rather than risking
    it, and the chain parks at Waiting For Gate and resumes by itself when the sensor
    reports closed.


    DOES NOT USE input_boolean.mower_full_yard_cycle. That marker enables the old
    mid-mow gate prompts and is deliberately left alone here.'
  triggers:
  - entity_id: binary_sensor.jason_momower_docked
    for: 00:03:00
    id: leg_docked
    note: Three minute hold is deliberate and is explained in the description. It
      filters the documented docked flicker AND gives automation.mower_garage_return
      time to close the door and clear the cycle flag.
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.rear_yard_gate
    id: gate_now_closed
    note: Only acted on when the chain is parked at Waiting For Gate. Lets the side
      yard leg start by itself once Scott shuts the gate, with no further action from
      him. Gate reads on = OPEN, so off means closed.
    to: 'off'
    trigger: state
  actions:
  - alias: Decide what the chain does next
    choose:
    - alias: Gate finally closed while the chain was waiting, run the side yard
      conditions:
      - condition: trigger
        id: gate_now_closed
      - condition: state
        entity_id: input_select.mower_chain_leg
        state: Waiting For Gate
      sequence:
      - action: input_select.select_option
        data:
          option: Side Yard
        target:
          entity_id: input_select.mower_chain_leg
      - action: notify.mobile_app_pixel_9
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:gate
            priority: high
            tag: mower_chain
            ttl: 0
          message: Gate is confirmed closed. Starting the final leg, the side yard.
            Battery is {{ states('sensor.jason_momower_battery') }} percent.
          title: Chain Resuming, Side Yard
      - action: script.mower_zone_cycle
        data:
          zone_ids:
          - 2
    - alias: Leg one done, advance to the front yard and ask Scott to shut the gate
      conditions:
      - condition: trigger
        id: leg_docked
      - condition: state
        entity_id: input_select.mower_chain_leg
        state: Rear Yard
      - condition: state
        entity_id: sensor.jason_momower_status_notice
        state: Mowing task completed
      - condition: state
        entity_id: sensor.jason_momower_error
        state: none
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: sensor.jason_momower_state_name
        state:
        - charging
        - charging_completed
      sequence:
      - action: input_select.select_option
        data:
          option: Front Yard
        target:
          entity_id: input_select.mower_chain_leg
      - action: notify.mobile_app_pixel_9
        alias: The gate prompt, now fired off a real dock instead of a lying zone
          sensor
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:gate-arrow-right
            priority: high
            sticky: true
            tag: mower_gate
            ttl: 0
          message: Rear yard is finished and Jason MoMower has docked. Go close the
            side gate now. The front yard leg is starting and takes about 55 minutes,
            so there is no rush, but the gate must be shut before the side yard leg
            begins. Battery is {{ states('sensor.jason_momower_battery') }} percent.
          title: Rear Yard Done, Close The Side Gate
      - action: tts.speak
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: Rear yard is finished and the mower has docked. Please go close
            the side gate. The front yard is starting now.
        target:
          entity_id: tts.home_assistant_cloud
      - action: script.mower_zone_cycle
        data:
          zone_ids:
          - 1
    - alias: Leg two done and gate confirmed shut, advance to the side yard
      conditions:
      - condition: trigger
        id: leg_docked
      - condition: state
        entity_id: input_select.mower_chain_leg
        state: Front Yard
      - condition: state
        entity_id: sensor.jason_momower_status_notice
        state: Mowing task completed
      - condition: state
        entity_id: sensor.jason_momower_error
        state: none
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: sensor.jason_momower_state_name
        state:
        - charging
        - charging_completed
      - alias: Gate reads exactly off, meaning confirmed CLOSED
        condition: state
        entity_id: binary_sensor.rear_yard_gate
        state: 'off'
      sequence:
      - action: input_select.select_option
        data:
          option: Side Yard
        target:
          entity_id: input_select.mower_chain_leg
      - action: notify.mobile_app_pixel_9
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:robot-mower
            priority: high
            tag: mower_chain
            ttl: 0
          message: Front yard is finished and the gate is confirmed closed. Starting
            the final leg, the side yard. Battery is {{ states('sensor.jason_momower_battery')
            }} percent.
          title: Front Yard Done, Starting Side Yard
      - action: script.mower_zone_cycle
        data:
          zone_ids:
          - 2
    - alias: Leg two done but the gate is not confirmed shut, hold the chain
      conditions:
      - condition: trigger
        id: leg_docked
      - condition: state
        entity_id: input_select.mower_chain_leg
        state: Front Yard
      - condition: state
        entity_id: sensor.jason_momower_status_notice
        state: Mowing task completed
      - condition: state
        entity_id: sensor.jason_momower_error
        state: none
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: sensor.jason_momower_state_name
        state:
        - charging
        - charging_completed
      sequence:
      - action: input_select.select_option
        data:
          option: Waiting For Gate
        target:
          entity_id: input_select.mower_chain_leg
      - action: notify.mobile_app_pixel_9
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:gate-alert
            priority: high
            sticky: true
            tag: mower_gate
            ttl: 0
          message: Front yard is finished and the mower is docked, but the rear yard
            gate reads {{ states('binary_sensor.rear_yard_gate') }} rather than closed.
            The side yard leg is ON HOLD and will start automatically the moment the
            gate sensor reports closed. Nothing is running until then.
          title: Chain Held, Gate Not Confirmed Closed
      - action: tts.speak
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: Front yard is finished. The side yard leg is on hold because the
            rear yard gate is not confirmed closed. It will start by itself once the
            gate reads closed.
        target:
          entity_id: tts.home_assistant_cloud
    - alias: Final leg done, whole yard complete
      conditions:
      - condition: trigger
        id: leg_docked
      - condition: state
        entity_id: input_select.mower_chain_leg
        state: Side Yard
      - condition: state
        entity_id: sensor.jason_momower_status_notice
        state: Mowing task completed
      - condition: state
        entity_id: sensor.jason_momower_error
        state: none
      - condition: state
        entity_id: input_boolean.mower_cycle_active
        state: 'off'
      - condition: state
        entity_id: cover.garage_door
        state: closed
      - condition: state
        entity_id: sensor.jason_momower_state_name
        state:
        - charging
        - charging_completed
      sequence:
      - action: input_select.select_option
        data:
          option: Idle
        target:
          entity_id: input_select.mower_chain_leg
      - action: notify.mobile_app_pixel_9
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:check-decagram
            priority: high
            tag: mower_chain
            ttl: 0
          message: All three legs finished and reported the task complete. Rear, front
            and side are all mowed and Jason MoMower is docked and charging on {{
            states('sensor.jason_momower_battery') }} percent. The chain is back to
            Idle.
          title: Whole Yard Complete
      - action: tts.speak
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: The whole yard is finished. Rear, front and side are all mowed
            and the mower is docked and charging.
        target:
          entity_id: tts.home_assistant_cloud
    - alias: FALLBACK, a leg ended without a clean completion, stop the chain
      conditions:
      - condition: trigger
        id: leg_docked
      - alias: A chain is genuinely in progress
        condition: not
        conditions:
        - condition: state
          entity_id: input_select.mower_chain_leg
          state: Idle
      - alias: Not the legitimate parked state waiting on the gate
        condition: not
        conditions:
        - condition: state
          entity_id: input_select.mower_chain_leg
          state: Waiting For Gate
      note: Reached only when a leg docked but one of the health conditions above
        failed, because choose takes the FIRST matching branch and every advancing
        branch is listed before this one. This is what stops the chain silently advancing
        over a failed leg, which is exactly what would have happened on 2026-08-20
        when the mower docked reporting Some zones unreachable rather than Mowing
        task completed. It sets the pointer back to Idle so nothing further fires,
        and reports which specific readings failed.
      sequence:
      - action: input_select.select_option
        data:
          option: Idle
        target:
          entity_id: input_select.mower_chain_leg
      - action: notify.mobile_app_pixel_9
        data:
          data:
            channel: alarm_stream
            importance: high
            notification_icon: mdi:alert-octagon
            priority: high
            sticky: true
            tag: mower_chain
            ttl: 0
          message: A mowing leg ended without a clean completion, so the chain has
            STOPPED rather than starting the next leg. Status notice reads {{ states('sensor.jason_momower_status_notice')
            }}, error reads {{ states('sensor.jason_momower_error') }}, cycle flag
            reads {{ states('input_boolean.mower_cycle_active') }}, garage door reads
            {{ states('cover.garage_door') }}, mower state reads {{ states('sensor.jason_momower_state_name')
            }}. Battery is {{ states('sensor.jason_momower_battery') }} percent. Check
            what got skipped before assuming the yard is done.
          title: Chain Stopped, Leg Did Not Complete
      - action: tts.speak
        data:
          cache: false
          media_player_entity_id: media_player.bedroom_group
          message: A mowing leg ended without reporting completion, so the chain has
            stopped. Please check the mower.
        target:
          entity_id: tts.home_assistant_cloud
  mode: single
- id: '1787255046492'
  alias: Master Updates Notification
  description: 'Notifies when any update entity becomes available or is completed,
    and uses the IKEA Fado lamp in the bedroom as a visual pending indicator: green
    while a critical infrastructure update is outstanding (HA Core, OS, Supervisor,
    Apps, UniFi gear), royalblue for everything else, and off once nothing is pending.


    Replaces the two prior automations, Master Critical System Updates Notification
    and Master Standard Updates Notification. Both of those triggered on the raw state_changed
    event with no entity filter, so every state change across all 5,600+ entities
    woke them and ran four template conditions, one of which looped the entire state
    machine. They were also broken: their variables blocks stringified new_state,
    producing thousands of ''str object has no attribute name'' template warnings
    per day and garbled notification names.


    This version triggers only on sensor.pending_updates, a template helper whose
    state is the count of update entities currently on. Home Assistant subscribes
    that template to the update domain alone, so the automation is woken only when
    an update actually appears or completes rather than on every state change in the
    system.


    LAMP OWNERSHIP. Neither of the old automations ever turned the lamp off, so a
    completed update simply relit it. This version tracks ownership with input_boolean.fado_update_indicator_active,
    which is set on whenever this automation lights the lamp. When the pending count
    reaches zero the lamp is turned off ONLY if that flag is on, so a lamp Scott turned
    on himself for normal bedroom use is never switched off by an update completing.
    A second trigger watches the lamp for any transition to off (manual, a scene such
    as the 11 PM Lights Off scene, or this automation itself) and clears the flag,
    so ownership is released as soon as anyone else takes the lamp.


    The changed entity is identified as the update entity with the most recent last_changed,
    which is sound because last_changed only advances on an actual on/off transition,
    not on attribute updates. Limitation worth knowing: if two update entities flip
    in opposite directions within the same instant the count is unchanged and no notification
    fires, and if two flip the same direction at once only the most recent is named.
    Both are rare. The startup guard skips the unavailable to value transition after
    a restart so a reboot does not produce a spurious notification.'
  triggers:
  - entity_id: sensor.pending_updates
    id: updates_changed
    trigger: state
  - entity_id: light.bedroom_fado_lamp
    id: lamp_turned_off
    to: 'off'
    trigger: state
  conditions:
  - alias: Skip startup and unavailable transitions
    condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unknown'',''unavailable''] and trigger.to_state is not none and trigger.to_state.state
      not in [''unknown'',''unavailable''] }}'
  actions:
  - choose:
    - alias: Lamp turned off by anyone, release ownership
      conditions:
      - condition: trigger
        id: lamp_turned_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fado_update_indicator_active
    - alias: No updates left pending, clear the indicator
      conditions:
      - condition: trigger
        id: updates_changed
      - condition: state
        entity_id: sensor.pending_updates
        state: '0'
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          message: '{{ title_word }} for {{ clean_name }}'
          title: Update {{ title_word }}
      - if:
        - condition: state
          entity_id: input_boolean.fado_update_indicator_active
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.bedroom_fado_lamp
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fado_update_indicator_active
    - alias: Critical infrastructure update
      conditions:
      - condition: trigger
        id: updates_changed
      - condition: template
        value_template: '{% set critical = [''update.home_assistant_operating_system_update'',''update.home_assistant_supervisor_update'',''update.home_assistant_core_update'',''update.esphome_update'',''update.matter_server_update'',''update.openthread_border_router_update'',''update.zigbee2mqtt_update'',''update.z_wave_js_ui_update'',''update.mosquitto_broker_update'',''update.studio_code_server_update'',''update.terminal_ssh_update'',''update.file_editor_update'',''update.samba_share_update'',''update.advanced_ssh_web_terminal_update'',''update.home_assistant_mcp_server_update'',''update.music_assistant_server_update'',''update.ring_mqtt_with_video_streaming_update'',''update.usw_flex_mini'',''update.usw_pro_max_24_poe'',''update.living_room_usw_flex_mini'',''update.bedroom_usw_flex_mini'',''update.office_usw_flex_mini'',''update.usw_aggregation'',''update.usp_pdu_pro'',''update.udm_pro'',''update.usw_flex_2_5g_5'',''update.garage_ap_u6_lite'',''update.living_room_ap_u6_lite'',''update.cloud_gateway_ultra_2'']
          %}{{ changed_entity in critical }}'
      sequence:
      - action: notify.mobile_app_pixel_9
        data:
          message: '{{ title_word }} for {{ clean_name }}'
          title: Update {{ title_word }}
      - action: light.turn_on
        data:
          rgb_color:
          - 0
          - 255
          - 0
        target:
          entity_id: light.bedroom_fado_lamp
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.fado_update_indicator_active
    default:
    - action: notify.mobile_app_pixel_9
      data:
        message: '{{ title_word }} for {{ clean_name }}'
        title: Update {{ title_word }}
    - action: light.turn_on
      data:
        color_name: royalblue
      target:
        entity_id: light.bedroom_fado_lamp
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.fado_update_indicator_active
  max: 20
  mode: queued
  variables:
    changed_entity: '{{ (states.update | sort(attribute=''last_changed'') | last).entity_id
      }}'
    changed_state: '{{ (states.update | sort(attribute=''last_changed'') | last).state
      }}'
    clean_name: '{% set n = state_attr(changed_entity, ''friendly_name'') | default('''',
      true) %}{% set n = n | regex_replace(find=''(?i)update'', replace='''') %}{%
      set n = n | regex_replace(find=''(?i)firmware'', replace='''') %}{% set n =
      n | regex_replace(find=''\s+'', replace='' '') %}{{ n.strip().title() }}'
    title_word: '{{ ''Available'' if changed_state == ''on'' else ''Completed'' }}'
- id: '1787268207663'
  alias: NFC Tag Actions (Consolidated)
  description: 'Single handler for 11 NFC tags, replacing 11 separate automations.
    Each tag maps to its own trigger id and its own choose branch, so no two branches
    can ever match the same run and the first match behavior of choose cannot silently
    swallow a branch.


    Mode is parallel with max 10 so scanning one tag never blocks another. The old
    automations were each mode single but independent of one another, so a slow action
    in one could not delay the rest; parallel preserves that independence. The tradeoff
    is that a rapid double scan of the same tag now runs twice instead of dropping
    the second. For the lock toggles this is harmless because both runs read the same
    lock state and issue the same command.


    Tags handled: Front Door Deadbolt (eff1012d), Laundry Room Door Deadbolt (two
    separate physical tags in two different physical locations, 4b16c7c6 and 1c2ad52a,
    both intentional, both mapped to trigger id laundry_room), Rear Door Deadbolt
    (8018f3c2), Sunroom Door Deadbolt (6937711c), Bedroom Closet Deadbolt (b52cebc2),
    Office Door (0b24eba4, unlock only plus notify), Garage keypad (b5c0f90b), Bedside
    lamps (aa413690), Garbage can TTS (c5100db2).


    Defect found and fixed during consolidation: tag eff1012d previously fired two
    separate enabled automations that performed the identical front door toggle, so
    every scan ran the toggle twice. It is now one branch.


    The HVAC filter tag (823c6552) was REMOVED on 2026-08-20 at Scott''s instruction.
    It had reset counter.hvac_filter_change_countdown and written a logbook entry
    gated on input_datetime.filter_reminder_date equalling today. That counter was
    orphaned, nothing decremented or displayed it, and the real filter reminder system
    is automation.hvac_filter_reminder_daily_check plus script.hvac_filter_replaced,
    which run on a 90 day cycle off input_datetime.filter_reminder_date. The counter
    helper was deleted. input_datetime.filter_reminder_date was KEPT because the live
    reminder system depends on it. The physical tag 823c6552 now does nothing.


    The disabled second front door trigger (2b8bddee) is carried forward still disabled
    so the original intent is not lost.


    NOT merged here: NFC - Toggle Garage Door from Truck (b38fed34). It uses wait_for_trigger
    with a 30 second timeout. Folding it in would either block every other tag for
    up to 30 seconds under mode single, or change its own re-entrancy under mode parallel.
    It stays standalone.'
  triggers:
  - id: front_door
    tag_id: eff1012d-ee57-4eec-838c-9edcd248eb05
    trigger: tag
  - enabled: false
    id: front_door
    tag_id: 2b8bddee-c0a6-4841-87bf-7a4957daeda4
    trigger: tag
  - id: laundry_room
    tag_id: 4b16c7c6-8c65-441a-bbbf-a9238674ee37
    trigger: tag
  - id: laundry_room
    tag_id: 1c2ad52a-44d0-459a-afca-0792d14a2bff
    trigger: tag
  - id: rear_door
    tag_id: 8018f3c2-a3be-4347-ab37-7e384719b753
    trigger: tag
  - id: sunroom
    tag_id: 6937711c-28d9-44e2-8ce0-f8e5df120d78
    trigger: tag
  - id: closet
    tag_id: b52cebc2-7126-4b57-ae72-183c5fda497a
    trigger: tag
  - id: office
    tag_id: 0b24eba4-5a73-4827-a108-1e00e06b197f
    trigger: tag
  - id: garage_keypad
    tag_id: b5c0f90b-f58e-4952-95bb-9a3a281fb70e
    trigger: tag
  - id: bedside_lamps
    tag_id: aa413690-d152-42ca-b663-8776638160c7
    trigger: tag
  - id: garbage_can
    tag_id: c5100db2-1d33-4338-8c3a-7d0ce419f7c2
    trigger: tag
  actions:
  - choose:
    - alias: Front Door Deadbolt toggle
      conditions:
      - condition: trigger
        id: front_door
      sequence:
      - else:
        - action: lock.lock
          target:
            entity_id: lock.front_door_deadbolt
        if:
        - condition: state
          entity_id: lock.front_door_deadbolt
          state: locked
        then:
        - action: lock.unlock
          target:
            entity_id: lock.front_door_deadbolt
    - alias: Laundry Room Door Deadbolt toggle (two physical tags)
      conditions:
      - condition: trigger
        id: laundry_room
      sequence:
      - else:
        - action: lock.lock
          target:
            entity_id: lock.laundry_room_door_deadbolt
        if:
        - condition: state
          entity_id: lock.laundry_room_door_deadbolt
          state: locked
        then:
        - action: lock.unlock
          target:
            entity_id: lock.laundry_room_door_deadbolt
    - alias: Rear Door Deadbolt toggle
      conditions:
      - condition: trigger
        id: rear_door
      sequence:
      - else:
        - action: lock.lock
          target:
            entity_id: lock.rear_door_deadbolt
        if:
        - condition: state
          entity_id: lock.rear_door_deadbolt
          state: locked
        then:
        - action: lock.unlock
          target:
            entity_id: lock.rear_door_deadbolt
    - alias: Sunroom Door Deadbolt toggle
      conditions:
      - condition: trigger
        id: sunroom
      sequence:
      - else:
        - action: lock.lock
          target:
            entity_id: lock.sunroom_door_deadbolt
        if:
        - condition: state
          entity_id: lock.sunroom_door_deadbolt
          state: locked
        then:
        - action: lock.unlock
          target:
            entity_id: lock.sunroom_door_deadbolt
    - alias: Bedroom Closet Deadbolt toggle
      conditions:
      - condition: trigger
        id: closet
      sequence:
      - else:
        - action: lock.lock
          target:
            entity_id: lock.bedroom_closet_door_deadbolt
        if:
        - condition: state
          entity_id: lock.bedroom_closet_door_deadbolt
          state: locked
        then:
        - action: lock.unlock
          target:
            entity_id: lock.bedroom_closet_door_deadbolt
    - alias: Office Door unlock only, then notify
      conditions:
      - condition: trigger
        id: office
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.office_door_lock
      - action: notify.send_message
        data:
          message: Office door lock unlocked
          title: Office Door
        target:
          entity_id: notify.scott_s_phone
    - alias: Garage keypad tag opens garage and unlocks laundry room
      conditions:
      - condition: trigger
        id: garage_keypad
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.garage_door
      - action: lock.unlock
        target:
          entity_id: lock.laundry_room_door_deadbolt
      - action: notify.mobile_app_pixel_9
        data:
          message: Garage notification
          title: Garage door open/Laundry room door unlocked
    - alias: Bedside lamps toggle
      conditions:
      - condition: trigger
        id: bedside_lamps
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedroom_bedside_lamps_group
    - alias: Garbage can set out TTS announcement
      conditions:
