                priority: high
                channel: alarm_stream
                importance: high
          - delay:
              hours: 1
    - conditions:
      - condition: trigger
        id:
        - Offline
      sequence:
      - delay:
          seconds: 1
      - action: media_player.play_media
        target:
          entity_id: media_player.bedroom_group
        data:
