      - target:
          entity_id: light.tv_lights
        data: {}
        action: light.turn_on
  - delay: 00:00:02
  - target:
      entity_id: scene.medication_rainbow_effect
    action: scene.turn_on
    data: {}
  - delay: 00:00:20
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not tv_lights_were_on }}'
        note: Template is intentional. Tests the captured variable tv_lights_were_on;
          a native state condition would re-evaluate at check time and break the save
          and restore logic. Do not convert.
      sequence:
      - target:
          entity_id: light.tv_lights
        action: light.turn_off
        data: {}
    - conditions:
      - condition: template
        value_template: '{{ tv_lights_were_on }}'
        note: Template is intentional. Tests the captured variable tv_lights_were_on;
          a native state condition would re-evaluate at check time and break the save
          and restore logic. Do not convert.
      sequence:
      - data:
          lights:
          - light.tv_lights
          adapt_color: true
          adapt_brightness: true
          turn_on_lights: true
          prefer_rgb_color: true
          transition: '45'
        action: adaptive_lighting.apply
