- id: '1730560445559'
  alias: NFC - HVAC Filter Change Reminder
  description: ''
  triggers:
  - tag_id: 823c6552-e013-4483-a590-fb81af51aee8
    trigger: tag
    id: Tag
  - at: 08:00:00
    trigger: time
    enabled: false
  conditions:
  - condition: template
    value_template: '{{ states(''input_datetime.filter_reminder_date'') == (now().strftime(''%Y-%m-%d''))
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Tag
      sequence:
      - data:
          name: HVAC Filter Change Logged
          message: HVAC filter change was logged on {{ now().strftime('%Y-%m-%d')
            }}.
        action: logbook.log
      - data:
          title: Set Filter Reminder Date
          message: Please set a date for the next HVAC filter change reminder using
            the input_datetime.filter_reminder_date helper in Home Assistant.
        action: persistent_notification.create
    - conditions:
      - condition: template
        value_template: '{{ states(''input_datetime.filter_reminder_date'') == (now().strftime(''%Y-%m-%d''))
          }}'
      sequence:
      - data:
          message: 'Reminder: It''s time to change your HVAC filter.'
        action: notify.mobile_app_pixel_9
