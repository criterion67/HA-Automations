- id: '1748708440470'
  alias: Charge monitor for curtain motors
  description: Announces via TTS when curtain motors are fully charged and reminds
    every 5 minutes while still plugged in
  triggers:
  - trigger: numeric_state
    entity_id: sensor.bedroom_curtain_right_battery
    above: 99
    id: Right
  - trigger: numeric_state
    entity_id: sensor.bedroom_curtain_left_battery
    above: 99
    id: Left
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Right
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://media_source/local/Best Chime Tone.mp3
          media_content_type: audio/mpeg
        metadata:
          title: Best Chime Tone.mp3
        action: media_player.play_media
      - delay: 00:00:02
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=Right+curtain+motor+now+fully+charged&language=en-US&voice=AriaNeural%7C%7Cnarration-professional
          media_content_type: provider
        metadata:
          title: Right curtain motor now fully charged
          thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
          media_class: app
        action: media_player.play_media
      - repeat:
          while:
          - condition: state
            entity_id: sensor.bedroom_curtain_right_power_source
            state: dc
          sequence:
          - delay: 00:05:00
          - target:
              entity_id: media_player.bedroom_group
            data:
              media_content_id: media-source://tts/tts.home_assistant_cloud?message=Right+curtain+motor+is+still+plugged+in+and+charging&language=en-US&voice=AriaNeural%7C%7Cnarration-professional
              media_content_type: provider
            action: media_player.play_media
          - delay: 00:00:02
    - conditions:
      - condition: trigger
        id: Left
      sequence:
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://media_source/local/Best Chime Tone.mp3
          media_content_type: audio/mpeg
        metadata:
          title: Best Chime Tone.mp3
        action: media_player.play_media
      - delay: 00:00:02
      - target:
          entity_id: media_player.bedroom_group
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message=Left+curtain+motor+now+fully+charged&language=en-US&voice=AriaNeural%7C%7Cnarration-professional
          media_content_type: provider
        metadata:
          title: Left curtain motor now fully charged
          thumbnail: https://brands.home-assistant.io/_/cloud/logo.png
          media_class: app
        action: media_player.play_media
      - repeat:
          while:
          - condition: state
            entity_id: sensor.bedroom_curtain_left_power_source
            state: dc
          sequence:
          - delay: 00:05:00
          - target:
              entity_id: media_player.bedroom_group
            data:
              media_content_id: media-source://tts/tts.home_assistant_cloud?message=Left+curtain+motor+is+still+plugged+in+and+charging&language=en-US&voice=AriaNeural%7C%7Cnarration-professional
              media_content_type: provider
            action: media_player.play_media
          - delay: 00:00:02
  mode: single
