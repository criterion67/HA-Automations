- id: '1757806464320'
  alias: Internet Connectivity Monitor
  description: 'Notify + change cabinet lights when internet goes down or comes back
    up. Forces light ON for red warning.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.8_8_8_8
    to: 'off'
    for: 00:00:10
    id: internet_down
  - trigger: state
    entity_id: binary_sensor.8_8_8_8
    to: 'on'
    id: internet_up
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: internet_down
      sequence:
      - data:
          message: The internet has been unreachable for 10 seconds (test).
          title: Internet Down
        action: script.notify_alert
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ''Red'' in (state_attr(''select.network_cabinet_ws2811_preset'',''options'')
              or []) }}

              '
          sequence:
          - target:
              entity_id: select.network_cabinet_ws2811_preset
            data:
              option: Red
            action: select.select_option
        default:
        - target:
            entity_id: light.network_cabinet_ws2811
          data:
            rgb_color:
            - 255
            - 0
            - 0
            brightness_pct: 100
          action: light.turn_on
      - target:
          entity_id: light.network_cabinet_ws2811
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: internet_up
      sequence:
      - data:
          message: The internet connection is back online.
          title: Internet Restored
        action: script.notify_alert
      - choose:
        - conditions:
          - condition: state
            entity_id: light.network_cabinet_ws2811
            state: 'on'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ ''UniFi Blue'' in (state_attr(''select.network_cabinet_ws2811_preset'',''options'')
                  or []) }}

                  '
              sequence:
              - target:
                  entity_id: select.network_cabinet_ws2811_preset
                data:
                  option: UniFi Blue
                action: select.select_option
            default:
            - target:
                entity_id: light.network_cabinet_ws2811
              data:
                rgb_color:
                - 0
                - 102
                - 255
                brightness_pct: 100
              action: light.turn_on
        default:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ''UniFi Blue'' in (state_attr(''select.network_cabinet_ws2811_preset'',''options'')
                or []) }}

                '
            sequence:
            - target:
                entity_id: select.network_cabinet_ws2811_preset
              data:
                option: UniFi Blue
              action: select.select_option
  mode: single
