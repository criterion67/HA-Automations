- id: '1772661391431'
  alias: Master Zigbee2MQTT Watchdog
  description: 'State-based watchdog: if the Z2M bridge connection sensor goes offline
    for 10 minutes (giving the built-in Z2M watchdog time to self-recover), automatically
    restart the Z2M addon and send a mobile notification.


    NOTIFY WRAPPER 2026-09-22: every direct notify.mobile_app_* call was replaced
    by script.notify_alert (or script.notify_clear for clear_notification) with the
    same message, title, tag, channel, importance, priority, ttl, actions, sticky,
    persistent, color, image, url and icon values, and target set to watch or bill
    where the call went to those devices. Delivery behavior is unchanged; channel
    and importance policy now lives in the shared scripts.'
  triggers:
  - entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: 'off'
    for: 00:10:00
    id: z2m_down
    trigger: state
  conditions: []
  actions:
  - action: hassio.addon_restart
    data:
      addon: 45df7312_zigbee2mqtt
  - delay: 00:00:10
  - action: script.notify_alert
    data:
      message: Z2M bridge was offline for 10+ minutes and was automatically restarted
        at {{ now().strftime('%I:%M %p on %b %-d') }}. Check that devices are responding.
      title: ⚠️ Zigbee2MQTT Restarted
      channel: System Alerts
      priority: high
      ttl: 0
      icon: mdi:zigbee
  mode: single
