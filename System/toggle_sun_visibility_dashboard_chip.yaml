- id: '1743727229575'
  alias: Toggle Sun Visibility Dashboard Chip
  description: Toggle dawn and dusk badges based on sun events
  triggers:
  - trigger: time
    at: sensor.sun_next_dawn_time
    id: dawn
  - trigger: time
    at: sensor.sun_next_dusk_time
    id: dusk
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.show_dawn
        data: {}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.show_dusk
        data: {}
    - conditions:
      - condition: trigger
        id: dawn
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.show_dusk
        data: {}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.show_dawn
        data: {}
    default: []
  mode: single
