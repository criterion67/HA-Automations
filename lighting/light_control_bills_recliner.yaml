- id: '1756518553160'
  alias: 'Light Control: Bill''s Recliner'
  description: 'Aqara mini button: single press toggles lamp, double press toggles
    overhead light.'
  triggers:
  - event_type: zha_event
    event_data:
      device_ieee: 00:15:8d:00:0a:f3:15:3f
      command: single
    id: Single Press
    trigger: event
  - event_type: zha_event
    event_data:
      device_ieee: 00:15:8d:00:0a:f3:15:3f
      command: double
    id: Double Press
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Single Press
      sequence:
      - target:
          entity_id: light.living_room_bills_light
        action: light.toggle
    - conditions:
      - condition: trigger
        id: Double Press
      sequence:
      - target:
          entity_id: switch.living_room_reading_light
        action: switch.toggle
  mode: single
