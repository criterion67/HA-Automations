- id: '1727476887134'
  alias: Office- Ceiling Light Presence Control V2
  description: 'Turns ceiling light on with presence, off after 5 min of no presence.

    '
  triggers:
  - entity_id: binary_sensor.office_presence_radar_target
    to: 'on'
    id: detected
    trigger: state
  - entity_id: binary_sensor.office_presence_radar_target
    to: 'off'
    for: 00:05:00
    id: cleared
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.office_ceiling_light
      - action: logbook.log
        data:
          name: Presence Control Debug
          message: Office ceiling light forced ON (presence detected).
          entity_id: switch.office_ceiling_light
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - condition: state
        entity_id: switch.office_ceiling_light
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.office_ceiling_light
      - action: logbook.log
        data:
          name: Presence Control Debug
          message: Office ceiling light forced OFF (no presence 5 min).
          entity_id: switch.office_ceiling_light
  mode: single
