- id: '1766272246009'
  alias: Christmas Lights for December 1-31 (v2)
  description: ''
  triggers:
  - entity_id:
    - sun.sun
    attribute: elevation
    below: -5
    id: Dusk
    trigger: numeric_state
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - at: '23:00:00'
    id: 11pm
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ now().month == 12 and 1 <= now().day <= 31 }}

      '
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Dusk
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.christmas_lights
        data: {}
    - conditions:
      - condition: trigger
        id: 11pm
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.christmas_lights_off
        data: {}
  mode: single
