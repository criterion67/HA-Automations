- id: '1760934021427'
  alias: Evening Routine (Fully Dynamic Scenes + Verification + Retry Actions)
  description: 'Executes 10 PM, 11 PM, and 12 AM scenes with dynamic entity verification
    for locks and lights, retry logic, actionable notifications, and safeguards for
    jammed/unavailable devices.

    '
  triggers:
  - trigger: time
    at: '22:00:00'
    id: lock_doors
  - trigger: time
    at: '23:00:00'
    id: lights_off
  - trigger: time
    at: 00:00:00
    id: midnight_lights_off
  - trigger: event
    event_type: mobile_app_notification_action
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lock_doors
      sequence:
      - target:
          entity_id: scene.2200_lock_doors
        action: scene.turn_on
      - delay: 00:00:10
      - variables:
          scene_locks: "{{ (state_attr('scene.2200_lock_doors', 'entity_id') or [])\n\
            \   | select('match', '^lock\\\\.') | list }}"
          unlocked_doors: "{{ expand(scene_locks)\n   | rejectattr('state','in',['jammed','unavailable'])\n\
            \   | selectattr('state','eq','unlocked')\n   | map(attribute='entity_id')\
            \ | list }}"
      - if:
        - condition: template
          value_template: '{{ unlocked_doors | length > 0 }}'
        then:
        - target:
            entity_id: '{{ unlocked_doors }}'
          action: lock.lock
        - delay: 00:00:10
        - variables:
            just_locked: "{{ expand(unlocked_doors)\n   | selectattr('state','eq','locked')\n\
              \   | map(attribute='entity_id') | list }}"
        - if:
          - condition: template
            value_template: '{{ just_locked | length > 0 }}'
          then:
          - data:
              title: Evening Routine
              message: '🔒 Locked: {{ expand(just_locked) | map(attribute=''name'')
                | list | join('', '') }}

                '
            action: notify.mobile_app_pixel_9
        - variables:
            still_unlocked: "{{ expand(scene_locks)\n   | rejectattr('state','in',['jammed','unavailable'])\n\
              \   | selectattr('state','eq','unlocked')\n   | map(attribute='entity_id')\
              \ | list }}"
        - if:
          - condition: template
            value_template: '{{ still_unlocked | length > 0 }}'
          then:
          - data:
              title: Evening Routine – Door Lock Issue
              message: '❌ Still unlocked: {{ expand(still_unlocked) | map(attribute=''name'')
                | list | join('', '') }}

                '
              data:
                actions:
                - action: RETRY_LOCKS
                  title: Retry Locks
                - action: IGNORE_LOCKS
                  title: Dismiss
            action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: lights_off
      sequence:
      - target:
          entity_id: scene.2300_lights_off
        action: scene.turn_on
      - delay: 00:00:10
      - variables:
          scene_entities: "{{ (state_attr('scene.2300_lights_off', 'entity_id') or\
            \ [])\n   | select('match', '^(light\\\\.|switch\\\\.|fan\\\\.)') | list\
            \ }}"
          still_on: "{{ expand(scene_entities)\n   | selectattr('state','eq','on')\n\
            \   | map(attribute='entity_id') | list }}"
      - if:
        - condition: template
          value_template: '{{ still_on | length > 0 }}'
        then:
        - data:
            title: Evening Routine – Lights Remaining
            message: '❌ The following lights or switches remained on: {{ expand(still_on)
              | map(attribute=''name'') | list | join('', '') }}

              '
            data:
              actions:
              - action: RETRY_LIGHTS
                title: Retry Lights
              - action: IGNORE_LIGHTS
                title: Dismiss
          action: notify.mobile_app_pixel_9
    - conditions:
      - condition: trigger
        id: midnight_lights_off
      sequence:
      - target:
          entity_id: scene.0000_lights_off
        action: scene.turn_on
      - delay: 00:00:10
      - variables:
          scene_entities_midnight: "{{ (state_attr('scene.0000_lights_off', 'entity_id')\
            \ or [])\n   | select('match', '^(light\\\\.|switch\\\\.|fan\\\\.)') |\
            \ list }}"
          still_on_midnight: "{{ expand(scene_entities_midnight)\n   | selectattr('state','eq','on')\n\
            \   | map(attribute='entity_id') | list }}"
      - if:
        - condition: template
          value_template: '{{ still_on_midnight | length > 0 }}'
        then:
        - data:
            title: Evening Routine – Midnight Lights
            message: '❌ These lights or switches stayed on: {{ expand(still_on_midnight)
              | map(attribute=''name'') | list | join('', '') }}

              '
            data:
              actions:
              - action: RETRY_MIDNIGHT
                title: Retry Lights
              - action: IGNORE_MIDNIGHT
                title: Dismiss
          action: notify.mobile_app_pixel_9
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RETRY_LOCKS'' }}'
      sequence:
      - variables:
          scene_locks_retry: "{{ (state_attr('scene.2200_lock_doors', 'entity_id')\
            \ or [])\n   | select('match', '^lock\\\\.') | list }}"
          unlocked_doors: "{{ expand(scene_locks_retry)\n   | rejectattr('state','in',['jammed','unavailable'])\n\
            \   | selectattr('state','eq','unlocked')\n   | map(attribute='entity_id')\
            \ | list }}"
      - if:
        - condition: template
          value_template: '{{ unlocked_doors | length > 0 }}'
        then:
        - target:
            entity_id: '{{ unlocked_doors }}'
          action: lock.lock
        - delay: 00:00:10
        - variables:
            retry_locked: "{{ expand(unlocked_doors)\n   | selectattr('state','eq','locked')\n\
              \   | map(attribute='entity_id') | list }}"
            retry_unlocked: "{{ expand(scene_locks_retry)\n   | rejectattr('state','in',['jammed','unavailable'])\n\
              \   | selectattr('state','eq','unlocked')\n   | map(attribute='entity_id')\
              \ | list }}"
        - if:
          - condition: template
            value_template: '{{ retry_unlocked | length == 0 }}'
          then:
          - data:
              title: Locks Retried
              message: '✅ Locked: {{ expand(retry_locked) | map(attribute=''name'')
                | list | join('', '') }}

                '
            action: notify.mobile_app_pixel_9
          else:
          - data:
              title: Locks Retried
              message: '❌ Still unlocked: {{ expand(retry_unlocked) | map(attribute=''name'')
                | list | join('', '') }}

                '
            action: notify.mobile_app_pixel_9
        else:
        - data:
            title: Locks Retried
            message: All doors are already locked.
          action: notify.mobile_app_pixel_9
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RETRY_LIGHTS'' }}'
      sequence:
      - variables:
          scene_entities_retry: "{{ (state_attr('scene.2300_lights_off', 'entity_id')\
            \ or [])\n   | select('match', '^(light\\\\.|switch\\\\.|fan\\\\.)') |\
            \ list }}"
      - target:
          entity_id: '{{ scene_entities_retry }}'
        action: homeassistant.turn_off
      - delay: 00:00:10
      - variables:
          retry_on: "{{ expand(scene_entities_retry)\n   | selectattr('state','eq','on')\n\
            \   | map(attribute='entity_id') | list }}"
      - if:
        - condition: template
          value_template: '{{ retry_on | length == 0 }}'
        then:
        - data:
            title: Lights Retried
            message: ✅ All lights now off.
          action: notify.mobile_app_pixel_9
        else:
        - data:
            title: Lights Retried
            message: '❌ Some lights still on: {{ expand(retry_on) | map(attribute=''name'')
              | list | join('', '') }}

              '
          action: notify.mobile_app_pixel_9
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''RETRY_MIDNIGHT'' }}'
      sequence:
      - variables:
          scene_entities_midnight_retry: "{{ (state_attr('scene.0000_lights_off',\
            \ 'entity_id') or [])\n   | select('match', '^(light\\\\.|switch\\\\.|fan\\\
            \\.)') | list }}"
      - target:
          entity_id: '{{ scene_entities_midnight_retry }}'
        action: homeassistant.turn_off
      - delay: 00:00:10
      - variables:
          retry_midnight: "{{ expand(scene_entities_midnight_retry)\n   | selectattr('state','eq','on')\n\
            \   | map(attribute='entity_id') | list }}"
      - if:
        - condition: template
          value_template: '{{ retry_midnight | length == 0 }}'
        then:
        - data:
            title: Midnight Lights Retried
            message: ✅ All midnight lights now off.
          action: notify.mobile_app_pixel_9
        else:
        - data:
            title: Midnight Lights Retried
            message: '❌ Some lights still on: {{ expand(retry_midnight) | map(attribute=''name'')
              | list | join('', '') }}

              '
          action: notify.mobile_app_pixel_9
  mode: single
